# K3S 配置文件 - WSL2 Ubuntu 22.04 环境
# Story 0.4: K3S 集群部署（WSL2 重构版）
# 技术栈：K3S v1.34.5 + local-path-provisioner
# 路径：/etc/rancher/k3s/config.yaml

# 节点配置
node-name: sisys-pc-wsl2
cluster-init: true

# 网络配置
# 重要：flannel-backend 选择取决于部署环境
#
# 部署场景推荐:
# - WSL2 单节点部署：vxlan (兼容性好)
# - Docker 容器内多节点：host-gw (不需要内核模块)
# - 物理机/虚拟机：vxlan 或 wireguard
#
# Flannel 后端对比:
# | 后端 | 优点 | 缺点 | 适用场景 |
# |------|------|------|---------|
# | vxlan | 兼容性好，支持跨子网 | 需要 VXLAN 内核模块，性能一般 | WSL2 单节点 |
# | host-gw | 性能好，不需要内核模块 | 要求节点在同一二层网络 | Docker 多节点 |
# | wireguard | 加密传输，安全 | 需要 WireGuard 模块，CPU 开销 | 生产环境 |
# | none | 无 Flannel | 需要外部 CNI | 使用 Calico/Cilium |

# WSL2 单节点部署推荐配置
flannel-backend: vxlan  # WSL2 单节点使用 vxlan
disable-network-policy: false  # 启用网络策略

# 禁用不需要的组件（节省资源）
disable:
  - traefik        # 使用独立的 Traefik Helm Chart
  - servicelb      # WSL2 不支持 LoadBalancer
  - metrics-server # 可选：独立安装

# API Server 配置
kube-apiserver-arg:
  - max-requests-inflight=1000
  - max-mutating-requests-inflight=500

# Controller Manager 配置
kube-controller-manager-arg:
  - node-cidr-mask-size=24

# Scheduler 配置
kube-scheduler-arg:
  - leader-elect=true

# 资源限制（针对 32G RAM 优化）
# 注意：所有内存单位使用 Mi (Mebibytes) 和 Gi (Gibibytes)
# etcd 内存限制
etcd-memory-limit: 2048Mi

# API Server 内存限制
apiserver-memory-limit: 2048Mi

# Controller Manager 内存限制
controller-manager-memory-limit: 1024Mi

# Scheduler 内存限制
scheduler-memory-limit: 512Mi

# Kubelet 配置
kubelet-arg:
  - max-pods=110

# 系统预留资源
system-reserved:
  - cpu=2000m
  - memory=4Gi

# Kube 预留资源
kube-reserved:
  - cpu=1000m
  - memory=2Gi

# 日志配置
debug: false
logging: 0

# WSL2 特殊配置
# 注意：WSL2 使用 NAT 网络，不支持 hostNetwork
# 存储使用 hostPath，数据存储在 WSL2 VHDX 虚拟磁盘
