# K3S 配置文件 - WSL2 Ubuntu 22.04 环境
# Story 0.4: K3S 集群部署（WSL2 重构版）
# 技术栈：K3S v1.34.5 + local-path-provisioner
# 路径：/etc/rancher/k3s/config.yaml

# 节点配置
node-name: sisys-pc-wsl2
cluster-init: true

# 网络配置（WSL2 特殊配置）
flannel-backend: none  # WSL2 使用 host-network 模式
disable-network-policy: false  # 禁用网络策略（WSL2 单节点）

# 禁用不需要的组件（节省资源）
disable:
  - traefik        # 使用独立的 Traefik Helm Chart
  - servicelb      # WSL2 不支持 LoadBalancer
  - metrics-server # 可选：独立安装
  - local-storage  # 使用 local-path-provisioner

# API Server 配置
kube-apiserver-arg:
  - max-requests-inflight=1000
  - max-mutating-requests-inflight=500

# Controller Manager 配置
kube-controller-manager-arg:
  - node-cidr-mask-size=24

# Scheduler 配置
kube-scheduler-arg:
  - leader-elect=true

# 资源限制（针对 32G RAM 优化）
# etcd 内存限制
etcd-memory-limit: 2048

# API Server 内存限制
apiserver-memory-limit: 2048

# Controller Manager 内存限制
controller-manager-memory-limit: 1024

# Scheduler 内存限制
scheduler-memory-limit: 512

# Kubelet 配置
kubelet-arg:
  - max-pods=110

# 系统预留资源
system-reserved:
  - cpu=2000m
  - memory=4Gi

# Kube 预留资源
kube-reserved:
  - cpu=1000m
  - memory=2Gi

# 日志配置
debug: false
logging: 0

# WSL2 特殊配置
# 注意：WSL2 使用 NAT 网络，不支持 hostNetwork
# 存储使用 hostPath，数据存储在 WSL2 VHDX 虚拟磁盘
