# Longhorn Helm Chart 值配置
# Story 0.4: K3S 集群部署
# 技术栈：Longhorn v1.5.3

# 默认设置
defaultSettings:
  # 单机部署，副本数=1（生产环境建议 3）
  defaultReplicaCount: 1
  # CPU 预留 10% 给 Instance Manager
  guaranteedInstanceManagerCpu: 10
  # 默认数据路径
  defaultDataPath: /var/lib/longhorn
  # 启用自动清理
  orphanAutoDeletion: true
  # 启用自动备份
  backupTarget: ""  # MVP 阶段暂不配置备份目标

# 持久化存储配置
persistence:
  # 默认文件系统类型
  defaultFsType: ext4
  # 默认 mkfs 参数
  defaultMkfsParams: ""
  # 存储类配置
  defaultClass: true
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete
  allowVolumeExpansion: true

# Ingress 配置（访问 Longhorn UI）
ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.local
  path: /
  # MVP 阶段先不启用 TLS
  tls: false
  # 如果使用 cert-manager，可以启用 TLS
  # tls: true
  # tlsSecret: longhorn-tls

# 资源限制
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# 节点选择器（可选）
# nodeSelector:
#   kubernetes.io/hostname: sisys-pc

# 容忍度（可选）
# tolerations:
#   - key: "node-role.kubernetes.io/master"
#     operator: "Exists"
#     effect: "NoSchedule"

# UI 服务配置
service:
  ui:
    type: ClusterIP
    port: 80

