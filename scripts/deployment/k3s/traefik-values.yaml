# Traefik Helm Chart 值配置 - WSL2 简化版
# Story 0.4: K3S 集群部署（WSL2 重构版）
# 技术栈：Traefik v2.10
# 环境：WSL2 Ubuntu 22.04

# 端口配置
ports:
  # Web 入口（HTTP）
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP

  # Web Secure 入口（HTTPS）
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

# Provider 配置
providers:
  # Kubernetes CRD Provider
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
    allowEmptyServices: false

  # Kubernetes Ingress Provider
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    allowEmptyServices: false

# 日志配置
logs:
  # 一般日志
  general:
    level: INFO
    format: common

  # 访问日志
  access:
    enabled: true
    format: common

# API 和仪表板配置
api:
  dashboard: true
  insecure: false  # 需要认证访问（更安全）

# 部署配置
deployment:
  enabled: true
  replicas: 1  # WSL2 单节点部署
  podAnnotations: {}
  podLabels: {}

# 资源限制
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 服务配置
service:
  enabled: true
  type: LoadBalancer  # WSL2 中使用 NodePort 或 LoadBalancer
  annotations: {}
  labels: {}
  spec: {}

# WSL2 特殊说明：
# - WSL2 不支持真正的 LoadBalancer，需要使用 port-forward 访问
# - 生产环境建议使用 NodePort + 外部负载均衡器
# - 开发环境可使用 kubectl port-forward 访问服务

# 访问方式：
# 1. Port-forward: kubectl -n traefik port-forward deploy/traefik 9000:9000
# 2. NodePort: 修改 service.type 为 NodePort，通过 <WSL2-IP>:<NodePort> 访问
