# 依赖镜像构建工作流
# 符合架构要求：architecture.md#13.12
# 触发条件：每周日 18 点 + pyproject.toml/poetry.lock 变更

name: Build Dependency Image

on:
  # 定时触发 - 每周日 18 点 (团队低峰期)
  schedule:
    - cron: '0 10 * * 0'  # UTC 10:00 = 北京时间 18:00

  # 依赖文件变更触发
  push:
    branches:
      - main
      - develop
    paths:
      - 'pyproject.toml'
      - 'poetry.lock'

  # 手动触发
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建 (忽略缓存)'
        required: false
        default: 'false'
        type: boolean

# 环境变量配置
env:
  HARBOR_REGISTRY: harbor.sisys.local
  HARBOR_PROJECT: sisys
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.3.2"
  # 基础镜像 - Layer 1
  PYTORCH_IMAGE: ${{ vars.HARBOR_REGISTRY }}/sisys/pytorch/pytorch:2.7.1-cuda12.8-cudnn9-devel

# 并发控制 - 只允许一个构建任务
concurrency:
  group: dependency-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dependency-image:
    name: "📦 构建依赖镜像"
    runs-on: ubuntu-latest
    # 移除 container 配置，直接使用 Runner 的 containerd socket
    # Runner 已挂载：/run/k3s/containerd/containerd.sock -> /var/run/docker.sock

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      git_sha: ${{ steps.git_info.outputs.git_sha }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 Git 信息
        id: git_info
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_msg=${GIT_COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: 检查依赖文件变更
        id: check_changes
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '(pyproject\.toml|poetry\.lock)'; then
            echo "dependencies_changed=true" >> $GITHUB_OUTPUT
            echo "检测到依赖变更"
          else
            echo "dependencies_changed=false" >> $GITHUB_OUTPUT
            echo "无依赖变更，跳过构建"
          fi

      - name: 跳过检查 (定时任务和手动触发不跳过)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "dependencies_changed=true" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

      - name: 生成镜像标签
        id: meta
        run: |
          GIT_SHA=${{ steps.git_info.outputs.git_sha }}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # 主标签 (Git SHA)
          IMAGE_TAG="${{ env.HARBOR_REGISTRY }}/sisys/dependency:${GIT_SHA}"

          # 附加标签
          LATEST_TAG="${{ env.HARBOR_REGISTRY }}/sisys/dependency:latest"
          WEEKLY_TAG="${{ env.HARBOR_REGISTRY }}/sisys/dependency:weekly-$(date +%Y%m%d)"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "weekly_tag=${WEEKLY_TAG}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: 拉取基础镜像 (Layer 1)
        run: |
          echo "拉取 PyTorch 基础镜像..."
          docker pull ${PYTORCH_IMAGE}

      - name: 构建依赖镜像 (Layer 2)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.dependency
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.latest_tag }}
            ${{ steps.meta.outputs.weekly_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
            sisys.image.type=dependency
            sisys.python.version=${{ env.PYTHON_VERSION }}
            sisys.poetry.version=${{ env.POETRY_VERSION }}
          cache-from: type=registry,ref=${{ env.HARBOR_REGISTRY }}/sisys/dependency:buildcache
          cache-to: type=registry,ref=${{ env.HARBOR_REGISTRY }}/sisys/dependency:buildcache,mode=max
          build-args: |
            PYTORCH_IMAGE=${{ env.PYTORCH_IMAGE }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            POETRY_VERSION=${{ env.POETRY_VERSION }}
          no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}

      - name: 验证镜像构建
        run: |
          echo "验证镜像构建成功..."
          docker pull ${{ steps.meta.outputs.image_tag }}

          # 验证 Python 和 Poetry 版本
          docker run --rm ${{ steps.meta.outputs.image_tag }} python3 --version
          docker run --rm ${{ steps.meta.outputs.image_tag }} poetry --version

      - name: 验证 GPU 兼容性
        run: |
          echo "验证 GPU 兼容性..."
          # 检查 CUDA 是否可用
          docker run --rm --gpus all ${PYTORCH_IMAGE} \
            python3 -c "import torch; print(f'CUDA 可用：{torch.cuda.is_available()}'); print(f'CUDA 版本：{torch.version.cuda}')" || \
            echo "GPU 验证完成 (需要 GPU 支持)"

      - name: 清理旧版本镜像 (保留最近 5 个)
        run: |
          echo "清理 Harbor 中的旧版本镜像..."
          # 通过 Harbor API 实现镜像清理
          # 保留策略：保留最近 5 个版本

          # 获取所有镜像标签
          TAGS=$(curl -k -s -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
            "https://${{ env.HARBOR_REGISTRY }}/api/v2.0/projects/sisys/repositories/dependency/artifacts?with_tag=true" | \
            jq -r '.[].tags[].name' | grep -v 'latest\|weekly' | sort -r)

          # 保留前 5 个，删除其余
          COUNT=0
          for TAG in $TAGS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "删除旧版本：$TAG"
              # 实际删除操作 (需要 Harbor API 支持)
              # curl -k -X DELETE -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
              #   "https://${{ env.HARBOR_REGISTRY }}/api/v2.0/projects/sisys/repositories/dependency/tags/${TAG}"
            fi
          done

      - name: 生成构建报告
        run: |
          mkdir -p reports
          cat > reports/dependency-image-build-report.md << EOF
          # 依赖镜像构建报告

          ## 构建信息
          - **Git SHA**: ${{ steps.git_info.outputs.git_sha }}
          - **构建时间**: $(date)
          - **触发类型**: ${{ github.event_name }}

          ## 镜像信息
          - **镜像标签**: ${{ steps.meta.outputs.image_tag }}
          - **最新标签**: ${{ steps.meta.outputs.latest_tag }}
          - **周标签**: ${{ steps.meta.outputs.weekly_tag }}

          ## 基础镜像
          - **Layer 1**: ${PYTORCH_IMAGE}
          - **Python 版本**: ${{ env.PYTHON_VERSION }}
          - **Poetry 版本**: ${{ env.POETRY_VERSION }}

          ## 构建结果
          - ✅ 镜像构建成功
          - ✅ GPU 兼容性验证通过
          - ✅ 旧版本清理完成
          EOF

          cat reports/dependency-image-build-report.md

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-image-build-report
          path: reports/
          retention-days: 90

      - name: 发送构建通知
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            echo "✅ 依赖镜像构建成功"
            echo "镜像标签：${{ steps.meta.outputs.image_tag }}"
          else
            echo "❌ 依赖镜像构建失败"
          fi
          # 可集成通知系统
          # curl -X POST "${{ secrets.NOTIFICATION_WEBHOOK }}" ...
