  #           app=${{ vars.HARBOR_REGISTRY }}/sisys/app:${IMAGE_TAG_L3} \
  #           -n sisys-test || echo "部署更新"

  #     - name: 触发 ArgoCD 同步
  #       run: |
  #         echo "触发 ArgoCD 自动同步..."
  #         # ArgoCD 会自动检测到镜像变更并同步
