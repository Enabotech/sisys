# CI Pipeline 模板 - 持续集成工作流 ( 优化版 )
# 基于预构建 CI 镜像加速流程
# 包含 7 个标准阶段，支持 GPU 任务调度

name: CI Pipeline

on:
  push:
    branches:
      - main
      - release
      - 'feature/**'
    tags:
      - 'v*'  # Git Tag 触发生产发布
  pull_request:
    branches:
      - main

  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号 (如 v1.1.0)'
        required: false
        type: string
      force_rebuild:
        description: '强制重新构建'
        required: false
        default: 'false'
        type: boolean

# ===========================================================================
# 环境变量配置
# ===========================================================================
env:
  # 应用配置
  APP_NAME: sisys-app
  IMAGE_NAME: sisys-app

  # Harbor 配置
  HARBOR_REGISTRY: harbor.sisys.local
  HARBOR_PROJECT: sisys

  # ArgoCD 配置
  ARGOCD_SERVER: argocd.sisys.local

  # Python 配置
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.3.2"

  # 测试配置 - 让 environments.py 自动检测为 CI 环境
  SISYS_TEST_ENV: ci
  SISYS_USE_TEST_PORTS: "true"

  # 测试服务主机地址（使用 docker compose 服务名）
  REDIS_HOST: redis
  POSTGRES_HOST: postgres
  QDRANT_HOST: qdrant
  MINIO_HOST: minio
  NEO4J_HOST: neo4j
  RABBITMQ_HOST: rabbitmq

  # =======================================================================
  # 镜像标签命名规范 (参考: docs/architecture/image-tagging-strategy.md)
  # =======================================================================
  # Layer 1: 基础依赖镜像 (Base Dependency Image)
  # 格式: l1-v{major}.{minor}.{patch}-{git_sha}
  # 说明: Ubuntu 22.04 + Python 3.11.15 + Node.js 20.x + Poetry 2.3.2
  # 构建: make docker-build-l1
  # Layer 1: 基础依赖镜像 - 使用 l1-latest 引用最新稳定版本
  IMAGE_TAG_L1_LATEST: l1-latest

  # Layer 2: CI/CD 依赖镜像 (CI/CD Dependency Image)
  # 格式: l2-v{major}.{minor}.{patch}-{git_sha}
  # 说明: 基于 L1 + 项目依赖 (pyproject.toml)
  # 构建: make docker-build-l2
  # Layer 2: CI/CD 依赖镜像 - 使用 l2-latest 引用最新稳定版本
  IMAGE_TAG_L2_LATEST: l2-latest

  # Layer 3: 应用镜像 (Application Image) - CI 自动构建
  # 格式: l3-v{major}.{minor}.{patch}-{git_sha}
  # 说明: 基于 L2 + 业务代码
  # 构建: CI 自动触发
  # Layer 3: 应用镜像 - 使用 latest 作为最新稳定版本标签
  IMAGE_TAG_L3_LATEST: latest

  # --- 版本标签前缀 (用于生成具体版本标签) ---
  # Layer 3 动态版本号: 手动输入 > Git Tag > 默认值 v0.0.0
  # 注意: 分支推送时版本号由 "提取构建上下文" 步骤从 VERSION 文件读取
  IMAGE_TAG_L3_BASE: |
    ${{
      github.event.inputs.version ||
      (startsWith(github.ref, 'refs/tags/') && github.ref_name) ||
      'v0.0.0'
    }}

# ===========================================================================
# 并发控制 - 同一 PR 只运行一个 Pipeline
# ===========================================================================
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 阶段 1: 文件变更检测 (精准触发 L2/L3 构建)
  # ===========================================================================
  detect-changes:
    name: "🔀 变更检测"
    runs-on: [gpu]
    container:
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root
    outputs:
      l2: ${{ steps.filter.outputs.l2 }}
      l3: ${{ steps.filter.outputs.l3 }}
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 变更检测
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            l2:
              - 'deploy/docker/dockerfile.l2'
              - 'pyproject.toml'
              - 'poetry.lock'
            l3:
              - 'deploy/docker/dockerfile.app'
              - 'src/**'
              - 'tests/**'
              - 'configs/**'
              - '.env'
              - '.env.example'
              - 'scripts/entrypoint.sh'
            src:
              - '.gitea/**'
              - 'configs/**'
              - 'delivery/**'
              - 'deploy/**'
              - 'src/**'
              - 'tests/**'
              - '.env'
              - 'pyproject.toml'
              - 'poetry.lock'

  # ===========================================================================
  # 阶段 2: 代码质量门禁 (Ruff + MyPy)
  # ===========================================================================
  code-quality:
    name: "🔍 代码检查"
    runs-on: [gpu]
    needs: [detect-changes]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root

    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true')
        || startsWith(github.ref, 'refs/tags/')
        || (github.event_name != 'workflow_dispatch' && (
          needs.detect-changes.outputs.src == 'true'
        ))
      }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证环境
        run: |
          echo "Python 版本:"
          python3 --version
          echo "Poetry 版本:"
          poetry --version

      # ✅ 保留 poetry install 作为补充 ( 处理微小依赖变更 )
      # 预构建镜像包含大部分依赖，此步骤仅处理新增/变更的依赖
      - name: 增量更新依赖
        run: |
          poetry install --no-interaction || echo "依赖更新完成"

      - name: 代码检查 ( Ruff )
        run: |
          mkdir -p reports/linting
          poetry run ruff check . --output-format=github > reports/linting/ruff-check.txt 2>&1 || { cat reports/linting/ruff-check.txt; exit 1; }
          poetry run ruff format --check .

      - name: 类型检查 ( MyPy )
        run: |
          mkdir -p reports/mypy
          poetry run mypy src/ tests/ --txt-report reports/mypy/mypy-report.txt

      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report
          path: |
            reports/linting/
            reports/mypy/
          retention-days: 30

  # ===========================================================================
  # 阶段 3: 单元测试 (pytest + 覆盖率) - 支持 GPU
  # ===========================================================================
  unit-tests:
    name: "🧪 单元测试"
    runs-on: [gpu]
    needs: [detect-changes]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root --gpus all

    if: >-
      ${{
        ((github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true')
        || startsWith(github.ref, 'refs/tags/')
        || (github.event_name != 'workflow_dispatch' && (
          needs.detect-changes.outputs.src == 'true'
        ))) &&
        !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]'))
      }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充 ( 处理微小依赖变更 )
      - name: 增量更新依赖
        run: |
          poetry install --no-interaction || echo "依赖更新完成"

      - name: 验证 GPU 可用性
        if: ${{ vars.GPU_ENABLED == 'true' }}
        run: |
          poetry run python -c "
          import sys
          import torch

          is_cuda = torch.cuda.is_available()
          version = torch.__version__

          print(f'CUDA  : {is_cuda}')
          print(f'Torch : {version}')

          if not is_cuda:
              print('❌ 错误: GPU_ENABLED 为 true，但 CUDA 不可用！')
              print('💡 请检查 Runner 是否配置了 --gpus all 及 NVIDIA 驱动。')
              sys.exit(1)

          print('✅ GPU 验证通过')
          "

      - name: 运行单元测试
        run: |
          mkdir -p reports/coverage reports/pytest
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/coverage.html \
            --cov-report=term-missing \
            --junitxml=reports/pytest/unit-tests.xml \
            --html=reports/pytest/unit-tests.html \
            --self-contained-html \
            -v

      - name: 检查覆盖率门禁 ( ≥80% )
        run: |
          poetry run coverage report --fail-under=80

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 30

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: reports/pytest/
          retention-days: 30

  # ===========================================================================
  # 阶段 4: 集成测试 (Docker Compose) - 宿主机 Runner
  # ===========================================================================
  # 说明:
  #   - runs-on: [gpu] 指向 gitea-org-runner (K8s StatefulSet)
  #   - Runner 通过 hostPath 挂载 /var/run/docker.sock 到 Job 容器
  #   - Job 容器内可直接运行 docker compose 命令
  #   - 使用根目录 .env 文件配置服务连接参数
  # ===========================================================================
  integration-tests:
    name: "🔗 集成测试"
    runs-on: [gpu]
    needs: [detect-changes]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root --gpus all --add-host=host.docker.internal:host-gateway

    if: >-
      ${{
        ((github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true')
        || startsWith(github.ref, 'refs/tags/')
        || (github.event_name != 'workflow_dispatch' && (
          needs.detect-changes.outputs.src == 'true'
        ))) &&
        !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]'))
      }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化环境
        shell: bash
        run: |
          set -a
          source ./.env
          set +a
          docker network create sisys-network 2>/dev/null || true
          docker compose -f ./deploy/app/docker-compose.yml up -d

          total=$(docker compose -f ./deploy/app/docker-compose.yml ps --services | wc -l)
          echo "检测到 $total 个服务，等待所有服务健康..."
          for i in {1..30}; do
            healthy=$(docker compose -f ./deploy/app/docker-compose.yml ps 2>/dev/null | grep -c -i '\(healthy\)' || true)
            if [ "$healthy" -ge "$total" ]; then
              echo "✅ 所有服务已就绪 ($healthy/$total)"
              break
            fi
            echo "等待服务健康... ($i/30) - 当前: $healthy/$total"
            sleep 2
          done
          docker compose -f ./deploy/app/docker-compose.yml ps

      - name: 增量更新依赖
        run: |
          poetry install --no-interaction || echo "依赖更新完成"

      - name: 集成测试
        shell: bash
        run: |
          set -a
          source ./.env
          set +a
          # Override HOST variables to use host.docker.internal for CI
          export REDIS_HOST=host.docker.internal
          export POSTGRES_HOST=host.docker.internal
          export QDRANT_HOST=host.docker.internal
          export MINIO_HOST=host.docker.internal
          export NEO4J_HOST=host.docker.internal
          export RABBITMQ_HOST=host.docker.internal
          mkdir -p reports/integration
          poetry run pytest tests/integration \
            --junitxml=reports/integration/integration-tests.xml \
            --html=reports/integration/integration-tests.html \
            --self-contained-html \
            -v \
            --tb=short

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: reports/integration/
          retention-days: 30

  # ===========================================================================
  # 阶段 5: 验收测试 (Docker Compose) - 宿主机 Runner
  # ===========================================================================
  # 说明:
  #   - runs-on: [gpu] 指向 gitea-org-runner (K8s StatefulSet)
  #   - Runner 通过 hostPath 挂载 /var/run/docker.sock 到 Job 容器
  #   - Job 容器内可直接运行 docker compose 命令
  #   - 使用根目录 .env 文件配置服务连接参数
  # ===========================================================================
  acceptance-tests:
    name: "🏁 验收测试"
    runs-on: [gpu]
    needs: [unit-tests, integration-tests]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root --gpus all --add-host=host.docker.internal:host-gateway

    # ✅ 逻辑: 除非 (GPU 开启 且 消息包含 [no gpu])，否则都运行
    if: ${{ !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]')) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 增量更新依赖
        run: |
          poetry install --no-interaction || echo "依赖更新完成"

      - name: 验收测试
        shell: bash
        run: |
          set -a
          source ./.env
          set +a
          # Override HOST variables to use host.docker.internal for CI
          export REDIS_HOST=host.docker.internal
          export POSTGRES_HOST=host.docker.internal
          export QDRANT_HOST=host.docker.internal
          export MINIO_HOST=host.docker.internal
          export NEO4J_HOST=host.docker.internal
          export RABBITMQ_HOST=host.docker.internal
          mkdir -p reports/acceptance
          poetry run pytest tests/acceptance \
            --junitxml=reports/acceptance/acceptance-tests.xml \
            --html=reports/acceptance/acceptance-tests.html \
            --self-contained-html \
            -v \
            --tb=short

      - name: 上传验收测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: acceptance-test-results
          path: reports/acceptance/
          retention-days: 30

  # ===========================================================================
  # 阶段 6: 安全扫描 (Trivy + Bandit)
  # ===========================================================================
  security-scan:
    name: "🛡️ 安全扫描"
    runs-on: [gpu]
    needs: [detect-changes]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root

    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true')
        || startsWith(github.ref, 'refs/tags/')
        || (github.event_name != 'workflow_dispatch' && (
          needs.detect-changes.outputs.src == 'true'
        ))
      }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充 ( 处理微小依赖变更 )
      - name: 增量更新依赖
        run: |
          poetry install --no-interaction || echo "依赖更新完成"

      - name: 密钥泄露检测 ( detect-secrets )
        run: |
          mkdir -p reports/security
          poetry run detect-secrets-hook . --baseline .secrets.baseline

      - name: 密钥检测报告
        run: |
          mkdir -p reports/security
          poetry run detect-secrets scan . \
            --baseline .secrets.baseline \
            --all-files \
            > reports/security/detect-secrets-report.json 2>&1 || true

      - name: 代码安全扫描 ( Bandit )
        run: |
          mkdir -p reports/security
          # 阻断 High 及以上级别漏洞
          poetry run bandit -r src/ -f json -o reports/security/bandit-report.json \
            --severity-level high
          poetry run bandit -r src/ -f screen -o reports/security/bandit-report.txt \
            --severity-level high

      # - name: Trivy 缓存
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.cache/trivy
      #     key: cache-trivy-${{ runner.os }}-${{ hashFiles('**/trivy-cache-key') }}
      #     restore-keys: |
      #       cache-trivy-${{ runner.os }}-

      - name: 文件系统扫描 ( Trivy )
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_INSECURE: 'true'
          TRIVY_DB_REPOSITORY: 'harbor.sisys.local/sisys/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'harbor.sisys.local/sisys/aquasecurity/trivy-java-db:1'
          TRIVY_CHECKS_BUNDLE_REPOSITORY: 'harbor.sisys.local/sisys/aquasecurity/trivy-checks:2'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'reports/security/trivy-fs.sarif'
          severity: 'CRITICAL'
          exit-code: '0'  # 发现 Critical 级别漏洞时阻断
          skip-setup-trivy: 'true'
          skip-db-update: 'true'
          skip-java-db-update: 'true'
          skip-check-update: 'true'

      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/security/
          retention-days: 90

  # ===========================================================================
  # 阶段 7: 镜像构建 (Docker Build 多阶段) — L2/L3 精准触发
  # ===========================================================================
  build-images:
    name: "🏗️ 构建镜像"
    runs-on: buildx
    needs: [code-quality, acceptance-tests, security-scan]
    timeout-minutes: 60
    container:
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L1_LATEST }}
      options: --user root --privileged
      credentials:
        username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
        password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

    # ✅ 精准触发: 仅 push/PR 有文件变更时构建，或手动强制重建
    # ✅ Tag 推送 (release 发布) 强制构建生产镜像
    # ✅ workflow_dispatch 不选 force_rebuild 时不构建（避免 paths-filter 回退到全分支对比）
    # if: >-
    #   ${{
    #     (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true')
    #     || startsWith(github.ref, 'refs/tags/')
    #     || (github.event_name != 'workflow_dispatch' && (
    #           needs.detect-changes.outputs.l2 == 'true'
    #             || needs.detect-changes.outputs.l3 == 'true'
    #        ))
    #   }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 CA 链
        run: |
          mkdir -p /tmp/buildkit-certs
          printf '%s' "${{ secrets.HARBOR_CA_CRT }}" > /tmp/buildkit-certs/harbor-ca.crt
          cp /tmp/buildkit-certs/harbor-ca.crt /usr/local/share/ca-certificates/harbor.crt
          update-ca-certificates
          cat > buildkitd.toml <<EOF
          [registry."harbor.sisys.local"]
            ca = ["/tmp/buildkit-certs/harbor-ca.crt"]
          EOF
          echo "Docker 版本:"
          docker --version
          docker info
          docker buildx version

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=harbor.sisys.local/sisys/tools/moby/buildkit:buildx-stable-1
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host
          config: buildkitd.toml

      - name: 提取构建上下文
        id: context
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # ========== 版本号确定 ==========
          # 优先级: 手动输入 > Git Tag > VERSION 文件 > 默认值 v0.0.0
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               echo "${{ github.ref }}" | grep -q '^refs/tags/'; then
            VERSION="${{ github.ref_name }}"
          elif [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "📄 版本号来自 VERSION 文件: ${VERSION}"
          else
            VERSION="v0.0.0"
            echo "⚠️  使用默认版本号: ${VERSION}"
          fi

          # ========== 分支识别 ==========
          case "${{ github.ref }}" in
            refs/heads/feature/*)
              FEATURE_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/feature/||')
              IMAGE_PREFIX="dev-feature"
              ;;
            refs/heads/main)
              FEATURE_NAME="main"
              IMAGE_PREFIX="dev"
              ;;
            refs/heads/release)
              FEATURE_NAME="release"
              IMAGE_PREFIX=""
              ;;
            refs/tags/v*)
              FEATURE_NAME="release"
              IMAGE_PREFIX=""
              ;;
            *)
              FEATURE_NAME="unknown"
              IMAGE_PREFIX="dev"
              ;;
          esac

          # 提取提交作者（清理换行和多余空格）
          AUTHOR=$(git log -1 --pretty=format:'%an' | tr -d '[:space:]')

          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "feature_name=${FEATURE_NAME}" >> $GITHUB_OUTPUT
          echo "author=${AUTHOR}" >> $GITHUB_OUTPUT
          echo "image_prefix=${IMAGE_PREFIX}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 生成镜像标签
        id: meta
        run: |
          GIT_SHA="${{ steps.context.outputs.git_sha }}"
          VERSION="${{ steps.context.outputs.version }}"
          PREFIX="${{ steps.context.outputs.image_prefix }}"
          FEATURE="${{ steps.context.outputs.feature_name }}"
          IMAGE="${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/app"

          # L2 标签
          echo "image_tag_l2=l2-${VERSION}-${GIT_SHA}" >> $GITHUB_OUTPUT

          # L3 基础标签
          if [ -n "$PREFIX" ]; then
            echo "image_tag_l3=${IMAGE}:${PREFIX}-${FEATURE}-${VERSION}-${GIT_SHA}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/release" ]; then
            echo "image_tag_l3=${IMAGE}:${VERSION}-${GIT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "image_tag_l3=${IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
          fi

          # 测试标签（仅 release/Tag 推送时生成）
          echo "image_tag_test=${IMAGE}:test-${VERSION}-${GIT_SHA}" >> $GITHUB_OUTPUT

          echo "✅ 版本: ${VERSION}"
          echo "✅ Feature: ${FEATURE}"
          echo "✅ SHA: ${GIT_SHA}"

      # ---------- L2 构建 ----------
      # - name: 同步 Lock 文件 (L2)
      #   if: >-
      #     ${{
      #       github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true'
      #       || startsWith(github.ref, 'refs/tags/')
      #       || needs.detect-changes.outputs.l2 == 'true'
      #     }}
      #   run: poetry lock --no-interaction

      - name: 构建 L2 镜像
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true'
            || startsWith(github.ref, 'refs/tags/')
            || needs.detect-changes.outputs.l2 == 'true'
          }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/dockerfile.l2
          push: true
          tags: |
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ steps.meta.outputs.image_tag_l2 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
            sisys.image.layer="l2"
            sisys.image.type="ci-dependency"
          cache-from: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:l2-cache
          cache-to: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:l2-cache,mode=min
          provenance: false
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L1_LATEST }}

      # ---------- L3 构建 ----------

      # Dev 构建（main / feature）— 仅推 dev 标签
      - name: 构建 L3 镜像（Dev）
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebuild == 'true')
            || ( startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/feature/')
                  && (github.event_name != 'workflow_dispatch' && ( needs.detect-changes.outputs.l3 == 'true'))
               )
          }}
        id: build-l3-dev
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/dockerfile.app
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag_l3 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.context.outputs.build_time }}
            sisys.image.layer="l3"
            sisys.image.type="application"
            sisys.io/feature=${{ steps.context.outputs.feature_name }}
            sisys.io/author=${{ steps.context.outputs.author }}
            sisys.io/build-time=${{ steps.context.outputs.build_time }}
            sisys.io/branch=${{ github.ref_name }}
            sisys.io/version=${{ steps.context.outputs.version }}
          cache-from: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:app-cache
          cache-to: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:app-cache,mode=min
          provenance: false
          platforms: linux/amd64
          build-args: |
            DEPENDENCY_IMAGE=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}

      # Release/Tag 构建 — 推 SemVer + test，Tag 推送额外推 latest
      - name: 构建 L3 镜像（Release/Tag）
        if: >-
          ${{
            startsWith(github.ref, 'refs/heads/release') ||
            startsWith(github.ref, 'refs/tags/')
          }}
        id: build-l3-release
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/dockerfile.app
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag_l3 }}
            ${{ steps.meta.outputs.image_tag_test }}
            ${{
              startsWith(github.ref, 'refs/tags/') &&
              format('{0}/{1}/app:latest', vars.HARBOR_REGISTRY, vars.HARBOR_PROJECT) ||
              ''
            }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.context.outputs.build_time }}
            sisys.image.layer="l3"
            sisys.image.type="application"
            sisys.io/feature=${{ steps.context.outputs.feature_name }}
            sisys.io/author=${{ steps.context.outputs.author }}
            sisys.io/build-time=${{ steps.context.outputs.build_time }}
            sisys.io/branch=${{ github.ref_name }}
            sisys.io/version=${{ steps.context.outputs.version }}
          cache-from: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:app-cache
          cache-to: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:app-cache,mode=min
          provenance: false
          platforms: linux/amd64
          build-args: |
            DEPENDENCY_IMAGE=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}

      # 记录 Digest 信息（用于 Kustomize 写回 + 审计追溯）
      - name: 记录 Digest 信息
        if: always() && (steps.build-l3-dev.outputs.digest != '' || steps.build-l3-release.outputs.digest != '')
        run: |
          DIGEST="${{ steps.build-l3-release.outputs.digest || steps.build-l3-dev.outputs.digest }}"
          echo "构建 Digest: ${DIGEST}"

          # 确保目录存在
          mkdir -p reports/build

          # 写入构建元数据文件
          cat > reports/build/build-metadata.json <<EOF
          {
            "version": "${{ steps.context.outputs.version }}",
            "git_sha": "${{ steps.context.outputs.git_sha }}",
            "digest": "${DIGEST}",
            "image": "${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/app",
            "tags": [
              "${{ steps.meta.outputs.image_tag_l3 }}",
              "${{ steps.meta.outputs.image_tag_test }}",
              "${{ steps.context.outputs.version }}"
            ],
            "build_time": "${{ steps.context.outputs.build_time }}",
            "feature": "${{ steps.context.outputs.feature_name }}",
            "author": "${{ steps.context.outputs.author }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          echo "✅ 元数据已保存到 reports/build/build-metadata.json"

      - name: 上传镜像信息
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: docker-image-info
          path: |
            reports/build/build-metadata.json
          retention-days: 30
