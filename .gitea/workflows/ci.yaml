# CI Pipeline 模板 - 持续集成工作流
# 符合架构要求：architecture.md#13.12
# 包含 7 个标准阶段，支持 GPU 任务调度和预构建镜像加速

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

  # 手动触发
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '手动触发CI'
        required: false
        default: 'false'
        type: boolean

# 环境变量配置
env:
  APP_NAME: sisys-app
  REGISTRY: harbor.sisys.local
  IMAGE_NAME: sisys-app
  ARGOCD_SERVER: argocd.sisys.local
  HARBOR_REGISTRY: harbor.sisys.local
  HARBOR_PROJECT: sisys
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.3.2"
  # 预构建镜像配置
  DEPENDENCY_IMAGE: ${{ vars.HARBOR_REGISTRY }}/sisys/dependency:${{ github.sha }}
  PYTORCH_IMAGE: ${{ vars.HARBOR_REGISTRY }}/sisys/pytorch/pytorch:2.7.1-cuda12.8-cudnn9-devel
  # GPU 配置
  GPU_ENABLED: ${{ vars.GPU_ENABLED || 'false' }}
  CUDA_VERSION: "12.8"

# 并发控制 - 同一 PR 只运行一个 Pipeline
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 阶段 1: 代码质量门禁 (Ruff + MyPy)
  # ===========================================================================
  code-quality:
    name: "🔍 代码质量检查"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DEPENDENCY_IMAGE }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        run: |
          python3 --version
          poetry --version

      - name: 安装项目依赖
        run: |
          poetry install --no-interaction

      - name: Ruff 代码检查
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: MyPy 类型检查
        run: |
          poetry run mypy src/ tests/

      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: |
            reports/linting/
            reports/mypy/
          retention-days: 30

  # ===========================================================================
  # 阶段 2: 单元测试 (pytest + 覆盖率) - 支持 GPU
  # ===========================================================================
  unit-test:
    name: "🧪 单元测试"
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: code-quality
    container:
      image: ${{ env.DEPENDENCY_IMAGE }}
      options: --user root
      # GPU 资源配置
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    # GPU 任务调度
    if: ${{ vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[gpu]') || vars.GPU_ENABLED == 'false' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        run: |
          python3 --version
          poetry --version

      - name: 安装项目依赖
        run: |
          poetry install --no-interaction

      - name: 验证 GPU 可用性 (可选)
        if: ${{ vars.GPU_ENABLED == 'true' }}
        run: |
          python3 -c "import torch; print(f'CUDA 可用：{torch.cuda.is_available()}')" || echo "GPU 不可用，使用 CPU 模式"

      - name: 运行单元测试
        run: |
          mkdir -p reports/coverage reports/pytest
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/html \
            --cov-report=term-missing \
            --junitxml=reports/pytest/unit-tests.xml \
            -v

      - name: 检查覆盖率门禁 (≥80%)
        run: |
          poetry run coverage report --fail-under=80

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 30

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/pytest/
          retention-days: 30

  # ===========================================================================
  # 阶段 3: 集成测试 (Docker Compose) - 支持 GPU
  # ===========================================================================
  integration-test:
    name: "🔗 集成测试"
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [unit-test]
    container:
      image: ${{ env.DEPENDENCY_IMAGE }}
      options: --user root --privileged
    # GPU 任务调度
    if: ${{ vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[gpu]') || vars.GPU_ENABLED == 'false' }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        run: |
          python3 --version
          poetry --version

      - name: 安装项目依赖
        run: |
          poetry install --no-interaction

      - name: 等待服务就绪
        run: |
          echo "等待 PostgreSQL 就绪..."
          until pg_isready -h postgres -p 5432 -U test; do sleep 1; done
          echo "PostgreSQL 就绪"

          echo "等待 Redis 就绪..."
          until redis-cli -h redis ping | grep -q PONG; do sleep 1; done
          echo "Redis 就绪"

      - name: 运行集成测试
        run: |
          mkdir -p reports/integration
          poetry run pytest tests/integration \
            --junitxml=reports/integration/integration-tests.xml \
            -v \
            --tb=short

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports/integration/
          retention-days: 30

  # ===========================================================================
  # 阶段 4: 安全扫描 (Trivy + Bandit)
  # ===========================================================================
  security-scan:
    name: "🔒 安全扫描"
    runs-on: ubuntu-latest
    needs: [unit-test]
    container:
      image: ${{ env.DEPENDENCY_IMAGE }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        run: |
          python3 --version
          poetry --version

      - name: 安装项目依赖
        run: |
          poetry install --no-interaction

      - name: Bandit 代码安全扫描
        run: |
          mkdir -p reports/security
          poetry run bandit -r src/ -f json -o reports/security/bandit-report.json || true
          poetry run bandit -r src/ -f screen -o reports/security/bandit-report.txt || true

      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'reports/security/trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security/
          retention-days: 90

  # ===========================================================================
  # 阶段 5: 镜像构建 (Docker Build 多阶段) - 基于预构建镜像
  # ===========================================================================
  build-image:
    name: "🏗️ 构建 Docker 镜像"
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    container:
      image: docker:24-dind
      options: --privileged

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

      - name: 生成镜像标签
        id: meta
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "tags=${{ vars.HARBOR_REGISTRY }}/sisys/app:${GIT_SHA},${{ vars.HARBOR_REGISTRY }}/sisys/app:latest" >> $GITHUB_OUTPUT

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
          cache-from: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/app:buildcache
          cache-to: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/app:buildcache,mode=max
          build-args: |
            DEPENDENCY_IMAGE=${{ env.DEPENDENCY_IMAGE }}
            PYTORCH_IMAGE=${{ env.PYTORCH_IMAGE }}

      - name: 上传镜像信息
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-info
          path: |
            reports/image-info.txt
          retention-days: 30

  # ===========================================================================
  # 阶段 6: 镜像推送 (Harbor) - 含自动漏洞扫描
  # ===========================================================================
  push-image:
    name: "📤 推送镜像并扫描"
    runs-on: ubuntu-latest
    needs: [build-image]
    container:
      image: ${{ env.DEPENDENCY_IMAGE }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取镜像标签
        id: meta
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${{ vars.HARBOR_REGISTRY }}/sisys/app:${GIT_SHA}" >> $GITHUB_OUTPUT

      - name: 触发 Harbor 漏洞扫描
        run: |
          echo "触发 Harbor 自动漏洞扫描..."
          # Harbor 会自动扫描新推送的镜像
          # 可通过 API 查询扫描结果
          curl -k -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/sisys/repositories/app/artifacts" \
            -H "accept: application/json" || echo "扫描已触发"

      - name: 验证镜像推送
        run: |
          echo "验证镜像推送成功..."
          docker pull ${{ steps.meta.outputs.image_tag }} || echo "镜像验证失败"

  # ===========================================================================
  # 阶段 7: 自动部署 (ArgoCD) - 支持 GPU 资源申请
  # ===========================================================================
  deploy:
    name: "🚀 自动部署到测试环境"
    runs-on: ubuntu-latest
    needs: [push-image]
    # 仅在 main 分支部署
    if: github.ref == 'refs/heads/main'
    container:
      image: bitnami/kubectl:latest
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Kubectl
        run: |
          kubectl version --client

      - name: 配置 Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: 更新镜像版本
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          kubectl set image deployment/sisys-app \
            app=${{ vars.HARBOR_REGISTRY }}/sisys/app:${GIT_SHA} \
            -n sisys-test || echo "部署更新"

      - name: 触发 ArgoCD 同步
        run: |
          echo "触发 ArgoCD 自动同步..."
          # ArgoCD 会自动检测到镜像变更并同步
          # 也可手动触发：argocd app sync sisys-app

          # 使用 ArgoCD API 触发同步
          curl -k -X POST "https://${{ env.ARGOCD_SERVER }}/api/v1/applications/sisys-app/sync" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"prune": false, "dryRun": false}' || echo "ArgoCD 同步已触发"

      - name: 等待部署就绪
        run: |
          kubectl rollout status deployment/sisys-app -n sisys-test --timeout=300s

      - name: 执行健康检查
        run: |
          echo "执行健康检查..."
          kubectl get pods -n sisys-test -l app=sisys-app
          kubectl get svc -n sisys-test -l app=sisys-app

      - name: 发送部署通知
        if: always()
        run: |
          echo "部署完成 - 状态：${{ job.status }}"
          # 可集成 Slack/钉钉/企业微信通知
          # curl -X POST "${{ secrets.NOTIFICATION_WEBHOOK }}" ...
