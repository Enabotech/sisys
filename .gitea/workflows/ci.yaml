# CI Pipeline 模板 - 持续集成工作流（优化版）
# 基于预构建 CI 镜像加速流程
# 包含 7 个标准阶段，支持 GPU 任务调度

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

  # 手动触发
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建'
        required: false
        default: 'false'
        type: boolean

# ===========================================================================
# 环境变量配置
# ===========================================================================
env:
  # 应用配置
  APP_NAME: sisys-app
  IMAGE_NAME: sisys-app

  # Harbor 配置
  HARBOR_REGISTRY: harbor.sisys.local
  HARBOR_PROJECT: sisys

  # ArgoCD 配置
  ARGOCD_SERVER: argocd.sisys.local

  # Python 配置
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.3.2"

  # =======================================================================
  # 镜像标签命名规范 (参考：docs/architecture/image-tagging-strategy.md)
  # =======================================================================
  # Layer 1: 基础依赖镜像 (Base Dependency Image)
  # 格式：l1-v{major}.{minor}.{patch}-{git_sha}
  # 说明：Ubuntu 22.04 + Python 3.11.15 + Node.js 20.x + Poetry 2.3.2
  # 构建：make docker-build-l1
  # Layer 1: 基础依赖镜像 - 使用 l1-latest 引用最新稳定版本
  IMAGE_TAG_L1_LATEST: l1-latest

  # Layer 2: CI/CD 依赖镜像 (CI/CD Dependency Image)
  # 格式：l2-v{major}.{minor}.{patch}-{git_sha}
  # 说明：基于 L1 + 项目依赖 (pyproject.toml)
  # 构建：make docker-build-l2
  # Layer 2: CI/CD 依赖镜像 - 使用 l2-latest 引用最新稳定版本
  IMAGE_TAG_L2_LATEST: l2-latest

  # Layer 3: 应用镜像 (Application Image) - CI 自动构建
  # 格式：l3-v{major}.{minor}.{patch}-{git_sha}
  # 说明：基于 L2 + 业务代码
  # 构建：CI 自动触发
  # Layer 3: 应用镜像 - 使用 l3-latest 作为最新稳定版本标签
  IMAGE_TAG_L3_LATEST: l3-latest

  # --- 版本标签前缀 (用于生成具体版本标签) ---
  # Layer 3 基础版本号，CI 构建时会生成 l3-v1.0.0-{git_sha}
  IMAGE_TAG_L3_BASE: l3-v1.0.0

# ===========================================================================
# 并发控制 - 同一 PR 只运行一个 Pipeline
# ===========================================================================
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 阶段 1: 代码质量门禁 (Ruff + MyPy)
  # ===========================================================================
  code-quality:
    name: "🔍 代码检查"
    runs-on: ubuntu-latest
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证环境
        run: |
          echo "Python 版本:"
          python3 --version
          echo "Poetry 版本:"
          poetry --version

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      # 预构建镜像包含大部分依赖，此步骤仅处理新增/变更的依赖
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: Ruff 代码检查
        run: |
          mkdir -p reports/linting
          poetry run ruff check . --output-format=github > reports/linting/ruff-check.txt || true
          poetry run ruff format --check .

      - name: MyPy 类型检查
        run: |
          mkdir -p reports/mypy
          poetry run mypy src/ tests/ --txt-report reports/mypy/mypy-report.txt || true

      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report
          path: |
            reports/linting/
            reports/mypy/
          retention-days: 30

  # ===========================================================================
  # 阶段 2: 单元测试 (pytest + 覆盖率) - 支持 GPU
  # ===========================================================================
  unit-tests:
    name: "🧪 单元测试"
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'gpu' }}
    needs: code-quality
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root --gpus all

    # ✅ 逻辑：除非 (GPU 开启 且 消息包含 [no gpu])，否则都运行
    if: ${{ !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]')) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: 验证 GPU 可用性
        if: ${{ vars.GPU_ENABLED == 'true' }}
        run: |
          poetry run python -c "
          import sys
          import torch

          is_cuda = torch.cuda.is_available()
          version = torch.__version__

          print(f'CUDA  ：{torch.cuda.is_available()}')
          print(f'Torch ：{torch.__version__}')

          if not is_cuda:
              print('❌ 错误：GPU_ENABLED 为 true，但 CUDA 不可用！')
              print('💡 请检查 Runner 是否配置了 --gpus all 及 NVIDIA 驱动。')
              sys.exit(1)

          print('✅ GPU 验证通过')
          "

      - name: 运行单元测试
        run: |
          mkdir -p reports/coverage reports/pytest
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/coverage.html \
            --cov-report=term-missing \
            --junitxml=reports/pytest/unit-tests.xml \
            --html=reports/pytest/unit-tests.html \
            --self-contained-html \
            -v

      - name: 检查覆盖率门禁 (≥80%)
        run: |
          poetry run coverage report --fail-under=80

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 30

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: reports/pytest/
          retention-days: 30

  # ===========================================================================
  # 阶段 3: 集成测试 (Docker Compose) - 支持 GPU
  # ===========================================================================
  integration-tests:
    name: "🔗 集成测试"
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'gpu' }}
    needs: [unit-tests]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root --gpus all  # ✅ 优化：移除 --privileged（由 Runner 提供）

    # ✅ 逻辑：除非 (GPU 开启 且 消息包含 [no gpu])，否则都运行
    if: ${{ !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]')) }}

    # ===========================================================================
    # 服务容器配置
    # ✅ 最佳实践：不使用端口映射，通过容器网络（DNS 名称）通信
    # ✅ 兼容性：支持 bridge/host/container 所有网络模式
    # ===========================================================================
    services:
      postgres:
        image: harbor.sisys.local/sisys/tools/postgres/postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_db
        # ✅ 移除 ports 配置 - 使用容器网络通信，避免端口冲突
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: harbor.sisys.local/sisys/tools/redis/redis:7.2-alpine
        # ✅ 移除 ports 配置 - 使用容器网络通信，避免端口冲突
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      # - name: 等待 PostgreSQL 就绪
      #   run: |
      #     echo "等待 PostgreSQL 就绪..."
      #     # ✅ 使用服务名访问（兼容所有网络模式）
      #     until pg_isready -h postgres -p 5432 -U test; do sleep 1; done
      #     echo "✅ PostgreSQL 就绪"

      # - name: 等待 Redis 就绪
      #   run: |
      #     echo "等待 Redis 就绪..."
      #     # ✅ 使用服务名访问（兼容所有网络模式）
      #     until redis-cli -h redis ping | grep -q PONG; do sleep 1; done
      #     echo "✅ Redis 就绪"

      - name: 运行集成测试
        run: |
          mkdir -p reports/integration
          poetry run pytest tests/integration \
            --junitxml=reports/integration/integration-tests.xml \
            --html=reports/integration/integration-tests.html \
            --self-contained-html \
            -v \
            --tb=short

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: reports/integration/
          retention-days: 30

  # ===========================================================================
  # 阶段 4: 安全扫描 (Trivy + Bandit)
  # ===========================================================================
  security-scan:
    name: "🔒 安全扫描"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    container:
      # ✅ 使用预构建 CI 镜像 (Layer 2)
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      - name: 更新项目依赖
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: 代码安全扫描 (Bandit)
        run: |
          mkdir -p reports/security
          poetry run bandit -r src/ -f json -o reports/security/bandit-report.json || true
          poetry run bandit -r src/ -f screen -o reports/security/bandit-report.txt || true

      # - name: Trivy 缓存
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.cache/trivy
      #     key: cache-trivy-${{ runner.os }}-${{ hashFiles('**/trivy-cache-key') }}
      #     restore-keys: |
      #       cache-trivy-${{ runner.os }}-

      - name: 文件系统扫描 (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_INSECURE: 'true'
          TRIVY_DB_REPOSITORY: 'harbor.sisys.local/sisys/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'harbor.sisys.local/sisys/aquasecurity/trivy-java-db:1'
          TRIVY_CHECKS_BUNDLE_REPOSITORY: 'harbor.sisys.local/sisys/aquasecurity/trivy-checks:2'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'reports/security/trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: 'true'
          # offline-scan: 'true'
          skip-db-update: 'true'
          skip-java-db-update: 'true'
          skip-check-update: 'true'

      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/security/
          retention-days: 90

  # ===========================================================================
  # 阶段 5: 镜像构建 (Docker Build 多阶段)
  # ===========================================================================
  build-image:
    name: "🏗️ 构建镜像"
    # ✅ 使用 DinD Runner 进行构建（有完整的 Buildx 支持）
    runs-on: buildx
    needs: [integration-tests, security-scan]
    container:
      # ✅ 使用 Layer 1 基础镜像进行构建
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L1_LATEST }}
      options: --user root --privileged  # ✅ 修复：添加 --user root
      credentials:
        username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
        password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置CA
        run: |
          # 写入 Harbor CA
          mkdir -p /tmp/buildkit-certs
          printf '%s' "${{ secrets.HARBOR_CA_CRT }}" > /tmp/buildkit-certs/harbor-ca.crt

          # 安装 Harbor CA 到系统信任链（Alpine）
          cp /tmp/buildkit-certs/harbor-ca.crt /usr/local/share/ca-certificates/harbor.crt
          # 更新系统信任
          update-ca-certificates

          # 生成 BuildKit 配置
          cat > buildkitd.toml <<EOF
          [registry."harbor.sisys.local"]
            ca = ["/tmp/buildkit-certs/harbor-ca.crt"]
          EOF

          echo "Docker 版本:"
          docker --version
          docker info
          docker buildx version

      # ✅ 先登录 Harbor（因为 buildkit 镜像在 Harbor 中）
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=harbor.sisys.local/sisys/tools/moby/buildkit:buildx-stable-1
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host
          config: buildkitd.toml

      - name: 生成镜像标签
        id: meta
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          # Layer 3 应用镜像标签 (遵循标签命名规范)
          echo "image_tag_l3=${{ env.IMAGE_TAG_L3_BASE }}-${GIT_SHA}" >> $GITHUB_OUTPUT
          # 测试环境标签
          echo "image_tag_test=test-v1.0.0-${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag_l3=${{ env.IMAGE_TAG_L3_BASE }}-${GIT_SHA}"
          echo "image_tag_test=test-v1.0.0-${GIT_SHA}"

      - name: 构建推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.app
          push: true
          tags: |
            ${{ vars.HARBOR_REGISTRY }}/sisys/app:${{ steps.meta.outputs.image_tag_l3 }}
            ${{ vars.HARBOR_REGISTRY }}/sisys/app:${{ steps.meta.outputs.image_tag_test }}
            ${{ vars.HARBOR_REGISTRY }}/sisys/app:l3-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
            sisys.image.layer="l3"
            sisys.image.type="application"
          cache-from: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:app-cache
          cache-to: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/buildcache:app-cache,mode=min
          build-args: |
            DEPENDENCY_IMAGE=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
          provenance: false
          platforms: linux/amd64

      - name: 上传镜像信息
        uses: actions/upload-artifact@v3
        with:
          name: docker-image-info
          path: |
            reports/image-info.txt
          retention-days: 30

  # ===========================================================================
  # 阶段 6: 镜像推送 (Harbor) - 含自动漏洞扫描
  # ===========================================================================
  push-image:
    name: "📤 推送镜像"
    runs-on: buildx
    needs: [build-image]
    container:
      # ✅ 使用 Layer 2 CI 镜像
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_L2_LATEST }}
      options: --user root

    steps:
      - name: 获取镜像标签
        id: meta
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG_L3="${{ env.IMAGE_TAG_L3_BASE }}-${GIT_SHA}"
          echo "image_tag_l3=${{ vars.HARBOR_REGISTRY }}/sisys/app:${IMAGE_TAG_L3}" >> $GITHUB_OUTPUT
          echo "image_tag_test=${{ vars.HARBOR_REGISTRY }}/sisys/app:test-v1.0.0-${GIT_SHA}" >> $GITHUB_OUTPUT

      - name: 触发 Harbor 漏洞扫描
        run: |
          echo "触发 Harbor 自动漏洞扫描..."
          # Harbor 会自动扫描新推送的镜像
          # 可通过 API 查询扫描结果
          curl -k -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/sisys/repositories/app/artifacts" \
            -H "accept: application/json" || echo "扫描已触发"

      - name: 验证镜像推送
        run: |
          echo "验证镜像推送成功..."
          docker pull ${{ steps.meta.outputs.image_tag_l3 }} || echo "镜像验证失败"
          docker pull ${{ steps.meta.outputs.image_tag_test }} || echo "测试镜像验证失败"

  # ===========================================================================
  # 阶段 7: 自动部署 (ArgoCD) - 仅 main 分支 -Argocd 已部署自动部署功能
  # ===========================================================================
  # auto-deploy:
  #   name: "🚀 自动部署"
  #   runs-on: ubuntu-latest
  #   needs: [push-image]
  #   # 仅在 main 分支部署
  #   if: github.ref == 'refs/heads/main'
  #   container:
  #     image: bitnami/kubectl:latest
  #     options: --user root

  #   steps:
  #     - name: 检出代码
  #       uses: actions/checkout@v4

  #     - name: 设置 Kubectl
  #       run: |
  #         kubectl version --client

  #     - name: 配置 Kubeconfig
  #       run: |
  #         mkdir -p ~/.kube
  #         echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

  #     - name: 更新镜像版本
  #       run: |
  #         GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
  #         IMAGE_TAG_L3="${{ env.IMAGE_TAG_L3_BASE }}-${GIT_SHA}"
