# ============================================================
# CI Pipeline 模板
# ============================================================
# Story: 0-8-gitea-runner-configuration
# Task: 5 - Pipeline 模板配置
#
# 7 阶段 Pipeline:
#   1. 代码质量 (Ruff + MyPy)
#   2. 单元测试 (pytest + cov)
#   3. 集成测试 (Docker Compose)
#   4. 安全扫描 (Trivy + Bandit)
#   5. 镜像构建 (Docker Build)
#   6. 镜像推送 (Harbor)
#   7. 自动部署 (ArgoCD)
# ============================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  # 应用配置
  APP_NAME: sisys
  REGISTRY: harbor.sisys.local
  IMAGE_NAME: sisys/app

  # Python 版本
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # 阶段 1: 代码质量
  # ============================================================
  code-quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest:host
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff linting
        run: |
          ruff check . --output-format=github

      - name: Ruff format check
        run: |
          ruff format . --check

      - name: MyPy type checking
        run: |
          mypy src/ --pretty

  # ============================================================
  # 阶段 2: 单元测试
  # ============================================================
  unit-test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest:host
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ============================================================
  # 阶段 3: 集成测试
  # ============================================================
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest:host
    needs: unit-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test         # pragma: allowlist secret
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          pytest tests/integration \
            --cov=src \
            --cov-append \
            -v \
            --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  # ============================================================
  # 阶段 4: 安全扫描
  # ============================================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest:host
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'

      - name: Upload Trivy filesystem report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs.sarif

      - name: Dependency vulnerability check
        run: |
          safety check --json > safety-report.json || true

      - name: Upload safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-dependency-report
          path: safety-report.json

  # ============================================================
  # 阶段 5: 镜像构建
  # ============================================================
  build-image:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest:host
    needs: [integration-test, security-scan]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Export image to tar
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} > image.tar

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ============================================================
  # 阶段 6: 镜像推送
  # ============================================================
  push-image:
    name: 📤 Push to Harbor
    runs-on: ubuntu-latest:host
    needs: build-image
    environment:
      name: harbor
      url: https://harbor.sisys.local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Push Docker image to Harbor
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64

      - name: Trigger Harbor vulnerability scan
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
            "https://${{ env.REGISTRY }}/api/v2.0/projects/sisys/repositories/app/artifacts/${{ github.sha }}/scan" \
            || echo "⚠️ Trigger scan failed (will scan automatically)"

      - name: Output image information
        run: |
          echo "✅ Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"

  # ============================================================
  # 阶段 7: 自动部署 (仅 main 分支)
  # ============================================================
  deploy:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest:host
    needs: push-image
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sisys.local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Update image in deployment
        run: |
          kubectl set image deployment/sisys-app \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n sisys

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sisys-app -n sisys --timeout=300s

      - name: Trigger ArgoCD sync (optional)
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://argocd.sisys.local/api/v1/applications/sisys-app/sync" \
            -d '{"prune": false, "dryRun": false}' \
            || echo "⚠️ ArgoCD sync triggered manually"

      - name: Health check
        run: |
          sleep 30
          curl -f https://sisys.local/health || exit 1

      - name: Deployment summary
        run: |
          echo "## Deployment Summary"
          echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "- Environment: Production"
          echo "- Status: ✅ Deployed"
