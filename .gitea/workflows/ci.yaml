# CI Pipeline 模板 - 持续集成工作流（优化版）
# 基于预构建 CI 镜像加速流程
# 包含 7 个标准阶段，支持 GPU 任务调度

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

  # 手动触发
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建'
        required: false
        default: 'false'
        type: boolean

# ===========================================================================
# 环境变量配置
# ===========================================================================
env:
  # 应用配置
  APP_NAME: sisys-app
  IMAGE_NAME: sisys-app

  # Harbor 配置
  HARBOR_REGISTRY: harbor.sisys.local
  HARBOR_PROJECT: sisys

  # ArgoCD 配置
  ARGOCD_SERVER: argocd.sisys.local

  # Python 配置
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.3.2"

  IMAGE_TAG_BASE: l1-latest

  # CI 镜像标签（使用固定标签，本地手动构建）
  # 当 pyproject.toml 变更时，手动运行 make docker-build-ci 更新镜像
  IMAGE_TAG_CI: l2-latest

# ===========================================================================
# 并发控制 - 同一 PR 只运行一个 Pipeline
# ===========================================================================
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 阶段 1: 代码质量门禁 (Ruff + MyPy)
  # ===========================================================================
  code-quality:
    name: "🔍 代码质量检查"
    runs-on: ubuntu-latest
    container:
      # ✅ 使用预构建 CI 镜像（固定标签，本地手动构建）
      # 当 pyproject.toml 变更时，poetry install 会自动处理依赖更新
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_CI }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证环境
        run: |
          echo "Python 版本:"
          python3 --version
          echo "Poetry 版本:"
          poetry --version

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      # 预构建镜像包含大部分依赖，此步骤仅处理新增/变更的依赖
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: Ruff 代码检查
        run: |
          mkdir -p reports/linting
          poetry run ruff check . --output-format=github > reports/linting/ruff-check.txt || true
          poetry run ruff format --check .

      - name: MyPy 类型检查
        run: |
          mkdir -p reports/mypy
          poetry run mypy src/ tests/ --txt-report reports/mypy/mypy-report.txt || true

      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report
          path: |
            reports/linting/
            reports/mypy/
          retention-days: 30

  # ===========================================================================
  # 阶段 2: 单元测试 (pytest + 覆盖率) - 支持 GPU
  # ===========================================================================
  unit-tests:
    name: "🧪 单元测试"
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: code-quality
    container:
      # ✅ 使用预构建 CI 镜像（固定标签，本地手动构建）
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_CI }}
      options: --user root --gpus all

    # ✅ 逻辑：除非 (GPU 开启 且 消息包含 [no gpu])，否则都运行
    if: ${{ !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]')) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: 验证 GPU 可用性
        if: ${{ vars.GPU_ENABLED == 'true' }}
        run: |
          poetry run python -c "
          import sys
          import torch

          is_cuda = torch.cuda.is_available()
          version = torch.__version__

          print(f'CUDA  ：{torch.cuda.is_available()}')
          print(f'Torch ：{torch.__version__}')

          if not is_cuda:
              print('❌ 错误：GPU_ENABLED 为 true，但 CUDA 不可用！')
              print('💡 请检查 Runner 是否配置了 --gpus all 及 NVIDIA 驱动。')
              sys.exit(1)

          print('✅ GPU 验证通过')
          "

      - name: 运行单元测试
        run: |
          mkdir -p reports/coverage reports/pytest
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/html \
            --cov-report=term-missing \
            --junitxml=reports/pytest/unit-tests.xml \
            -v

      - name: 检查覆盖率门禁 (≥80%)
        run: |
          poetry run coverage report --fail-under=80

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 30

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: reports/pytest/
          retention-days: 30

  # ===========================================================================
  # 阶段 3: 集成测试 (Docker Compose) - 支持 GPU
  # ===========================================================================
  integration-tests:
    name: "🔗 集成测试"
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [unit-tests]
    container:
      # ✅ 使用预构建 CI 镜像（固定标签，本地手动构建）
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_CI }}
      options: --user root --privileged

    # ✅ 逻辑：除非 (GPU 开启 且 消息包含 [no gpu])，否则都运行
    if: ${{ !(vars.GPU_ENABLED == 'true' && contains(github.event.head_commit.message, '[no gpu]')) }}

    # ===========================================================================
    # 服务容器配置
    # ✅ 最佳实践：不使用端口映射，通过容器网络（DNS 名称）通信
    # ✅ 兼容性：支持 bridge/host/container 所有网络模式
    # ===========================================================================
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
          POSTGRES_DB: test_db
        # ✅ 移除 ports 配置 - 使用容器网络通信，避免端口冲突
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        # ✅ 移除 ports 配置 - 使用容器网络通信，避免端口冲突
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: 等待 PostgreSQL 就绪
        run: |
          echo "等待 PostgreSQL 就绪..."
          # ✅ 使用服务名访问（兼容所有网络模式）
          until pg_isready -h postgres -p 5432 -U test; do sleep 1; done
          echo "✅ PostgreSQL 就绪"

      - name: 等待 Redis 就绪
        run: |
          echo "等待 Redis 就绪..."
          # ✅ 使用服务名访问（兼容所有网络模式）
          until redis-cli -h redis ping | grep -q PONG; do sleep 1; done
          echo "✅ Redis 就绪"

      - name: 运行集成测试
        run: |
          mkdir -p reports/integration
          poetry run pytest tests/integration \
            --junitxml=reports/integration/integration-tests.xml \
            -v \
            --tb=short

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: reports/integration/
          retention-days: 30

  # ===========================================================================
  # 阶段 4: 安全扫描 (Trivy + Bandit)
  # ===========================================================================
  security-scan:
    name: "🔒 安全扫描"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    container:
      # ✅ 使用预构建 CI 镜像（固定标签，本地手动构建）
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_CI }}
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ✅ 保留 poetry install 作为补充（处理微小依赖变更）
      - name: 安装项目依赖（如有变更）
        run: |
          poetry install --no-interaction --quiet || echo "依赖安装完成"

      - name: Bandit 代码安全扫描
        run: |
          mkdir -p reports/security
          poetry run bandit -r src/ -f json -o reports/security/bandit-report.json || true
          poetry run bandit -r src/ -f screen -o reports/security/bandit-report.txt || true

      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'reports/security/trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/security/
          retention-days: 90

  # ===========================================================================
  # 阶段 5: 镜像构建 (Docker Build 多阶段)
  # ===========================================================================
  build-image:
    name: "🏗️ 构建 Docker 镜像"
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan]
    container:
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_BASE }}
      options: --privileged

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Harbor 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}

      - name: 生成镜像标签
        id: meta
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.app
          push: true
          tags: |
            ${{ vars.HARBOR_REGISTRY }}/sisys/app:${GIT_SHA}
            ${{ vars.HARBOR_REGISTRY }}/sisys/app:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.timestamp }}
          cache-from: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/app:buildcache
          cache-to: type=registry,ref=${{ vars.HARBOR_REGISTRY }}/sisys/app:buildcache,mode=max
          build-args: |
            DEPENDENCY_IMAGE=${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_CI }}

      - name: 上传镜像信息
        uses: actions/upload-artifact@v3
        with:
          name: docker-image-info
          path: |
            reports/image-info.txt
          retention-days: 30

  # ===========================================================================
  # 阶段 6: 镜像推送 (Harbor) - 含自动漏洞扫描
  # ===========================================================================
  push-image:
    name: "📤 推送镜像并扫描"
    runs-on: ubuntu-latest
    needs: [build-image]
    container:
      # ✅ 使用预构建 CI 镜像
      image: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/dependency:${{ env.IMAGE_TAG_CI }}
      options: --user root

    steps:
      - name: 获取镜像标签
        id: meta
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${{ vars.HARBOR_REGISTRY }}/sisys/app:${GIT_SHA}" >> $GITHUB_OUTPUT

      - name: 触发 Harbor 漏洞扫描
        run: |
          echo "触发 Harbor 自动漏洞扫描..."
          # Harbor 会自动扫描新推送的镜像
          # 可通过 API 查询扫描结果
          curl -k -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
            "https://${{ vars.HARBOR_REGISTRY }}/api/v2.0/projects/sisys/repositories/app/artifacts" \
            -H "accept: application/json" || echo "扫描已触发"

      - name: 验证镜像推送
        run: |
          echo "验证镜像推送成功..."
          docker pull ${{ steps.meta.outputs.image_tag }} || echo "镜像验证失败"

  # ===========================================================================
  # 阶段 7: 自动部署 (ArgoCD) - 仅 main 分支
  # ===========================================================================
  auto-deploy:
    name: "🚀 自动部署到测试环境"
    runs-on: ubuntu-latest
    needs: [push-image]
    # 仅在 main 分支部署
    if: github.ref == 'refs/heads/main'
    container:
      image: bitnami/kubectl:latest
      options: --user root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Kubectl
        run: |
          kubectl version --client

      - name: 配置 Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: 更新镜像版本
        run: |
          GIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          kubectl set image deployment/sisys-app \
            app=${{ vars.HARBOR_REGISTRY }}/sisys/app:${GIT_SHA} \
            -n sisys-test || echo "部署更新"

      - name: 触发 ArgoCD 同步
        run: |
          echo "触发 ArgoCD 自动同步..."
          # ArgoCD 会自动检测到镜像变更并同步
          # 也可手动触发：argocd app sync sisys-app

          # 使用 ArgoCD API 触发同步
          curl -k -X POST "https://${{ env.ARGOCD_SERVER }}/api/v1/applications/sisys-app/sync" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"prune": false, "dryRun": false}' || echo "ArgoCD 同步已触发"

      - name: 等待部署就绪
        run: |
          kubectl rollout status deployment/sisys-app -n sisys-test --timeout=300s

      - name: 执行健康检查
        run: |
          echo "执行健康检查..."
          kubectl get pods -n sisys-test -l app=sisys-app
          kubectl get svc -n sisys-test -l app=sisys-app

      - name: 发送部署通知
        if: always()
        run: |
          echo "部署完成 - 状态：${{ job.status }}"
          # 可集成 Slack/钉钉/企业微信通知
          # curl -X POST "${{ secrets.NOTIFICATION_WEBHOOK }}" ...
