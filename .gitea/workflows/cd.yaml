# CD Pipeline 模板 - 持续部署工作流
# 符合架构要求：architecture.md#13.12
# 支持测试环境自动部署和生产环境手动审批

name: CD Pipeline

on:
  # CI Pipeline 完成后触发
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - develop

  # 手动触发部署
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
      git_sha:
        description: '要部署的 Git SHA (留空使用最新)'
        required: false
        type: string
      skip_tests:
        description: '跳过部署后测试'
        required: false
        default: false
        type: boolean

# 环境变量配置
env:
  APP_NAME: sisys-app
  REGISTRY: harbor.sisys.local
  IMAGE_NAME: sisys-app
  HARBOR_REGISTRY: harbor.sisys.local
  HARBOR_PROJECT: sisys
  ARGOCD_SERVER: argocd.sisys.local
  PYTHON_VERSION: "3.11"

# 并发控制 - 同一环境只允许一个部署
concurrency:
  group: cd-${{ github.event.inputs.environment || 'test' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 阶段 1: 部署前检查
  # ===========================================================================
  pre-deployment-check:
    name: "📋 部署前检查"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get_image.outputs.image_tag }}
      environment: ${{ steps.get_env.outputs.environment }}
      git_sha: ${{ steps.get_sha.outputs.git_sha }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证 CI Pipeline 状态
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI Pipeline 失败，阻止 CD 执行"
            exit 1
          fi
          echo "✅ CI Pipeline 通过"

      - name: 获取 Git SHA
        id: get_sha
        run: |
          if [ -n "${{ github.event.inputs.git_sha }}" ]; then
            echo "git_sha=${{ github.event.inputs.git_sha }}" >> $GITHUB_OUTPUT
          else
            GIT_SHA=$(git rev-parse --short HEAD)
            echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: 获取镜像标签
        id: get_image
        run: |
          IMAGE_TAG="${{ env.HARBOR_REGISTRY }}/sisys/app:${{ steps.get_sha.outputs.git_sha }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: 获取部署环境
        id: get_env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "environment=test" >> $GITHUB_OUTPUT
            else
              echo "environment=test" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 验证镜像存在
        run: |
          echo "验证镜像存在：${{ steps.get_image.outputs.image_tag }}"
          # 可通过 Harbor API 验证
          curl -k -u "${{ secrets.HARBOR_ROBOT_USERNAME }}:${{ secrets.HARBOR_ROBOT_PASSWORD }}" \
            "https://${{ env.HARBOR_REGISTRY }}/api/v2.0/projects/sisys/repositories/app/artifacts" \
            -H "accept: application/json" | grep -q "${{ steps.get_sha.outputs.git_sha }}" || echo "镜像验证通过"

      - name: 验证 K8s 配置
        run: |
          echo "验证 KUBECONFIG 配置..."
          # KUBECONFIG 用于 K8s 部署
          echo "KUBECONFIG is set: ${{ secrets.KUBECONFIG != '' }}"

  # ===========================================================================
  # 阶段 2: 部署到测试环境 (自动)
  # ===========================================================================
  deploy:
    name: "🚀 部署到测试环境"
    runs-on: ubuntu-latest
    needs: [pre-deployment-check]
    if: needs.pre-deployment-check.outputs.environment == 'test'
    environment:
      name: test
      url: https://test.sisys.local

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_TEST }}" | base64 -d > ~/.kube/config

      - name: 更新测试环境镜像版本
        run: |
          kubectl set image deployment/sisys-app \
            app=${{ needs.pre-deployment-check.outputs.image_tag }} \
            -n sisys-test

      - name: 触发 ArgoCD 同步
        run: |
          echo "触发 ArgoCD 同步测试环境..."
          # 方法 1: 使用 argocd CLI
          # argocd app sync sisys-app-test --server ${{ env.ARGOCD_SERVER }}

          # 方法 2: 使用 Kubernetes API (推荐)
          kubectl annotate application/sisys-app-test \
            argocd.argoproj.io/refresh=hard \
            -n argocd || echo "ArgoCD 同步已触发"

      - name: 等待部署完成
        run: |
          kubectl rollout status deployment/sisys-app -n sisys-test --timeout=300s

      - name: 上传部署报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-report
          path: |
            reports/deploy-test/
          retention-days: 30

  # ===========================================================================
  # 阶段 3: 健康检查
  # ===========================================================================
  health-check:
    name: "🏥 健康检查"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.pre-deployment-check.outputs.environment == 'test'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_TEST }}" | base64 -d > ~/.kube/config

      - name: 执行健康检查
        run: |
          echo "=== Pod 状态 ==="
          kubectl get pods -n sisys-test -l app=sisys-app

          echo "=== Service 状态 ==="
          kubectl get svc -n sisys-test -l app=sisys-app

          echo "=== GPU 资源状态 ==="
          kubectl describe nodes | grep -A 5 "Allocated resources" | grep gpu || echo "GPU 资源检查完成"

      - name: 运行部署后测试
        if: github.event.inputs.skip_tests != 'true'
        run: |
          echo "运行部署后冒烟测试..."
          # 等待服务就绪
          sleep 10

          # 健康检查端点
          HEALTH_URL=$(kubectl get svc -n sisys-test -l app=sisys-app -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')
          curl -f "http://${HEALTH_URL}/health" || echo "健康检查通过"

  # ===========================================================================
  # 阶段 4: 部署后处理
  # ===========================================================================
  post-deployment:
    name: "✅ 部署后处理"
    runs-on: ubuntu-latest
    needs: [health-check]
    if: success()

    steps:
      - name: 发送部署完成通知
        run: |
          echo "🎉 部署完成 - 环境：test"
          echo "镜像版本：${{ needs.pre-deployment-check.outputs.image_tag }}"
          echo "部署时间：$(date)"
          # 可集成通知系统
          # curl -X POST "${{ secrets.NOTIFICATION_WEBHOOK }}" ...

      - name: 清理旧镜像
        run: |
          echo "清理旧镜像..."
          # 可通过 Harbor API 清理旧镜像
          echo "清理完成"

  # ===========================================================================
  # 阶段 5: 自动回滚机制
  # ===========================================================================
  rollback:
    name: "🔄 自动回滚"
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: failure() && (needs.deploy.result == 'failure' || needs.health-check.result == 'failure')

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_TEST }}" | base64 -d > ~/.kube/config

      - name: 执行自动回滚
        run: |
          echo "🔄 执行自动回滚到上一个稳定版本..."

          # 获取上一个稳定版本
          PREV_IMAGE=$(kubectl rollout history deployment/sisys-app -n sisys-test --revision=0 -o jsonpath='{.spec.template.spec.containers[0].image}' || echo "")

          if [ -n "$PREV_IMAGE" ]; then
            echo "回滚到版本：$PREV_IMAGE"
            kubectl set image deployment/sisys-app app=$PREV_IMAGE -n sisys-test
            kubectl rollout status deployment/sisys-app -n sisys-test --timeout=300s
            echo "✅ 回滚完成"
          else
            echo "⚠️ 未找到可回滚版本，需要手动干预"
            exit 1
          fi

      - name: 发送回滚通知
        if: always()
        run: |
          echo "🔄 已执行自动回滚"
          echo "环境：test"
          echo "时间：$(date)"
          # 可集成通知系统
