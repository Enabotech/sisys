[tool.poetry]
name = "sisys"
version = "0.1.0"
description = "AI-driven strategic planning and decision intelligence platform for enterprises"
authors = ["Agimtech <agimtech@example.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# Web Framework
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.7"

# CLI
click = "^8.1.7"
typer = "^0.16.0"

# Database & ORM
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"

# Redis & Caching
redis = "^5.0.1"
hiredis = "^2.2.3"

# Vector Database
qdrant-client = "^1.7.0"

# Graph Database
neo4j = "^5.15.0"

# Object Storage
minio = "^7.2.0"
boto3 = "^1.34.0"

# LLM & AI
langgraph = "^1.0.0"
prefect = "^3.6.0"
litellm = "^1.28.0"
sentence-transformers = "^2.2.2"

# Embeddings
FlagEmbedding = "^1.2.8"  # BGE-M3

# Search & Ranking
rank-bm25 = "^0.2.2"

# Data Processing
pandas = "^2.1.3"
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"

# Document Processing
pypdf2 = "^3.0.1"
python-docx = "^1.1.0"
openpyxl = "^3.1.2"
pillow = "^10.1.0"

# OCR
pytesseract = "^0.3.10"

# Message Queue
aio-pika = "^9.3.0"

# Monitoring & Observability
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-exporter-otlp = "^1.21.0"
prometheus-client = "^0.21.1"

# Security & Auth
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"
pytest-timeout = "^2.2.0"
httpx = "^0.25.2"
coverage = "^7.4.0"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
bandit = "^1.9.4"
detect-secrets = "^1.5.0"
pbr = "^7.0.3"

[tool.poetry.scripts]
sisys = "src.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Black Configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

# Ruff Configuration
[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

# Mypy Configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Pytest Configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "unit: marks unit tests",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
fail_under = 0  # Set to 80 for CI/CD enforcement
