[project]
name = "sisys"
version = "0.1.1"
description = "AI-driven strategic planning and decision intelligence platform for enterprises"
authors = [{name = "Agimtech", email = "agimtech@example.com"}]
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# Web Framework
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.22"

# CLI
typer = "^0.24.0"

# L1 Caching
redis = "^5.0.1"
redis-om = "^0.3.0"
hiredis = "^2.2.3"

# L2 Relational Database & ORM
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"

# L3 Vector Database
qdrant-client = "1.7.1"

# L4 Object Storage
minio = "^7.2.0"
boto3 = "^1.34.0"

# L5 Graph Database
neo4j = "^5.15.0"
neomodel = "^5.2.0"

# General Data Tools
pandas = "^2.1.3"
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
httpx = "^0.27.0"

# pytorch
torch = {version = "2.7.1", source = "pytorch-cuda"}
torchvision = {version = "0.22.1", source = "pytorch-cuda"}
torchaudio = {version = "2.7.1", source = "pytorch-cuda"}

# LLM & AI
langgraph = "^1.0.0"
prefect = "^3.6.0"
litellm = "^1.28.0"
sentence-transformers = "^2.2.2"

# Embeddings
FlagEmbedding = "^1.2.8"  # BGE-M3

# Search & Ranking
rank-bm25 = "^0.2.2"

# Document Processing
python-docx = "^1.1.0"
defusedxml = "^0.7.0"
python-pptx = "^1.0"
openpyxl = "^3.1.2"
pillow = "^12.1.1"
scrapy = "^2.11"
pypdf = "^6.12.1"
tinytag = "^2.2.1"
ffmpeg-python = "^0.2.0"

# OCR
pytesseract = "^0.3.10"
onnxruntime = "^1.26.0"
pypdfium2 = "^5.9.0"

# Message Queue
aio-pika = "^9.3.0"

# Monitoring & Observability
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-exporter-otlp = "^1.21.0"
prometheus-client = "^0.21.1"

# Security & Auth
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = ">=4.0.0,<5.0.0"
pylint = "^4.0.5"
pydantic-extra-types = "^2.11.1"
pyotp = "^2.9.0"
types-psycopg2 = "^2.9.21.20260422"
types-aiofiles = "^25.1.0.20250115"
aiofiles = "^25.1.0"

# Others
scrapy-playwright = "^0.0.46"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.14.0"
pytest-xdist = "^3.8.0"
pytest-timeout = "^2.3.0"
pytest-bdd = "^8.0.0"  # SDD 验收测试
coverage = "^7.4.0"
factory_boy = "^3.3.0"  # 测试数据工厂
pytest-html = "^4.2.0"
fakeredis = "^2.28.0"
reportlab = "^4.5.1"

[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
ruff = "^0.15.12"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
bandit = "^1.9.4"
detect-secrets = "^1.5.0"
pbr = "^7.0.3"
freezegun = "^1.5.1"

# SDD 工具链
schemathesis = "^3.19.0"  # API 契约测试
openapi-spec-validator = "^0.7.2"  # OpenAPI 验证
jsonschema = "^4.19.0"  # JSON Schema 验证
safety = "^3.7.0"
types-requests = "^2.32.4.20260107"
types-PyYAML = "^6.0.0"
types-passlib = "^1.7.7"
types-python-jose = "^3.5.0"
types-reportlab = "^4.5.1.20260521"
types-openpyxl = "^3.1.5.20260518"
types-defusedxml = "^0.7.0"
import-linter = "^2.11"
asyncpg-stubs = "^0.31.2"
striprtf = "^0.0.32"

[project.scripts]
crawler = "plugins.crawler.cli:app"

[tool.poetry.scripts]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128/"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Black Configuration
[tool.black]
line-length = 128
target-version = ['py311']
include = '\.pyi?$'

# Ruff Configuration
[tool.ruff]
line-length = 128
target-version = "py311"
output-format = "concise"
exclude = [
    ".claude/",
    ".qwen/",
    "_bmad/",
    ".git/",
    "__pycache__/",
    "*.egg-info/",
    ".venv/",
    "venv/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Mypy Configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
mypy_path = "stubs"

exclude = [
    '^\.claude/',
    '^\.qwen/',
    '^_bmad/',
    '^\.git/',
    '^__pycache__/',
    '\.egg-info/',
    '^\.venv/',
    '^venv/',
]

# Pytest Configuration
[tool.pytest.ini_options]
# 测试发现
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# 标记系统
markers = [
    "unit: 单元测试（Mock 外部依赖，快速执行）",
    "integration: 集成测试（Docker Compose 真实实例，较慢执行）",
    "acceptance: 验收测试（BDD Gherkin 场景，真实服务）",
    "e2e: 端到端验收测试（Gherkin BDD 场景）",
    "asyncio: 异步测试（aio-pika 组件需要）",
    "slow: 慢速测试（>1 秒）",
    "k8s: 需要 Kubernetes 集群访问的测试",
    "database: 需要数据库的测试",
    "redis: 需要 Redis 的测试",
    "qdrant: 需要 Qdrant 的测试",
    "minio: 需要 MinIO 的测试",
    "neo4j: 需要 Neo4j 的测试",
    "llm: 需要 LLM API 的测试",
    "AC-1: Acceptance Criterion - common use for AC tests",
    "AC-2: Acceptance Criterion - common use for AC tests",
    "AC-3: Acceptance Criterion - common use for AC tests",
    "AC-4: Acceptance Criterion - common use for AC tests",
    "AC-5: Acceptance Criterion - common use for AC tests",
    "AC-6: Acceptance Criterion - common use for AC tests",
    "AC-7: Acceptance Criterion - common use for AC tests",
    "AC-8: Acceptance Criterion - common use for AC tests",
    "AC-9: Acceptance Criterion - common use for AC tests",
    "edge-case: Edge case scenarios",
]

# 插件配置
asyncio_mode = "auto"

# 默认选项
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "-n", "auto",
    "--dist", "loadscope",
]

# 过滤器
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]
# branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true

# Bandit Configuration (Security Scanning)
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B105", "B113", "B404", "B501", "B602", "B603", "B607", "B107"]
# B107: hardcoded_password_default - 脚本默认密码为测试用途
# precision = 1
