# sisys - Kubernetes Production Deployment Configuration
# Version: 1.0.0
# Description: Kubernetes manifests for production deployment
#
# Usage:
#   kubectl apply -f k8s/production/
#
# Prerequisites:
#   - Kubernetes cluster 1.25+
#   - kubectl configured with cluster access
#   - Docker image pushed to GHCR
#   - Secrets configured (see KUBERNETES_SECRETS_SETUP.md)

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production
    environment: production

---
# ConfigMap - Application Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sisys-config
  namespace: production
  labels:
    app: sisys
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "postgres"
  REDIS_HOST: "redis"
  QDRANT_HOST: "qdrant"
  MINIO_ENDPOINT: "minio:9000"
  NEO4J_URI: "bolt://neo4j:7687"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

---
# Secret - Sensitive Configuration (placeholder - use external secrets management)
# IMPORTANT: In production, use external secrets management (e.g., HashiCorp Vault, AWS Secrets Manager)
apiVersion: v1
kind: Secret
metadata:
  name: sisys-secrets
  namespace: production
  labels:
    app: sisys
type: Opaque
stringData:
  # These should be populated by your secrets management system
  POSTGRES_USER: "changeme"
  POSTGRES_PASSWORD: "changeme"   # pragma: allowlist secret
  POSTGRES_DB: "sisys"
  MINIO_ROOT_USER: "changeme"
  MINIO_ROOT_PASSWORD: "changeme-minio-password"  # pragma: allowlist secret
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "changeme-neo4j-password"   # pragma: allowlist secret
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "changeme-grafana-password"   # pragma: allowlist secret

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sisys-app
  namespace: production
  labels:
    app: sisys
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sisys
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sisys
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sisys-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: sisys-app
          image: ghcr.io/sisys/sisys:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sisys-config
            - secretRef:
                name: sisys-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: sisys
                topologyKey: kubernetes.io/hostname

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: sisys-app
  namespace: production
  labels:
    app: sisys
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: sisys

---
# Ingress (requires ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sisys-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - sisys.example.com
      secretName: sisys-tls   # pragma: allowlist secret
  rules:
    - host: sisys.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sisys-app
                port:
                  number: 8000

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sisys-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sisys-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sisys-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sisys

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sisys-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: sisys
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: sisys
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 6333  # Qdrant
        - protocol: TCP
          port: 9000  # MinIO
        - protocol: TCP
          port: 7687  # Neo4j
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53  # DNS

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sisys-service-account
  namespace: production
  labels:
    app: sisys
