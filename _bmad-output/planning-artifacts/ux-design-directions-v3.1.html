<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISYS V3.1 · 战略承诺墙</title>
<style>
/* ============================================================
   CSS 设计 Token — 复用 V1，精简
   ============================================================ */
:root {
  --color-primary:#1890ff; --color-primary-hover:#096dd9; --color-primary-active:#40a9ff; --color-primary-bg:#e6f7ff;
  --color-success:#00875A; --color-warning:#B86E00; --color-danger:#C53030;
  --color-score-red:#C53030; --color-score-amber:#D46B08; --color-score-green:#00875A;
  --color-detection:#3B82F6; --color-detection-bg:#EFF6FF; --color-detection-border:#BFDBFE;
  --color-signal-ok-bg:#E6F7F1; --color-signal-warn-bg:#FFF8E6; --color-signal-danger-bg:#FFF1F0;
  --color-text-primary:#262626; --color-text-secondary:#595959; --color-text-tertiary:#8c8c8c; --color-text-disabled:#bfbfbf;
  --color-bg-primary:#f5f5f5; --color-bg-card:#fff; --color-border:#e8e8e8; --color-white:#fff;
  --font-family-base:'PingFang SC','Microsoft YaHei',sans-serif; --font-family-code:'Consolas','Monaco',monospace;
  --spacing-xs:4px; --spacing-sm:8px; --spacing-md:16px; --spacing-lg:24px; --spacing-xl:32px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.1); --shadow-md:0 4px 12px rgba(0,0,0,.08); --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --slider-track-h:8px; --slider-touch-h:20px; --slider-thumb-size:28px;
  --spring-bounce:cubic-bezier(0.34,1.56,0.64,1); --spring-settle:cubic-bezier(0.25,0.1,0.25,1);
  --ripple-dur:0.6s;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-family-base);background:var(--color-bg-primary);color:var(--color-text-primary);line-height:1.6;overflow-x:hidden}

/* 关键帧 — 仅保留必需的 */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:.4}100%{transform:translate(-50%,-50%) scale(3.5);opacity:0}}
@keyframes thumbPulseNotch{0%{transform:translate(-50%,-50%) scale(1.3)}50%{transform:translate(-50%,-50%) scale(1.22)}100%{transform:translate(-50%,-50%) scale(1.3)}}
@keyframes detectionPulse{0%,100%{box-shadow:0 0 0 rgba(59,130,246,0)}50%{box-shadow:0 0 12px rgba(59,130,246,.35)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes sliderPulse{0%,100%{box-shadow:0 0 0 rgba(24,144,255,0)}50%{box-shadow:0 0 16px rgba(24,144,255,.4)}}
@keyframes ghostGlow{0%,100%{opacity:.35}50%{opacity:.55}}

/* ============================================================
   Zone 布局
   ============================================================ */
.app{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;padding:0 var(--spacing-md)}

/* Header Zone */
.header{display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 var(--spacing-sm);border-bottom:1px solid var(--color-border);flex-shrink:0}
.header-brand{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-center{display:flex;align-items:center;gap:var(--spacing-md)}
.header-right{display:flex;align-items:center;gap:var(--spacing-md);font-size:13px}
.header-project{padding:3px 10px;border-radius:4px;border:1px solid var(--color-border);background:var(--color-bg-card);font-size:12px;font-family:var(--font-family-base);cursor:pointer;max-width:200px}
.present-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--color-border);background:var(--color-bg-card);cursor:pointer;font-size:11px;font-family:var(--font-family-base);transition:all .15s}
.present-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.present-btn.active{background:var(--color-primary);color:white;border-color:var(--color-primary)}

/* Slider Zone */
.slider-zone{padding:var(--spacing-sm) var(--spacing-lg);flex-shrink:0;display:flex;align-items:center;gap:var(--spacing-md)}
.slider-zone-label{font-size:13px;font-weight:600;color:var(--color-text-secondary);white-space:nowrap}
.slider-zone-wrap{flex:1;max-width:600px}

/* Counter Zone */
.counter-zone{display:none;padding:0 var(--spacing-lg) var(--spacing-sm);flex-shrink:0}
.counter-zone.visible{display:block;animation:fadeIn .2s ease-out}
.counter-inner{display:flex;align-items:center;gap:var(--spacing-md);padding:var(--spacing-sm) var(--spacing-md);background:var(--color-detection-bg);border:1px solid var(--color-detection-border);border-radius:var(--radius-md);font-size:12px;color:var(--color-text-secondary)}
.counter-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.counter-dot.detection{background:var(--color-detection)}
.counter-dot.warning{background:var(--color-warning)}
.counter-highlight{font-weight:700;color:var(--color-detection)}

/* Card Grid Zone */
.card-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:var(--spacing-md);padding:var(--spacing-md) 0;align-content:start}
.card-grid.presenting{grid-template-columns:1fr;grid-template-rows:1fr;max-width:900px;margin:0 auto;padding:var(--spacing-xl) 0}

/* ============================================================
   卡片样式
   ============================================================ */
.commitment-card{background:var(--color-bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--spacing-md);cursor:pointer;transition:box-shadow .2s,transform .15s,grid-row-end .35s var(--spring-settle);position:relative;display:flex;flex-direction:column;gap:var(--spacing-xs);border:2px solid transparent;min-height:160px}
.commitment-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.commitment-card:active{transform:scale(.99)}

/* 颜色状态 */
.commitment-card.green{border-color:transparent;background:linear-gradient(135deg,var(--color-bg-card),var(--color-signal-ok-bg))}
.commitment-card.amber{border-color:rgba(212,107,8,.25);background:linear-gradient(135deg,var(--color-bg-card),var(--color-signal-warn-bg))}
.commitment-card.red{border-color:rgba(197,48,48,.35);background:linear-gradient(135deg,var(--color-bg-card),var(--color-signal-danger-bg))}
.commitment-card.detected{animation:detectionPulse 3s ease-in-out infinite;border-color:var(--color-detection-border)}

/* 幽灵预览状态 */
.commitment-card.ghost-green{background:linear-gradient(135deg,var(--color-bg-card),rgba(0,135,90,.12));border-color:rgba(0,135,90,.2)}
.commitment-card.ghost-green .card-score,.commitment-card.ghost-green .card-title{opacity:.55}
.commitment-card.ghost-amber{background:linear-gradient(135deg,var(--color-bg-card),rgba(212,107,8,.08));border-color:rgba(212,107,8,.15)}
.commitment-card.ghost-amber .card-score,.commitment-card.ghost-amber .card-title{opacity:.55}

/* 展开状态 */
.commitment-card.expanded{grid-row-end:span 2;cursor:default;box-shadow:var(--shadow-lg);z-index:10;min-height:480px}
.commitment-card.expanded:hover{transform:none}

/* 演示模式卡片 */
.presenting .commitment-card{min-height:70vh;padding:var(--spacing-xl) var(--spacing-2xl);font-size:1.2em}

/* 卡片内部元素 */
.card-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--spacing-sm)}
.card-title{font-size:14px;font-weight:600;flex:1;line-height:1.3}
.card-badges{display:flex;gap:4px;flex-shrink:0}
.card-lifecycle{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:500;white-space:nowrap}
.card-lifecycle.stable{background:var(--color-signal-ok-bg);color:var(--color-success)}
.card-lifecycle.attention{background:var(--color-signal-warn-bg);color:var(--color-warning)}
.card-lifecycle.deteriorating{background:var(--color-signal-danger-bg);color:var(--color-danger)}
.card-lifecycle.forming{background:#f0f5ff;color:var(--color-primary)}

.card-score-row{display:flex;align-items:baseline;gap:var(--spacing-sm)}
.card-score{font-size:32px;font-weight:700;font-family:var(--font-family-code);line-height:1}
.card-score.green{color:var(--color-success)}
.card-score.amber{color:var(--color-score-amber)}
.card-score.red{color:var(--color-danger)}
.card-trend{font-size:18px;font-weight:700}
.card-trend.up{color:var(--color-success)}
.card-trend.flat{color:var(--color-text-tertiary)}
.card-trend.down{color:var(--color-danger)}

.card-owner{font-size:11px;color:var(--color-text-tertiary)}
.card-updated{font-size:10px;color:var(--color-text-disabled)}

/* 自动检测徽章 */
.detection-badge{position:absolute;top:-8px;right:12px;background:var(--color-detection);color:white;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(59,130,246,.3);white-space:nowrap}
.detection-badge.hidden{display:none}

/* 卡片内 sparkline 区域 */
.card-spark{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:auto}
.spark-dot{width:4px;border-radius:2px;background:var(--color-border)}
.spark-dot.rising{background:var(--color-success)}
.spark-dot.falling{background:var(--color-danger)}

/* ============================================================
   卡片展开 — 后果树
   ============================================================ */
.expanded-content{display:none;flex-direction:column;gap:var(--spacing-md);margin-top:var(--spacing-md);padding-top:var(--spacing-md);border-top:1px solid var(--color-border)}
.commitment-card.expanded .expanded-content{display:flex;animation:fadeIn .25s ease-out}

.tree-section{border-left:3px solid var(--color-border);padding-left:var(--spacing-md)}
.tree-section.danger{border-left-color:var(--color-danger)}
.tree-section.warning{border-left-color:var(--color-warning)}
.tree-section.detection{border-left-color:var(--color-detection)}
.tree-section-title{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:var(--spacing-xs);letter-spacing:.5px}
.tree-section-body{font-size:13px;color:var(--color-text-secondary);line-height:1.5}

/* 合同表格 */
.contract-table{width:100%;border-collapse:collapse;font-size:12px;margin:var(--spacing-xs) 0}
.contract-table th{text-align:left;font-weight:600;color:var(--color-text-tertiary);padding:4px 8px;border-bottom:2px solid var(--color-border);font-size:10px}
.contract-table td{padding:6px 8px;border-bottom:1px solid var(--color-bg-primary)}
.contract-table tr.risk-high td{background:var(--color-signal-danger-bg)}
.contract-table tr.risk-mid td{background:var(--color-signal-warn-bg)}
.contract-status{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.contract-status.high{background:var(--color-danger)}
.contract-status.mid{background:var(--color-warning)}

/* 风险传导节点 */
.risk-node{padding:var(--spacing-sm);background:var(--color-signal-danger-bg);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.risk-node:hover{border-color:var(--color-danger);box-shadow:0 0 6px rgba(197,48,48,.15)}
.risk-node .risk-target{font-weight:600;color:var(--color-danger)}

/* ============================================================
   AI Dissent 区
   ============================================================ */
.dissent-section{margin-top:var(--spacing-sm)}
.dissent-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:var(--spacing-xs) 0;font-size:12px;font-weight:600;color:var(--color-text-secondary)}
.dissent-header:hover{color:var(--color-primary)}
.dissent-list{display:flex;flex-direction:column;gap:var(--spacing-sm);margin-top:var(--spacing-sm)}
.dissent-list.collapsed{display:none}
.dissent-card{padding:var(--spacing-sm) var(--spacing-md);border-radius:var(--radius-md);font-size:12px;border-left:3px solid var(--color-warning);background:var(--color-signal-warn-bg);animation:floatUp .2s ease-out}
.dissent-card .dissent-role{font-weight:700;color:var(--color-warning);margin-bottom:2px}
.dissent-card .dissent-text{color:var(--color-text-secondary);line-height:1.5}
.dissent-card .dissent-source{font-size:10px;color:var(--color-text-tertiary);margin-top:4px}
.dissent-card .dissent-confidence{font-size:10px;color:var(--color-text-tertiary)}

/* ============================================================
   Path Back to Green
   ============================================================ */
.path-section{margin-top:var(--spacing-sm)}
.path-section-title{font-size:12px;font-weight:700;color:var(--color-success);margin-bottom:var(--spacing-sm)}
.path-list{display:flex;flex-direction:column;gap:var(--spacing-sm)}
.path-card{padding:var(--spacing-sm) var(--spacing-md);border-radius:var(--radius-md);border:1px solid var(--color-border);cursor:pointer;transition:all .15s;font-size:12px}
.path-card:hover{border-color:var(--color-success);box-shadow:0 0 6px rgba(0,135,90,.1)}
.path-card.recommended{border-color:var(--color-success);background:var(--color-signal-ok-bg)}
.path-card .path-name{font-weight:600;color:var(--color-text-primary)}
.path-card .path-effect{color:var(--color-success);font-weight:600}
.path-card .path-cost{color:var(--color-text-tertiary);font-size:11px}
.path-card .path-timeline{font-size:10px;color:var(--color-text-disabled)}
.path-card.ghost-previewing{border-color:var(--color-primary);box-shadow:0 0 10px rgba(24,144,255,.2)}
.path-actions{margin-top:var(--spacing-sm);display:flex;gap:var(--spacing-sm)}
.path-btn{padding:4px 12px;border-radius:var(--radius-sm);border:1px solid var(--color-border);cursor:pointer;font-size:11px;font-family:var(--font-family-base);background:var(--color-bg-card);transition:all .15s}
.path-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.path-btn.apply{background:var(--color-success);color:white;border-color:var(--color-success)}
.path-btn.apply:hover{background:#006d45}

/* ============================================================
   双向传染 — 滑块脉冲 + 反向分析
   ============================================================ */
.slider-pulse-hint{position:absolute;top:-28px;transform:translateX(-50%);font-size:11px;color:var(--color-primary);font-weight:600;white-space:nowrap;pointer-events:none;animation:fadeIn .3s ease-out}
.reverse-analysis{padding:var(--spacing-sm);background:#f0f8ff;border-radius:var(--radius-sm);font-size:12px;margin-top:var(--spacing-sm);border-left:3px solid var(--color-primary)}

/* ============================================================
   图例 Zone
   ============================================================ */
.legend-zone{display:flex;align-items:center;gap:var(--spacing-lg);padding:var(--spacing-sm) var(--spacing-lg);border-top:1px solid var(--color-border);font-size:11px;color:var(--color-text-tertiary);flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-dot.green{background:var(--color-success)}
.legend-dot.amber{background:var(--color-score-amber)}
.legend-dot.red{background:var(--color-danger)}
.legend-dot.blue{background:var(--color-detection)}

/* ============================================================
   政治安全 Zone
   ============================================================ */
.safety-zone{padding:var(--spacing-sm) var(--spacing-lg);border-top:1px solid var(--color-border);flex-shrink:0;font-size:12px}
.safety-inner{display:flex;align-items:center;gap:var(--spacing-md);padding:var(--spacing-sm) var(--spacing-md);background:var(--color-signal-warn-bg);border-radius:var(--radius-md);border:1px dashed var(--color-warning)}
.safety-icon{font-size:16px}
.safety-info{flex:1}
.safety-title{font-weight:600;color:var(--color-warning)}
.safety-detail{font-size:11px;color:var(--color-text-secondary)}
.safety-countdown{font-weight:700;color:var(--color-warning);font-family:var(--font-family-code)}
.safety-actions{display:flex;gap:var(--spacing-sm)}
.safety-btn{padding:3px 10px;border-radius:var(--radius-sm);border:1px solid var(--color-border);cursor:pointer;font-size:11px;font-family:var(--font-family-base);background:var(--color-bg-card);transition:all .15s}
.safety-btn:hover{border-color:var(--color-warning)}
.safety-btn.primary{background:var(--color-warning);color:white;border-color:var(--color-warning)}

/* ============================================================
   演示模式
   ============================================================ */
.present-nav{display:none;justify-content:center;align-items:center;gap:var(--spacing-lg);padding:var(--spacing-md)}
.present-nav.visible{display:flex}
.present-nav-arrow{font-size:24px;cursor:pointer;color:var(--color-text-tertiary);padding:var(--spacing-sm);border-radius:50%;transition:all .15s;user-select:none}
.present-nav-arrow:hover{color:var(--color-primary);background:var(--color-primary-bg)}
.present-nav-info{font-size:14px;color:var(--color-text-secondary);font-weight:500}
body.presenting .slider-zone{display:none}
body.presenting .legend-zone{display:none}
body.presenting .counter-zone{display:block}

/* ============================================================
   Toast
   ============================================================ */
.toast-container{position:fixed;top:64px;right:var(--spacing-lg);z-index:3000;display:flex;flex-direction:column;gap:var(--spacing-sm)}
.toast{padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:var(--shadow-lg);animation:toastIn .3s ease-out;display:flex;align-items:center;gap:var(--spacing-sm);max-width:360px}
.toast.success{background:#f6ffed;border:1px solid #b7eb8f;color:#135200}
.toast.warning{background:#fffbe6;border:1px solid #ffe58f;color:#874d00}
.toast.info{background:var(--color-primary-bg);border:1px solid #91d5ff;color:#003a8c}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header Zone -->
  <div class="header">
    <div class="header-brand">🎯 SISYS · 战略承诺墙</div>
    <div class="header-center">
      <select class="header-project" id="navProject" onchange="showToast('已切换项目','info')">
        <option>XX公司 2026 SP-BP</option>
        <option>YY医疗 2025 战略复盘</option>
      </select>
    </div>
    <div class="header-right">
      <button class="present-btn" id="presentBtn" onclick="togglePresentMode()">🎥 演示模式</button>
      <span>👤 赵总</span>
    </div>
  </div>

  <!-- Slider Zone -->
  <div class="slider-zone" id="sliderZone">
    <span class="slider-zone-label">国产化率目标</span>
    <div class="slider-zone-wrap" id="sliderContainer"></div>
  </div>

  <!-- Counter Zone -->
  <div class="counter-zone" id="counterZone">
    <div class="counter-inner" id="counterInner"></div>
  </div>

  <!-- Card Grid Zone -->
  <div class="card-grid" id="cardGrid"></div>

  <!-- Present Nav -->
  <div class="present-nav" id="presentNav">
    <span class="present-nav-arrow" onclick="presentPrev()">◀</span>
    <span class="present-nav-info" id="presentInfo">1 / 12</span>
    <span class="present-nav-arrow" onclick="presentNext()">▶</span>
  </div>

  <!-- Legend Zone -->
  <div class="legend-zone" id="legendZone">
    <span style="font-weight:600;">图例:</span>
    <span class="legend-item"><span class="legend-dot green"></span> 绿色 ≥70</span>
    <span class="legend-item"><span class="legend-dot amber"></span> 琥珀 40-69</span>
    <span class="legend-item"><span class="legend-dot red"></span> 红色 &lt;40</span>
    <span class="legend-item"><span class="legend-dot blue"></span> 🔵 系统检测</span>
    <span style="margin-left:auto;">↗改善 →持平 ↘恶化</span>
  </div>

  <!-- Political Safety Zone -->
  <div class="safety-zone" id="safetyZone">
    <div class="safety-inner" id="safetyInner"></div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// 工具函数 — 复用 V1
// ============================================================
function showToast(m,t){var ct=document.getElementById('toastContainer'),to=document.createElement('div');to.className='toast '+(t||'info');to.textContent=m;ct.appendChild(to);setTimeout(function(){to.style.opacity='0';to.style.transition='opacity .3s';setTimeout(function(){to.remove();},300);},3000)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function mapRange(v,inMin,inMax,outMin,outMax){return outMin+(outMax-outMin)*((v-inMin)/(inMax-inMin))}

// ============================================================
// SliderPhysics — 完整复用 V1

class SliderPhysics{constructor(container,opts){this.container=container;this.min=opts.min??0;this.max=opts.max??100;this.value=opts.value??50;this.step=opts.step??1;this.notches=opts.notches||[];this.onChange=opts.onChange||(()=>{});this.onRelease=opts.onRelease||(()=>{});this.formatValue=opts.formatValue||(v=>v);this.reverseGradient=opts.reverseGradient||false;this.valueSuffix=opts.valueSuffix||'';this.warnBelow=opts.warnBelow;this.dangerBelow=opts.dangerBelow;this._label=opts.label||container.dataset.label||'';this.isDragging=false;this.prevNotchIdx=-1;this._velTracker=[];this._inertiaRAF=null;this._build();this._bindEvents()}

const SCORE_THRESHOLDS = {green:70, amber:40}; // >=70 green, 40-69 amber, <40 red
function scoreToColor(s){return s>=SCORE_THRESHOLDS.green?'green':s>=SCORE_THRESHOLDS.amber?'amber':'red'}
function scoreToLabel(s){return s>=SCORE_THRESHOLDS.green?'稳定执行':s>=SCORE_THRESHOLDS.amber?'需关注':'恶化中'}

// 评分公式: 滑块位置 → 各卡片分数 (线性模型)
function calcAllScores(locRate){
  // locRate = 国产化率 0-100
  // 各卡片基准分 + 国产化率敏感度
  const sensitivity = {
    revenue_growth:     {base:84, sens:-0.18},
    market_share:       {base:80, sens:-0.06},
    customer_retention: {base:91, sens:0.02},
    product_launch:     {base:85, sens:0.04},
    rd_invest:          {base:76, sens:0.10},
    supplier_local:     {base:72, sens:-0.80},
    talent_acq:         {base:88, sens:0.05},
    cost_control:       {base:92, sens:-0.04},
    compliance:         {base:94, sens:-0.12},
    nps_satisfaction:   {base:81, sens:0.03},
    channel_coverage:   {base:68, sens:-0.55},
    ebitda_margin:      {base:74, sens:0.08}
  };
  const scores = {};
  for(const [id, s] of Object.entries(sensitivity)){
    scores[id] = clamp(Math.round(s.base + (locRate - 67) * s.sens), 0, 100);
  }
  return scores;
}

// ============================================================
// Ghost Manifest — 预计算所有滑块位置的卡片状态
// ============================================================
let ghostManifest = {};
let currentSliderValue = 67;
let ghostPreviewMode = false;
let ghostPreviewRate = null;
let expandedCardId = null;
let presentMode = false;
let presentIndex = 0;
let safetyTimers = {};

function buildGhostManifest(){
  ghostManifest = {};
  for(let pct=0;pct<=100;pct++){
    const scores = calcAllScores(pct);
    ghostManifest[pct] = {};
    for(const card of COMMITMENT_DEFS){
      const score = scores[card.id];
      ghostManifest[pct][card.id] = {
        score: score,
        color: scoreToColor(score),
        label: scoreToLabel(score)
      };
    }
  }
}

// ============================================================
// 卡片渲染
// ============================================================
function getCardState(cardId){
  if(ghostPreviewMode && ghostPreviewRate!==null && ghostManifest[ghostPreviewRate]){
    return ghostManifest[ghostPreviewRate][cardId];
  }
  return ghostManifest[currentSliderValue]?.[cardId] || {score:0,color:'green',label:'稳定执行'};
}

function getCardTrend(cardId){
  // 基于当前分数 vs 30天前分数 (简化: 用滑块位置模拟)
  const cur = ghostManifest[currentSliderValue]?.[cardId]?.score || 0;
  const prev = ghostManifest[clamp(currentSliderValue-3,0,100)]?.[cardId]?.score || cur;
  const diff = cur - prev;
  if(diff > 1) return 'up';
  if(diff < -1) return 'down';
  return 'flat';
}

function renderCardGrid(){
  const grid = document.getElementById('cardGrid');
  const scores = ghostManifest[currentSliderValue] || {};

  grid.innerHTML = COMMITMENT_DEFS.map(card => {
    const state = scores[card.id] || {score:0, color:'green', label:'稳定执行'};
    const trend = getCardTrend(card.id);
    const trendIcon = trend==='up'?'↗':trend==='down'?'↘':'→';
    const trendClass = trend==='up'?'up':trend==='down'?'down':'flat';
    const isExpanded = expandedCardId === card.id;
    const isDetected = card.hasDetection;

    // Sparkline dots — 简化为基于趋势的5点
    const sparkDots = (()=>{
      const dots = [];
      for(let i=0;i<5;i++){
        if(trend==='up') dots.push(i>=3?'rising':'');
        else if(trend==='down') dots.push(i>=2?'falling':'');
        else dots.push('');
      }
      return dots.map((c,i)=>`<span class="spark-dot${c?' '+c:''}" style="height:${6+Math.abs(i-2)*3}px"></span>`).join('');
    })();

    const colorClass = isExpanded ? (state.color + (ghostPreviewMode?' ghost-'+state.color:'')) : (state.color + (isDetected?' detected':'') + (ghostPreviewMode&&state.color==='amber'?' ghost-green':ghostPreviewMode&&state.color==='red'?' ghost-amber':''));

    return `
    <div class="commitment-card ${colorClass}${isExpanded?' expanded':''}" id="card-${card.id}" onclick="onCardClick('${card.id}', event)" data-card-id="${card.id}">
      ${isDetected && !isExpanded ? `
      <div class="detection-badge">
        🔵 系统检测 · 2h前 · ${card.detectionInfo.probability}可能脱轨
      </div>`:''}
      <div class="card-header-row">
        <span class="card-title">${card.title}</span>
        <div class="card-badges">
          <span class="card-lifecycle ${state.label==='稳定执行'?'stable':state.label==='需关注'?'attention':'deteriorating'}">${state.label}</span>
        </div>
      </div>
      <div class="card-score-row">
        <span class="card-score ${state.color}">${state.score}</span>
        <span class="card-trend ${trendClass}">${trendIcon}</span>
      </div>
      <div class="card-owner">${card.owner} · ${card.ownerTitle}</div>
      <div class="card-spark">${sparkDots}</div>
      <div class="card-updated">更新于 ${isDetected?'检测于2h前':'2h前'}</div>
      ${isExpanded ? renderExpandedContent(card) : ''}
    </div>`;
  }).join('');

  // 更新 Counter Zone
  updateCounter();
  // 更新政治安全区
  updateSafetyZone();
  // 更新滑块脉冲
  updateSliderPulse();
}

function renderExpandedContent(card){
  const tree = card.consequenceTree;
  const isDetected = card.hasDetection && tree.operationalSignal;

  let html = '<div class="expanded-content">';

  // 检测徽章（展开态）
  if(isDetected){
    html += `
    <div style="background:var(--color-detection-bg);border:1px solid var(--color-detection-border);border-radius:var(--radius-md);padding:var(--spacing-sm) var(--spacing-md);margin-bottom:var(--spacing-sm)">
      <span style="font-weight:700;color:var(--color-detection)">🔵 系统检测 · 2h前 · ${card.detectionInfo.probability} 可能脱轨</span>
      <span style="font-size:11px;color:var(--color-text-tertiary);margin-left:var(--spacing-md)">🕐 剩余响应窗口: <span id="safety-countdown-expanded">23h</span></span>
    </div>`;
  }

  // OPERATIONAL SIGNAL 层
  if(isDetected && tree.operationalSignal){
    html += `
    <div class="tree-section detection">
      <div class="tree-section-title">OPERATIONAL SIGNAL</div>
      <div class="tree-section-body">
        ${tree.operationalSignal.events.map(e=>`
          <div style="display:flex;align-items:center;gap:8px;padding:2px 0">
            <span style="font-size:10px;color:var(--color-text-tertiary)">${e.time}</span>
            <span>${e.event}</span>
            ${e.status==='danger'?'<span style="font-size:10px;color:var(--color-danger);font-weight:600">← 当前状态</span>':''}
          </div>
        `).join('')}
        <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:4px">数据源: ${tree.operationalSignal.dataSource} · 算法: ${tree.operationalSignal.algorithm}</div>
      </div>
    </div>`;
  }

  // TRIGGER ASSUMPTION
  html += `
  <div class="tree-section">
    <div class="tree-section-title">TRIGGER ASSUMPTION</div>
    <div class="tree-section-body">${tree.triggerAssumption}</div>
  </div>`;

  // 受影响的合同
  if(tree.contracts && tree.contracts.length > 0){
    html += `
    <div class="tree-section ${tree.contracts.some(c=>c.risk==='high')?'danger':'warning'}">
      <div class="tree-section-title">受影响的合同 (${tree.contracts.length})</div>
      <table class="contract-table">
        <tr><th>合同编号</th><th>供应商</th><th>金额</th><th>${isDetected?'进口率':'风险'}</th></tr>
        ${tree.contracts.map(c=>`
          <tr class="${c.risk==='high'?'risk-high':c.risk==='mid'?'risk-mid':''}">
            <td><span class="contract-status ${c.risk}"></span>${c.id}</td>
            <td>${c.supplier}</td>
            <td>${c.amount}</td>
            <td>${isDetected?c.importRate:c.risk==='high'?'🔴 高':c.risk==='mid'?'🟡 中':'🟢 低'}</td>
          </tr>
        `).join('')}
      </table>
    </div>`;
  }

  // 受影响供应商
  if(tree.suppliers && tree.suppliers.length > 0){
    html += `
    <div class="tree-section ${tree.suppliers.some(s=>s.risk==='high')?'danger':'warning'}">
      <div class="tree-section-title">受影响供应商</div>
      <div class="tree-section-body">
        ${tree.suppliers.map(s=>`
          <div style="padding:4px 0;display:flex;align-items:center;gap:8px">
            <span class="contract-status ${s.risk}"></span>
            <strong>${s.name}</strong>
            <span style="font-size:11px;color:var(--color-text-tertiary)">营收占比 ${s.revenueShare} · ${s.alternative||s.relationship}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // 风险传导
  if(tree.riskNodes && tree.riskNodes.length > 0){
    html += `
    <div class="tree-section danger">
      <div class="tree-section-title">风险传导</div>
      ${tree.riskNodes.map((n,i)=>`
        <div class="risk-node" onclick="event.stopPropagation();onRiskNodeClick('${card.id}',${i})" data-risk-idx="${i}">
          <span class="risk-target">${n.severity==='high'?'🔴':'🟡'} ${n.target}</span>: ${n.impact}
        </div>
      `).join('')}
    </div>`;
  }

  // AI DISSENT 区（默认展开）
  if(card.aiDissent && card.aiDissent.length > 0){
    html += `
    <div class="dissent-section">
      <div class="dissent-header" onclick="event.stopPropagation();toggleDissent('${card.id}')">
        🤖 AI 异议 (${card.aiDissent.length}) <span id="dissent-toggle-${card.id}" style="font-size:10px">▲ 收起</span>
      </div>
      <div class="dissent-list" id="dissent-list-${card.id}">
        ${card.aiDissent.map(d=>`
          <div class="dissent-card">
            <div class="dissent-role">${d.role} <span class="dissent-confidence">(置信度: ${d.confidence}%)</span></div>
            <div class="dissent-text">${d.text}</div>
            <div class="dissent-source">📎 证据: ${d.source}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  // PATH BACK TO GREEN
  if(card.pathsToGreen && card.pathsToGreen.length > 0){
    html += `
    <div class="path-section">
      <div class="path-section-title">🟢 Path Back to Green</div>
      <div class="path-list">
        ${card.pathsToGreen.map((p,i)=>`
          <div class="path-card ${i===0?'recommended':''}" id="path-${card.id}-${i}" onclick="event.stopPropagation();previewPath('${card.id}',${i})">
            <div class="path-name">${i===0?'⭐ ':''}${p.name}</div>
            <div class="path-effect">效果: ${p.effect}</div>
            <div class="path-cost">成本: ${p.cost}</div>
            <div class="path-timeline">时间线: ${p.timeline}</div>
          </div>
        `).join('')}
      </div>
      <div class="path-actions" id="path-actions-${card.id}" style="display:none">
        <button class="path-btn" onclick="event.stopPropagation();cancelPreview()">← 返回路径列表</button>
        <button class="path-btn apply" id="apply-btn-${card.id}" onclick="event.stopPropagation();applyPath('${card.id}')">确认应用此路径</button>
      </div>
    </div>`;
  }

  // 政治安全元数据（仅检测卡片）
  if(isDetected){
    html += `
    <div style="margin-top:var(--spacing-sm);padding:var(--spacing-sm);background:var(--color-bg-primary);border-radius:var(--radius-sm);font-size:11px;color:var(--color-text-tertiary)">
      🕐 检测于 ${card.detectionInfo.detectedAt} · 静默期48h · 责任人已通知 (${card.owner})
      · 👤 可见范围: ${card.owner} + ${COMMITMENT_DEFS.find(c=>c.id==='revenue_growth')?.owner||'赵总'} (直线上级)
      · 剩余响应窗口: <span id="safety-countdown-bottom">23h</span>
    </div>`;
  }

  html += '</div>';
  return html;
}

// ============================================================
// 交互逻辑
// ============================================================
function onCardClick(cardId, event){
  if(event.target.closest('.path-card') || event.target.closest('.path-btn') ||
     event.target.closest('.dissent-header') || event.target.closest('.risk-node') ||
     event.target.closest('.slider-track-wrap') || event.target.closest('.slider-thumb')) return;

  if(expandedCardId === cardId){
    // 再次点击 → 收起
    expandedCardId = null;
  } else {
    expandedCardId = cardId;
    // 如果有幽灵预览，清除
    if(ghostPreviewMode) cancelPreview();
  }
  renderCardGrid();

  if(expandedCardId && presentMode){
    // 演示模式：滚动到展开卡片
    setTimeout(()=>{
      const card = document.getElementById('card-'+cardId);
      if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
    },100);
  }
}

function toggleDissent(cardId){
  const list = document.getElementById('dissent-list-'+cardId);
  const toggle = document.getElementById('dissent-toggle-'+cardId);
  if(!list || !toggle) return;
  list.classList.toggle('collapsed');
  toggle.textContent = list.classList.contains('collapsed') ? '▶ 展开' : '▲ 收起';
}

// ============================================================
// Path Back to Green — 幽灵预览
// ============================================================
let previewPathCardId = null;
let previewPathIdx = null;

function previewPath(cardId, pathIdx){
  const card = COMMITMENT_DEFS.find(c=>c.id===cardId);
  if(!card || !card.pathsToGreen[pathIdx]) return;

  const path = card.pathsToGreen[pathIdx];
  previewPathCardId = cardId;
  previewPathIdx = pathIdx;

  // 进入幽灵预览模式
  ghostPreviewMode = true;
  ghostPreviewRate = path.targetRate;

  // 高亮被预览的路径卡片
  renderCardGrid();

  // 显示路径操作按钮
  const prevCard = document.querySelectorAll('.path-card');
  prevCard.forEach(c=>c.classList.remove('ghost-previewing'));
  const targetPath = document.getElementById('path-'+cardId+'-'+pathIdx);
  if(targetPath) targetPath.classList.add('ghost-previewing');

  const actions = document.getElementById('path-actions-'+cardId);
  if(actions) actions.style.display = 'flex';

  // 滑块不跟随移动（保持原位），仅墙面显示幽灵状态
  showToast('🔮 幽灵预览: '+path.name+' · 200ms','info');
}

function cancelPreview(){
  ghostPreviewMode = false;
  ghostPreviewRate = null;
  previewPathCardId = null;
  previewPathIdx = null;

  // 隐藏所有路径操作按钮
  document.querySelectorAll('[id^="path-actions-"]').forEach(el=>el.style.display='none');
  document.querySelectorAll('.path-card').forEach(c=>c.classList.remove('ghost-previewing'));

  renderCardGrid();
}

function applyPath(cardId){
  const card = COMMITMENT_DEFS.find(c=>c.id===cardId);
  if(!card || previewPathIdx===null) return;

  const path = card.pathsToGreen[previewPathIdx];

  // 移动滑块到目标位置
  if(window._slider){
    window._slider.setValue(path.targetRate, true);
    currentSliderValue = path.targetRate;
  }

  // 退出幽灵预览模式
  ghostPreviewMode = false;
  ghostPreviewRate = null;
  previewPathCardId = null;
  previewPathIdx = null;

  document.querySelectorAll('[id^="path-actions-"]').forEach(el=>el.style.display='none');

  // 如果供应商卡变绿了 → 清除检测徽章
  const supplierCard = COMMITMENT_DEFS.find(c=>c.id==='supplier_local');
  const newScore = ghostManifest[currentSliderValue]?.['supplier_local']?.score || 0;
  if(newScore >= SCORE_THRESHOLDS.green && supplierCard){
    supplierCard.hasDetection = false;
    showToast('✅ 供应商国产化卡回归绿色 · 系统检测徽章已清除','success');
  }

  renderCardGrid();
  showToast('✅ 路径已应用 · 滑块调整至 '+path.targetRate+'%','success');
}

// ============================================================
// 双向传染 — 点击风险节点
// ============================================================
function onRiskNodeClick(cardId, nodeIdx){
  const card = COMMITMENT_DEFS.find(c=>c.id===cardId);
  if(!card) return;
  const node = card.consequenceTree.riskNodes[nodeIdx];
  if(!node) return;

  // 查找对应的 Path Back to Green
  const paths = card.pathsToGreen;
  if(!paths || paths.length===0) return;

  // 自动选择推荐路径进行幽灵预览
  const bestPath = paths[0];
  ghostPreviewMode = true;
  ghostPreviewRate = bestPath.targetRate;
  previewPathCardId = cardId;
  previewPathIdx = 0;

  renderCardGrid();

  // 显示反向传染分析
  showToast(`🔮 双向传染: 调整国产化率至 ${bestPath.targetRate}% 可恢复此节点 · 滑块脉冲提示中`,'info');
}

// ============================================================
// 滑块脉冲 — 反向传染视觉
// ============================================================
function updateSliderPulse(){
  const trackWrap = document.querySelector('.slider-track-wrap');
  if(!trackWrap) return;

  // 移除旧脉冲
  const oldHints = trackWrap.querySelectorAll('.slider-pulse-hint');
  oldHints.forEach(h=>h.remove());

  if(ghostPreviewMode && ghostPreviewRate!==null){
    // 在目标位置添加脉冲提示
    const pct = mapRange(ghostPreviewRate, 0, 100, 0, 100);
    const hint = document.createElement('div');
    hint.className = 'slider-pulse-hint';
    hint.style.left = pct+'%';
    hint.textContent = `调整至 ${ghostPreviewRate}% → 恢复绿色`;
    trackWrap.appendChild(hint);

    // 滑块脉冲动画
    if(window._slider && window._slider.thumb){
      window._slider.thumb.style.animation = 'sliderPulse 1.2s ease-in-out infinite';
    }
  } else {
    if(window._slider && window._slider.thumb){
      window._slider.thumb.style.animation = '';
    }
  }
}

// ============================================================
// Counter Zone
// ============================================================
function updateCounter(){
  const counterZone = document.getElementById('counterZone');
  const counterInner = document.getElementById('counterInner');
  const scores = ghostManifest[currentSliderValue] || {};

  // 统计状态
  let detected = 0, amber = 0, red = 0;
  for(const card of COMMITMENT_DEFS){
    const state = scores[card.id];
    if(!state) continue;
    if(card.hasDetection) detected++;
    if(state.color==='amber') amber++;
    if(state.color==='red') red++;
  }

  const total = detected + amber + red;
  if(total === 0 && !ghostPreviewMode){
    counterZone.classList.remove('visible');
    return;
  }

  counterZone.classList.add('visible');

  let html = '';
  if(detected > 0) html += `<span class="counter-dot detection"></span> <span class="counter-highlight">${detected} 项系统检测</span>`;
  if(amber > 0) html += ` · <span class="counter-dot warning"></span> ${amber} 项需关注`;
  if(red > 0) html += ` · <span style="color:var(--color-danger);font-weight:600">${red} 项恶化中</span>`;

  const supplierCard = COMMITMENT_DEFS.find(c=>c.id==='supplier_local');
  if(supplierCard && supplierCard.hasDetection && supplierCard.detectionInfo){
    const remaining = getRemainingSilence(supplierCard);
    html += ` · 🕐 <span style="font-weight:600;color:var(--color-detection)">响应窗口剩余 ${remaining}</span>`;
  }

  if(ghostPreviewMode) html += ' · <span style="color:var(--color-primary);font-weight:600">🔮 幽灵预览模式 · 未保存</span>';

  counterInner.innerHTML = html;
}

// ============================================================
// 政治安全区
// ============================================================
function getRemainingSilence(card){
  if(!card.detectionInfo) return 'N/A';
  // 模拟: 基于 silenceUntil 计算剩余时间
  const now = new Date();
  const silenceUntil = new Date(card.detectionInfo.silenceUntil);
  const diff = silenceUntil - now;
  if(diff <= 0) return '0h (已过期)';
  const hours = Math.floor(diff / (1000*60*60));
  const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
  return hours+'h '+mins+'min';
}

function updateSafetyZone(){
  const safetyInner = document.getElementById('safetyInner');
  const detectedCards = COMMITMENT_DEFS.filter(c=>c.hasDetection);

  if(detectedCards.length === 0){
    safetyInner.innerHTML = '<span style="color:var(--color-text-tertiary)">✅ 无静默检测项 · 系统监控运行中</span>';
    return;
  }

  const card = detectedCards[0];
  const remaining = getRemainingSilence(card);

  safetyInner.innerHTML = `
    <span class="safety-icon">🔵</span>
    <div class="safety-info">
      <div class="safety-title">静默检测中 — 仅责任人及直线上级可见</div>
      <div class="safety-detail">
        🟡 ${card.title} · 检测于 ${card.detectionInfo.detectedAt} · 触发: ${card.detectionInfo.event.split('→')[0].trim()}<br>
        责任人: ${card.owner} (${card.ownerTitle}) · 主管: 赵总
      </div>
    </div>
    <span class="safety-countdown" id="safety-countdown">剩余 ${remaining}</span>
    <div class="safety-actions">
      <button class="safety-btn" onclick="safetyAction('acknowledge')">确认已知晓</button>
      <button class="safety-btn primary" onclick="safetyAction('correct')">发起纠正措施</button>
    </div>`;
}

function safetyAction(action){
  const card = COMMITMENT_DEFS.find(c=>c.hasDetection);
  if(!card) return;

  if(action === 'acknowledge'){
    showToast('✅ 已确认知晓 · 响应窗口计时器继续 · 剩余 '+getRemainingSilence(card),'info');
  } else if(action === 'correct'){
    // 模拟纠正: 自动选择推荐路径
    if(card.pathsToGreen && card.pathsToGreen[0]){
      const path = card.pathsToGreen[0];
      previewPath(card.id, 0);
      showToast('🟢 已启动纠正措施: '+path.name+' · 请确认预览效果','success');
    }
  }
}

// ============================================================
// 演示模式
// ============================================================
function togglePresentMode(){
  presentMode = !presentMode;
  const btn = document.getElementById('presentBtn');
  const grid = document.getElementById('cardGrid');
  const presentNav = document.getElementById('presentNav');
  const sliderZone = document.getElementById('sliderZone');
  const legendZone = document.getElementById('legendZone');

  if(presentMode){
    btn.classList.add('active');
    btn.textContent = '🎥 退出演示';
    grid.classList.add('presenting');
    presentNav.classList.add('visible');
    sliderZone.style.display = 'none';
    legendZone.style.display = 'none';
    document.body.classList.add('presenting');

    // 收起已展开卡片
    expandedCardId = null;
    if(ghostPreviewMode) cancelPreview();

    // 定位到第一张需关注的卡片
    presentIndex = 0;
    const scores = ghostManifest[currentSliderValue] || {};
    for(let i=0;i<COMMITMENT_DEFS.length;i++){
      const card = COMMITMENT_DEFS[i];
      const state = scores[card.id];
      if(card.hasDetection || (state && state.color!=='green')){
        presentIndex = i;
        break;
      }
    }
    renderPresentCard();
  } else {
    btn.classList.remove('active');
    btn.textContent = '🎥 演示模式';
    grid.classList.remove('presenting');
    presentNav.classList.remove('visible');
    sliderZone.style.display = '';
    legendZone.style.display = '';
    document.body.classList.remove('presenting');
    renderCardGrid();
  }
}

function renderPresentCard(){
  const grid = document.getElementById('cardGrid');
  const presentInfo = document.getElementById('presentInfo');
  const card = COMMITMENT_DEFS[presentIndex];
  if(!card) return;

  const state = ghostManifest[currentSliderValue]?.[card.id] || {score:0,color:'green',label:'稳定执行'};
  const trend = getCardTrend(card.id);
  const trendIcon = trend==='up'?'↗':trend==='down'?'↘':'→';
  const isDetected = card.hasDetection;

  presentInfo.textContent = `${presentIndex+1} / ${COMMITMENT_DEFS.length}`;

  // 演示模式: 展开所有需关注卡片
  expandedCardId = card.id;

  const colorClass = state.color + (isDetected?' detected':'');
  grid.innerHTML = `
  <div class="commitment-card ${colorClass} expanded" id="card-${card.id}" onclick="onCardClick('${card.id}', event)">
    ${isDetected ? `
    <div class="detection-badge" style="font-size:14px;padding:4px 16px;top:-12px">
      🔵 系统检测 · 2h前 · ${card.detectionInfo.probability} 可能脱轨
    </div>`:''}
    <div class="card-header-row">
      <span class="card-title" style="font-size:28px">${card.title}</span>
      <div class="card-badges">
        <span class="card-lifecycle ${state.label==='稳定执行'?'stable':state.label==='需关注'?'attention':'deteriorating'}" style="font-size:14px;padding:4px 12px">${state.label}</span>
      </div>
    </div>
    <div class="card-score-row">
      <span class="card-score ${state.color}" style="font-size:64px">${state.score}</span>
      <span class="card-trend ${trend==='up'?'up':trend==='down'?'down':'flat'}" style="font-size:36px">${trendIcon}</span>
    </div>
    <div class="card-owner" style="font-size:18px">${card.owner} · ${card.ownerTitle}</div>
    ${renderExpandedContent(card)}
  </div>`;
}

function presentPrev(){
  if(!presentMode) return;
  presentIndex = (presentIndex - 1 + COMMITMENT_DEFS.length) % COMMITMENT_DEFS.length;
  expandedCardId = COMMITMENT_DEFS[presentIndex].id;
  renderPresentCard();
}

function presentNext(){
  if(!presentMode) return;
  presentIndex = (presentIndex + 1) % COMMITMENT_DEFS.length;
  expandedCardId = COMMITMENT_DEFS[presentIndex].id;
  renderPresentCard();
}

// 键盘导航
document.addEventListener('keydown', function(e){
  if(!presentMode) return;
  if(e.key === 'ArrowRight'){e.preventDefault();presentNext();}
  if(e.key === 'ArrowLeft'){e.preventDefault();presentPrev();}
  if(e.key === 'Escape'){e.preventDefault();togglePresentMode();}
});

// ============================================================
// 初始化
// ============================================================
function init(){
  // 构建 Ghost Manifest
  buildGhostManifest();

  // 初始化滑块
  const sliderContainer = document.getElementById('sliderContainer');
  window._slider = new SliderPhysics(sliderContainer, {
    min:0, max:100, value:67, step:1,
    formatValue: v=>v+'%',
    valueSuffix:'',
    notches:[
      {value:45, aiRec:true},
      {value:52, aiRec:false},
      {value:67, aiRec:false}
    ],
    onChange: function(v){
      currentSliderValue = v;
      // 如果有幽灵预览在显示，保持幽灵模式
      if(!ghostPreviewMode){
        renderCardGrid();
      }
    },
    onRelease: function(v){
      currentSliderValue = v;
      if(!ghostPreviewMode){
        renderCardGrid();
      }
    }
  });

  // 渲染初始墙面
  renderCardGrid();

  // 政治安全区倒计时更新
  setInterval(function(){
    const card = COMMITMENT_DEFS.find(c=>c.hasDetection);
    if(card && card.hasDetection){
      const remaining = getRemainingSilence(card);
      const countdowns = document.querySelectorAll('#safety-countdown, #safety-countdown-expanded, #safety-countdown-bottom');
      countdowns.forEach(el=>{el.textContent = '剩余 '+remaining});
      if(expandedCardId === card.id || presentMode){
        updateCounter();
      }
    }
  }, 30000); // 30s 更新

  showToast('🟢 战略承诺墙已就绪 · 12张卡片 · 单滑块 · Ghost Manifest预计算完成','success');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
