<style>
:root{--p:#1890ff;--s:#00875A;--w:#B86E00;--d:#C53030;--det:#3B82F6;--bg:#f5f5f5;--card:#fff;--bd:#e8e8e8;--t1:#262626;--t2:#595959;--t3:#8c8c8c;--ok:#E6F7F1;--wn:#FFF8E6;--dn:#FFF1F0;--db:#EFF6FF;--f:'PingFang SC','Microsoft YaHei',sans-serif;--fm:'Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t1);overflow:hidden;height:100vh}
@keyframes detPulse{0%,100%{box-shadow:0 0 0 rgba(59,130,246,0)}50%{box-shadow:0 0 14px rgba(59,130,246,.4)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

.app{display:flex;flex-direction:column;height:100vh;max-width:1440px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 16px;border-bottom:1px solid var(--bd);flex-shrink:0;z-index:100;background:var(--card)}
.header-brand{font-size:15px;font-weight:700}
.mode-toggle{display:flex;border-radius:4px;overflow:hidden;border:1px solid var(--bd)}
.mode-btn{padding:3px 12px;font-size:11px;cursor:pointer;border:none;background:var(--card);font-family:var(--f)}
.mode-btn.on{background:var(--p);color:#fff}
.header-right{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--t2)}

.slider-zone{padding:8px 24px;flex-shrink:0;z-index:90;background:var(--card);border-bottom:1px solid var(--bd)}
.slider-label-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.slider-label{font-size:12px;font-weight:600;color:var(--t2)}
.slider-reason{font-size:10px;color:var(--det)}
.slider-dt{font-size:12px;cursor:pointer;color:var(--t3);padding:0 4px}

.param-drawer{height:0;overflow:hidden;transition:height .35s ease-out;z-index:80;background:var(--card);border-bottom:1px solid var(--bd)}
.param-drawer.open{height:480px}
.drawer-inner{padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.param-tabs{display:flex;gap:0;border-bottom:2px solid var(--bd)}
.param-tab{padding:6px 12px;font-size:11px;cursor:pointer;border:none;background:none;font-family:var(--f);color:var(--t3);border-bottom:2px solid transparent;margin-bottom:-2px}
.param-tab.on{color:var(--p);border-bottom-color:var(--p);font-weight:600}
.param-presets{display:flex;gap:8px}
.preset-card{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;text-align:center;font-size:11px;transition:all .15s}
.preset-card:hover{border-color:var(--p)}.preset-card.on{border-color:var(--p);background:#e6f7ff}
.preset-card .pn{font-weight:600}.preset-card .pi{font-size:10px;color:var(--t3);margin-top:2px}
.param-list{flex:1;overflow-y:auto;font-size:11px}
.param-row{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--bg)}
.param-why{font-size:11px;color:var(--t2);padding:8px;background:var(--db);border-radius:6px;border-left:3px solid var(--det)}

.counter-zone{display:none;padding:4px 24px;flex-shrink:0;font-size:11px;background:var(--db);border-bottom:1px solid #BFDBFE}
.counter-zone.on{display:block}

.content-zone{flex:1;display:flex;overflow:hidden;position:relative}

/* Detection Strip */
.detection-strip{width:24px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .3s cubic-bezier(0.34,1.56,0.64,1);z-index:55;cursor:pointer}
.detection-strip:hover,.detection-strip.exp{width:280px}
.strip-dots{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 0;gap:12px}
.detection-strip:hover .strip-dots,.detection-strip.exp .strip-dots{display:none}
.summary-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background-color .3s}
.summary-dot.red{background:var(--d)}.summary-dot.amber{background:var(--w)}.summary-dot.green{background:var(--s)}.summary-dot.detected{animation:detPulse 3s infinite}
.summary-dot .sc{font-size:9px;font-weight:700;color:#fff;line-height:1}

.strip-rows{display:none;padding:8px;flex-direction:column}
.detection-strip:hover .strip-rows,.detection-strip.exp .strip-rows{display:flex}
.strip-search{padding:4px 8px;border:1px solid var(--bd);border-radius:4px;font-size:11px;width:100%;margin-bottom:8px}
.strip-gh{font-size:10px;font-weight:700;color:var(--t3);padding:8px 4px 2px}
.strip-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;transition:background .12s;font-size:11px}
.strip-row:hover{background:#e6f7ff}.strip-row.on{background:#e6f7ff;border:1px solid var(--p)}
.sr-d{width:10px;height:10px;border-radius:50%;flex-shrink:0}.sr-d.red{background:var(--d)}.sr-d.amber{background:var(--w)}.sr-d.green{background:var(--s)}.sr-d.detected{animation:detPulse 3s infinite}
.sr-n{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-s{font-family:var(--fm);font-weight:700;width:28px;text-align:right}
.sr-o{font-size:10px;color:var(--t3);width:24px;text-align:center}

/* Focus Area */
.focus-area{flex:1;overflow-y:auto;padding:24px}
.focus-card{background:var(--card);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:24px;max-width:900px;margin:0 auto;position:relative;transition:opacity .3s,filter .3s}
.focus-card.detected{border:2px solid #BFDBFE;animation:detPulse 3s infinite}
/* Ghost preview — dramatic */
.focus-card.ghost{opacity:.45;filter:grayscale(30%) blur(.3px);border:2px dashed var(--p)}
.ghost-banner{display:none;position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:4px 16px;border-radius:10px;font-size:12px;font-weight:700;z-index:10;animation:fadeIn .3s}
.focus-card.ghost .ghost-banner{display:block}

.focus-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;margin-bottom:8px}
.focus-badge.detection{background:var(--det);color:#fff}
.focus-title{font-size:22px;font-weight:700;margin-bottom:4px}
.focus-score{font-size:48px;font-weight:700;font-family:var(--fm);line-height:1;transition:color .3s}
.focus-score.green{color:var(--s)}.focus-score.amber{color:var(--w)}.focus-score.red{color:var(--d)}
.focus-owner{font-size:14px;color:var(--t2);margin-top:4px}

.tree{margin-top:16px}
.tree-sec{border-left:3px solid var(--bd);padding-left:16px;margin-top:12px}.tree-sec.danger{border-left-color:var(--d)}.tree-sec.warn{border-left-color:var(--w)}.tree-sec.det{border-left-color:var(--det)}
.tree-ttl{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:4px;letter-spacing:.5px}
.tree-body{font-size:13px;color:var(--t2);line-height:1.5}
.ct{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.ct th{text-align:left;font-weight:600;color:var(--t3);padding:4px 8px;border-bottom:2px solid var(--bd);font-size:10px}.ct td{padding:5px 8px;border-bottom:1px solid var(--bg)}.rh td{background:var(--dn)}.rm td{background:var(--wn)}
.rn{padding:8px;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid transparent;margin-top:4px;transition:all .15s}.rn:hover{border-color:var(--d);box-shadow:0 0 6px rgba(197,48,48,.15)}.rn .rt{font-weight:600;color:var(--d)}.rn.am .rt{color:var(--w)}

.dissent{margin-top:16px}.dissent-hd{display:flex;justify-content:space-between;cursor:pointer;padding:4px 0;font-size:12px;font-weight:600;color:var(--t2)}.dissent-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}.dissent-list.closed{display:none}.dissent-card{padding:8px 12px;border-radius:8px;font-size:12px;border-left:3px solid var(--w);background:var(--wn)}.dissent-card .dr{font-weight:700;color:var(--w);margin-bottom:2px}.dissent-card .dt{color:var(--t2)}.dissent-card .ds{font-size:10px;color:var(--t3);margin-top:4px}

.paths{margin-top:16px}.paths-ttl{font-size:13px;font-weight:700;color:var(--s);margin-bottom:8px}.path-card{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);cursor:pointer;transition:all .15s;font-size:12px;margin-bottom:8px}.path-card:hover{border-color:var(--s)}.path-card.rec{border-color:var(--s);background:var(--ok)}.path-card .pname{font-weight:600}.path-card .peff{color:var(--s);font-weight:600}.path-actions{margin-top:8px;display:none}.path-actions.on{display:flex;gap:8px}
.btn{padding:4px 12px;border-radius:4px;border:1px solid var(--bd);cursor:pointer;font-size:11px;background:var(--card);font-family:var(--f);transition:all .15s}.btn:hover{border-color:var(--p);color:var(--p)}.btn.apply{background:var(--s);color:#fff;border-color:var(--s)}.btn.apply:hover{background:#006d45}

.matrix-area{flex:1;overflow-y:auto;padding:24px;display:none;align-items:center;justify-content:center}.matrix-area.on{display:flex}.matrix-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:16px;max-width:1000px}
.mdot{width:60px;height:60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:15px;font-weight:700;font-family:var(--fm);position:relative}.mdot:hover{transform:scale(1.2);z-index:10}.mdot.green{background:rgba(0,135,90,.12);color:var(--s);border:2px solid var(--s)}.mdot.amber{background:rgba(212,107,8,.10);color:var(--w);border:2px solid var(--w)}.mdot.red{background:rgba(197,48,48,.10);color:var(--d);border:2px solid var(--d)}.mdot.detected{animation:detPulse 3s infinite}.mdn{font-size:7px;font-weight:400;font-family:var(--f);color:var(--t3);margin-top:2px;text-align:center;line-height:1.1;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.safety-zone{padding:8px 24px;border-top:1px solid var(--bd);flex-shrink:0;z-index:60;font-size:12px;background:var(--wn)}
.safety-inner{display:flex;align-items:center;gap:12px}

.watermark{position:absolute;bottom:8px;right:12px;font-size:9px;color:var(--t3);opacity:.35;pointer-events:none}

.toast-container{position:fixed;top:56px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:4px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:toastIn .3s ease-out}
.toast.success{background:#f6ffed;border:1px solid #b7eb8f;color:#135200}.toast.info{background:#e6f7ff;border:1px solid #91d5ff;color:#003a8c}

.cs{display:flex;align-items:center;gap:8px}.cs .sw{flex:1;height:20px;display:flex;align-items:center;position:relative;cursor:pointer}.cs .st{width:100%;height:8px;border-radius:4px;background:#e8e8e8;position:relative;overflow:visible}.cs .sf{position:absolute;top:0;left:0;height:100%;border-radius:inherit;background:linear-gradient(to right,#C53030,#D48806,#00875A);background-size:300% 100%;transition:width .05s linear;pointer-events:none}.cs .thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#f5f5f5);border:3px solid #1890ff;box-shadow:0 2px 8px rgba(24,144,255,.2);cursor:grab;z-index:2}.cs .val{font-size:18px;font-weight:700;width:45px;text-align:center;flex-shrink:0;font-family:var(--fm)}
</style>

let pv={},pid=PACT,sv=PD[PACT].def,focusId='supplier_local',mode='briefing',ghost=false,ghostRate=null,drawerOpen=false,tabActive='环境',previewIdx=null,_slider=null;

(function initPV(){for(const[k,d]of Object.entries(PD))pv[k]=d.def;})();
function calc(cid){const s=SENS[cid];if(!s)return 50;let sc=0,w=0;for(const[k,c]of Object.entries(s)){const v=pv[k]??PD[k]?.def??50;sc+=(c.b+(v-c.a)*c.s);w++;}return C(Math.round(sc/Math.max(w,1)),0,100);}
function gs(cid){if(ghost&&ghostRate!==null){const sv=pv[pid];pv[pid]=ghostRate;const sc=calc(cid);pv[pid]=sv;return{score:sc,color:S2C(sc),label:S2L(sc)};}const sc=calc(cid);return{score:sc,color:S2C(sc),label:S2L(sc)};}
function gc(){const c={red:0,amber:0,green:0,detected:0};for(const x of CARDS){const s=gs(x.id);c[s.color]++;if(x.det)c.detected++;}return c;}

// === Slider ===
function onSC(v){sv=v;pv[pid]=v;updateDots();updateFocusScore();}
function onSR(v){sv=v;pv[pid]=v;updateDots();updateFocusScore();setTimeout(()=>renderAll(),50);}
function buildSlider(){
  const def=PD[pid];const c=document.getElementById('sc');
  c.innerHTML='<div class="cs"><div class="sw" id="sw"><div class="st"><div class="sf" id="sf"></div></div><div class="thumb" id="thumb"></div></div><span class="val" id="sv"></span></div>';
  const sf=c.querySelector('#sf'),thumb=c.querySelector('#thumb'),sw=c.querySelector('#sw'),svEl=c.querySelector('#sv');
  let val=def.def,isDragging=false,vel=[],raf=null;
  function setUI(v,a){
    const p=MR(v,def.min,def.max,0,100);thumb.style.left=p+'%';
    if(a)sf.style.width=p+'%';else{sf.style.transition='none';sf.style.width=p+'%';sf.offsetHeight;sf.style.transition='';}
    svEl.textContent=v+def.unit;sf.style.backgroundPosition=(100-p)+'% center';
  }
  thumb.addEventListener('pointerdown',e=>{e.preventDefault();thumb.setPointerCapture(e.pointerId);isDragging=true;thumb.style.transform='translate(-50%,-50%) scale(1.35)';thumb.style.boxShadow='0 1px 4px rgba(24,144,255,.5),0 0 0 12px rgba(24,144,255,.12)'});
  thumb.addEventListener('pointermove',e=>{if(!isDragging)return;const r=sw.getBoundingClientRect();const x=C(e.clientX,r.left,r.right);const p=(x-r.left)/r.width;const nv=Math.round((def.min+p*(def.max-def.min)));val=nv;setUI(nv,true);onSC(nv);});
  thumb.addEventListener('pointerup',()=>{if(!isDragging)return;isDragging=false;thumb.style.transform='translate(-50%,-50%)';thumb.style.boxShadow='0 2px 8px rgba(24,144,255,.2)';onSR(val);});
  sw.addEventListener('pointerdown',e=>{if(e.target===thumb)return;const r=sw.getBoundingClientRect();const p=(e.clientX-r.left)/r.width;val=Math.round((def.min+p*(def.max-def.min)));setUI(val,false);onSR(val);});
  setUI(def.def,false);
  return{setValue(v){val=C(Math.round(v),def.min,def.max);setUI(val,true);onSR(val);}};
}

// === Detection Strip ===
function renderStrip(){
  const s=document.getElementById('strip');
  const cards=CARDS.map(c=>({...c,state:gs(c.id)}));
  cards.sort((a,b)=>{if(a.state.color!==b.state.color)return a.state.color==='red'?-1:a.state.color==='amber'&&b.state.color==='green'?-1:1;return a.state.score-b.state.score;});
  const counts=gc();
  let rows='',lc='';
  for(const c of cards){
    if(c.state.color!==lc){const lb=c.state.color==='red'?'🔴 恶化中':c.state.color==='amber'?'🟡 需关注':'🟢 稳定执行';rows+=`<div class="strip-gh">${lb} (${counts[c.state.color]}项)</div>`;lc=c.state.color;}
    const oi=c.owner.charAt(0)+(c.owner.length>1?c.owner.charAt(c.owner.length-1):'');
    rows+=`<div class="strip-row${focusId===c.id?' on':''}" onclick="selectCard('${c.id}')"><span class="sr-d ${c.state.color}${c.det?' detected':''}"></span><span class="sr-n">${c.title}</span><span class="sr-s">${c.state.score}</span><span class="sr-o">${oi}</span>${c.det?'<span style="font-size:8px">🔵</span>':''}</div>`;
  }
  s.innerHTML=`<div class="strip-dots">
    <div class="summary-dot red${counts.detected>0?' detected':''}" title="恶化中:${counts.red}项"><span class="sc">${counts.red}</span></div>
    <div class="summary-dot amber" title="需关注:${counts.amber}项"><span class="sc">${counts.amber}</span></div>
    <div class="summary-dot green" title="稳定执行:${counts.green}项"><span class="sc">${counts.green}</span></div>
  </div><div class="strip-rows"><input class="strip-search" placeholder="🔍 搜索..." oninput="filterStrip(this.value)">${rows}</div>`;
}
function filterStrip(q){document.querySelectorAll('.strip-row').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'flex':'none';});}
function updateDots(){
  const counts=gc();
  const dots=document.querySelectorAll('.summary-dot');
  if(dots.length<3)return;
  dots[0].querySelector('.sc').textContent=counts.red;
  dots[1].querySelector('.sc').textContent=counts.amber;
  dots[2].querySelector('.sc').textContent=counts.green;
  if(counts.detected>0)dots[0].classList.add('detected');else dots[0].classList.remove('detected');
  updateCounter();
}
function updateFocusScore(){
  if(mode!=='briefing')return;
  const el=document.querySelector('.focus-score');if(!el)return;
  const s=gs(focusId);el.textContent=s.score;el.className='focus-score '+s.color;
}

// === Focus Card ===

  const s=gs(c.id),tr=s.label,isD=c.det,isG=ghost,tree=c.tree;
  const ti=getTrend(c.id);const tic=ti==='up'?'↗':ti==='down'?'↘':'→';

  if(isG)h+=`<div class="ghost-banner">🔮 幽灵预览 — 滑块未移动 · 仅预览效果</div>`;

  h+=`<div class="tree-sec"><div class="tree-ttl">TRIGGER ASSUMPTION</div><div class="tree-body">${tree.ta}</div></div>`;
  if(tree.cts&&tree.cts.length>0){h+=`<div class="tree-sec ${tree.cts.some(x=>x.risk==='high')?'danger':'warn'}"><div class="tree-ttl">受影响的合同(${tree.cts.length})</div><table class="ct"><tr><th>合同</th><th>供应商</th><th>金额</th><th>${isD?'进口率':'风险'}</th></tr>${tree.cts.map(x=>`<tr class="${x.risk==='high'?'rh':x.risk==='mid'?'rm':''}"><td>${x.id}</td><td>${x.sup}</td><td>${x.amt}</td><td>${x.risk==='high'?'🔴高':x.risk==='mid'?'🟡中':'🟢低'}${x.ir?'·'+x.ir:''}</td></tr>`).join('')}</table></div>`;}
  if(tree.rns&&tree.rns.length>0){h+=`<div class="tree-sec danger"><div class="tree-ttl">风险传导</div>${tree.rns.map(n=>`<div class="rn${n.sev==='mid'?' am':''}" onclick="onRiskClick('${c.id}')"><span class="rt">${n.sev==='high'?'🔴':'🟡'} ${n.role||n.name}</span>: ${n.impact}</div>`).join('')}</div>`;}

  if(c.paths&&c.paths.length>0){h+=`<div class="paths"><div class="paths-ttl">🟢 Path Back to Green</div>${c.paths.map((p,i)=>`<div class="path-card${i===0?' rec':''}" onclick="previewPath(${i})"><div class="pname">${p.name}</div><div class="peff">效果:${p.eff}</div><div style="font-size:11px;color:var(--t3)">成本:${p.cost}·${p.time}</div></div>`).join('')}<div class="path-actions" id="pa"><button class="btn" onclick="cancelPreview()">←返回</button><button class="btn apply" onclick="applyPath()">确认应用此路径</button></div></div>`;}
  h+=`<div class="watermark">🔶 模拟数据 · 更新于 ${TA(c.ua)}</div></div>`;

function getTrend(cid){const cur=calc(cid);const sv=pv[pid];pv[pid]=C(sv-3,PD[pid].min,PD[pid].max);const prev=calc(cid);pv[pid]=sv;const d=cur-prev;return d>1?'up':d<-1?'down':'flat';}
function toggleDissent(){const l=document.getElementById('disList'),t=document.getElementById('disToggle');if(!l||!t)return;l.classList.toggle('closed');t.textContent=l.classList.contains('closed')?'▶展开':'▲收起';}

function applyPath(){

  sv=p.tr;pv[pid]=p.tr;
  _slider.setValue(p.tr);

function onRiskClick(cid){const c=CARDS.find(x=>x.id===cid);if(!c||!c.paths||!c.paths[0])return;previewPath(0);}

function renderMatrix(){
  const a=document.getElementById('matrix');let h='<div class="matrix-grid">';
  for(let r=1;r<=5;r++)for(let cl=1;cl<=6;cl++){const c=CARDS.find(x=>x.row===r&&x.col===cl);if(!c){h+='<div></div>';continue;}const s=gs(c.id);h+=`<div class="mdot ${s.color}${c.det?' detected':''}" onclick="selectCard('${c.id}');setMode('briefing')">${s.score}<span class="mdn">${c.title}</span></div>`;}
  h+='</div>';a.innerHTML=h;
}

// === Drawer ===
function buildDrawer(){
  const tiers=['环境','战略','执行','监控','风险','解码'];
  document.getElementById('drawerIn').innerHTML=`
    <div class="param-tabs">${tiers.map(t=>`<button class="param-tab${t===tabActive?' on':''}" onclick="tabActive='${t}';buildDrawer()">${t}</button>`).join('')}</div>
    <div class="param-presets">${PRESETS.map(k=>{const d=PD[k];return`<div class="preset-card${k===pid?' on':''}" onclick="switchParam('${k}')"><div class="pn">⭐ ${d.name}</div><div class="pi">${d.tier}·当前${pv[k]}${d.unit}${k===pid?'·🔵激活':''}</div></div>`;}).join('')}</div>
    <div class="param-list">${Object.entries(PD).filter(([k,d])=>d.tier===tabActive).map(([k,d])=>{const active=k===pid;return`<div class="param-row" style="${active?'background:#e6f7ff':''}"><span class="pn" style="width:80px;font-weight:500">${d.name}</span><span style="width:45px;text-align:right;font-family:var(--fm)">${pv[k]}${d.unit}</span><span style="font-size:10px;color:var(--t3)">对${Object.keys(SENS).filter(cid=>SENS[cid]?.[k]).length}张卡影响</span>${active?'<span style="font-size:10px;color:var(--p)">🔵当前</span>':''}</div>`;}).join('')}</div>
    <div class="param-why"><strong>当前检测:</strong> 🔵 ${PD[pid].name} · ${PD[pid].reason||'无活跃检测'}<br><span style="font-size:10px">原因:此参数对supplier_local卡的敏感度最高(0.80)</span></div>`;
}
function toggleDrawer(){drawerOpen=!drawerOpen;document.getElementById('drawer').classList.toggle('open',drawerOpen);}
function switchParam(k){pid=k;sv=pv[k];const d=PD[k];document.getElementById('sl').textContent=(d.reason?'🔵 ':'')+d.name+'目标';document.getElementById('sr').textContent=d.reason?'— '+d.reason:'';drawerOpen=false;document.getElementById('drawer').classList.remove('open');buildSlider();renderAll();T('已切换至 '+d.name,'info');}

// === Counter + Safety ===
function updateCounter(){const cz=document.getElementById('cz');const counts=gc();let n=counts.detected+counts.amber+counts.red;if(ghost)n++;if(n===0){cz.classList.remove('on');return;}cz.classList.add('on');let t='';if(counts.detected>0)t+=`🔵<strong>${counts.detected}项系统检测</strong>`;if(counts.amber>0)t+=`·🟡${counts.amber}项需关注`;if(counts.red>0)t+=`·<span style="color:var(--d)">${counts.red}项恶化中</span>`;if(ghost)t+=`·<span style="color:var(--p);font-weight:600">🔮幽灵预览·未保存</span>`;const dc=CARDS.find(c=>c.det);if(dc&&dc.detInfo){const rem=Math.max(0,Math.floor((new Date(dc.detInfo.su)-new Date())/3600000));t+=`·🕐响应窗口剩余${rem}h`;}document.getElementById('ci').innerHTML=t;}
function updateSafety(){const dc=CARDS.find(c=>c.det);const el=document.getElementById('safezIn');if(!dc){el.innerHTML='<span style="color:var(--t3)">✅无静默检测项·系统监控运行中</span>';return;}const rem=Math.max(0,Math.floor((new Date(dc.detInfo.su)-new Date())/3600000));el.innerHTML=`<span>🔵</span><div style="flex:1"><strong>静默检测中—仅责任人及直线上级可见</strong><br><span style="font-size:11px;color:var(--t2)">${dc.title}·检测于${dc.detInfo.da}·责任人:${dc.owner}(${dc.role||''})·主管:赵总</span></div><span class="safety-countdown">剩余${rem}h</span><button class="btn" onclick="T('✅已确认知晓','info')">确认已知晓</button><button class="btn apply" onclick="previewPath(0);T('🟢已启动纠正措施','success')">发起纠正措施</button>`;}

// === Render All ===
function renderAll(){renderStrip();if(mode==='briefing')renderFocus();else renderMatrix();updateCounter();updateSafety();}
function setMode(m){mode=m;document.getElementById('btn-brief').classList.toggle('on',m==='briefing');document.getElementById('btn-matrix').classList.toggle('on',m==='matrix');document.getElementById('focus').style.display=m==='briefing'?'block':'none';document.getElementById('matrix').style.display=m==='matrix'?'flex':'none';document.getElementById('matrix').classList.toggle('on',m==='matrix');renderAll();}
function selectCard(cid){focusId=cid;if(mode==='matrix')setMode('briefing');renderAll();}

// === Init ===
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('sl').textContent='🔵 '+PD[pid].name+'目标';
  document.getElementById('sr').textContent='— '+PD[pid].reason;
  _slider=buildSlider();
  buildDrawer();
  renderAll();
  setInterval(updateSafety,30000);
  T('🟢V3.2战略承诺墙已就绪·1焦点卡+检测条(3点汇总/全量展开)','success');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drawerOpen)toggleDrawer();if(ghost)cancelPreview();}});
</script>
</body>
</html>
