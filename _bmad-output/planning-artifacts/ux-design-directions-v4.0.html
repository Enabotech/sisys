<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SISYS V4.0 · 战略偏差归因</title>
<style>
:root{--p:#1890ff;--s:#00875A;--w:#B86E00;--d:#C53030;--det:#3B82F6;--bg:#f5f5f5;--card:#fff;--bd:#e8e8e8;--t1:#262626;--t2:#595959;--t3:#8c8c8c;--ok:#E6F7F1;--wn:#FFF8E6;--dn:#FFF1F0;--db:#EFF6FF;--f:'PingFang SC','Microsoft YaHei',sans-serif;--fm:'Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t1);overflow:hidden;height:100vh}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.app{display:flex;flex-direction:column;height:100vh;max-width:1440px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 16px;border-bottom:1px solid var(--bd);flex-shrink:0;z-index:100;background:var(--card)}
.header-brand{font-size:15px;font-weight:700}
.header-right{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--t2)}
.main{display:flex;flex:1;overflow:hidden}
/* SP列表(左) */
.sp-panel{width:240px;flex-shrink:0;border-right:1px solid var(--bd);overflow-y:auto;background:var(--card);display:flex;flex-direction:column}
.sp-item{padding:10px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:8px;font-size:12px}
.sp-item:hover{background:var(--db)}.sp-item.on{border-left-color:var(--p);background:#e6f7ff}
.sp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.sp-dot.red{background:var(--d)}.sp-dot.amber{background:var(--w)}.sp-dot.green{background:var(--s)}
.sp-name{flex:1;font-weight:500}.sp-dev{font-family:var(--fm);font-weight:700;font-size:13px}.sp-dev.red{color:var(--d)}.sp-dev.amber{color:var(--w)}.sp-dev.green{color:var(--s)}
.sp-meta{font-size:10px;color:var(--t3)}
.sp-cover{font-size:10px;padding:8px 12px;border-top:1px solid var(--bd);color:var(--t2)}
.sp-cover-bar{height:6px;border-radius:3px;background:var(--bd);margin-top:4px;overflow:hidden}
.sp-cover-fill{height:100%;border-radius:3px;background:var(--s);transition:width .3s}
/* 因果链(中) */
.chain-panel{flex:1;overflow-y:auto;padding:24px}
.chain-sp{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--t1)}
.chain-sp-target{font-size:11px;color:var(--t3);margin-bottom:8px}
.chain-arrow{text-align:center;color:var(--t3);font-size:14px;padding:4px 0}
.chain-bp{border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:8px;transition:all .15s}
.chain-bp.on{border-color:var(--p);background:#f0f7ff}
.chain-bp-name{font-weight:600;font-size:13px;margin-bottom:6px}
.chain-kpi{display:flex;gap:12px;align-items:center;font-size:12px;margin:6px 0}
.chain-kpi-item{flex:1;text-align:center;padding:4px 8px;border-radius:4px;background:var(--bg)}
.chain-kpi-val{font-family:var(--fm);font-weight:700;font-size:16px}.chain-kpi-val.red{color:var(--d)}.chain-kpi-val.amber{color:var(--w)}.chain-kpi-val.green{color:var(--s)}
.chain-events{margin-top:8px;font-size:11px;color:var(--t2)}
.chain-event{padding:3px 0;display:flex;gap:8px}.chain-event-time{color:var(--t3);width:55px;flex-shrink:0}
.chain-event.red{border-left:2px solid var(--d);padding-left:8px;font-weight:600}
.chain-paths{margin-top:8px}.chain-path{padding:6px 10px;border-radius:4px;font-size:11px;cursor:pointer;border:1px solid var(--bd);margin-bottom:4px;transition:all .15s}
.chain-path:hover{border-color:var(--s)}.chain-path.rec{border-color:var(--s);background:var(--ok)}
.chain-path-name{font-weight:600}.chain-path-eff{color:var(--s)}
/* 反事实(右) */
.cf-panel{width:300px;flex-shrink:0;border-left:1px solid var(--bd);overflow-y:auto;background:var(--card);padding:16px}
.cf-title{font-size:13px;font-weight:700;margin-bottom:12px}
.cf-card{background:var(--db);border-radius:8px;padding:12px;margin-bottom:10px;font-size:12px}
.cf-card-title{font-weight:600;color:var(--p);margin-bottom:6px}
.cf-compare{display:flex;gap:8px;align-items:center;margin:8px 0}
.cf-cur,.cf-pre{padding:6px 10px;border-radius:4px;font-size:13px;font-family:var(--fm);font-weight:700}
.cf-cur{background:var(--dn);color:var(--d)}.cf-pre{background:var(--ok);color:var(--s)}
.cf-arrow{font-size:16px;color:var(--t3)}
.cf-missed{color:var(--d);font-weight:600;margin-top:4px}
.cf-action{margin-top:10px}.cf-btn{display:block;width:100%;padding:8px;border-radius:4px;border:1px solid var(--p);cursor:pointer;font-size:12px;background:var(--card);color:var(--p);text-align:center;transition:all .15s;font-family:var(--f)}
.cf-btn:hover{background:var(--p);color:#fff}.cf-btn.apply{background:var(--s);color:#fff;border-color:var(--s)}.cf-btn.apply:hover{background:#006d45}
/* 底栏 */
.bottom-bar{height:56px;flex-shrink:0;border-top:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;gap:16px;font-size:11px;background:var(--card)}
.bb-actions{display:flex;gap:8px;flex:1;overflow-x:auto}
.bb-act{flex:1;min-width:180px;padding:6px 10px;border-radius:4px;background:var(--bg);font-size:11px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.bb-act:hover{border-color:var(--p)}.bb-act.red{border-left:3px solid var(--d)}.bb-act.amber{border-left:3px solid var(--w)}
.bb-act-num{font-family:var(--fm);font-weight:700;margin-right:4px}
.bb-act-from{font-size:9px;color:var(--t3)}
/* Ghost状态 */
.chain-bp.ghost{opacity:.45;filter:grayscale(30%) blur(.3px);border:2px dashed var(--p);position:relative}
.ghost-banner{display:none;position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:2px 10px;border-radius:8px;font-size:10px;font-weight:700;z-index:10;white-space:nowrap}
.chain-bp.ghost .ghost-banner{display:block}
.chain-path.ghosting{background:var(--db);border:1px dashed var(--p)}
.sp-item.ghost-glow{background:rgba(24,144,255,.08)}.sp-item.ghost-dim{opacity:.38;filter:grayscale(30%)}
.chain-bp.ghost-glow{border-color:var(--p);box-shadow:0 0 12px rgba(24,144,255,.2)}.chain-bp.ghost-dim{opacity:.38}
.toast-container{position:fixed;top:56px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:4px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:toastIn .3s ease-out}
.toast.success{background:#f6ffed;border:1px solid #b7eb8f;color:#135200}.toast.info{background:#e6f7ff;border:1px solid #91d5ff;color:#003a8c}
.ghost-bar{display:none;height:36px;flex-shrink:0;background:linear-gradient(90deg,#e6f7ff,#f0f5ff);border-bottom:1px solid var(--p);align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.ghost-bar.on{display:flex}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="header-brand">🎯 SISYS V4.0 · 战略偏差归因</div><div class="header-right"><span>XX公司 2026 SP-BP</span><span>👤 张总</span></div></div>
<div class="ghost-bar" id="ghostBar"><span>🔮 幽灵预览 — KPI目标调整中 · 未保存</span><span style="display:flex;gap:8px"><button class="cf-btn" onclick="cancelPreview()" style="width:auto;padding:4px 12px">✖ 取消</button><button class="cf-btn apply" onclick="applyPath()" style="width:auto;padding:4px 12px">✓ 确认调整</button></span></div>
<div class="main">
<div class="sp-panel" id="spPanel"></div>
<div class="chain-panel" id="chainPanel"></div>
<div class="cf-panel" id="cfPanel"></div>
</div>
<div class="bottom-bar" id="bottomBar"></div>
</div>
<div class="toast-container" id="toasts"></div>
<script>
// === Utils ===
function T(m,t){const c=document.getElementById('toasts'),e=document.createElement('div');e.className='toast '+(t||'info');e.textContent=m;c.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(()=>e.remove(),300)},3000)}
function C(v,min,max){return Math.max(min,Math.min(max,v))}
function TA(iso){const d=new Date(iso),n=new Date(),s=Math.floor((n-d)/1000);if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';if(s<86400)return Math.floor(s/3600)+'小时前';return Math.floor(s/86400)+'天前'}
function S2C(s){return s>=70?'green':s>=40?'amber':'red'}
function S2L(s){return s>=70?'达标':s>=40?'关注':'恶化'}

// === Data: SP Control Points ===
const SPS=[
  {id:'sp1',name:'供应链自主可控',target:'国产化率≥67%',current:45,deviation:-32.8,status:'critical',owner:'张总',tier:'strategic',bpIds:['bp1','bp2']},
  {id:'sp2',name:'核心器件供应安全',target:'7类器件国产化',current:5,deviation:-18.5,status:'at_risk',owner:'李明',tier:'strategic',bpIds:['bp3']},
  {id:'sp3',name:'海外市场营收占比',target:'海外营收≥15%',current:11,deviation:-15.2,status:'at_risk',owner:'赵总',tier:'strategic',bpIds:['bp4']},
  {id:'sp4',name:'研发投入强度',target:'研发占比≥8%',current:8.2,deviation:2.5,status:'on_track',owner:'陈伟',tier:'execution',bpIds:['bp5']},
  {id:'sp5',name:'人才梯队健康度',target:'继任率≥80%',current:72,deviation:5,status:'on_track',owner:'孙静',tier:'capability',bpIds:['bp6']},
];
// === Data: BP Initiatives ===
const BPIS=[
  {id:'bp1',cpId:'sp1',name:'供应商国产化替代计划',kpiName:'国产供应商签约率',kpiTarget:70,kpiActual:45,kpiUnit:'%',deviation:-35.7,status:'critical',owner:'张总',budget:'¥5亿',timeline:'Q1:45%→Q4:67%',
    events:[{time:'2025-09',event:'鑫达贸易月度出货量下降23%',st:'warning'},{time:'2025-10',event:'续约谈判推迟(第2次)',st:'warning'},{time:'2025-11',event:'⚠ 合同终止风险—当前状态',st:'danger'}],
    cf:{earliest:'2025-09-15',action:'启动备选供应商资质预审',wouldBe:14,missed:63},
    paths:[{name:'分阶段推进 Q1→Q4',targetKpi:55,eff:'KPI偏差 35.7%→15%',cost:'额外供应商开发资源',time:'12个月分4阶段'}]},
  {id:'bp2',cpId:'sp1',name:'供应链韧性提升计划',kpiName:'供应中断恢复时间',kpiTarget:48,kpiActual:72,kpiUnit:'h',deviation:-50,status:'critical',owner:'张总',budget:'¥2.4亿',
    events:[{time:'2025-08',event:'华东仓库水灾导致3天断供',st:'danger'}],
    cf:{earliest:'2025-07-01',action:'启动异地备灾仓库建设',wouldBe:8,missed:94},
    paths:[{name:'加速异地仓库建设',targetKpi:55,eff:'恢复时间 72h→55h',cost:'¥8,000万追加投资',time:'6个月'}]},
  {id:'bp3',cpId:'sp2',name:'核心器件国产替代专项',kpiName:'国产器件认证通过率',kpiTarget:80,kpiActual:55,kpiUnit:'%',deviation:-31,status:'critical',owner:'李明',budget:'¥3.2亿',
    events:[{time:'2025-07',event:'3类器件认证测试失败',st:'warning'},{time:'2025-10',event:'供应商A退出竞标',st:'danger'}],
    cf:{earliest:'2025-06-01',action:'启动备选认证实验室',wouldBe:12,missed:112},
    paths:[{name:'引入第3方认证机构',targetKpi:65,eff:'偏差31%→18%',cost:'¥5,000万',time:'4个月'}]},
  {id:'bp4',cpId:'sp3',name:'东南亚市场落地计划',kpiName:'海外渠道签约数',kpiTarget:20,kpiActual:8,kpiUnit:'家',deviation:-60,status:'critical',owner:'赵总',budget:'¥1.8亿',
    events:[{time:'2025-04',event:'当地合规审批延迟4个月',st:'danger'}],
    cf:{earliest:'2025-02-15',action:'提前启动当地法人注册',wouldBe:25,missed:151},
    paths:[{name:'加速合资公司设立',targetKpi:14,eff:'偏差60%→30%',cost:'¥3,000万',time:'3个月'}]},
  {id:'bp5',cpId:'sp4',name:'研发管线推进计划',kpiName:'专利申请数',kpiTarget:15,kpiActual:16,kpiUnit:'件',deviation:6.7,status:'on_track',owner:'陈伟',budget:'¥6亿',
    events:[],cf:null,paths:[]},
  {id:'bp6',cpId:'sp5',name:'关键人才保留计划',kpiName:'关键岗位继任率',kpiTarget:80,kpiActual:72,kpiUnit:'%',deviation:-10,status:'at_risk',owner:'孙静',budget:'¥8,000万',
    events:[{time:'2025-09',event:'2位总监级提出离职',st:'warning'}],
    cf:{earliest:'2025-06-01',action:'提前启动股权激励方案',wouldBe:5,missed:98},
    paths:[{name:'加速股权激励落地',targetKpi:78,eff:'偏差10%→2.5%',cost:'¥2,000万',time:'2个月'}]},
];

// === State ===
let selSP='sp1',selBPI='bp1',ghost=false,ghostTarget=null,previewBpId=null;

// === Derive ===
function getSP(id){return SPS.find(s=>s.id===id)}
function getBPI(id){return BPIS.find(b=>b.id===id)}
function getBPIsBySP(spId){return BPIS.filter(b=>b.cpId===spId)}
function getCoverage(){const total=SPS.length;const mapped=SPS.filter(s=>s.bpIds.length>0).length;return {mapped,total,pct:Math.round(mapped/total*100)}}
function getMostCriticalSP(){return SPS.reduce((a,b)=>(a.deviation<b.deviation)?a:b,SPS[0])}

// === Render: SP List (左) ===
function renderSPList(){
  const el=document.getElementById('spPanel');
  const sorted=[...SPS].sort((a,b)=>a.deviation-b.deviation);
  let h='';
  for(const sp of sorted){
    const cls=['sp-item'];if(sp.id===selSP)cls.push('on');
    if(ghost){const affected=getSP(selSP);if(affected&&affected.bpIds.some(bid=>getBPI(bid)?.cpId===sp.id))cls.push('ghost-glow');else if(sp.id!==selSP)cls.push('ghost-dim');}
    h+=`<div class="${cls.join(' ')}" onclick="onSelectSP('${sp.id}')"><span class="sp-dot ${sp.status==='critical'?'red':sp.status==='at_risk'?'amber':'green'}"></span><span class="sp-name">${sp.name}</span><span class="sp-dev ${sp.status==='critical'?'red':sp.status==='at_risk'?'amber':'green'}">${sp.deviation>0?'+':''}${sp.deviation}%</span></div>`;
  }
  const cov=getCoverage();
  h+=`<div class="sp-cover">SP→BP 映射覆盖率: ${cov.pct}% (${cov.mapped}/${cov.total})<div class="sp-cover-bar"><div class="sp-cover-fill" style="width:${cov.pct}%"></div></div></div>`;
  el.innerHTML=h;
}

// === Render: Causal Chain (中) ===
function renderCausalChain(){
  const el=document.getElementById('chainPanel');
  const sp=getSP(selSP);if(!sp)return;
  const bps=getBPIsBySP(selSP);
  let h=`<div class="chain-sp">${sp.status==='critical'?'🔴':sp.status==='at_risk'?'🟡':'🟢'} SP: ${sp.name}</div>`;
  h+=`<div class="chain-sp-target">目标: ${sp.target} · 实际: ${sp.current}% · 偏差: ${sp.deviation>0?'+':''}${sp.deviation}% · ${sp.owner}(${sp.tier})</div>`;
  for(const bp of bps){
    const bpCls=['chain-bp'];if(bp.id===selBPI)bpCls.push('on');
    if(ghost){if(bp.id===previewBpId)bpCls.push('ghost');else if(getSP(selSP)?.bpIds.includes(bp.id))bpCls.push('ghost-glow');else bpCls.push('ghost-dim');}
    h+=`<div class="${bpCls.join(' ')}" onclick="onSelectBPI('${bp.id}')">`;
    if(ghost&&bp.id===previewBpId)h+=`<div class="ghost-banner">🔮 幽灵预览 · 目标KPI调整中</div>`;
    h+=`<div class="chain-bp-name">${bp.status==='critical'?'🔴':bp.status==='at_risk'?'🟡':'🟢'} BP: ${bp.name} · ${bp.owner} · ${bp.budget}</div>`;
    h+=`<div class="chain-kpi"><div class="chain-kpi-item">目标<span class="chain-kpi-val">${bp.kpiTarget}${bp.kpiUnit}</span></div><div class="chain-kpi-item">实际<span class="chain-kpi-val ${S2C(bp.kpiActual/bp.kpiTarget*100)}">${bp.kpiActual}${bp.kpiUnit}</span></div><div class="chain-kpi-item">偏差<span class="chain-kpi-val ${bp.deviation<-20?'red':bp.deviation<-10?'amber':'green'}">${bp.deviation>0?'+':''}${bp.deviation}%</span></div></div>`;
    if(ghost&&bp.id===previewBpId&&ghostTarget!==null){
      const previewActual=Math.round(bp.kpiActual+(ghostTarget-bp.kpiTarget)*0.6);
      const previewDev=Math.round((previewActual-ghostTarget)/ghostTarget*100);
      h+=`<div class="chain-kpi" style="opacity:.7;border:1px dashed var(--p);border-radius:4px"><div class="chain-kpi-item">预览目标<span class="chain-kpi-val" style="color:var(--p)">${ghostTarget}${bp.kpiUnit}</span></div><div class="chain-kpi-item">预估实际<span class="chain-kpi-val" style="color:var(--p)">${previewActual}${bp.kpiUnit}</span></div><div class="chain-kpi-item">预估偏差<span class="chain-kpi-val" style="color:var(--p)">${previewDev}%</span></div></div>`;
    }
    if(bp.events&&bp.events.length>0){h+=`<div class="chain-events">`;for(const ev of bp.events){h+=`<div class="chain-event${ev.st==='danger'?' red':''}"><span class="chain-event-time">${ev.time}</span>${ev.event}</div>`;}h+=`</div>`;}
    if(bp.paths&&bp.paths.length>0){h+=`<div class="chain-paths">`;for(let i=0;i<bp.paths.length;i++){const p=bp.paths[i];h+=`<div class="chain-path${i===0?' rec':''}${ghost&&previewBpId===bp.id&&ghostTarget===p.targetKpi?' ghosting':''}" onclick="event.stopPropagation();previewPath('${bp.id}',${i})"><span class="chain-path-name">${p.name}</span><br><span class="chain-path-eff">${p.eff}</span> · ${p.cost} · ${p.time}</div>`;}h+=`</div>`;}
    h+=`</div>`;
  }
  el.innerHTML=h;
}

// === Render: Counterfactual (右) ===
function renderCounterfactual(){
  const el=document.getElementById('cfPanel');
  const bp=getBPI(selBPI);if(!bp){el.innerHTML='<div class="cf-title">💡 反事实推演</div><div style="font-size:12px;color:var(--t3)">← 选择BP举措查看反事实分析</div>';return;}
  let h=`<div class="cf-title">💡 反事实推演</div>`;
  if(!bp.cf){h+=`<div style="font-size:12px;color:var(--t2)">该举措暂无反事实分析数据</div>`;}else{
    h+=`<div class="cf-card"><div class="cf-card-title">如果当时...</div><div style="font-size:11px;color:var(--t2);margin-bottom:6px">在 <b>${bp.cf.earliest}</b><br>${bp.cf.action}</div><div class="cf-compare"><span class="cf-cur">当前<br>${bp.deviation}%</span><span class="cf-arrow">→</span><span class="cf-pre">反事实<br>-${bp.cf.wouldBe}%</span></div><div style="font-size:11px;color:var(--s)">📐 改善 +${Math.abs(bp.deviation)-bp.cf.wouldBe}pp</div><div class="cf-missed">⏰ 错过 ${bp.cf.missed} 天最佳干预窗口</div></div>`;
  }
  if(bp.paths&&bp.paths.length>0){
    h+=`<div style="font-size:12px;font-weight:600;margin-bottom:6px">🟢 修正路径</div>`;
    for(let i=0;i<bp.paths.length;i++){const p=bp.paths[i];h+=`<div class="chain-path${i===0?' rec':''}" onclick="previewPath('${bp.id}',${i})"><span class="chain-path-name">${p.name}</span><br><span class="chain-path-eff">${p.eff}</span><br><span style="font-size:10px;color:var(--t3)">${p.cost} · ${p.time}</span></div>`;}
  }
  if(!ghost)h+=`<div class="cf-action"><button class="cf-btn apply" onclick="previewPath('${selBPI}',0)" ${!bp.paths||bp.paths.length===0?'disabled':''}>启动纠正措施</button></div>`;
  el.innerHTML=h;
}

// === Render: Bottom Bar (底) ===
function renderBottomBar(){
  const el=document.getElementById('bottomBar');
  if(ghost){const bp=getBPI(previewBpId);el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;width:100%;color:var(--p);font-weight:600">🔮 KPI目标调整: ${bp?bp.kpiTarget:''}${bp?bp.kpiUnit:''} → ${ghostTarget}${bp?bp.kpiUnit:''} · 反事实偏离预估 -${bp?bp.cf.wouldBe:''}%</div>`;return;}
  const criticals=BPIS.filter(b=>b.status==='critical').slice(0,3);
  let acts='';
  for(let i=0;i<criticals.length;i++){
    const bp=criticals[i];const sp=getSP(bp.cpId);
    acts+=`<div class="bb-act red" onclick="onSelectSP('${bp.cpId}');onSelectBPI('${bp.id}')"><span class="bb-act-num">${i+1}.</span>处理: ${bp.name} (偏差${bp.deviation}%)<br><span class="bb-act-from">关联SP: ${sp?sp.name:''} · ${bp.owner}</span></div>`;
  }
  el.innerHTML=`<span style="font-weight:600;white-space:nowrap">📌 今日行动 (${criticals.length}项)</span><div class="bb-actions">${acts}</div>`;
}

// === Render All ===
function renderAll(){renderSPList();renderCausalChain();renderCounterfactual();renderBottomBar();document.getElementById('ghostBar').classList.toggle('on',ghost)}

// === Interaction ===
function onSelectSP(spId){selSP=spId;const bps=getBPIsBySP(spId);selBPI=bps.length>0?bps[0].id:null;if(ghost){ghost=false;ghostTarget=null;previewBpId=null;}renderAll()}
function onSelectBPI(bpId){selBPI=bpId;renderAll()}
function previewPath(bpId,idx){const bp=getBPI(bpId);if(!bp||!bp.paths||!bp.paths[idx])return;ghost=true;ghostTarget=bp.paths[idx].targetKpi;previewBpId=bpId;renderAll();T('🔮 幽灵预览: '+bp.paths[idx].name+' · KPI目标调整至'+ghostTarget+bp.kpiUnit,'info')}
function cancelPreview(){ghost=false;ghostTarget=null;previewBpId=null;renderAll()}
function applyPath(){const bp=getBPI(previewBpId);if(!bp||ghostTarget===null)return;bp.kpiTarget=ghostTarget;const newActual=Math.round(bp.kpiActual+(ghostTarget-bp.kpiTarget)*0.6);bp.kpiActual=Math.max(0,newActual);bp.deviation=Math.round((bp.kpiActual-bp.kpiTarget)/bp.kpiTarget*100);bp.status=bp.deviation<-20?'critical':bp.deviation<-10?'at_risk':'on_track';ghost=false;ghostTarget=null;previewBpId=null;renderAll();T('✅ 路径已应用 · KPI目标调整至'+bp.kpiTarget+bp.kpiUnit,'success')}

// === Init ===
document.addEventListener('DOMContentLoaded',()=>{selSP=getMostCriticalSP().id;const bps=getBPIsBySP(selSP);selBPI=bps.length>0?bps[0].id:null;renderAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ghost)cancelPreview()});
</script>
</body>
