# CEO Agent 基础配置（Story 5-1 — CEO Agent 实例化 MVP）
#
# 配置资产身份键：identity.role（加载器按 {role}_agent.yaml 寻址）
# 未知键策略：Schema 外未知键被加载器忽略（前向兼容——DC-3 回填期新旧配置共存）
# 字段语义与裁剪标准见 Story 5-1 DC-3：保留有近期 Story 消费方的字段，
# 裁剪无认领方字段（.md 身份档案七件套属 Story 5.2，不在此文件）

agent:
  name: "CEO Agent"
  version: "1.0.0"
  description: "首席执行官 Agent，MVP 单 Agent 方案的战略规划执行者"
identity:
  role: "ceo"
capabilities:
  # 职责（core-domain §17.3.1 CEO 条目）
  responsibilities: ["战略方向", "最终决策", "高管协调"]
  # 领域知识（core-domain §17.3.1 expertise）
  domain_knowledge: ["宏观趋势", "竞争格局", "战略意图"]
llm_config:
  # 留空时 5.3 引擎回退 UDMR 路由；本 Story 不调用 LLM（映射 LLMConfig.model 由 5.3 消费）
  preferred_model: null
eip_config:
  # 5.4 EIP 消费，本 Story 仅承载
  default_isolation_level: "L4"
  # 5.5 三重硬隔离消费：L4 严格工具白名单（真源 = TOOL_CATALOG 全部 23 名，
  # 当前 23 条目均默认 ACTIVE 故「ACTIVE 全集」效果等同全部名；V1 出现
  # DEPRECATED 工具时需按 tool.status 过滤再生成）。工具名是中文显示名形态，
  # 6 个含半角空格（PESTEL 分析/VRIO 框架/GE-麦肯锡矩阵/SPACE 矩阵/
  # BSC 平衡计分卡/RACI 矩阵），另有 $APPEALS/SWOT-TOWS 特殊字符——
  # 逐字节照抄禁改写，全角空格混入即 449（fail-closed 全拒）
  allowed_tools:
    - "PESTEL 分析"
    - "波特五力"
    - "$APPEALS"
    - "竞争对手分析"
    - "价值链分析"
    - "VRIO 框架"
    - "安索夫矩阵"
    - "SWOT-TOWS"
    - "GE-麦肯锡矩阵"
    - "SPACE 矩阵"
    - "情景规划"
    - "价值曲线分析"
    - "价值主张画布"
    - "商业模式画布"
    - "破坏性创新模型"
    - "BSC 平衡计分卡"
    - "战略地图"
    - "组织设计框架"
    - "依赖关系图"
    - "RACI 矩阵"
    - "甘特图"
    - "KPI"
    - "变革管理模型"
memory_config:
  # Agent 状态 TTL 秒（闭区间 60~2592000，默认 86400 为值对象唯一默认值真源）
  state_ttl: 86400
