---
# SISYS 应用 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sisys-app
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sisys-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sisys-app
        app.kubernetes.io/part-of: sisys
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: sisys-app
          image: harbor.sisys.local/sisys/app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /app/.cache
            - name: nginx-cache-volume
              mountPath: /var/cache/nginx
            - name: nginx-run-volume
              mountPath: /var/run
            - name: nginx-log-volume
              mountPath: /var/log/nginx
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        - name: nginx-cache-volume
          emptyDir: {}
        - name: nginx-run-volume
          emptyDir: {}
        - name: nginx-log-volume
          emptyDir: {}
      imagePullSecrets: []
      nodeSelector: {}
      tolerations: []
