---
# SISYS 应用 HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sisys-app
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sisys-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
