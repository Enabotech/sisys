---
# Kustomize Base 配置
# SISYS 应用的基础资源配置

apiVersion: v1
kind: Namespace
metadata:
  name: sisys
  labels:
    app.kubernetes.io/name: sisys
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/managed-by: argocd

---
# SISYS 应用 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sisys-app
  namespace: sisys
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/managed-by: argocd
spec:
  # 副本数由 Kustomize overlay 或 HPA 管理
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sisys-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sisys-app
        app.kubernetes.io/part-of: sisys
    spec:
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: sisys-app
          # 镜像由 Kustomize overlay 或 ArgoCD Image Updater 管理
          image: harbor.sisys.local/sisys/app:latest
          imagePullPolicy: Always

          # 端口配置
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # 健康检查
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # 资源限制
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # 安全上下文
          securityContext:
            readOnlyRootFilesystem: true
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # 环境变量
          env:
            - name: APP_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "info"

          # 挂载配置
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /app/.cache

      # 挂载卷
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}

      # 镜像拉取策略
      imagePullSecrets: []

      # 节点选择
      nodeSelector: {}

      # 容忍度
      tolerations: []

---
# SISYS 应用 Service
apiVersion: v1
kind: Service
metadata:
  name: sisys-app
  namespace: sisys
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sisys-app

---
# SISYS 应用 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: sisys-app-config
  namespace: sisys
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
data:
  # 应用配置
  APP_ENV: "development"
  LOG_LEVEL: "info"

  # 数据库配置 (从 Secret 获取敏感信息)
  DB_HOST: "postgres.sisys.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "sisys"

  # Redis 配置
  REDIS_HOST: "redis.sisys.svc.cluster.local"
  REDIS_PORT: "6379"

---
# SISYS 应用 HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sisys-app
  namespace: sisys
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sisys-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # CPU 使用率指标
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 内存使用率指标
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
