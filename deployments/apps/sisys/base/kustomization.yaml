---
# Kustomize Base 配置
# SISYS 应用的基础资源配置

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 命名空间配置
namespace: sisys

# 通用标签
commonLabels:
  app.kubernetes.io/name: sisys-app
  app.kubernetes.io/part-of: sisys
  app.kubernetes.io/managed-by: argocd

# 资源文件列表
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
