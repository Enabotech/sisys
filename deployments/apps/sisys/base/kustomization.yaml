---
# Kustomize Base 配置
# SISYS 应用的基础资源配置

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 命名空间配置
namespace: sisys

# 通用标签（注意：不要在这里添加 labels，因为会影响 selector）
# selector 相关的 labels 应该在 deployment.yaml 中直接定义

# 资源文件列表
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
