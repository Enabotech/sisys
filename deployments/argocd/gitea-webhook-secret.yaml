---
# ArgoCD Gitea Webhook 配置
# 用于接收 Gitea 代码推送事件并触发 ArgoCD 同步

apiVersion: v1
kind: Secret
metadata:
  name: argocd-gitea-webhook-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: webhook
  annotations:
    description: "Gitea Webhook 验证密钥"
type: Opaque
stringData:
  # Webhook 验证密钥（可选，用于验证 Webhook 请求）
  webhook-secret: ""
