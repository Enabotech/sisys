# =============================================================================
# 4. 示例 Application 配置
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-example
  namespace: argocd
  annotations:
    # 启用镜像更新
    argocd-image-updater.argoproj.io/image-list: |
      harbor.sisys.local/sisys/myapp=myapp

    # 更新策略：语义化版本
    argocd-image-updater.argoproj.io/myapp.update-strategy: semver

    # 允许的 tag 格式
    argocd-image-updater.argoproj.io/myapp.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$

    # 排序方式
    argocd-image-updater.argoproj.io/myapp.sort-mode: semver

    # 忽略的 tag
    argocd-image-updater.argoproj.io/myapp.ignore-tags: |
      latest,dev,nightly

    # 强制更新
    argocd-image-updater.argoproj.io/myapp.force-update: "true"
spec:
  project: default
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/myapp
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# 测试 Application - 用于验证 Image Updater 功能
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-image-updater
  namespace: argocd
  annotations:
    # 最简单的配置 - 使用 latest tag
    argocd-image-updater.argoproj.io/image-list: harbor.sisys.local/sisys/test-app
    argocd-image-updater.argoproj.io/update-strategy: latest
spec:
  project: default
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/test-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# 配置说明文档
# =============================================================================
#
# 使用方法:
#
# 1. 应用 Image Updater 安装清单:
#    sudo kubectl apply -f deployments/argocd/image-updater-install.yaml
#
# 2. 验证安装:
#    sudo kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-image-updater
#
# 3. 配置 Harbor Webhook（通过 Web 界面）:
#    参考上文配置指南
#
# 4. 创建 Application:
#    sudo kubectl apply -f deployments/argocd/image-updater-config.yaml
#
# 5. 测试镜像更新:
#    a. 推送新镜像到 Harbor:
#       docker tag test-app:latest harbor.sisys.local/sisys/test-app:v1.0.0
#       docker push harbor.sisys.local/sisys/test-app:v1.0.0
#
#    b. 等待 Image Updater 检测（约 1-2 分钟）:
#       sudo kubectl logs -n argocd -l app.kubernetes.io/name=argocd-image-updater -f
#
#    c. 验证 Application 已更新:
#       sudo kubectl get application test-image-updater -n argocd
#
# =============================================================================
