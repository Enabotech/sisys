---
# ArgoCD Gitea Repository Credentials
# Purpose: ArgoCD connection to Gitea code repository
# Story 0.7: Task 4 - Gitea Integration
#
# Security Fix (CRITICAL-1): 2026-03-19
# - Remove plaintext token, use environment variable or CI/CD injection
# - Use Kustomize secretGenerator or External Secrets Operator
#
# Required environment variables before deployment:
#   export GITEA_ADMIN_TOKEN="your-personal-access-token"
#   export GITEA_ADMIN_USERNAME="gitea_admin"

apiVersion: v1
kind: Secret
metadata:
  name: argocd-gitea-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
  annotations:
    description: "Gitea credentials for ArgoCD repository access"
    # Note: Actual token injected via environment variable, not committed to Git
type: Opaque
stringData:
  # Gitea username - injected via environment variable
  # Deploy: kubectl apply -f this-file.yaml --env GITEA_ADMIN_USERNAME=gitea_admin
  username: "${GITEA_ADMIN_USERNAME}"
  # Gitea Personal Access Token - injected via environment variable
  # Generate: Gitea → Settings → Applications → Generate New Token
  # Scopes: repository, user
  # Deploy: kubectl apply -f this-file.yaml --env GITEA_ADMIN_TOKEN=your-token
  password: "${GITEA_ADMIN_TOKEN}"
  # Gitea repository URL template
  url: https://gitea.sisys.local/sisys
  # Configure insecure to trust self-signed certificates (development only)
  # Production: Use official TLS certificate
  insecure: "true"
---
