---
# ArgoCD Gitea 仓库凭据配置
# 用于 ArgoCD 连接 Gitea 代码仓库
# Story 0.7: Task 4 - Gitea 仓库集成
# 修复：CRITICAL-1 (密码字段为空) + CRITICAL-2 (TLS 证书验证失败)

apiVersion: v1
kind: Secret
metadata:
  name: argocd-gitea-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
  annotations:
    description: "Gitea 仓库凭据 - 用于 ArgoCD 访问 Gitea 代码仓库"
    # pragma: allowlist secret
type: Opaque
stringData:
  # Gitea 用户名（已在配置时替换为实际值）
  username: gitea_admin
  # Gitea Personal Access Token（已在配置时替换为实际值）
  # 获取方式：登录 Gitea → 用户设置 → Applications → Generate New Token
  # 权限：repository, user
  password: "1f182aca3d38b66f7e49c034d98fb15bf02434b7"  # pragma: allowlist secret
  # Gitea 仓库 URL 模板
  url: https://gitea.sisys.local/sisys
  # 修复 CRITICAL-2: 配置 insecure 以信任自签名证书
  insecure: "true"
