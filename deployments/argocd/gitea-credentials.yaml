---
# 部署指南:
#
# 方法 1: 使用 kubectl --env (推荐用于开发环境)
#   export GITEA_ADMIN_TOKEN="1f182aca3d38b66f7e49c034d98fb15bf02434b7"
#   export GITEA_ADMIN_USERNAME="gitea_admin"
#   kubectl apply -f gitea-credentials.yaml
#
# 方法 2: 使用 Kustomize (推荐用于生产环境)
#   kubectl apply -k deployments/argocd/
#
# 方法 3: 使用 Helm (如果通过 Helm 部署 ArgoCD)
#   helm upgrade argocd argo/argo-cd -f values.yaml --set gitea.token=YOUR_TOKEN
#
# 方法 4: 使用 External Secrets Operator (最佳实践)
#   kubectl apply -f external-secret.yaml
