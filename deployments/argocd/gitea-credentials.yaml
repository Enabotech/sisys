---
# ArgoCD Gitea 仓库凭据配置
# 用于 ArgoCD 连接 Gitea 代码仓库

apiVersion: v1
kind: Secret
metadata:
  name: argocd-gitea-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
  annotations:
    description: "Gitea 仓库凭据 - 用于 ArgoCD 访问 Gitea 代码仓库"
type: Opaque
stringData:
  # Gitea 用户名（将在配置时替换为实际值）
  username: admin
  # Gitea Personal Access Token（将在配置时替换为实际值）
  password: ""
  # Gitea 仓库 URL 模板
  url: https://gitea.sisys.local/sisys
