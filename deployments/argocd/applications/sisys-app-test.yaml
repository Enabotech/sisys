---
# ArgoCD Application - Test 环境
# 测试环境配置 - 自动同步 + 手动审批
#
# 同步策略：自动同步但需要审批
# 适用于：QA 团队进行测试验证

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-test
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-test
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: testing
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # ArgoCD Image Updater 注解
  annotations:
    # 镜像列表 - 格式：别名=镜像路径
    argocd-image-updater.argoproj.io/image-list: |
      app=harbor.sisys.local/sisys/app

    # 写回方法：使用 git 提交更新
    argocd-image-updater.argoproj.io/write-back-method: git
    # Git 仓库配置
    argocd-image-updater.argoproj.io/git-repo: https://gitea.sisys.local/sisys/sisys.git
    argocd-image-updater.argoproj.io/git-branch: HEAD

    # 自定义提交消息
    argocd-image-updater.argoproj.io/git-commit-message: |
      build: automatic update of {{ .AppName }}
      changes:
      {{ range .AppChanges -}}
      updates image {{ .Image }} tag '{{ .OldTag }}' -> '{{ .NewTag }}'
      {{ end }}
      [skip actions]

    # 更新策略
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build

    # 只匹配 test-开头的标签
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^test-.*

    # 强制使用 Digest (确保不可变性)
    # argocd-image-updater.argoproj.io/app.force-digest: "true"

    # 轮询间隔 (测试环境适中)
    argocd-image-updater.argoproj.io/app.check-interval: 10m

    # 审批注解
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default

  # 源代码配置 - Test 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/apps/sisys/test

    # ✅ Kustomize 配置（移除硬编码的 images，让 Image Updater 管理）
    kustomize: {}

  # 目标配置 - Test 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-test

  # 同步策略 - 自动同步但需要审批
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # 忽略差异 - Test 环境
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 测试环境
    - name: Environment
      value: testing
    - name: SyncPolicy
      value: Automatic with Approval
    - name: ImageTagPattern
      value: test-{version}
    - name: UpdateStrategy
      value: latest (by push time)
