---
# ArgoCD Application - Test 环境
# 测试环境配置 - 自动同步 + 手动审批
#
# 同步策略：自动同步但需要审批
# 适用于：QA 团队进行测试验证

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-test
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-test
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: testing
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ========== ArgoCD Image Updater 配置 ==========
    argocd-image-updater.argoproj.io/image-list: |
      app=harbor.sisys.local/sisys/app
    
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-repo: https://gitea.sisys.local/sisys/sisys.git
    argocd-image-updater.argoproj.io/git-branch: HEAD
    
    # 测试环境使用 latest 策略 (因为 test-* 不是标准 semver)
    argocd-image-updater.argoproj.io/app.update-strategy: latest
    
    # 只匹配 test-开头的标签
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^test-.*
    
    # 强制使用 Digest
    argocd-image-updater.argoproj.io/app.force-digest: "true"
    
    # 轮询间隔 (测试环境适中)
    argocd-image-updater.argoproj.io/app.check-interval: 2m
    
    # 审批注解
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default

  # 源代码配置 - Test 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/apps/sisys/test

    # Kustomize 配置
    kustomize:
      images:
        - name: harbor.sisys.local/sisys/app
          newTag: test-v0.0.0-initial
      commonLabels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: sisys
        app.kubernetes.io/environment: testing
      commonAnnotations:
        argocd.argoproj.io/tracking-id: sisys-app-test

  # 目标配置 - Test 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-test

  # 同步策略 - 自动同步但需要审批
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # 忽略差异 - Test 环境
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 测试环境
    - name: Environment
      value: testing
    - name: SyncPolicy
      value: Automatic with Approval
    - name: ImageTagPattern
      value: test-{version}
    - name: UpdateStrategy
      value: latest (by push time)