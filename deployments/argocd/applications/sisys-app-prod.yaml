---
# ArgoCD Application - Prod 环境
# 生产环境配置 - 手动同步 + 双人审批
#
# 同步策略：手动同步（不启用 automated）
# 适用于：生产环境部署，需要严格审批流程

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-prod
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # ArgoCD Image Updater 注解
  annotations:
    # 指定要监控的镜像列表（使用纯镜像路径，不带标签）
    argocd-image-updater.argoproj.io/image-list: |
      harbor.sisys.local/sisys/app
    # 写回方法：使用 git 提交更新
    argocd-image-updater.argoproj.io/write-back-method: git
    # Git 仓库配置
    argocd-image-updater.argoproj.io/git-repo: https://gitea.sisys.local/sisys/sisys.git
    # 更新策略：semver 表示使用语义化版本
    argocd-image-updater.argoproj.io/harbor.sisys.local-sisys-app.update-strategy: semver
    # 只允许稳定版本标签（排除 rc、beta 等）
    argocd-image-updater.argoproj.io/harbor.sisys.local-sisys-app.allow-tags: regexp:^v?[0-9]+\.[0-9]+\.[0-9]+$
    # 生产环境需要手动审批
    argocd-image-updater.argoproj.io/harbor.sisys.local-sisys-app.force-update: "false"
    # 审批要求
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default

  # 源代码配置 - Prod 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/apps/sisys/prod

    # Kustomize 配置
    kustomize:
      images:
        - harbor.sisys.local/sisys/app:v1.0.0
      commonLabels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: sisys
      commonAnnotations:
        argocd.argoproj.io/tracking-id: sisys-app-prod

  # 目标配置 - Prod 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-prod

  # 同步策略 - 手动同步（不启用 automated）
  syncPolicy:
    # 不启用 automated，需要手动触发同步
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ServerSideApply=true
      - Prune=false  # 生产环境禁用自动修剪
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # 忽略差异 - Prod 环境
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 生产环境
    - name: Environment
      value: production
    - name: SyncPolicy
      value: Manual (requires approval)
    - name: ImageTag
      value: v1.0.0
