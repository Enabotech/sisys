---
# ArgoCD Application - Dev 环境
# 开发环境配置 - 自动同步

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-dev
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: development
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # 源代码配置 - Dev 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/apps/sisys/dev

    # Kustomize 配置
    kustomize:
      images:
        - sisys/harbor.sisys.local/sisys/app:latest

  # 目标配置 - Dev 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-dev

  # 同步策略 - 完全自动
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # 忽略差异
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 开发环境
    - name: Environment
      value: development

---
# ArgoCD Application - Test 环境
# 测试环境配置 - 自动同步 + 手动审批

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-test
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-test
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: testing
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # 手动审批注解
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default

  # 源代码配置 - Test 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/apps/sisys/test

    # Kustomize 配置
    kustomize:
      images:
        - sisys/harbor.sisys.local/sisys/app:v1.0.0

  # 目标配置 - Test 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-test

  # 同步策略 - 自动同步但需要审批
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 测试环境
    - name: Environment
      value: testing

---
# ArgoCD Application - Prod 环境
# 生产环境配置 - 手动同步 + 双人审批

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-prod
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # 生产环境需要手动同步
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # 审批要求
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  project: default

  # 源代码配置 - Prod 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deployments/apps/sisys/prod

    # Kustomize 配置
    kustomize:
      images:
        - sisys/harbor.sisys.local/sisys/app:v1.0.0

  # 目标配置 - Prod 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-prod

  # 同步策略 - 手动同步（不启用 automated）
  syncPolicy:
    # 不启用 automated，需要手动触发同步
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ServerSideApply=true
      - Prune=false  # 生产环境禁用自动修剪
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 生产环境
    - name: Environment
      value: production
    - name: SyncPolicy
      value: Manual (requires approval)
