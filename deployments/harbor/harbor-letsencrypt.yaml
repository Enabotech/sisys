---
# Let's Encrypt 证书配置（生产环境）
# Story 0.6: Harbor 镜像仓库部署
# 用途：配置 cert-manager 自动申请 Let's Encrypt 证书

# =============================================================================
# 前置条件
# =============================================================================
#
# 1. 安装 cert-manager
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.3/cert-manager.yaml
#
# 2. 验证 cert-manager 安装
#    kubectl get pods -n cert-manager
#
# 3. 配置 DNS 提供商（如 Cloudflare、Route53 等）
#    或使用 HTTP-01 验证（需要外部可访问的 Ingress）
#
# =============================================================================

# cert-manager ClusterIssuer（Let's Encrypt Production）
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: cert-manager
spec:
  acme:
    # Let's Encrypt Production API
    server: https://acme-v02.api.letsencrypt.org/directory

    # 用于 ACME 账户的邮箱
    # pragma: allowlist secret
    email: admin@sisys.local

    # 私钥存储
    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    # HTTP-01 验证
    solvers:
    - http01:
        ingress:
          class: traefik
          podTemplate:
            spec:
              nodeSelector:
                kubernetes.io/os: linux

---
# Let's Encrypt Staging（测试环境）
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: cert-manager
spec:
  acme:
    # Let's Encrypt Staging API（速率限制更宽松）
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@sisys.local
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    - http01:
        ingress:
          class: traefik

---
# Harbor TLS 证书
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  # 证书有效期 90 天（Let's Encrypt 标准）
  duration: 2160h  # 90 天
  # 到期前 30 天续期
  renewBefore: 720h  # 30 天

  # 证书主题
  subject:
    organizations:
    - SISYS

  # 密钥配置
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
    rotationPolicy: Always

  # 证书用途
  usages:
  - server auth
  - client auth

  # DNS 名称
  dnsNames:
  - harbor.sisys.local

  # 使用 Let's Encrypt Production
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

  # 证书 Secret
  secretName: harbor-tls-secret

---
# 使用示例
# =============================================================================
#
# 1. 安装 cert-manager
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.3/cert-manager.yaml
#
# 2. 应用配置
#    kubectl apply -f harbor-letsencrypt.yaml
#
# 3. 验证证书申请
#    kubectl get certificate -n harbor
#    kubectl describe certificate harbor-tls -n harbor
#
# 4. 查看证书详情
#    kubectl get secret harbor-tls-secret -n harbor -o jsonpath='{.data}' | jq
#
# 5. 验证 HTTPS 访问
#    curl -v https://harbor.sisys.local
#
# 6. 检查证书有效期
#    echo | openssl s_client -connect harbor.sisys.local:443 -servername harbor.sisys.local 2>/dev/null | openssl x509 -noout -dates
#
# =============================================================================

# 故障排查
# =============================================================================
#
# 1. 证书申请失败
#    kubectl logs -n cert-manager -l app=cert-manager
#    kubectl get challenges -n harbor
#    kubectl get orders -n harbor
#
# 2. DNS 验证问题
#    # 确认 DNS 解析正确
#    dig harbor.sisys.local
#
#    # 验证 HTTP-01 挑战可达性
#    curl http://harbor.sisys.local/.well-known/acme-challenge/
#
# 3. 速率限制
#    # Let's Encrypt 限制：
#    # - 每周 50 个证书/注册域名
#    # - 每小时 5 个失败验证
#    # 使用 Staging 环境测试：https://letsencrypt.org/docs/staging-environment/
#
# =============================================================================
