---
# Kustomize 配置
# Story 0.6: Harbor 镜像仓库部署
# 用于组合所有 Kubernetes 资源

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 命名空间
namespace: harbor

# 资源列表
# =============================================================================
# 修复 CRITICAL-001: 使用 IngressRoute CRD 替代传统 Ingress
# =============================================================================
resources:
- namespace.yaml
- secrets.yaml
- networkpolicy.yaml
- middleware.yaml
- ingress-route.yaml  # 使用 IngressRoute CRD (Traefik 原生)
- password-policy-job.yaml  # 密码策略初始化 Job (MEDIUM-002 修复)
# - ingress.yaml      # 已废弃，使用 ingress-route.yaml 替代

# Helm Chart 配置（通过 HelmRelease 或 kustomize helm 插件）
# 注意：Helm Chart 部署建议使用 ArgoCD 或 Helm CLI
# values.yaml 中已禁用 Helm 管理的 Ingress (expose.ingress.enabled=false)

# 配置映射
configMapGenerator:
- name: harbor-config
  files:
  - config/harbor.yml

# 生成器选项
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    story: "0.6-harbor-image-registry"
    managed-by: "kustomize"

# 通用标签
commonLabels:
  app: harbor
  story: "0.6"
  component: "registry"

# 通用注解
commonAnnotations:
  description: "Harbor 镜像仓库部署配置"
