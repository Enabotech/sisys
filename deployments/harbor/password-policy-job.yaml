---
# Harbor 密码策略初始化 Job
# Story 0.6: Harbor 镜像仓库部署
#
# 修复 MEDIUM-002: 密码策略配置不会自动生效
# 问题描述：values.yaml 中的 passwordPolicy 配置不会自动应用到 Harbor
# 解决方案：使用 Kubernetes Job 在 Harbor 部署后自动调用 API 配置密码策略
#
# 使用方式:
#   kubectl apply -f password-policy-job.yaml
#
# 验证:
#   kubectl logs -n harbor job/harbor-password-policy-init

apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-password-policy-init
  namespace: harbor
  labels:
    app: harbor
    story: "0.6"
  annotations:
    story: "0.6-harbor-image-registry"
    description: "自动配置 Harbor 密码策略"
    managed-by: "kustomize"
spec:
  template:
    spec:
      containers:
      - name: password-policy-init
        image: curlimages/curl:8.5.0
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -euo pipefail

            echo "=========================================="
            echo "Harbor 密码策略初始化"
            echo "=========================================="
            echo ""

            # 定义 Harbor Core 服务地址
            HARBOR_CORE_URL="http://harbor-core.harbor.svc.cluster.local:8080"

            echo "⏳ 等待 Harbor Core 就绪..."
            for i in $(seq 1 60); do
              if curl -sf "${HARBOR_CORE_URL}/api/v2.0/ping" > /dev/null 2>&1; then
                echo "✅ Harbor Core 已就绪 (尝试 $i/60 次)"
                break
              fi
              if [[ $i -eq 60 ]]; then
                echo "❌ Harbor Core 未就绪，退出"
                exit 1
              fi
              echo "  等待中... ($i/60)"
              sleep 5
            done

            echo ""
            echo "🔐 获取管理员 Token..."

            # 从 Kubernetes Secret 获取管理员密码
            ADMIN_PASSWORD_FILE="/var/run/secrets/kubernetes.io/serviceaccount/harbor-admin-password"
            if [[ -f "$ADMIN_PASSWORD_FILE" ]]; then
              ADMIN_PASSWORD=$(cat "$ADMIN_PASSWORD_FILE")
            else
              # 尝试从环境变量获取
              if [[ -n "${HARBOR_ADMIN_PASSWORD:-}" ]]; then
                ADMIN_PASSWORD="${HARBOR_ADMIN_PASSWORD}"
              else
                echo "⚠️  无法获取管理员密码，跳过密码策略配置"
                echo "   请手动在 Harbor Web 界面配置密码策略"
                exit 0
              fi
            fi

            # 测试认证
            echo "🔑 测试管理员认证..."
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              -u "admin:${ADMIN_PASSWORD}" \
              "${HARBOR_CORE_URL}/api/v2.0/users/me" || echo "000")

            if [[ "$HTTP_CODE" != "200" ]]; then
              echo "⚠️  管理员认证失败 (HTTP $HTTP_CODE)"
              echo "   可能原因:"
              echo "   1. 管理员密码已修改"
              echo "   2. Harbor 使用外部认证 (LDAP/AD)"
              echo "   3. Secret 未正确挂载"
              echo "   跳过密码策略配置，请手动配置"
              exit 0
            fi
            echo "✅ 管理员认证通过"

            echo ""
            echo "📋 配置密码策略..."

            # Harbor v2.x 密码策略 API
            # 参考：https://github.com/goharbor/harbor/blob/main/src/server/v2.0/handler/config.go
            CONFIG_PAYLOAD='{
              "auth_mode": "db_auth",
              "self_registration": false,
              "password_policy": {
                "min_length": 12,
                "require_upper": true,
                "require_lower": true,
                "require_digit": true,
                "require_special": true,
                "password_history_count": 5,
                "password_expiration_days": 90
              }
            }'

            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
              -u "admin:${ADMIN_PASSWORD}" \
              -X PUT "${HARBOR_CORE_URL}/api/v2.0/configurations" \
              -H "Content-Type: application/json" \
              -d "$CONFIG_PAYLOAD" || echo "000")

            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ 密码策略配置成功"
              echo ""
              echo "📋 已配置的密码策略:"
              echo "   - 最小长度：12 位"
              echo "   - 必须包含：大写字母 + 小写字母 + 数字 + 特殊字符"
              echo "   - 密码历史：不得重复最近 5 次密码"
              echo "   - 密码过期：90 天"
            else
              echo "⚠️  密码策略配置失败 (HTTP $HTTP_CODE)"
              echo "   请手动在 Harbor Web 界面配置"
            fi

            echo ""
            echo "=========================================="
            echo "密码策略初始化完成"
            echo "=========================================="
        env:
        - name: HARBOR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-secret
              key: HARBOR_ADMIN_PASSWORD
              optional: true
        volumeMounts:
        - name: admin-password
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount/harbor-admin-password
          subPath: password
          readOnly: true
      volumes:
      - name: admin-password
        secret:
          secretName: harbor-secret
          items:
          - key: HARBOR_ADMIN_PASSWORD
            path: password
          optional: true
      # pragma: allowlist secret
      # 此 Secret 包含 Harbor 管理员密码，用于自动配置密码策略
      # 密码本身存储在 Kubernetes Secret 中，此处仅引用
      restartPolicy: Never
      serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600  # 1 小时后自动清理 Job
  activeDeadlineSeconds: 600     # 最多运行 10 分钟

---
