---
# Harbor 开发环境 Secrets 示例
# Story 0.6: Harbor 镜像仓库部署
# 用途：本地开发测试，严禁用于生产环境

apiVersion: v1
kind: Secret
metadata:
  name: harbor-secret
  namespace: harbor
  labels:
    app: harbor
  annotations:
    description: "开发环境 Secrets 示例"
type: Opaque
stringData:
  # Harbor 核心密钥
  # pragma: allowlist secret
  SECRET_KEY: "dev-secret-key-please-change-in-production"
  # pragma: allowlist secret
  HARBOR_ADMIN_PASSWORD: "Harbor12345!"  # 首次登录后修改

  # 数据库配置
  # pragma: allowlist secret
  POSTGRES_PASSWORD: "postgres123"
  POSTGRES_USERNAME: "postgres"
  POSTGRES_DATABASE: "registry"

  # Redis 配置
  # pragma: allowlist secret
  REDIS_PASSWORD: "redis123"

  # Registry 配置
  # pragma: allowlist secret
  REGISTRY_CREDENTIAL_SECRET: "registry-dev-secret"
