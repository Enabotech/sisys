# Harbor Trivy StatefulSet 恢复配置
# 基于 kubectl describe statefulset 输出重建
# 创建时间：2026-04-05

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-trivy
  namespace: harbor
  labels:
    app: harbor
    app.kubernetes.io/component: trivy
    app.kubernetes.io/instance: harbor
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: harbor
    app.kubernetes.io/version: 2.14.2
    chart: harbor
    component: trivy
    heritage: Helm
    release: harbor
  annotations:
    meta.helm.sh/release-name: harbor
    meta.helm.sh/release-namespace: harbor
spec:
  serviceName: harbor-trivy
  replicas: 1
  selector:
    matchLabels:
      app: harbor
      component: trivy
      release: harbor
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: harbor
        app.kubernetes.io/component: trivy
        app.kubernetes.io/instance: harbor
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: harbor
        app.kubernetes.io/part-of: harbor
        app.kubernetes.io/version: 2.14.2
        chart: harbor
        component: trivy
        heritage: Helm
        release: harbor
      annotations:
        checksum/secret: 43a68aaf73f915e1a439ffd372d1e902937844716ee36410cdf96cbb4ab6f7a3
    spec:
      containers:
        - name: trivy
          image: goharbor/trivy-adapter-photon:v2.14.2
          ports:
            - name: api-server
              containerPort: 8080
              protocol: TCP
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /probe/healthy
              port: api-server
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /probe/ready
              port: api-server
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: NO_PROXY
              value: "harbor-core,harbor-jobservice,harbor-database,harbor-registry,harbor-portal,harbor-trivy,harbor-exporter,127.0.0.1,localhost,.local,.internal"
            - name: SCANNER_LOG_LEVEL
              value: "info"
            - name: SCANNER_TRIVY_CACHE_DIR
              value: "/home/scanner/.cache/trivy"
            - name: SCANNER_TRIVY_REPORTS_DIR
              value: "/home/scanner/.cache/reports"
            - name: SCANNER_TRIVY_DEBUG_MODE
              value: "false"
            - name: SCANNER_TRIVY_VULN_TYPE
              value: "os,library"
            - name: SCANNER_TRIVY_TIMEOUT
              value: "5m0s"
            - name: SCANNER_TRIVY_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harbor-trivy
                  key: gitHubToken
            - name: SCANNER_TRIVY_SEVERITY
              value: "HIGH,CRITICAL"
            - name: SCANNER_TRIVY_IGNORE_UNFIXED
              value: "false"
            - name: SCANNER_TRIVY_SKIP_UPDATE
              value: "false"
            - name: SCANNER_TRIVY_SKIP_JAVA_DB_UPDATE
              value: "false"
            - name: SCANNER_TRIVY_DB_REPOSITORY
              value: "harbor.sisys.local/sisys/aquasecurity/trivy-db:2"
            - name: SCANNER_TRIVY_JAVA_DB_REPOSITORY
              value: "harbor.sisys.local/sisys/aquasecurity/trivy-java-db:1"
            - name: SCANNER_TRIVY_CHECKS_BUNDLE_REPOSITORY
              value: "harbor.sisys.local/sisys/aquasecurity/trivy-checks:2"
            - name: SCANNER_TRIVY_OFFLINE_SCAN
              value: "false"
            - name: SCANNER_TRIVY_SECURITY_CHECKS
              value: "vuln"
            - name: SCANNER_TRIVY_INSECURE
              value: "true"
            - name: SCANNER_API_SERVER_ADDR
              value: ":8080"
            - name: SCANNER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: harbor-trivy
                  key: redisURL
            - name: SCANNER_STORE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: harbor-trivy
                  key: redisURL
            - name: SCANNER_JOB_QUEUE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: harbor-trivy
                  key: redisURL
          volumeMounts:
            - name: data
              mountPath: /home/scanner/.cache
      volumes: []
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: harbor
          chart: harbor
          heritage: Helm
          release: harbor
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
