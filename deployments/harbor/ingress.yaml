---
# Harbor Ingress 配置
# Story 0.6: Harbor 镜像仓库部署
# 配置 Traefik Ingress + TLS
# 修复：同时支持 HTTP (web) 和 HTTPS (websecure) 入口点，移除不支持的注解

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ingress
  namespace: harbor
  annotations:
    # Traefik 配置 - 同时支持 HTTP 和 HTTPS 入口点
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

    # 代理配置（镜像推送需要大文件上传）
    traefik.ingress.kubernetes.io/router.priority: "100"

spec:
  ingressClassName: traefik
  rules:
  - host: harbor.sisys.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: harbor-core
            port:
              number: 80
  tls:
  - hosts:
    - harbor.sisys.local
    # pragma: allowlist secret
    secretName: harbor-tls-secret
