---
# Harbor Ingress 配置
# Story 0.6: Harbor 镜像仓库部署
# 配置 Traefik Ingress + TLS
#
# 修复历史：
# - 2026-03-16: 根路径路由到 harbor-portal，API 路由到 harbor-core
# - 2026-03-16 (问题 5): 调整路径顺序，更具体的路径在前，添加优先级注解
# - 2026-03-17 (问题 6): 添加 /c/login 和 /c/ 路径，修复 WSL 重启后 API 路由问题

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-ingress
  namespace: harbor
  labels:
    app: harbor
  annotations:
    # Traefik 配置 - 同时支持 HTTP 和 HTTPS 入口点
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

    # 路由优先级（数字越大优先级越高）
    traefik.ingress.kubernetes.io/router.priority: "100"

    # 路径优先级说明：
    # Traefik 按照路径 specificity 匹配，更具体的路径优先
    # 顺序：Exact > Prefix (更长) > Prefix (更短)
spec:
  ingressClassName: traefik
  rules:
  - host: harbor.sisys.local
    http:
      paths:
      # 1. 登录页面（精确匹配，最高优先级）
      - path: /c/login
        pathType: Exact
        backend:
          service:
            name: harbor-core
            port:
              number: 80
      # 2. Core 相关路径（高优先级）
      - path: /c/
        pathType: Prefix
        backend:
          service:
            name: harbor-core
            port:
              number: 80
      # 3. API 路径
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: harbor-core
            port:
              number: 80
      # 4. 服务发现路径
      - path: /service/
        pathType: Prefix
        backend:
          service:
            name: harbor-core
            port:
              number: 80
      # 5. Registry V2 API
      - path: /v2/
        pathType: Prefix
        backend:
          service:
            name: harbor-core
            port:
              number: 80
      # 6. 根路径和前端页面（最低优先级）
      - path: /
        pathType: Prefix
        backend:
          service:
            name: harbor-portal
            port:
              number: 80
  tls:
  - hosts:
    - harbor.sisys.local
    # pragma: allowlist secret
    secretName: harbor-tls-secret
