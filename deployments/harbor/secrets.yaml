---
# Harbor Kubernetes Secrets 配置
# Story 0.6: Harbor 镜像仓库部署
# 重要：此文件为模板，实际使用前需要生成真实密钥

# =============================================================================
# 使用说明
# =============================================================================
#
# 1. 生成密钥文件：
#    cp secrets.yaml secrets.yaml.actual
#
# 2. 编辑 secrets.yaml.actual，替换所有占位符为真实值
#
# 3. 生成随机密钥：
#    - SECRET_KEY: openssl rand -base64 32
#    - HARBOR_ADMIN_PASSWORD: openssl rand -base64 32
#    - POSTGRES_PASSWORD: openssl rand -base64 32
#    - REDIS_PASSWORD: openssl rand -base64 32
#
# 4. 应用密钥：
#    kubectl apply -f secrets.yaml.actual
#
# 5. 删除明文密钥文件：
#    shred -u secrets.yaml.actual
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: harbor-secret
  namespace: harbor
  labels:
    app: harbor
type: Opaque
stringData:
  # =============================================================================
  # Harbor 核心密钥
  # =============================================================================

  # 密钥密钥（用于加密 Harbor 内部敏感信息）
  # 生成：openssl rand -base64 32
  # pragma: allowlist secret
  SECRET_KEY: "PLACEHOLDER_SECRET_KEY_MIN_32_BYTES"

  # Harbor 管理员密码（首次登录后需修改）
  # 要求：12 位 + 大小写 + 数字 + 符号
  # 生成：openssl rand -base64 32
  # pragma: allowlist secret
  HARBOR_ADMIN_PASSWORD: "PLACEHOLDER_ADMIN_PASSWORD"

  # =============================================================================
  # 数据库配置
  # =============================================================================

  # PostgreSQL 密码
  # 生成：openssl rand -base64 32
  # pragma: allowlist secret
  POSTGRES_PASSWORD: "PLACEHOLDER_POSTGRES_PASSWORD"

  # PostgreSQL 用户名（通常不需要修改）
  POSTGRES_USERNAME: "postgres"

  # PostgreSQL 数据库名（通常不需要修改）
  POSTGRES_DATABASE: "registry"

  # =============================================================================
  # Redis 配置
  # =============================================================================

  # Redis 密码
  # 生成：openssl rand -base64 32
  # pragma: allowlist secret
  REDIS_PASSWORD: "PLACEHOLDER_REDIS_PASSWORD"

  # =============================================================================
  # Registry 配置
  # =============================================================================

  # Registry 认证密钥
  # 生成：openssl rand -base64 32
  # pragma: allowlist secret
  REGISTRY_CREDENTIAL_SECRET: "PLACEHOLDER_REGISTRY_SECRET"

  # =============================================================================
  # Cosign 镜像签名配置
  # =============================================================================
  # 注意：Notary 已弃用，使用 Cosign 进行镜像签名
  # Cosign 支持 keyless 签名（推荐）和密钥对签名
  # 参考文档：docs/deployment/HARBOR_COSIGN_SIGNING.md
  #
  # 如使用密钥对签名，生成方式：
  # cosign generate-key-pair
  # 然后存储私钥于安全位置（如 Vault、KMS）
  #

  # TLS 证书
  # 生成：openssl req -x509 -nodes -days 365 -newkey rsa:4096 \\
  #         -keyout tls.key -out tls.crt \\
  #         -subj "/CN=harbor.sisys.local" \\
  #         -addext "subjectAltName=DNS:harbor.sisys.local"
  # pragma: allowlist secret
  TLS_CRT: |
    # PLACEHOLDER_TLS_CERTIFICATE - 实际证书通过 openssl 生成

  # pragma: allowlist secret
  TLS_KEY: |
    # PLACEHOLDER_TLS_PRIVATE_KEY - 实际密钥通过 openssl 生成

---
# 开发环境示例密钥（仅用于本地测试，严禁用于生产！）
# =============================================================================
# 使用方式：
#   kubectl apply -f secrets-example.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: harbor-secret-example
  namespace: harbor
  labels:
    app: harbor
  annotations:
    description: "开发环境示例密钥 - 严禁用于生产！"
type: Opaque
stringData:
  # 警告：这些是示例密钥，仅用于开发测试
  # pragma: allowlist secret
  SECRET_KEY: "dev-secret-key-change-in-production"
  # pragma: allowlist secret
  HARBOR_ADMIN_PASSWORD: "Harbor12345!"  # 示例密码，请修改
  # pragma: allowlist secret
  POSTGRES_PASSWORD: "postgres123"
  # pragma: allowlist secret
  POSTGRES_USERNAME: "postgres"
  # pragma: allowlist secret
  POSTGRES_DATABASE: "registry"
  # pragma: allowlist secret
  REDIS_PASSWORD: "redis123"
  # pragma: allowlist secret
  REGISTRY_CREDENTIAL_SECRET: "registry-secret-change-in-production"
