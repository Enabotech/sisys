# Gitea Secrets 配置模板 - Story 0.5
# 描述：开发环境快速部署模板（包含示例值）
# 警告：此文件仅用于开发/测试环境，生产环境必须使用 secrets.yaml 并通过外部密钥管理注入
#
# 使用方法：
# 1. 复制此文件为 secrets-values.yaml
# 2. 修改密码和密钥为实际值
# 3. 应用配置：kubectl apply -f secrets-values.yaml
#
# 安全提示：
# - 不要将 secrets-values.yaml 提交到 git
# - 生产环境必须使用 secrets.yaml 模板并通过 CI/CD 注入
---
# Gitea 管理员账号 Secret（开发环境示例）
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin-secret
  namespace: gitea
type: Opaque
stringData:
  username: "gitea_admin"
  # 开发环境密码（必须修改）：Admin@123456
  # 生产环境必须使用：openssl rand -base64 24
  password: "Admin@123456"  # pragma: allowlist secret # 仅开发环境
  email: "admin@sisys.local"
---
# Gitea 应用密钥 Secret（开发环境示例）
apiVersion: v1
kind: Secret
metadata:
  name: gitea-app-secret
  namespace: gitea
type: Opaque
stringData:
  # 开发环境示例密钥（必须替换）
  SECRET_KEY: "dev-secret-key-change-in-production-openssl-rand-base64-32"  # pragma: allowlist secret
  INTERNAL_TOKEN: "dev-internal-token-change-in-production-openssl-rand-base64-32"  # pragma: allowlist secret
  JWT_SECRET: "dev-jwt-secret-change-in-production-openssl-rand-base64-32"  # pragma: allowlist secret
---
# PostgreSQL 数据库 Secret（开发环境示例）
apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgresql-secret
  namespace: gitea
type: Opaque
stringData:
  # 开发环境密码（必须修改）
  password: "Gitea@Db123456"  # pragma: allowlist secret # 仅开发环境
  admin-password: "Gitea@Admin123456"  # pragma: allowlist secret # 仅开发环境
  username: "gitea"
  postgres-password: "Postgres@123456"  # pragma: allowlist secret # 仅开发环境
