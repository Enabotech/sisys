# Gitea Helm Chart 配置 - 快速测试版
# 最小化配置，用于验证部署

image:
  repository: gitea/gitea
  tag: "1.25.4"
  pullPolicy: IfNotPresent

gitea:
  admin:
    existingSecret: ""
  config:
    APP_NAME: "SISYS Code Hosting"
    RUN_MODE: prod
    repository:
      ROOT: /data/git/repositories
    server:
      DOMAIN: gitea-test.sisys.local
      HTTP_PORT: 3000
      ROOT_URL: http://gitea-test.sisys.local/
    database:
      DB_TYPE: sqlite3  # 使用 SQLite 简化部署
    log:
      MODE: console
      LEVEL: info
    security:
      INSTALL_LOCK: true
      DISABLE_REGISTRATION: true
    actions:
      ENABLED: false

replicaCount: 1

resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

persistence:
  enabled: true
  storageClass: local-path
  size: 5Gi

service:
  http:
    port: 3000
    type: ClusterIP

# 禁用 PostgreSQL
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
