; ============================================================
; Gitea Actions Artifact 配置 (v1.25+)
; ============================================================
; 参考：gitea_v.1.25+_example.app.ini 第 2836-2875 行
; ============================================================

[actions]
; 启用 Actions 功能
ENABLED = true
; 使用 Gitea 自身作为 Actions 源
DEFAULT_ACTIONS_URL = self
; 日志保留天数
LOG_RETENTION_DAYS = 365
; 日志压缩类型 (none/zstd)
LOG_COMPRESSION = zstd
; Artifact 默认保留天数（可在 workflow 中覆盖）
ARTIFACT_RETENTION_DAYS = 90
; 僵尸任务超时时间
ZOMBIE_TASK_TIMEOUT = 10m
; 无限任务超时时间
ENDLESS_TASK_TIMEOUT = 3h
; 废弃作业超时时间
ABANDONED_JOB_TIMEOUT = 24h

[storage.actions]
; Artifact 存储类型 (local/minio/azureblob)
STORAGE_TYPE = local
; 存储路径（相对于 APP_DATA_PATH）
PATH = actions-artifacts
