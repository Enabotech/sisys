REPO_INDEXER_UPDATE_BUFFER_LEN = 100

[session]
PROVIDER = memory
PROVIDER_CONFIG =
COOKIE_NAME = _gitea_session
COOKIE_SECURE = true
GC_INTERVAL_TIME = 3600
SESSION_LIFE_TIME = 86400

[cache]
ENABLED = true
ADAPTER = memory
INTERVAL = 60
HOST =
ITEM_TTL = 16h

[queue]
TYPE = level
DATADIR = /data/gitea/queues
WRAP_IF_LOWER = level
HIGH_PRIORITY_BUFFER_SIZE = 0
MAX_ATTEMPTS = 0
TIMEOUT = 1m0s
WORKERS = 1
BLOCK_TIMEOUT = 1s
BOOST_TIMEOUT = 5m0s
BOOST_TIMEOUT_MULTIPLIER = 2

[webhook]
ALLOWED_HOST_LIST = external,loopback
SKIP_TLS_VERIFY = false
PAGING_NUM = 10
HISTORY_LENGTH = 10
TASK_NUMBER = 1
QUEUE_NUMBER = 1000
QUEUE_TIMEOUT = 4s
DELIVER_TIMEOUT = 5s

[log]
MODE = console, file
LEVEL = info
ROUTER = console
COLORIZE = true
ACCESS =
ACCESS_LOG_FORMAT = combined
ACCESS_LOG_TEMPLATE =
REQUEST_ID_LOG_TEMPLATE =
ROOT_PATH = /data/gitea/log
BUFFER_LEN = 10000
FILE_NAME = /data/gitea/log/gitea.log
FILE_MAX_SIZE_SHIFT = 8
FILE_DAILY_ROTATE = true
FILE_MAX_DAYS = 30
FILE_COMPRESS = gzip
FILE_COMPRESS_LEVEL = -1
FILE_PERMISSION = 0o640
ERROR_FILE_PATH = /data/gitea/log/error.log
ERROR_FILE_ACCESS_LOG_LEVEL = error
ERROR_FILE_PERMISSION = 0o640
STACKTRACE_LEVEL = critical
STACKTRACE_LOG_LEVEL =
STACKTRACE_FORMAT = plain
STACKTRACE_FILE_PATH = /data/gitea/log/crash.log
STACKTRACE_FILE_PERMISSION = 0o644

