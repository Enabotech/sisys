PROTOCOL = http
DOMAIN = gitea.sisys.local
HTTP_ADDR = 0.0.0.0
LANDING_PAGE = home
LFS_JWT_SECRET =
ENABLE_ACME = false
ACME_URL =
ACME_CA_ROOT =
USE_ACME_DIRECTORY = true
CERT_EMAIL = admin@sisys.local
LOCKED_TOKENS_PER_USER = 0
PASSWORD_COMPLEXITY = upper,lower,digit,special
PASSWORD_HASH_ALGO = argon2

[database]
DB_TYPE = postgres
HOST = gitea-postgresql:5432
NAME = gitea
USER = gitea
PASSWD =
SSL_MODE = disable
PATH = /data/gitea/gitea.db
LOG_SQL = false
SQLITE_TIMEOUT = 500
MAX_IDLE_CONNS = 2
MAX_OPEN_CONNS = 0
CONN_MAX_LIFETIME = 3h
ITERATE_BUFFER_SIZE = 1000
SHOW_SQL = false

[indexer]
ISSUE_INDEXER_PATH = /data/gitea/indexers/issues.bleve
ISSUE_INDEXER_TYPE = bleve
ISSUE_INDEXER_INCLUDE_INTERNAL_USERS = false
ISSUE_INDEXER_UPDATE_BUFFER_LEN = 100
REPO_INDEXER_ENABLED = false
