; APP 名称
APP_NAME = SISYS Code Hosting
RUN_USER = git
RUN_MODE = prod

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main
DEFAULT_PRIVATE = private
MAX_CREATION_LIMIT = -1
ENABLE_PUSH_CREATE_USER = false
ENABLE_PUSH_CREATE_ORG = false
DISABLED_REPO_UNITS =
DEFAULT_REPO_UNITS = repo,issues,wiki,pulls,releases

[repository.local]
LOCAL_COPY_PATH = tmp/local-repo

[repository.upload]
ENABLED = true
TEMP_PATH = /data/gitea/uploads
ALLOWED_TYPES =
FILE_MAX_SIZE = 50
MAX_FILES = 10

[ui]
THEMES = arc-green
DEFAULT_THEME = arc-green
ENABLE_REACTION = true
ENABLE_TIMETRACKING = true

[ui.meta]
AUTHOR = SISYS Team
DESCRIPTION = Enterprise Strategic Planning Management System Code Hosting
KEYWORDS = gitea,git,strategic-planning,devops

[server]
DOMAIN = gitea.sisys.local
HTTP_PORT = 3000
ROOT_URL = https://gitea.sisys.local/
APP_DATA_PATH = /data/gitea
DISABLE_SSH = false
START_SSH_SERVER = true
SSH_PORT = 2222
SSH_DOMAIN = gitea.sisys.local
SSH_ROOT_PATH = /data/git/.ssh
SSH_SERVER_Ciphers = aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
SSH_SERVER_MACs = hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
SSH_SERVER_KEY_EXCHANGES = curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512
SSH_HOST_KEY_ALGORITHMS = rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,ssh-ed25519
LFS_START_SERVER = true
LFS_JWT_SECRET =
OFFLINE_MODE = false
LOCAL_ROOT_URL = http://localhost:3000/
DISABLE_ROUTER_LOG = false
CERT_FILE =
KEY_FILE =
STATIC_ROOT_PATH = /usr/local/gitea/custom
STATIC_URL_PREFIX =
