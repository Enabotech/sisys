# Gitea Ingress 配置 - Story 0.5
# 描述：Traefik v3.x Ingress 配置，启用 TLS 1.3 + HSTS 安全头
# 依赖：middleware.yaml (gitea-secure-headers)

# Gitea Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: ingress
  annotations:
    # Traefik 配置
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # 引用 Traefik Middleware 添加安全头 (见 middleware.yaml)
    traefik.ingress.kubernetes.io/router.middlewares: gitea-secure-headers@gitea

spec:
  ingressClassName: traefik

  # TLS 配置（使用自签名证书）
  tls:
    - hosts:
        - gitea.sisys.local
      secretName: gitea-tls-secret

  # 路由规则
  rules:
    - host: gitea.sisys.local
      http:
        paths:
          # 主应用路径
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http
                port:
                  number: 3000

---
# TLS Secret 配置说明
#
# MVP 阶段（开发环境）：使用自签名证书
# 运行以下命令创建自签名证书：
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt \
#     -subj "/CN=gitea.sisys.local/O=SISYS"
#   kubectl create secret tls gitea-tls-secret --cert=tls.crt --key=tls.key -n gitea
