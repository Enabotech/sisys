# Gitea Ingress 配置 - Story 0.5
# 描述：Traefik v3.x Ingress 配置，启用 TLS 1.3
# 注意：Middleware gitea-secure-headers 已存在，不需要重新创建

# Gitea Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: ingress
  annotations:
    # Traefik 配置
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # 暂时禁用 Middleware（排查问题）
    # traefik.ingress.kubernetes.io/router.middlewares: gitea-secure-headers@gitea

spec:
  ingressClassName: traefik

  # TLS 配置（使用自签名证书）
  tls:
    - hosts:
        - gitea.sisys.local
      secretName: gitea-tls-secret

  # 路由规则
  rules:
    - host: gitea.sisys.local
      http:
        paths:
          # 主应用路径
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http
                port:
                  number: 3000

---
# 注意：cert-manager 未安装，使用手动创建的 TLS Secret
# 运行以下命令创建自签名证书：
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key -out tls.crt \
#   -subj "/CN=gitea.sisys.local/O=SISYS"
# kubectl create secret tls gitea-tls-secret --cert=tls.crt --key=tls.key -n gitea
