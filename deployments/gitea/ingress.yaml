# Gitea Ingress 配置 - Story 0.5
# 描述：Traefik v3.x Ingress 配置，启用 TLS 1.3
---
# Traefik Middleware - 安全头配置
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: gitea-secure-headers
  namespace: gitea
  labels:
    app: gitea
spec:
  headers:
    # HSTS 配置 (安全验收标准)
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    # SSL 重定向
    sslRedirect: true
    # 其他安全头
    customFrameOptionsValue: "DENY"
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
---
# Gitea Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: ingress
  annotations:
    # Traefik 配置
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # 引用 Traefik Middleware 添加安全头 (见 secure-headers Middleware)
    traefik.ingress.kubernetes.io/router.middlewares: gitea-secure-headers@kubernetescrd

    # TLS 配置
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  # TLS 配置
  tls:
    - hosts:
        - gitea.sisys.local
      secretName: gitea-tls-secret

  # 路由规则
  rules:
    - host: gitea.sisys.local
      http:
        paths:
          # 主应用路径
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http
                port:
                  number: 3000

          # SSH 路径 (可选，用于 Git over SSH)
          - path: /ssh
            pathType: Prefix
            backend:
              service:
                name: gitea-ssh
                port:
                  number: 2222

---
# Certificate 配置 (cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-tls
  namespace: gitea
  labels:
    app: gitea
spec:
  secretName: gitea-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - gitea.sisys.local
  duration: 2160h  # 90 天
  renewBefore: 360h  # 15 天前续期
