# Gitea Kubernetes Secrets 配置 - Story 0.5
# 描述：敏感信息存储于 Kubernetes Secret，无明文配置
# 安全验收标准：密钥存储于 Kubernetes Secret
#
# 使用说明：
# 1. 生产环境应使用外部密钥管理（如 HashiCorp Vault、AWS Secrets Manager）
# 2. 或使用 SealedSecrets 加密后提交到 git
# 3. 开发环境可使用此模板，但实际值应通过环境变量注入
#
# 生成安全随机字符串：
#   openssl rand -base64 32
#   openssl rand -hex 32
---
# Gitea 管理员账号 Secret
# 生产环境应通过 CI/CD 或外部密钥管理注入
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin-secret
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 管理员账号配置
  # 开发环境示例（生产环境必须替换）
  username: "gitea_admin"
  # 密码必须通过环境变量注入：kubectl create secret generic ... --from-literal=password=$GITEA_ADMIN_PASSWORD
  password: "${GITEA_ADMIN_PASSWORD}"  # 占位符，实际值通过 CI/CD 注入
  email: "admin@sisys.local"
---
# Gitea 应用密钥 Secret
# 这些密钥必须使用强随机字符串
apiVersion: v1
kind: Secret
metadata:
  name: gitea-app-secret
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Gitea 密钥（至少 32 字节随机字符串）
  # 生产环境生成命令：openssl rand -base64 32
  SECRET_KEY: "${GITEA_SECRET_KEY}"  # 占位符，实际值通过 CI/CD 注入
  INTERNAL_TOKEN: "${GITEA_INTERNAL_TOKEN}"  # 占位符，实际值通过 CI/CD 注入
  # OAuth2 JWT 密钥
  JWT_SECRET: "${GITEA_JWT_SECRET}"  # 占位符，实际值通过 CI/CD 注入
---
# PostgreSQL 数据库 Secret
# 密码必须符合复杂度要求（12 位 + 大小写 + 数字 + 特殊符号）
apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgresql-secret
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 数据库密码（符合复杂度要求）
  # 生产环境生成命令：openssl rand -base64 24 | base64
  password: "${GITEA_DB_PASSWORD}"  # 占位符，实际值通过 CI/CD 注入
  admin-password: "${GITEA_DB_ADMIN_PASSWORD}"  # 占位符，实际值通过 CI/CD 注入
  # 数据库用户名
  username: "gitea"
  postgres-password: "${POSTGRES_PASSWORD}"  # 占位符，实际值通过 CI/CD 注入
