# Gitea Kubernetes Secrets 配置 - Story 0.5
# 描述：敏感信息存储于 Kubernetes Secret，无明文配置
# 安全验收标准：密钥存储于 Kubernetes Secret
---
# Gitea 管理员账号 Secret
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin-secret
  namespace: gitea
  labels:
    app: gitea
type: Opaque
stringData:
  # 管理员账号配置
  username: "gitea_admin"
  password: "Admin@123456"  # pragma: allowlist secret # 符合复杂度要求：12 位 + 大小写 + 数字 + 符号
  email: "admin@sisys.local"
---
# Gitea 应用密钥 Secret
apiVersion: v1
kind: Secret
metadata:
  name: gitea-app-secret
  namespace: gitea
  labels:
    app: gitea
type: Opaque
stringData:
  # Gitea 密钥（至少 32 字节随机字符串）
  # 生产环境应使用：openssl rand -base64 32 生成
  SECRET_KEY: "change-me-in-production-openssl-rand-base64-32"  # pragma: allowlist secret
  INTERNAL_TOKEN: "change-me-in-production-openssl-rand-base64-32"  # pragma: allowlist secret
  # OAuth2 JWT 密钥
  JWT_SECRET: "change-me-in-production-openssl-rand-base64-32"  # pragma: allowlist secret
---
# PostgreSQL 数据库 Secret
apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgresql-secret
  namespace: gitea
  labels:
    app: gitea
type: Opaque
stringData:
  # 数据库密码（符合复杂度要求）
  password: "Gitea@Db123456"  # pragma: allowlist secret
  admin-password: "Gitea@Admin123456"  # pragma: allowlist secret
  # 数据库用户名
  username: "gitea"
  postgres-password: "Postgres@123456"  # pragma: allowlist secret
