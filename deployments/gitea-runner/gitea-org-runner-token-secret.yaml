# Gitea 组织级 Runner Token Secret
# Story: 0-8-gitea-runner-configuration
# 组织：sisys
# 创建日期：2026-03-20
#
# Token 生成位置：
# https://gitea.sisys.local/org/sisys/settings/actions/runners
#
# 使用说明：
# 1. 应用此 Secret 到 Kubernetes
#    kubectl apply -f gitea-org-runner-token-secret.yaml -n gitea-actions
# 2. 重启 Runner Pod 使配置生效
#    kubectl rollout restart statefulset gitea-org-runner -n gitea-actions

apiVersion: v1
kind: Secret
metadata:
  name: gitea-org-runner-token
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
    scope: organization
    org: sisys
type: Opaque
stringData:
  # 组织级 Runner 注册 Token
  # 生成位置：/org/sisys/settings/actions/runners
  token: "$GITEA_RUNNER_REGISTRATION_TOKEN"
