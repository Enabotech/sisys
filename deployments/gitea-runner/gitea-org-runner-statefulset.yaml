# ============================================================
# Gitea 组织级 Runner StatefulSet 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 组织：sisys
# 作用域：组织级别（org/sisys）
#
# 特性：
#   - 3 个并发 Runner（gitea-org-runner-00~02）
#   - 每个 Pod 使用独立 PVC（持久化注册信息）
#   - 组织级 Runner 自动可用于组织内所有仓库
#   - 标签：ubuntu-latest,docker,k8s
#   - **已修复**: 添加 Node.js 运行时支持（解决 "Cannot find: node in PATH" 错误）
#   - **已修复**: 添加 SSL 证书支持（解决 "x509: certificate signed by unknown authority" 错误）
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-org-runner
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
    scope: organization
    org: sisys
spec:
  # 3 个 Runner 支持 3 个并发 Job
  replicas: 3
  serviceName: gitea-org-runner
  selector:
    matchLabels:
      app: gitea-org-runner
  template:
    metadata:
      labels:
        app: gitea-org-runner
    spec:
      serviceAccountName: gitea-runner

      # 标准镜像不需要特权模式
      securityContext:
        runAsNonRoot: false

      # Init Container - 确保配置目录存在
      initContainers:
        # Init: 确保配置目录存在
        - name: init-config
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /etc/act-runner && ls -la /etc/act-runner/']
          volumeMounts:
            - name: runner-config
              mountPath: /etc/act-runner
              readOnly: true

      containers:
        - name: runner
          image: docker.io/gitea/act_runner:0.3.0
          imagePullPolicy: IfNotPresent

          # Runner 启动参数 - 使用自定义启动脚本
          command:
            - /bin/sh
            - -c
            - |
              echo "🔧 Installing Node.js from mirrors..."

              # 使用阿里云镜像源加速 apk 安装
              sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories

              # 安装 nodejs 和 npm
              if apk add --no-cache nodejs npm; then
                echo "✅ Node.js version: $(node --version)"
                echo "✅ npm version: $(npm --version)"
              else
                echo "⚠️ apk add failed, continuing anyway..."
              fi

              # 安装 Python 3.11 和 pip
              echo "🔧 Installing Python 3.11..."
              if apk add --no-cache python3 py3-pip; then
                echo "✅ Python version: $(python3 --version)"
                echo "✅ pip version: $(pip3 --version)"
                # 创建 python 符号链接（某些 actions 需要）
                ln -sf /usr/bin/python3 /usr/bin/python
              else
                echo "⚠️ Python install failed, continuing anyway..."
              fi

              echo "🚀 Starting act_runner..."
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml

          # 环境变量配置
          env:
            # Gitea 实例地址（使用内部 HTTP 服务绕过 TLS 问题）
            - name: GITEA_INSTANCE_URL
              value: "http://gitea-http.gitea.svc.cluster.local:3000"

            # Runner 名称（使用 Pod 名称后缀区分）
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Runner 标签（用于 Job 调度）
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest,docker,k8s,linux"

            # Token（从 Secret 注入 - 组织级 Token）
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-org-runner-token
                  key: token

            # SSL 证书配置 - 信任自签名证书
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: GIT_SSL_NO_VERIFY
              value: "false"

          # 卷挂载
          volumeMounts:
            # K3s containerd socket（关键！）
            - name: containerd-sock
              mountPath: /var/run/docker.sock
              readOnly: true

            # Runner 持久化配置目录
            - name: runner-data
              mountPath: /data

            # Runner 配置文件（ConfigMap 挂载到独立目录）
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true

            # SSL 证书挂载
            - name: ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true

          # 资源限制
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          # 健康检查
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 就绪检查
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      # 卷配置
      volumes:
        # K3s containerd socket
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket

        # Runner 配置文件（ConfigMap）
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644

        # SSL 证书卷
        - name: ca-certificates
          secret:
            secretName: ca-certificates  # pragma: allowlist secret
            defaultMode: 0644

  # volumeClaimTemplates - StatefulSet 核心特性
  # 每个 Pod 自动创建独立 PVC
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path  # K3s 默认 StorageClass

---
# ============================================================
# Runner 配置文件 ConfigMap（复用现有配置）
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
data:
  config.yaml: |
    # Runner 配置
    runner:
      # 注册文件路径（持久化在 PVC 中）
      file: /data/.runner
      # 工作目录
      workdir: /data/workdir
      # 临时目录
      tempdir: /data/tmp
      # 超时设置
      timeout: 10m

    # 日志配置
    log:
      level: info
      format: text
      output: stdout

    # 容器配置
    container:
      # 工作镜像
      image: docker.gitea.com/runner-images:ubuntu-latest
      # 网络模式
      network: host
      # 工作目录
      workdir: /workspace

    # 缓存配置
    cache:
      enabled: true
      dir: /data/cache
