# ============================================================
# Gitea 组织级 Runner StatefulSet 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 组织：sisys
# 作用域：组织级别（org/sisys）
#
# 特性：
#   - 3 个并发 Runner（gitea-org-runner-00~02）
#   - 每个 Pod 使用独立 PVC（持久化注册信息）
#   - 组织级 Runner 自动可用于组织内所有仓库
#   - 标签：ubuntu-latest,docker,k8s
#   - ✅ 已修复：使用 Docker Socket（/var/run/docker.sock）
#   - ✅ 已修复：添加 Docker CLI 运行时支持
#   - ✅ 已修复：添加 SSL 证书支持
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-org-runner
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
    scope: organization
    org: sisys
spec:
  # 3 个 Runner 支持 3 个并发 Job
  replicas: 3
  serviceName: gitea-org-runner
  selector:
    matchLabels:
      app: gitea-org-runner
  template:
    metadata:
      labels:
        app: gitea-org-runner
    spec:
      serviceAccountName: gitea-runner

      # 标准镜像不需要特权模式
      securityContext:
        runAsNonRoot: false

      # Init Container - 确保配置目录存在
      initContainers:
        # Init: 确保配置目录存在
        - name: init-config
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /etc/act-runner && ls -la /etc/act-runner/']
          volumeMounts:
            - name: runner-config
              mountPath: /etc/act-runner
              readOnly: true

      containers:
        - name: runner
          image: docker.io/gitea/act_runner:0.3.0
          imagePullPolicy: IfNotPresent

          # Runner 启动参数 - 使用自定义启动脚本
          # ✅ 修复：使用 Docker Socket（/var/run/docker.sock）
          # ✅ 修复：安装 Docker CLI 支持
          command:
            - /bin/sh
            - -c
            - |
              echo "🔧 Setting up Alpine repositories..."

              # 使用清华镜像源 (HTTP 避免 HTTPS 证书问题)
              # Alpine 3.23 太新，降级到稳定的 v3.21
              cat > /etc/apk/repositories << 'EOF'
              http://mirrors.tuna.tsinghua.edu.cn/alpine/v3.21/main
              http://mirrors.tuna.tsinghua.edu.cn/alpine/v3.21/community
              EOF

              # 更新仓库索引
              echo "📦 Updating package index..."
              apk update

              # 安装 Node.js (Alpine 3.21 使用 nodejs 包)
              echo "🔧 Installing Node.js..."
              if apk add --no-cache nodejs npm; then
                echo "✅ Node.js version: $(node --version)"
                echo "✅ npm version: $(npm --version)"
              else
                echo "⚠️ Node.js install failed, trying edge repository..."
                # 尝试从 edge 仓库安装
                echo "http://mirrors.tuna.tsinghua.edu.cn/alpine/edge/community" >> /etc/apk/repositories
                apk update
                apk add --no-cache nodejs npm || echo "⚠️ Still failed, workflows requiring node will fail"
              fi

              # 安装 Python 3 (使用 python3 包名)
              echo "🔧 Installing Python..."
              if apk add --no-cache python3 py3-pip py3-setuptools; then
                echo "✅ Python version: $(python3 --version)"
                # 创建 python 符号链接（某些 actions 需要）
                ln -sf /usr/bin/python3 /usr/bin/python
              else
                echo "⚠️ Python install failed, continuing anyway..."
              fi

              # 安装 git, curl 和 Docker CLI (关键！)
              echo "🔧 Installing git, curl and Docker CLI..."
              apk add --no-cache git curl ca-certificates

              # 安装 Docker CLI (用于与宿主机 Docker daemon 通信)
              # ✅ 关键修复：确保 Docker CLI 正确安装
              if apk add --no-cache docker-cli; then
                echo "✅ Docker CLI version: $(docker --version)"
                # 验证 Docker socket 连接
                echo "🔍 Testing Docker socket connection..."
                if docker info >/dev/null 2>&1; then
                  echo "✅ Docker socket connection successful"
                else
                  echo "⚠️ Docker socket connection failed, checking socket..."
                  ls -la /var/run/docker.sock || echo "Socket file not found"
                fi
              else
                echo "❌ Docker CLI install failed - CI workflows will fail!"
                exit 1
              fi

              # 检查注册文件是否存在，不存在则自动注册
              if [ ! -f /data/.runner ]; then
                echo "📝 No registration file found, registering runner..."
                /usr/local/bin/act_runner generate config \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || echo "⚠️ Config generation failed, using existing config"
                
                echo "🔑 Registering runner..."
                /usr/local/bin/act_runner register \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || {
                    echo "❌ Registration failed, exiting..."
                    exit 1
                  }
                echo "✅ Runner registered successfully"
              else
                echo "✅ Registration file found, starting runner..."
              fi

              echo "🚀 Starting act_runner..."
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml

          # 环境变量配置
          env:
            # Gitea 实例地址（使用 HTTPS 外部入口，upload-artifact 需要 TLS）
            - name: GITEA_INSTANCE_URL
              value: "https://gitea.sisys.local"

            # Runner 名称（使用 Pod 名称后缀区分）
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Runner 标签（用于 Job 调度）
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest,docker,k8s,linux"

            # Token（从 Secret 注入 - 组织级 Token）
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-org-runner-token
                  key: token

            # SSL 证书配置 - 信任自签名证书
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: GIT_SSL_NO_VERIFY
              value: "false"

          # 卷挂载
          volumeMounts:
            # ✅ Docker socket（关键！使用 Docker Shim）
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: false

            # ✅ Docker 配置 (Harbor 证书)
            - name: docker-config
              mountPath: /etc/docker
              readOnly: true

            # Runner 持久化配置目录
            - name: runner-data
              mountPath: /data

            # Runner 配置文件（ConfigMap 挂载到独立目录）
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true

            # SSL 证书挂载
            - name: ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true

          # 资源限制
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          # 健康检查
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 就绪检查
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      # 卷配置
      volumes:
        # ✅ Docker socket (使用 Docker Shim)
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

        # ✅ Docker 配置 (包含 Harbor 证书和认证)
        - name: docker-config
          hostPath:
            path: /etc/docker
            type: DirectoryOrCreate

        # Runner 配置文件（ConfigMap）
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644

        # SSL 证书卷
        - name: ca-certificates
          secret:
            secretName: ca-certificates
            defaultMode: 0644

  # volumeClaimTemplates - StatefulSet 核心特性
  # 每个 Pod 自动创建独立 PVC
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path  # K3s 默认 StorageClass
