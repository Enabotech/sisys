# ============================================================
# Gitea Advanced Act Runner - StatefulSet 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 命名空间：gitea-advacts
# 版本：v3.0 (基于成功配置优化)
# 日期：2026-04-02
#
# 核心改进：
#   - ✅ 移除 hostNetwork（安全改进）
#   - ✅ Pod 内 TCP 通信 (127.0.0.1:2375)
#   - ✅ Docker daemon.json 配置 insecure-registries
#   - ✅ PID 文件自动清理
#   - ✅ tail -f 保持容器运行
#   - ✅ 标签：ubuntu-latest,docker,k8s,linux,dind,advacts
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-runner-dind
  namespace: gitea-advacts
  labels:
    app: gitea-runner-dind
    story: "0-8"
    scope: organization
    org: sisys
    runner-type: dind
    env: advacts
spec:
  # 初始 1 个副本，验证后扩展到 2 个
  replicas: 1
  serviceName: gitea-runner-dind
  selector:
    matchLabels:
      app: gitea-runner-dind
  template:
    metadata:
      labels:
        app: gitea-runner-dind
    spec:
      # ✅ 移除 hostNetwork - 使用 Pod 内网络命名空间（安全改进）
      # Pod 内容器共享网络命名空间，localhost 可达

      serviceAccountName: gitea-runner-dind

      # Pod 级别安全上下文
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0

      containers:
        # Container 1: act_runner (Runner 管理容器)
        - name: runner
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3.0-dind-rootless
          imagePullPolicy: IfNotPresent

          # 容器级别安全上下文（非特权）
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          # Runner 启动命令
          command:
            - /bin/sh
            - -c
            - |
              echo "🚀 Starting act_runner..."
              echo "⏳ Waiting for Docker daemon..."
              until docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; do
                echo "  Docker not ready yet, waiting..."
                sleep 2
              done
              echo "✅ Docker daemon ready"

              if [ ! -f /data/.runner ]; then
                echo "📝 Registering runner..."
                /usr/local/bin/act_runner register \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || {
                    echo "❌ Registration failed, exiting..."
                    exit 1
                  }
                echo "✅ Runner registered successfully"
              else
                echo "✅ Registration file found, starting runner..."
              fi

              echo "🚀 Starting act_runner daemon..."
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml

          env:
            - name: GITEA_INSTANCE_URL
              value: "https://gitea.sisys.local"
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest,docker,k8s,linux,dind,advacts"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-org-runner-token
                  key: token
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"

          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: tmp
              mountPath: /tmp
            - name: ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true

          resources:
            requests:
              cpu: 1000m
              memory: 3Gi
            limits:
              cpu: 4000m
              memory: 8Gi

          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

        # Container 2: docker-dind (Docker Daemon)
        - name: docker-dind
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3.0-dind-rootless
          imagePullPolicy: IfNotPresent

          # 安全上下文（特权模式 - K3s/WSL2 兼容性）
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - NET_ADMIN
              drop:
                - SYS_MODULE
            seccompProfile:
              type: RuntimeDefault

          # Docker 启动命令
          command:
            - sh
            - -c
            - |
              echo "🚀 Starting Docker Daemon (localhost only)..."
              echo "📦 Network: Pod-internal (no hostNetwork)"
              echo "📦 Listen: tcp://127.0.0.1:2375 + unix:///var/run/docker.sock"

              mkdir -p /var/run

              # ✅ 清理旧的 PID 文件（系统重启后可能残留）
              rm -f /var/run/docker.pid 2>/dev/null || true
              rm -f /var/run/docker/*.pid 2>/dev/null || true

              # ✅ 创建 Docker daemon 配置
              mkdir -p /etc/docker
              cat > /etc/docker/daemon.json <<'EOF'
              {
                "insecure-registries": ["harbor.sisys.local"],
                "storage-driver": "overlay2",
                "log-level": "error"
              }
              EOF

              # 启动 dockerd
              dockerd \
                --log-level=error \
                --storage-driver=overlay2 \
                --host=unix:///var/run/docker.sock \
                --host=tcp://127.0.0.1:2375 \
                &

              # 等待 Docker 就绪
              echo "⏳ Waiting for Docker daemon..."
              for i in {1..30}; do
                if docker -H unix:///var/run/docker.sock info >/dev/null 2>&1; then
                  echo "✅ Docker daemon ready"
                  break
                fi
                sleep 1
              done

              # 显示 Docker 信息
              docker -H unix:///var/run/docker.sock info 2>&1 | head -20

              # ✅ 使用 tail -f 保持容器运行
              echo "📋 Keeping container alive..."
              tail -f /dev/null

          env:
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"

          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - docker -H unix:///var/run/docker.sock info >/dev/null 2>&1
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: var-run
          emptyDir: {}
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644
        - name: ca-certificates
          secret:
            secretName: ca-certificates
            defaultMode: 0644
        - name: tmp
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
        storageClassName: local-path
    - metadata:
        name: docker-graph
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path
