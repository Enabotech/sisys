# ============================================================
# Gitea Runner StatefulSet 配置 (解决重复注册问题)
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 问题修复：Runner 重复注册问题
#
# 关键变更：
#   - 使用 StatefulSet 替代 Deployment
#   - 每个 Pod 使用独立 PVC (gitea-runner-data-{0,1,2})
#   - Pod 名称固定 (gitea-runner-0, gitea-runner-1, gitea-runner-2)
#   - 注册信息持久化，重启后不丢失
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-runner
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
spec:
  # 3 个 Runner 支持 3 个并发 Job
  replicas: 3
  serviceName: gitea-runner
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      serviceAccountName: gitea-runner

      # 标准镜像不需要特权模式
      securityContext:
        runAsNonRoot: false

      # Init Container - 确保配置目录存在
      initContainers:
        - name: init-config
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /etc/act-runner && ls -la /etc/act-runner/']
          volumeMounts:
            - name: runner-config
              mountPath: /etc/act-runner
              readOnly: true

      containers:
        - name: runner
          image: docker.io/gitea/act_runner:0.3.0
          imagePullPolicy: IfNotPresent

          # Runner 启动参数
          # 关键：使用 --config 指定配置文件路径，确保 .runner 文件被正确读取
          # config.yaml 从 ConfigMap 挂载，.runner 文件持久化在 PVC 中
          args:
            - daemon
            - --config
            - /etc/act-runner/config.yaml

          # 环境变量配置
          env:
            # Gitea 实例地址 (使用内部 HTTP 服务绕过 TLS 问题)
            - name: GITEA_INSTANCE_URL
              value: "http://gitea-http.gitea.svc.cluster.local:3000"

            # Runner 名称 (使用 Pod 名称后缀区分)
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Runner 标签 (用于 Job 调度)
            # 支持多种标签格式，兼容不同的 runs-on 配置
            # act_runner 会自动添加 :host 后缀
            - name: GITEA_RUNNER_LABELS
              value: "docker,k8s,standard,ubuntu-latest,linux"

            # Token (从 Secret 注入)
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token

          # 卷挂载
          volumeMounts:
            # K3s containerd socket (关键！)
            - name: containerd-sock
              mountPath: /var/run/docker.sock
              readOnly: true

            # Runner 持久化配置目录 (解决重复注册问题)
            # act_runner 将 .runner 文件存储在 /data 目录 (PVC)
            - name: runner-data
              mountPath: /data

            # Runner 配置文件 (ConfigMap 挂载到独立目录)
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true

          # 资源限制
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          # 健康检查
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 就绪检查
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      # 卷配置
      volumes:
        # K3s containerd socket
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
        # Runner 配置文件 (ConfigMap)
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644

  # volumeClaimTemplates - StatefulSet 核心特性
  # 每个 Pod 自动创建独立 PVC
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path  # K3s 默认 StorageClass
