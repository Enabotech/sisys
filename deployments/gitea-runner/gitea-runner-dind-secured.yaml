# ============================================================
# Gitea Runner 双容器 Sidecar 部署配置（安全优化版）
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 组织：sisys
# 作用域：组织级别（org/sisys）
# 版本：v3.0 (安全优化版)
# 日期：2026-04-02
#
# 安全优化：
#   ✅ 节点隔离（专用 CI 节点）
#   ✅ NetworkPolicy（限制出站流量）
#   ✅ 不共享 docker.sock（容器间隔离）
#   ✅ runner/job/daemon 三层隔离
#   ✅ PSS Baseline 合规
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: gitea-actions
  labels:
    # ✅ PSS Baseline 级别
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.34
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner-dind
  namespace: gitea-actions
  labels:
    app: gitea-runner-dind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-runner-dind-role
  namespace: gitea-actions
rules:
  # 最小权限：仅允许访问 Pod 状态
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner-dind-binding
  namespace: gitea-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-runner-dind-role
subjects:
  - kind: ServiceAccount
    name: gitea-runner-dind
    namespace: gitea-actions
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-token
  namespace: gitea-actions
type: Opaque
stringData:
  token: "2qsfG21yaoJHUPG1E8JoikRiNJXhVrrbKKGzFMzJ"
---
apiVersion: v1
kind: Secret
metadata:
  name: ca-certificates
  namespace: gitea-actions
type: Opaque
stringData:
  ca-certificates.crt: |
    # 在此添加自签名证书（如需要）
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-actions
  labels:
    app: gitea-runner-dind
data:
  config.yaml: |
    runner:
      file: /data/.runner
      workdir: /data/workdir
      tempdir: /data/tmp
      timeout: 30m

    log:
      level: info
      format: text
      output: stdout

    container:
      image: harbor.sisys.local/sisys/dependency:l2-latest
      network: bridge
      workdir: /workspace
      options: |
        --privileged
        --tmpfs /tmp
        --tmpfs /var/tmp
        --dns 10.43.0.10
        --dns-search gitea-actions.svc.cluster.local
        -e GIT_SSL_NO_VERIFY=true
        -e NODE_TLS_REJECT_UNAUTHORIZED=0
      env:
        - DOCKER_HOST=unix:///var/run/docker.sock
        - DOCKER_TLS_CERTDIR=
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /workspace:/workspace
        - /tmp:/tmp

    cache:
      enabled: true
      dir: /data/cache
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-runner-dind
  namespace: gitea-actions
  labels:
    app: gitea-runner-dind
    story: "0-8"
    scope: organization
    org: sisys
    runner-type: dind
spec:
  replicas: 2  # 2 个并发 Runner
  serviceName: gitea-runner-dind
  selector:
    matchLabels:
      app: gitea-runner-dind
  template:
    metadata:
      labels:
        app: gitea-runner-dind
    spec:
      serviceAccountName: gitea-runner-dind
      
      # ✅ 安全优化 1: 节点隔离（专用 CI 节点）
      nodeSelector:
        role: ci-runner
      tolerations:
        - key: ci
          operator: Exists
          effect: NoSchedule
      
      # Pod 级别安全上下文
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      
      # Init Container - 准备目录
      initContainers:
        - name: init-docker-graph
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /var/lib/docker && chmod 777 /var/lib/docker']
          volumeMounts:
            - name: docker-graph
              mountPath: /var/lib/docker
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      
      containers:
        # Container 1: act_runner (Runner 管理容器)
        - name: runner
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3.0-dind-rootless
          imagePullPolicy: IfNotPresent
          
          # ✅ 安全优化 4: runner 容器保持非特权
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          
          command:
            - /bin/sh
            - -c
            - |
              echo "🚀 Starting act_runner..."
              
              # 等待 Docker Daemon 就绪（使用 TCP 连接）
              echo "⏳ Waiting for Docker daemon..."
              until docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; do
                echo "  Docker not ready yet, waiting..."
                sleep 2
              done
              echo "✅ Docker daemon ready"
              
              # 检查注册文件是否存在，不存在则自动注册
              if [ ! -f /data/.runner ]; then
                echo "📝 No registration file found, registering runner..."
                /usr/local/bin/act_runner register \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || {
                    echo "❌ Registration failed, exiting..."
                    exit 1
                  }
                echo "✅ Runner registered successfully"
              else
                echo "✅ Registration file found, starting runner..."
              fi
              
              echo "🚀 Starting act_runner daemon..."
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml
          
          env:
            - name: GITEA_INSTANCE_URL
              value: "https://gitea.sisys.local"
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest,docker,k8s,linux,dind"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
          
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: tmp
              mountPath: /tmp
            - name: ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
          
          resources:
            requests:
              cpu: 1000m
              memory: 3Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        
        # Container 2: docker-dind (Docker Daemon)
        - name: docker-dind
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3.0-dind-rootless
          imagePullPolicy: IfNotPresent

          # ⚠️ 特权模式（K3s/WSL2 环境必需）
          # ✅ PSS Baseline 允许 privileged，但不允许额外的 capabilities
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            # ✅ 移除额外的 capabilities（SYS_ADMIN 等违反 PSS baseline）
            # privileged 模式已经包含所有需要的权限
          
          command:
            - sh
            - -c
            - |
              echo "🚀 Starting Docker Daemon..."
              
              # 创建 /var/run 目录
              mkdir -p /var/run
              
              # ✅ 清理旧的 PID 文件（系统重启后可能残留）
              rm -f /var/run/docker.pid 2>/dev/null || true
              
              # ✅ 创建 Docker daemon 配置（添加 insecure-registry）
              mkdir -p /etc/docker
              cat > /etc/docker/daemon.json <<'EOF'
              {
                "insecure-registries": ["harbor.sisys.local"],
                "storage-driver": "overlay2",
                "log-level": "error"
              }
              EOF
              
              # 启动 dockerd（特权模式，监听 TCP 和 Unix Socket）
              echo "📦 Starting dockerd..."
              dockerd --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock &
              
              # 等待 Docker 就绪
              echo "⏳ Waiting for Docker daemon..."
              for i in {1..30}; do
                if docker -H unix:///var/run/docker.sock info >/dev/null 2>&1; then
                  echo "✅ Docker daemon ready"
                  break
                fi
                sleep 1
              done
              
              # 显示 Docker 信息
              docker -H unix:///var/run/docker.sock info 2>&1 | head -20
              
              # 保持容器运行
              echo "📋 Keeping container alive..."
              tail -f /dev/null
          
          env:
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: tmp
              mountPath: /tmp
          
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - docker -H unix:///var/run/docker.sock info >/dev/null 2>&1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      
      # 卷配置
      volumes:
        - name: var-run
          emptyDir: {}
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644
        - name: ca-certificates
          secret:
            secretName: ca-certificates
            defaultMode: 0644
        - name: tmp
          emptyDir: {}
  
  # PVC 模板
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: local-path
    
    - metadata:
        name: docker-graph
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path
---
# ✅ 安全优化 2: NetworkPolicy（限制出站流量）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-runner-default-deny
  namespace: gitea-actions
spec:
  podSelector:
    matchLabels:
      app: gitea-runner-dind
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # 不允许入站
  egress:
    # ✅ 允许 DNS 查询
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # ✅ 允许访问 Gitea（仅 Gitea HTTP 服务）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
          podSelector:
            matchLabels:
              app: gitea
      ports:
        - protocol: TCP
          port: 3000
    # ✅ 允许访问 Harbor（镜像拉取/推送）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # ✅ 允许访问 Docker Hub（仅 443）
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # ❌ 禁止访问 Kubernetes API（job 容器无法获取 K8s 权限）
    # 注意：runner 本身不需要访问 K8s API
