# Gitea Runner Token Secret
# Story: 0-8-gitea-runner-configuration
# Task: 1.2 - Store Token to Kubernetes Secret
# Updated: 2026-03-20

apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-token
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
type: Opaque
data:
  # Token 已配置（2026-03-20）
  # 安全提示：生产环境请使用外部密钥管理
  token: $GITEA_RUNNER_REGISTRATION_TOKEN
