# ============================================================
# Gitea Runner K8s Executor 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# Task: 4 - K8s Executor 配置
#
# 执行器模式：Kubernetes Native Executor
# 特点:
#   - 每个 Job 在独立 Pod 中执行（天然隔离）
#   - 支持并发执行多个 Job
#   - 任务完成后 Pod 自动清理
#   - 细粒度资源控制
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-k8s-config
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "4"
data:
  # ============================================================
  # K8s Executor 配置文件
  # ============================================================
  config.yaml: |
    # Runner 日志配置
    log:
      level: info
      format: text
      output: stdout

    # Runner 运行时配置
    runner:
      # Job 超时时间
      timeout: 30m
      # 工作目录
      workdir: /workspace
      # 临时目录
      tempdir: /tmp

    # K8s Executor 配置
    container:
      kubernetes:
        # Runner 所在的命名空间
        namespace: gitea-actions

        # 使用的 ServiceAccount
        service_account: gitea-runner

        # 镜像拉取 Secret (复用 Story 0.6 Harbor Robot Account)
        image_pull_secrets:
          - harbor-robot-account

        # Pod 模板配置
        pod_template: |
          apiVersion: v1
          kind: Pod
          spec:
            # 服务账户
            serviceAccountName: gitea-runner

            # 镜像拉取 Secret
            imagePullSecrets:
              - name: harbor-robot-account

            # 安全上下文
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              fsGroup: 1000

            # 容器定义
            containers:
              - name: job
                # 默认工作镜像
                image: harbor.sisys.local/sisys/dependency:l2-latest

                # 工作目录
                workingDir: /workspace

                # 资源限制
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: 2000m
                    memory: 4Gi

                # 安全上下文
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL

                # 环境变量
                env:
                  - name: WORKSPACE
                    value: /workspace
                  - name: RUNNER_TEMP
                    value: /tmp

                # 卷挂载
                volumeMounts:
                  - name: workspace
                    mountPath: /workspace
                  - name: tmp
                    mountPath: /tmp

            # 卷配置
            volumes:
              - name: workspace
                emptyDir: {}
              - name: tmp
                emptyDir: {}

            # 节点选择器
            nodeSelector: {}

            # 容忍度
            tolerations: []

            # 亲和性
            affinity: {}

            # 重启策略 (Job 完成后不重启)
            restartPolicy: Never

        # 并发配置
        concurrency:
          # 最大并发 Job 数
          max_jobs: 6
          # 每个 Runner 的并发数
          runner_capacity: 3

        # Job 清理配置
        cleanup:
          # Job 完成后自动清理 Pod
          auto_cleanup: true
          # Pod 保留时间 (TTL)
          ttl_seconds: 300  # 5 分钟
          # 清理失败重试次数
          cleanup_retries: 3

        # Job 超时配置
        timeout:
          # 默认超时时间
          default_timeout: 30m
          # 最大超时时间
          max_timeout: 2h

        # 日志收集配置
        logging:
          # 启用日志收集
          enabled: true
          # 日志级别
          level: info
          # 日志输出
          output: stdout
          # 日志保留时间
          retention_days: 7

---
# ============================================================
# K8s Executor 资源配额
# ============================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitea-runner-k8s-quota
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "4"
spec:
  hard:
    # 计算资源配额
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"

    # 存储配额
    persistentvolumeclaims: "20"
    requests.storage: "500Gi"

    # 对象数量配额
    pods: "50"
    services: "20"
    secrets: "30"
    configmaps: "30"

    # Job 相关配额
    jobs: "100"
    cronjobs: "10"

---
# ============================================================
# K8s Executor LimitRange
# ============================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: gitea-runner-k8s-limits
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "4"
spec:
  limits:
    # 容器限制
    - type: Container
      # 默认限制
      default:
        cpu: "2000m"
        memory: "4Gi"
      # 默认请求
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      # 最大限制
      max:
        cpu: "4000m"
        memory: "8Gi"
      # 最小限制
      min:
        cpu: "100m"
        memory: "128Mi"

    # Pod 限制
    - type: Pod
      max:
        cpu: "8000m"
        memory: "16Gi"
      min:
        cpu: "100m"
        memory: "128Mi"

    # PVC 限制
    - type: PersistentVolumeClaim
      max:
        storage: "100Gi"
      min:
        storage: "1Gi"

---
# ============================================================
# K8s Executor NetworkPolicy
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-runner-network-policy
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "4"
spec:
  # 应用于所有带 app=gitea-runner 标签的 Pod
  podSelector:
    matchLabels:
      app: gitea-runner

  # 策略类型
  policyTypes:
    - Ingress
    - Egress

  # 入站规则
  ingress:
    # 允许来自 Gitea 的通信
    - from:
        - namespaceSelector:
            matchLabels:
              name: gitea
      ports:
        - protocol: TCP
          port: 8080

    # 允许来自同一命名空间的通信
    - from:
        - podSelector: {}

  # 出站规则
  egress:
    # 允许访问 K8s API Server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

    # 允许访问 Harbor
    - to:
        - namespaceSelector:
            matchLabels:
              name: harbor
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

    # 允许访问 Gitea
    - to:
        - namespaceSelector:
            matchLabels:
              name: gitea
      ports:
        - protocol: TCP
          port: 3000

    # 允许 DNS 解析
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 允许访问同一命名空间
    - to:
        - podSelector: {}

---
# ============================================================
# K8s Executor Job 模板
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-runner-k8s-job-template
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "4"
  annotations:
    description: "K8s Executor Job 模板 (仅供参考，实际 Job 由 Runner 动态创建)"
spec:
  # 并行度
  parallelism: 1

  # 完成数
  completions: 1

  # 主动完成度
  activeDeadlineSeconds: 1800  # 30 分钟

  # 回退限制
  backoffLimit: 3

  # TTL 清理
  ttlSecondsAfterFinished: 300

  # Pod 模板
  template:
    metadata:
      labels:
        app: gitea-runner-job
    spec:
      # 服务账户
      serviceAccountName: gitea-runner

      # 镜像拉取 Secret
      imagePullSecrets:
        - name: harbor-robot-account

      # 安全上下文
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 1000

      # 容器
      containers:
        - name: job
          image: harbor.sisys.local/sisys/dependency:l2-latest
          imagePullPolicy: IfNotPresent

          # 工作目录
          workingDir: /workspace

          # 资源限制
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

          # 安全上下文
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # 环境变量
          env:
            - name: WORKSPACE
              value: /workspace
            - name: RUNNER_TEMP
              value: /tmp

          # 卷挂载
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp

      # 卷配置
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      # 重启策略
      restartPolicy: Never

---
# ============================================================
# K8s Executor 辅助脚本 ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-k8s-scripts
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "4"
data:
  # K8s Executor 初始化脚本
  init-k8s-executor.sh: |
    #!/bin/bash
    set -e

    echo "🔧 Initializing K8s Executor..."

    # 检查 K8s API 访问
    echo "📊 Testing K8s API access..."
    if ! kubectl auth can-i create pods -n gitea-actions &> /dev/null; then
      echo "❌ Cannot create pods in gitea-actions namespace"
      exit 1
    fi

    if ! kubectl auth can-i get pods -n gitea-actions &> /dev/null; then
      echo "❌ Cannot get pods in gitea-actions namespace"
      exit 1
    fi

    if ! kubectl auth can-i delete pods -n gitea-actions &> /dev/null; then
      echo "❌ Cannot delete pods in gitea-actions namespace"
      exit 1
    fi

    echo "✅ K8s API access verified"

    # 检查 ServiceAccount
    echo "📊 Checking ServiceAccount..."
    if ! kubectl get serviceaccount gitea-runner -n gitea-actions &> /dev/null; then
      echo "❌ ServiceAccount gitea-runner not found"
      exit 1
    fi
    echo "✅ ServiceAccount verified"

    # 检查 RBAC 权限
    echo "📊 Checking RBAC permissions..."
    kubectl get clusterrole gitea-runner -o yaml | grep -A 10 "rules:" || {
      echo "❌ ClusterRole gitea-runner not properly configured"
      exit 1
    }
    echo "✅ RBAC permissions verified"

    # 检查资源配额
    echo "📊 Checking ResourceQuota..."
    if kubectl get resourcequota gitea-runner-k8s-quota -n gitea-actions &> /dev/null; then
      echo "✅ ResourceQuota configured"
    else
      echo "⚠️ ResourceQuota not found (optional)"
    fi

    # 显示配置信息
    echo "📊 K8s Executor Configuration:"
    echo "  Namespace: gitea-actions"
    echo "  ServiceAccount: gitea-runner"
    echo "  Max Concurrent Jobs: 6"
    echo "  Job Timeout: 30m"
    echo "  Auto Cleanup: enabled"

    echo "✅ K8s Executor initialization complete"

  # K8s Job 监控脚本
  monitor-k8s-jobs.sh: |
    #!/bin/bash

    # 监控 K8s Job 执行状态

    NAMESPACE="gitea-actions"

    echo "📊 Monitoring K8s Jobs in namespace: $NAMESPACE"
    echo "================================================"

    # 显示运行中的 Job
    echo -e "\n🔄 Running Jobs:"
    kubectl get jobs -n "$NAMESPACE" --field-selector=status.active=1

    # 显示已完成的 Job
    echo -e "\n✅ Completed Jobs:"
    kubectl get jobs -n "$NAMESPACE" --field-selector=status.success=1

    # 显示失败的
    echo -e "\n❌ Failed Jobs:"
    kubectl get jobs -n "$NAMESPACE" --field-selector=status.failed=1

    # 显示相关 Pod
    echo -e "\n📦 Related Pods:"
    kubectl get pods -n "$NAMESPACE" -l app=gitea-runner-job

    # 资源使用情况
    echo -e "\n📊 Resource Usage:"
    kubectl top pods -n "$NAMESPACE" 2>/dev/null || echo "Metrics server not available"

    # 配额使用情况
    echo -e "\n📋 Quota Usage:"
    kubectl describe resourcequota gitea-runner-k8s-quota -n "$NAMESPACE"

  # K8s Job 清理脚本
  cleanup-k8s-jobs.sh: |
    #!/bin/bash
    set -e

    NAMESPACE="gitea-actions"
    MAX_AGE_HOURS=${1:-24}

    echo "🧹 Cleaning up K8s Jobs older than $MAX_AGE_HOURS hours..."

    # 清理已完成的 Job
    echo "  Removing completed jobs..."
    kubectl delete jobs -n "$NAMESPACE" --field-selector=status.success=1

    # 清理失败的 Job (超过保留时间)
    echo "  Removing failed jobs older than $MAX_AGE_HOURS hours..."
    kubectl get jobs -n "$NAMESPACE" --field-selector=status.failed=1 -o jsonpath='{.items[*].metadata.name}' | \
      xargs -r -n1 kubectl delete job -n "$NAMESPACE"

    # 清理孤儿 Pod
    echo "  Removing orphaned pods..."
    kubectl delete pods -n "$NAMESPACE" --field-selector=status.phase=Succeeded

    # 清理事件
    echo "  Removing old events..."
    kubectl delete events -n "$NAMESPACE" --field-selector=type=Normal

    echo "✅ Cleanup complete"
