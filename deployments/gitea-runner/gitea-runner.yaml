# ============================================================
# Gitea Runner 部署配置 (最终优化版)
# ============================================================
# Story: 0-8-gitea-runner-configuration
# Task: 2 - Gitea Runner 部署
#
# 镜像选择：docker.io/gitea/act_runner:0.3.0 (标准版)
# 选择理由:
#   - 兼容性最好 (⭐⭐⭐⭐⭐)
#   - 无需特权模式
#   - 无需 hostNetwork/hostPID/hostIPC
#   - 直接复用 K3s containerd
#
# 架构说明:
#   - Runner 通过 containerd socket 使用 K3s 的容器运行时
#   - 无需内置 Docker daemon (简化配置)
#   - 支持 Docker 和 K8s 两种 Executor 模式
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: gitea-actions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-runner
rules:
  # Pod 管理 (K8s Executor 必需)
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "create", "delete", "watch"]
  # 配置读取
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  # 事件监控
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-runner
subjects:
  - kind: ServiceAccount
    name: gitea-runner
    namespace: gitea-actions
---
# ConfigMap - Runner 配置（跳过 TLS 验证）
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-actions
  labels:
    app: gitea-runner
data:
  .runner: |
    {"name":"k8s-runner","token":"TOKEN_PLACEHOLDER","instance":"https://gitea.sisys.local","labels":["docker","k8s","standard"],"insecure":true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
spec:
  # 3 个 Runner 支持 3 个并发 Job
  replicas: 3
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      serviceAccountName: gitea-runner

      # 标准镜像不需要特权模式
      securityContext:
        runAsNonRoot: false

      containers:
        - name: runner
          image: docker.io/gitea/act_runner:0.3.0
          imagePullPolicy: IfNotPresent

          # Runner 启动参数
          args:
            - daemon

          # 环境变量配置
          env:
            # Gitea 实例地址 (使用内部 HTTP 服务绕过 TLS 问题)
            - name: GITEA_INSTANCE_URL
              value: "http://gitea-http.gitea.svc.cluster.local:3000"

            # Runner 名称
            - name: GITEA_RUNNER_NAME
              value: "k8s-runner"

            # Runner 标签 (用于 Job 调度)
            - name: GITEA_RUNNER_LABELS
              value: "docker,k8s,standard"

            # Token (从 Secret 注入)
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token

          # 卷挂载
          volumeMounts:
            # K3s containerd socket (关键！)
            - name: containerd-sock
              mountPath: /var/run/docker.sock
              readOnly: true

            # Runner 配置目录
            - name: runner-config
              mountPath: /root/.config/act_runner
              readOnly: true

          # 资源限制
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          # 健康检查
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      # 卷配置
      volumes:
        # K3s containerd socket
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
        # Runner 配置 (带 TLS 跳过设置)
        - name: runner-config
          configMap:
            name: gitea-runner-config

      # 节点调度
      nodeSelector: {}
      tolerations: []
      affinity: {}
---
# Service (用于监控)
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner
  namespace: gitea-actions
  labels:
    app: gitea-runner
spec:
  selector:
    app: gitea-runner
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
