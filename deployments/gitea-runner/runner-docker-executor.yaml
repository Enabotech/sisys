---
# ============================================================
# Docker Executor 资源限制配置
# ============================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: gitea-runner-limits
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
spec:
  limits:
    # 容器默认限制
    - type: Container
      default:
        cpu: "2000m"
        memory: "2Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
      max:
        cpu: "4000m"
        memory: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"

    # PVC 限制
    - type: PersistentVolumeClaim
      max:
        storage: "50Gi"
      min:
        storage: "1Gi"

---
# ============================================================
# Docker Executor ResourceQuota
# ============================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitea-runner-quota
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
spec:
  hard:
    # 资源总量限制
    requests.cpu: "12"
    requests.memory: "24Gi"
    limits.cpu: "24"
    limits.memory: "48Gi"

    # 对象数量限制
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"

    # 存储限制
    persistentvolumeclaims: "10"
    requests.storage: "200Gi"
