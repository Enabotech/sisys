# ============================================================
# Gitea Runner Docker Executor 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# Task: 3 - Docker Executor 配置
#
# 执行器模式：Docker in Docker (DIND)
# 镜像：gitea/act_runner:0.3.0 (标准版)
#
# 架构说明:
#   - 使用 K3s containerd socket (已挂载到 /var/run/docker.sock)
#   - 无需运行独立的 Docker daemon (简化配置)
#   - 支持 Docker 命令直接调用 K3s containerd
#   - 镜像缓存加速通过本地 Harbor 实现
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-docker-config
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "3"
data:
  # ============================================================
  # Runner 配置文件
  # ============================================================
  config.yaml: |
    # Runner 日志配置
    log:
      level: info
      format: text
      output: stdout

    # Runner 运行时配置
    runner:
      # Job 超时时间
      timeout: 10m
      # 工作目录
      workdir: /workspace
      # 临时目录
      tempdir: /tmp

    # 容器配置 (Docker Executor)
    container:
      # 工作镜像 (用于执行 Job)
      image: docker.gitea.com/runner-images:ubuntu-latest

      # 网络模式 (使用 host 模式以访问 K3s containerd)
      network: host

      # 工作目录
      workdir: /workspace

      # Docker 选项
      options: |
        --privileged
        --tmpfs /tmp
        --tmpfs /var/tmp

      # 环境变量
      env:
        - DOCKER_HOST=unix:///var/run/docker.sock
        - DOCKER_TLS_CERTDIR=

      # 卷挂载
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /workspace:/workspace
        - /tmp:/tmp

    # 镜像缓存配置 (加速构建)
    cache:
      # 启用镜像缓存
      enabled: true
      # 缓存目录
      dir: /var/cache/act_runner
      # 缓存清理策略
      cleanup:
        # 缓存最大大小
        max_size: 10Gi
        # 缓存保留时间
        max_age: 7d
        # 自动清理触发条件
        cleanup_threshold: 90%

    # 镜像拉取配置
    image_pull:
      # 拉取策略
      policy: IfNotPresent
      # 镜像加速 (使用本地 Harbor 作为镜像源)
      mirrors:
        - https://harbor.sisys.local
      # 预拉取镜像列表 (常用镜像)
      prefetch:
        - docker.gitea.com/runner-images:ubuntu-latest
        - docker.gitea.com/runner-images:node-latest
        - docker.gitea.com/runner-images:python-latest
        - docker.io/library/alpine:latest
        - docker.io/library/postgres:15
        - harbor.sisys.local/sisys/base:latest

    # Harbor 集成配置
    registry:
      # Harbor 配置
      harbor:
        url: https://harbor.sisys.local
        # 使用 imagePullSecrets 进行认证 (复用 Story 0.6 Robot Account)
        auth_secret: harbor-robot-account  # pragma: allowlist secret
        # 跳过 TLS 验证 (开发环境)
        insecure: false
        # 镜像推送配置
        push:
          # 推送超时
          timeout: 5m
          # 推送重试次数
          retries: 3

    # Docker BuildX 配置 (加速构建)
    buildx:
      # 启用 BuildKit
      enabled: true
      # BuildKit 配置
      config: |
        [worker.oci]
          max-parallelism = 4
          snapshotter = "overlayfs"
        [registry."harbor.sisys.local"]
          http = true
          insecure = true

---
# ============================================================
# Docker Executor 镜像缓存 ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-docker-cache
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "3"
data:
  # 镜像缓存策略配置
  cache-policy.yaml: |
    version: "1.0"

    # 缓存策略
    policies:
      # 基础镜像缓存 (永久保留)
      - pattern: "docker.gitea.com/runner-images:*"
        ttl: never
        priority: high

      # 语言运行时镜像 (保留 30 天)
      - pattern: "docker.io/library/node:*"
        ttl: 30d
        priority: medium

      - pattern: "docker.io/library/python:*"
        ttl: 30d
        priority: medium

      # 数据库镜像 (保留 14 天)
      - pattern: "docker.io/library/postgres:*"
        ttl: 14d
        priority: low

      # 应用镜像 (保留 7 天)
      - pattern: "harbor.sisys.local/sisys/*"
        ttl: 7d
        priority: low

---
# ============================================================
# Docker Executor 辅助脚本 ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-docker-scripts
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "3"
data:
  # Docker 环境初始化脚本
  init-docker.sh: |
    #!/bin/bash
    set -e

    echo "🔧 Initializing Docker environment..."

    # 检查 Docker socket 是否可用
    if [ ! -S /var/run/docker.sock ]; then
      echo "❌ Docker socket not found at /var/run/docker.sock"
      exit 1
    fi

    # 测试 Docker 连接
    echo "📊 Testing Docker connection..."
    docker info > /dev/null 2>&1
    if [ $? -ne 0 ]; then
      echo "❌ Cannot connect to Docker daemon"
      exit 1
    fi

    echo "✅ Docker connection successful"

    # 预拉取常用镜像
    echo "📦 Prefetching common images..."
    PREFETCH_IMAGES=(
      "docker.gitea.com/runner-images:ubuntu-latest"
      "docker.gitea.com/runner-images:node-latest"
      "docker.gitea.com/runner-images:python-latest"
      "docker.io/library/alpine:latest"
      "docker.io/library/postgres:15"
    )

    for image in "${PREFETCH_IMAGES[@]}"; do
      echo "  Pulling $image..."
      docker pull "$image" || echo "  ⚠️ Failed to pull $image (continuing)"
    done

    # 配置 Harbor 登录
    if [ -n "$HARBOR_USERNAME" ] && [ -n "$HARBOR_PASSWORD" ]; then
      echo "🔐 Logging in to Harbor..."
      echo "$HARBOR_PASSWORD" | docker login harbor.sisys.local -u "$HARBOR_USERNAME" --password-stdin
      if [ $? -eq 0 ]; then
        echo "✅ Harbor login successful"
      else
        echo "⚠️ Harbor login failed (will retry on demand)"
      fi
    else
      echo "ℹ️ Harbor credentials not provided (will use imagePullSecrets)"
    fi

    # 显示 Docker 信息
    echo "📊 Docker Information:"
    docker info --format '{{.ServerVersion}}' | sed 's/^/  Version: /'
    docker info --format '{{.Driver}}' | sed 's/^/  Driver: /'
    docker info --format '{{.NCPU}}' | sed 's/^/  CPUs: /'
    docker info --format '{{.MemTotal}}' | sed 's/^/  Memory: /'

    echo "✅ Docker environment initialization complete"

  # Docker 构建加速脚本
  build-accelerate.sh: |
    #!/bin/bash
    set -e

    # Docker BuildX 构建加速脚本
    # 使用 BuildKit 并行构建和镜像缓存

    BUILD_CONTEXT="${1:-.}"
    DOCKERFILE="${2:-Dockerfile}"
    IMAGE_TAG="${3:-app:latest}"

    echo "🚀 Building image with BuildKit acceleration..."

    # 启用 BuildKit
    export DOCKER_BUILDKIT=1

    # 构建参数
    BUILD_ARGS=(
      "--build-arg" "BUILDKIT_INLINE_CACHE=1"
      "--cache-from" "$IMAGE_TAG"
      "--progress" "plain"
    )

    # 执行构建
    docker buildx build \
      -f "$DOCKERFILE" \
      -t "$IMAGE_TAG" \
      "${BUILD_ARGS[@]}" \
      "$BUILD_CONTEXT"

    echo "✅ Build complete: $IMAGE_TAG"

  # Docker 清理脚本
  cleanup-docker.sh: |
    #!/bin/bash
    set -e

    echo "🧹 Cleaning up Docker resources..."

    # 清理悬空镜像
    echo "  Removing dangling images..."
    docker image prune -f

    # 清理停止的容器
    echo "  Removing stopped containers..."
    docker container prune -f

    # 清理构建缓存
    echo "  Removing build cache..."
    docker builder prune -f --keep-storage 5GB

    # 清理卷 (谨慎)
    # docker volume prune -f

    echo "✅ Docker cleanup complete"

---
# ============================================================
# Harbor 凭据 Secret (复用 Story 0.6 Robot Account)
# ============================================================
