# ============================================================
# Gitea Runner 配置文件
# ============================================================
# Story: 0-8-gitea-runner-configuration
#
# 说明：
#   - 此配置文件定义 Runner 的行为
#   - .runner 文件存储注册凭证
#   - 两者都需要持久化
#
# ✅ 已更新：与实际运行配置一致
#   - 使用预构建 CI 镜像 (harbor.sisys.local/sisys/runner-images:ubuntu-act-latest)
#   - 启用特权模式 (--privileged)
#   - 配置 tmpfs 临时目录
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
data:
  config.yaml: |
    # Runner 配置
    runner:
      # 注册文件路径（持久化在 PVC 中）
      file: /data/.runner
      # 工作目录
      workdir: /data/workdir
      # 临时目录
      tempdir: /data/tmp
      # 超时设置
      timeout: 10m

    # 日志配置
    log:
      level: info
      format: text
      output: stdout

    # 容器配置（Docker Executor 模式）
    # ✅ 使用预构建 CI 镜像，包含 Docker CLI 和完整工具链
    # ✅ 修复：使用 bridge 网络模式以支持 Kubernetes DNS 解析
    container:
      # 工作镜像（使用本地 Harbor 镜像，包含 Docker 和 Buildx）
      image: harbor.sisys.local/sisys/runner-images:ubuntu-act-latest

      # 网络模式 - ✅ 使用 bridge 模式支持 DNS 解析
      network: bridge

      # 工作目录
      workdir: /workspace

      # Docker 选项（关键！启用 Docker in Docker）
      # ✅ 特权模式：允许容器内运行 Docker 命令
      # ✅ 添加 DNS 配置以支持 Kubernetes 服务发现
      options: |
        --privileged
        --tmpfs /tmp
        --tmpfs /var/tmp
        --dns 10.43.0.10
        --dns-search gitea-actions.svc.cluster.local
        --dns-search svc.cluster.local
        --dns-search cluster.local

      # 环境变量
      env:
        - DOCKER_HOST=unix:///var/run/docker.sock
        - DOCKER_TLS_CERTDIR=

      # 卷挂载（关键！挂载 docker.sock 到 Job 容器）
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /workspace:/workspace
        - /tmp:/tmp

    # 缓存配置
    cache:
      enabled: true
      dir: /data/cache
