# ============================================================
# Gitea Runner 配置文件
# ============================================================
# Story: 0-8-gitea-runner-configuration
#
# 说明：
#   - 此配置文件定义 Runner 的行为
#   - .runner 文件存储注册凭证
#   - 两者都需要持久化
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
data:
  config.yaml: |
    # Runner 配置
    runner:
      # 注册文件路径（持久化在 PVC 中）
      file: /data/.runner
      # 工作目录
      workdir: /data/workdir
      # 临时目录
      tempdir: /data/tmp
      # 超时设置
      timeout: 10m

    # 日志配置
    log:
      level: info
      format: text
      output: stdout

    # 容器配置 - 禁用容器化执行，直接在 Runner 上运行
    container:
      # 禁用容器隔离，直接在 Runner 容器内执行步骤
      network: host
      
      # 工作目录
      workdir: /workspace
      
      # 环境变量
      env:
        - DOCKER_HOST=unix:///var/run/docker.sock
        - DOCKER_TLS_CERTDIR=
      
      # 卷挂载
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /workspace:/workspace
        - /tmp:/tmp

    # 缓存配置
    cache:
      enabled: true
      dir: /data/cache
