# ============================================================
# Gitea Runner DinD-Rootless StatefulSet 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 组织：sisys
# 作用域：组织级别（org/sisys）
# 版本：v2.2 (卷挂载修正版)
# 日期：2026-04-01
#
# 修正说明：
#   - /var/run/docker.sock 不能直接作为 emptyDir 挂载（dockerd 需要创建 socket 文件）
#   - 解决方案：挂载 /var/run 目录，让 dockerd 在其中创建 socket 文件
#   - 使用 TCP 主机连接作为备选方案
#
# 特性：
#   - DinD 模式（特权容器，用于 K3s 环境）
#   - 1 个初始副本（验证后扩展到 2 个）
#   - 每个 Pod 使用独立 PVC（持久化注册信息）
#   - 标签：ubuntu-latest,docker,k8s,linux,dind
# ============================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-runner-dind
  namespace: gitea-actions
  labels:
    app: gitea-runner-dind
    story: "0-8"
    scope: organization
    org: sisys
    runner-type: dind
spec:
  # 初始 1 个副本，验证后扩展到 2 个
  replicas: 1
  serviceName: gitea-runner-dind
  selector:
    matchLabels:
      app: gitea-runner-dind
  template:
    metadata:
      labels:
        app: gitea-runner-dind
    spec:
      # ✅ 使用 hostNetwork 绕过 RootlessKit 网络限制
      hostNetwork: true
      hostPID: false
      hostIPC: false
      
      serviceAccountName: gitea-runner-dind
      
      # Pod 级别安全上下文
      # ✅ 注意：docker-dind 容器需要 root 权限运行 dockerd
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      
      containers:
        # Container 1: act_runner (Runner 管理容器)
        - name: runner
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3.0-dind-rootless
          imagePullPolicy: IfNotPresent
          
          # 容器级别安全上下文
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          
          # Runner 启动命令（包含自动注册逻辑）
          command:
            - /bin/sh
            - -c
            - |
              echo "🚀 Starting act_runner..."
              
              # 等待 Docker Daemon 就绪（使用 TCP 连接）
              echo "⏳ Waiting for Docker daemon..."
              until docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1; do
                echo "  Docker not ready yet, waiting..."
                sleep 2
              done
              echo "✅ Docker daemon ready"
              
              # 检查注册文件是否存在，不存在则自动注册
              if [ ! -f /data/.runner ]; then
                echo "📝 No registration file found, registering runner..."
                /usr/local/bin/act_runner register \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || {
                    echo "❌ Registration failed, exiting..."
                    exit 1
                  }
                echo "✅ Runner registered successfully"
              else
                echo "✅ Registration file found, starting runner..."
              fi
              
              echo "🚀 Starting act_runner daemon..."
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml
          
          # 环境变量
          env:
            # Gitea 配置
            - name: GITEA_INSTANCE_URL
              value: "https://gitea.sisys.local"
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest,docker,k8s,linux,dind"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-org-runner-token
                  key: token
            
            # Docker 配置（TCP 连接）
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
          
          # 卷挂载
          volumeMounts:
            # ✅ 挂载 /var/run 目录（不是 socket 文件）
            - name: var-run
              mountPath: /var/run
            
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: tmp
              mountPath: /tmp
            - name: ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
          
          # 资源限制
          resources:
            requests:
              cpu: 1000m
              memory: 3Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          # 健康检查
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        
        # Container 2: docker-dind (Docker Daemon)
        - name: docker-dind
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3.0-dind-rootless
          imagePullPolicy: IfNotPresent
          
          # 安全上下文（特权模式）
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - NET_ADMIN
              drop:
                - SYS_MODULE
            seccompProfile:
              type: RuntimeDefault
          
          # Docker 启动命令
          command:
            - sh
            - -c
            - |
              echo "🚀 Starting Docker Daemon (TCP + Unix Socket)..."
              
              # 创建 /var/run 目录
              mkdir -p /var/run
              
              # ✅ 清理旧的 PID 文件（系统重启后可能残留）
              rm -f /var/run/docker.pid 2>/dev/null || true
              
              # 启动 dockerd（特权模式，监听 TCP 和 Unix Socket）
              echo "📦 Starting dockerd..."
              dockerd \
                --log-level=error \
                --storage-driver=overlay2 \
                --host=unix:///var/run/docker.sock \
                --host=tcp://0.0.0.0:2375 \
                &
              
              # 等待 Docker 就绪
              echo "⏳ Waiting for Docker daemon..."
              for i in {1..30}; do
                if docker -H unix:///var/run/docker.sock info >/dev/null 2>&1; then
                  echo "✅ Docker daemon ready"
                  break
                fi
                sleep 1
              done
              
              # 显示 Docker 信息
              docker -H unix:///var/run/docker.sock info 2>&1 | head -20
              
              # ✅ 使用 tail -f 保持容器运行（而非 wait）
              echo "📋 Keeping container alive..."
              tail -f /dev/null
          
          env:
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          
          volumeMounts:
            # ✅ 挂载 /var/run 目录（dockerd 在其中创建 socket 文件）
            - name: var-run
              mountPath: /var/run
            
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: tmp
              mountPath: /tmp
          
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          
          # Docker Daemon 健康检查
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - docker -H unix:///var/run/docker.sock info >/dev/null 2>&1
            # ✅ 增加初始延迟，给 dockerd 足够启动时间
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      
      # 卷配置
      volumes:
        # ✅ /var/run 目录 - dockerd 在其中创建 docker.sock 文件
        - name: var-run
          emptyDir: {}
        
        # Runner 配置
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644
        
        # SSL 证书
        - name: ca-certificates
          secret:
            secretName: ca-certificates
            defaultMode: 0644
        
        # 临时目录
        - name: tmp
          emptyDir: {}
  
  # PVC 模板
  volumeClaimTemplates:
    - metadata:
        name: runner-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: local-path
    
    # Docker Graph 存储
    - metadata:
        name: docker-graph
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: local-path
