# ============================================================
# Gitea Advanced Act Runner - RBAC 配置
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 命名空间：gitea-advacts
# 版本：v1.0 (借鉴成功配置)
# 日期：2026-04-02
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner-dind
  namespace: gitea-advacts
  labels:
    app: gitea-runner-dind
    runner-type: dind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-runner-dind-role
  namespace: gitea-advacts
rules:
  # 允许访问 Pod（用于动态调度）
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # 允许访问 ConfigMaps 和 Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner-dind-binding
  namespace: gitea-advacts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-runner-dind-role
subjects:
  - kind: ServiceAccount
    name: gitea-runner-dind
    namespace: gitea-advacts
