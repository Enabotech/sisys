        app: gitea-org-runner
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - "echo \"\U0001F527 Setting up Alpine repositories...\"\n\n# 使用清华镜像源 (HTTP
          避免 HTTPS 证书问题)\n# Alpine 3.23 太新，降级到稳定的 v3.21\ncat > /etc/apk/repositories
          << 'EOF'\nhttp://mirrors.tuna.tsinghua.edu.cn/alpine/v3.21/main\nhttp://mirrors.tuna.tsinghua.edu.cn/alpine/v3.21/community\nEOF\n\n#
          更新仓库索引\necho \"\U0001F4E6 Updating package index...\"\napk update\n\n# 安装
          Node.js (Alpine 3.21 使用 nodejs 包)\necho \"\U0001F527 Installing Node.js...\"\nif
          apk add --no-cache nodejs npm; then\n  echo \"✅ Node.js version: $(node
          --version)\"\n  echo \"✅ npm version: $(npm --version)\"\nelse\n  echo \"⚠️
          Node.js install failed, trying edge repository...\"\n  # 尝试从 edge 仓库安装\n
          \ echo \"http://mirrors.tuna.tsinghua.edu.cn/alpine/edge/community\" >>
          /etc/apk/repositories\n  apk update\n  apk add --no-cache nodejs npm ||
          echo \"⚠️ Still failed, workflows requiring node will fail\"\nfi\n\n# 安装
          Python 3 (使用 python3 包名)\necho \"\U0001F527 Installing Python...\"\nif apk
          add --no-cache python3 py3-pip py3-setuptools; then\n  echo \"✅ Python version:
          $(python3 --version)\"\n  # 创建 python 符号链接（某些 actions 需要）\n  ln -sf /usr/bin/python3
          /usr/bin/python\nelse\n  echo \"⚠️ Python install failed, continuing anyway...\"\nfi\n\n#
          安装 git 和 curl (actions 需要)\necho \"\U0001F527 Installing git and curl...\"\napk
          add --no-cache git curl ca-certificates\n\necho \"\U0001F680 Starting act_runner...\"\nexec
          /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml\n"
