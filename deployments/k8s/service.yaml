# Kubernetes Service 配置
# 提供服务发现和负载均衡

apiVersion: v1
kind: Service
metadata:
  name: sisys-app
  namespace: sisys-test
  labels:
    app: sisys-app
  annotations:
    description: "SISYS 应用服务配置 - 测试环境"
spec:
  # 服务类型 - LoadBalancer 用于外部访问
  type: LoadBalancer
  
  # 会话保持
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 小时
  
  # 选择器
  selector:
    app: sisys-app
  
  # 端口配置
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      # 指定节点端口 (可选)
      # nodePort: 30080
    
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8443
      # nodePort: 30443
    
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
  
  # 外部 IP (可选)
  # loadBalancerIP: 192.168.1.100
  
  # 外部流量策略
  externalTrafficPolicy: Local
  
  # 健康检查
  loadBalancerSourceRanges:
    - 0.0.0.0/0  # 允许所有来源，生产环境应限制

---
# 生产环境 Service 配置
apiVersion: v1
kind: Service
metadata:
  name: sisys-app
  namespace: sisys-prod
  labels:
    app: sisys-app
  annotations:
    description: "SISYS 应用服务配置 - 生产环境"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # AWS NLB
spec:
  type: LoadBalancer
  
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  
  selector:
    app: sisys-app
  
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
    
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8443
    
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
  
  # 生产环境配置
  externalTrafficPolicy: Local
  
  # 限制访问来源
  loadBalancerSourceRanges:
    - 10.0.0.0/8  # 内网访问
    - 172.16.0.0/12
  
  # 健康检查配置
  loadBalancerHealthCheck:
    protocol: HTTP
    port: 8000
    path: /health/live
    intervalSeconds: 30
    timeoutSeconds: 5
    healthyThreshold: 2
    unhealthyThreshold: 3

---
# Headless Service (用于 StatefulSet 或直接 Pod 访问)
apiVersion: v1
kind: Service
metadata:
  name: sisys-app-headless
  namespace: sisys-test
  labels:
    app: sisys-app
  annotations:
    description: "SISYS 无头服务 - 用于 GPU 任务直接调度"
spec:
  clusterIP: None  # 无头服务
  selector:
    app: sisys-app
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
# Metrics Service (用于 Prometheus 监控)
apiVersion: v1
kind: Service
metadata:
  name: sisys-app-metrics
  namespace: sisys-test
  labels:
    app: sisys-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: sisys-app
  ports:
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
