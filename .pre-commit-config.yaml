# Pre-commit Configuration
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Usage:
#   1. Install pre-commit: pip install pre-commit
#   2. Install hooks: pre-commit install
#   3. Run manually: pre-commit run --all-files
#
# This configuration runs fast checks on staged files only.
# Full test suite runs in CI/CD pipeline.

repos:
  # =========================================
  # Built-in hooks
  # =========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # =========================================
  # Ruff - Fast Python linting
  # =========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # =========================================
  # MyPy - Type checking (optional, can be slow)
  # =========================================
  # - repo: https://github.com/pre-commit/mirrors-mypy
  - repo: local
    # rev: v1.7.1
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        require_serial: true
        # Only check staged files
        args: [--ignore-missing-imports, --warn-return-any, --warn-unused-configs]
        # Optional: uncomment to skip in certain conditions
        # stages: [manual]

  # =========================================
  # Security - Bandit (security linting)
  # =========================================
  # - repo: https://github.com/PyCQA/bandit
  - repo: local
    # rev: 1.7.5
    hooks:
      - id: bandit
        name: bandit
        entry: poetry run bandit
        language: system
        types: [python]
        args: ["--skip", "B101,B404,B603,B607"]

  # =========================================
  # Secret Detection - Detect secrets
  # =========================================
  # - repo: https://github.com/Yelp/detect-secrets
  - repo: local
    # rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: poetry run detect-secrets-hook
        language: system
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # =========================================
  # SDD 工具链验证（Story 0.1 验收标准）
  # =========================================
  - repo: local
    hooks:
      - id: validate-schemas
        name: Validate Domain Event Schemas
        entry: poetry run python scripts/tools/validate_schemas.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]
        # 验证领域事件 Schema 符合 Pydantic 模型

      - id: validate-openapi
        name: Validate OpenAPI Specification
        entry: poetry run openapi-spec-validator openapi/openapi.yaml
        language: system
        pass_filenames: false
        stages: [push]
        # 验证 OpenAPI 3.1 规范符合性

      - id: pytest-bdd
        name: Run BDD Acceptance Tests
        entry: poetry run pytest tests/features/ --bdd-verbose
        language: system
        pass_filenames: false
        stages: [push]
        # 运行 Gherkin 验收测试

# =========================================
# CI-specific configuration
# =========================================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
