# Pre-commit Configuration
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# 📜 项目宪法：代码提交强制检查流程
# ================================================================
# 每次 git commit 必须自动执行以下循环：
#   1. 检查 (Check) → 运行所有 hooks 检查代码问题
#   2. 修改 (Fix) → 自动修复可修复的问题（格式化、导入排序等）
#   3. 通过 (Pass) → 所有检查通过后才能提交
#
# 安装步骤:
#   1. 安装 pre-commit: pip install pre-commit
#   2. 安装 hooks: pre-commit install
#   3. 验证安装：pre-commit run --all-files
#
# 工作流程:
#   - 本地提交时自动运行（仅检查暂存文件）
#   - CI/CD 推送时完整运行（检查所有文件）
#   - 任何检查失败都会阻止提交
#
# 宪法原则:
#   - 不允许绕过 hooks（除非紧急情况使用 --no-verify）
#   - 自动修复优先（能自动修复的问题不阻塞提交）
#   - 快速反馈（失败时立即显示详细错误信息）
#
# ⚡ 性能优化:
#   - 使用本地工具链（poetry 已安装的包）避免重复安装
#   - 仅检查暂存文件（staged files only）
#   - 并行执行 hooks

repos:
  # =========================================
  # Built-in hooks (轻量级基础检查)
  # =========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      # - id: detect-private-key
      - id: check-case-conflict

  # =========================================
  # Ruff - Fast Python linting (使用本地安装)
  # =========================================
  - repo: local
    hooks:
      - id: ruff
        name: "Ruff 代码检查与自动修复"
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        verbose: true
        # 自动修复：导入排序、代码风格、常见错误

      - id: ruff-format
        name: "Ruff 代码格式化"
        entry: poetry run ruff format
        language: system
        types: [python]
        verbose: true
        # 强制格式化：统一代码风格

  # =========================================
  # MyPy - Type checking (使用本地安装)
  #
  # 配置策略（业界最佳实践）：
  #   - pyproject.toml [tool.mypy] 是唯一真相来源（严格度、exclude、overrides）
  #   - pre-commit 不重复携带业务参数，只附加：
  #     --pretty: 终端可读输出
  #     --show-error-codes: 方便 IDE 跳转
  #   - 第三方库豁免用 [[tool.mypy.overrides]] 精准控制，不用全局 --ignore-missing-imports
  # =========================================
  - repo: local
    hooks:
      - id: mypy
        name: "MyPy 类型检查"
        entry: poetry run mypy
        language: system
        types: [python]
        verbose: true
        require_serial: true
        args: [--pretty, --show-error-codes]

  # =========================================
  # Security - Bandit (使用本地安装)
  # =========================================
  - repo: local
    hooks:
      - id: bandit
        name: "Bandit 安全漏洞扫描"
        entry: poetry run bandit
        language: system
        types: [python]
        verbose: true
        args: ["--skip", "B101,B105,B106,B107,B110,B113,B404,B501,B602,B603,B607"]
        # 强制安全扫描：检测常见安全漏洞
        # 跳过：B101(断言), B105/B106/B107(硬编码密码), B110(try-except-pass), B113(请求无超时), B404(subprocess), B501(SSL 验证), B602(shell=True), B603(subprocess 无 shell), B607(部分 shell 使用)
        exclude: "^tests/"

  # =========================================
  # Secret Detection - 密钥检测 (使用本地安装)
  # =========================================
  - repo: local
    hooks:
      - id: detect-secrets
        name: "检测密钥泄露"
        entry: poetry run detect-secrets-hook
        language: system
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json
        verbose: true
        # 强制检测：防止密钥、密码、Token 等敏感信息提交

  # =========================================
  # SDD 工具链验证（Story 0.1 验收标准 - 强制）
  # =========================================
  - repo: local
    hooks:
      - id: validate-schemas
        name: "验证领域事件 Schema"
        entry: poetry run python scripts/tools/validate_schemas.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [push]
        verbose: true
        # 强制验证：领域事件 Schema 符合 Pydantic 模型

      - id: validate-openapi
        name: "验证 OpenAPI 规范"
        entry: poetry run openapi-spec-validator openapi/openapi.yaml
        language: system
        pass_filenames: false
        stages: [push]
        verbose: true
        # 强制验证：OpenAPI 3.1 规范符合性

      - id: pytest-bdd
        name: "运行 BDD 验收测试"
        entry: poetry run pytest tests/features/ --bdd-verbose
        language: system
        pass_filenames: false
        stages: [push]
        verbose: true
        # 强制验证：Gherkin 验收测试通过

# =========================================
# CI-specific configuration
# =========================================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
