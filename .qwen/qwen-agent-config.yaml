# =============================================================================
# Qwen Code Agent 配置 - sisys 企业战略规划管理系统
# =============================================================================
# 版本：2.0.0 (宗师级优化版)
# 基于文档：
#   - MVP 实施计划 v1.0.0 (mvp-implementation-plan.md)
#   - 架构设计文档 v8.3.0 (architecture.md)
#   - 产品需求文档 v1.0.0 (prd.md)
# 
# 开发范式：AI 原生开发（1 人 + 4~8 个 Qwen Code Agent 并行）
# MVP 周期：12 周（2026-03-01 ~ 2026-05-23）
# =============================================================================

# -----------------------------------------------------------------------------
# 全局配置
# -----------------------------------------------------------------------------
global:
  # 输出语言：中文（技术术语保留英文）
  communication_language: "Chinese"
  
  # 项目根目录
  project_root: "."
  
  # 模型配置
  model:
    default: "qwen3.5-plus"       # 默认模型
    temperature: 0.2              # 低温度确保代码准确性
    top_p: 0.9
    max_tokens: 4096
    max_context_tokens: 256000    # 最大上下文长度
  
  # 上下文管理
  context:
    compression_enabled: true     # 启用上下文压缩（架构公理二：外部化记忆）
    compression_ratio_target: 0.7 # 目标压缩率≥70%
    semantic_cache_enabled: true  # 启用语义缓存
    semantic_cache_threshold: 0.9 # 相似度>0.9 命中缓存
  
  # 输出规范
  output:
    code_comments: "Chinese"          # 代码注释语言
    commit_messages: "Chinese"        # 提交信息语言
    preserve_technical_terms: true    # 保留技术术语（不翻译）
    docstring_style: "google"         # Google 风格文档字符串

# -----------------------------------------------------------------------------
# Agent 角色配置（基于 MVP WBS 任务分解）
# -----------------------------------------------------------------------------
agents:
  # =========================================================================
  # 领域层 Agent 组（第 2 周任务）
  # =========================================================================
  domain_agent_lead:
    # 领域层首席 Agent - 负责核心实体和架构一致性
    role: "领域层首席架构师"
    description: "负责 DDD 领域建模、核心实体设计、六边形架构一致性，确保领域层零外部依赖"
    
    # 技能画像（基于 PRD 122 项 FR 和 39 项 NFR）
    skills:
      primary:
        - "DDD（领域驱动设计）"
        - "六边形架构"
        - "Python 3.11+"
        - "Pydantic v2"
      secondary:
        - "领域建模"
        - "领域事件"
        - "事件溯源"
        - "CQRS 模式"
    
    # 任务执行配置
    execution:
      max_concurrent_tasks: 2       # 最多 2 个并行任务
      output_review_required: true  # 需要审查（P0 级代码）
      auto_test_generation: true    # 自动生成单元测试
    
    # 文件偏好（基于 architecture.md 第 13 章目录结构）
    preferred_files:
      - "src/domain/models/*.py"
      - "src/domain/services/*.py"
      - "src/domain/repositories/*.py"
      - "src/domain/events/*.py"
    
    # MVP 任务映射（mvp-implementation-plan.md 第 3 章）
    mvp_tasks:
      - "W2-T1: 领域实体定义"
      - "W2-T2: 领域服务接口"
      - "W2-T3: 领域事件定义"
    
    # 架构约束（architecture.md 第 1.2 节系统公理）
    constraints:
      - "领域层零外部依赖（依赖倒置原则）"
      - "所有实体必须实现 Event Sourcing 接口"
      - "使用 Pydantic v2 进行数据验证"
      - "遵循系统公理一：自主调用（trigger→route→execute）"
      - "遵循系统公理二：外部化记忆（LLM 上下文=缓存，磁盘记忆=真相源）"

  domain_agent_support:
    # 领域层辅助 Agent - 负责值对象和辅助功能
    role: "领域层开发专家"
    description: "负责值对象、领域异常、辅助领域服务实现"
    
    skills:
      primary:
        - "值对象设计"
        - "领域异常处理"
        - "Python 类型注解"
      secondary:
        - "数据验证"
        - "业务规则实现"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/domain/models/value_objects.py"
      - "src/domain/exceptions/*.py"
    
    mvp_tasks:
      - "W2-T5: 领域层单元测试"

  # =========================================================================
  # 基础设施层 Agent 组（第 3 周任务）
  # =========================================================================
  infrastructure_agent_db:
    # 数据库专家 - 负责 PostgreSQL/Redis 存储层
    role: "数据库与存储专家"
    description: "负责 PostgreSQL 关系存储、Redis 缓存层、Alembic 迁移，确保五层存储架构 L1/L2 层实现"
    
    skills:
      primary:
        - "PostgreSQL 15+"
        - "SQLAlchemy 2.0"
        - "Alembic 迁移"
        - "Redis 7.0+"
      secondary:
        - "SQL 优化"
        - "索引设计"
        - "连接池管理"
        - "pgvector 向量扩展"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/storage/postgresql.py"
      - "src/infrastructure/storage/redis.py"
      - "src/infrastructure/storage/alembic/*.py"
      - "migrations/*.py"
    
    mvp_tasks:
      - "W3-T1: PostgreSQL 仓储实现"
      - "W3-T2: Redis 缓存集成"
    
    # 架构约束（architecture.md 第 11 章存储架构）
    constraints:
      - "五层存储单向依赖链（Cache → Relational → Vector → Object → Graph）"
      - "所有仓储必须实现 Unit of Work 模式"
      - "启用 pgvector 扩展支持向量检索"
      - "Redis 缓存 TTL 默认 24 小时"

  infrastructure_agent_messaging:
    # 消息队列专家 - 负责 RabbitMQ 事件总线
    role: "消息队列与事件总线专家"
    description: "负责 RabbitMQ 事件总线、Redis PubSub、Outbox 模式，确保双通道事件驱动架构"
    
    skills:
      primary:
        - "RabbitMQ 3.12+"
        - "aio-pika"
        - "Redis PubSub"
        - "事件驱动架构"
      secondary:
        - "Outbox 模式"
        - "消息持久化"
        - "死信队列"
        - "事务发件箱"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/messaging/rabbitmq.py"
      - "src/infrastructure/messaging/redis_pubsub.py"
      - "src/infrastructure/messaging/outbox.py"
      - "src/infrastructure/messaging/event_bus.py"
    
    mvp_tasks:
      - "W3-T3: RabbitMQ 事件总线"
      - "W3-T5: 基础设施层测试"
    
    # 架构约束（architecture.md 第 10 章事件驱动）
    constraints:
      - "双通道事件总线（Redis 实时 + RabbitMQ 持久化）"
      - "所有业务状态事件必须使用 Outbox 模式"
      - "审计事件必须归档至 WORM 存储（7 年）"
      - "实现事件 Schema 版本管理"

  infrastructure_agent_tenant:
    # 多租户专家 - 负责租户隔离中间件
    role: "多租户与隔离专家"
    description: "负责 Basic tier 多租户隔离（Row-Level）、租户上下文传播、RBAC 权限"
    
    skills:
      primary:
        - "多租户架构"
        - "Row-Level 隔离"
        - "RBAC 权限"
        - "中间件开发"
      secondary:
        - "租户上下文传播"
        - "数据隔离验证"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/tenant/*.py"
      - "src/infrastructure/middleware/*.py"
      - "src/infrastructure/rbac/*.py"
    
    mvp_tasks:
      - "W3-T4: 多租户中间件"
    
    # 架构约束（architecture.md 附录 H 多租户设计）
    constraints:
      - "MVP 阶段使用 Basic tier（共享 Schema + Row-Level 隔离）"
      - "所有查询必须包含 tenant_id 过滤"
      - "租户上下文全链路传播（CLI/API → 服务 → 仓储）"
      - "实现租户隔离渗透测试"

  # =========================================================================
  # 工作流引擎 Agent 组（第 4 周任务）
  # =========================================================================
  workflow_agent_prefect:
    # Prefect 工作流专家 - 负责确定性数据管道
    role: "Prefect 工作流专家"
    description: "负责 Prefect 数据管道、文档处理流程、RAG 索引流程，实现确定性数据流"
    
    skills:
      primary:
        - "Prefect 3.6+"
        - "数据管道"
        - "工作流编排"
        - "异步 Python"
      secondary:
        - "任务重试"
        - "工作流监控"
        - "Checkpoint 机制"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/workflows/prefect/*.py"
      - "src/infrastructure/workflows/prefect/flows/*.py"
    
    mvp_tasks:
      - "W4-T1: 文档处理用例"
      - "W4-T2: RAG 检索用例"
    
    # 架构约束（architecture.md 第 3.2 节双核引擎）
    constraints:
      - "Prefect 仅负责确定性数据流（非认知推理）"
      - "与 LangGraph 通过 OrchestrationService 协调"
      - "所有工作流必须发布 Checkpoint 事件"

  workflow_agent_langgraph:
    # LangGraph 专家 - 负责 Agent 认知推理编排
    role: "LangGraph Agent 编排专家"
    description: "负责 LangGraph 状态机、Agent 协作图、BLM/BEM 规划图，实现认知密集型推理"
    
    skills:
      primary:
        - "LangGraph 1.0+"
        - "状态机"
        - "Agent 编排"
        - "BLM/BEM 模型"
      secondary:
        - "图遍历"
        - "认知推理"
        - "多 Agent 协作"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/workflows/langgraph/*.py"
      - "src/infrastructure/workflows/langgraph/graphs/*.py"
      - "src/infrastructure/workflows/langgraph/nodes/*.py"
    
    mvp_tasks:
      - "W4-T3: Agent 执行用例"
      - "W4-T4: Checkpoint 用例"
    
    # 架构约束（architecture.md 第 17.3 节 AGENT 架构）
    constraints:
      - "BLM 状态机实现六阶段（MVP 阶段实现 3 阶段）"
      - "Agent 标准工作流：Think→Code→Execute→Observe→Validate"
      - "所有状态变更必须持久化至 Checkpoint"
      - "支持 Time-Travel 能力（单点恢复 + 分支对比）"

  # =========================================================================
  # AI/ML Agent 组（核心能力）
  # =========================================================================
  ai_agent_llm_router:
    # LLM 路由专家 - 负责 UDMR 动态路由
    role: "LLM 路由与成本优化专家"
    description: "负责 UDMR 三层决策（L1 合规→L2 评估→L3 执行）、LiteLLM 集成、本地/云端路由，实现本地占比≥80%、成本节省≥50%"
    
    skills:
      primary:
        - "LiteLLM 1.0+"
        - "UDMR 路由框架"
        - "模型路由策略"
        - "Ollama+Qwen2.5"
      secondary:
        - "成本优化"
        - "Token 管理"
        - "速率限制处理"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/ai/llm_router.py"
      - "src/infrastructure/ai/udmr/*.py"
      - "src/infrastructure/ai/model_registry.py"
    
    mvp_tasks:
      - "W4-T3: Agent 执行用例（路由部分）"
    
    # 架构约束（architecture.md 第 4 章 UDMR）
    constraints:
      - "L1 合规性网关：敏感数据检查、数据驻留、白名单"
      - "L2 复杂度评估：语义匹配 (35%)+ 历史成功率 (30%)+ 成本 (20%)+ 复杂度 (15%)"
      - "L3 路由执行：云模型优势阈值 0.15，本地质量阈值 0.70"
      - "路由决策日志归档至 WORM 存储（7 年）"
      - "MVP 目标：本地路由占比≥60%，Token 成本/请求<¥0.05"

  ai_agent_rag:
    # RAG 专家 - 负责混合检索
    role: "RAG 检索与知识发现专家"
    description: "负责 Dense+Sparse+Graph 混合检索、RRF 融合、ColBERT 重排序，实现检索延迟 P95<800ms、召回率≥80%"
    
    skills:
      primary:
        - "RAG 检索"
        - "BGE-M3 嵌入"
        - "混合检索（Dense+Sparse+Graph）"
        - "RRF 融合"
      secondary:
        - "ColBERT 重排序"
        - "Qdrant 向量检索"
        - "语义缓存"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: true
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/ai/rag_service.py"
      - "src/infrastructure/ai/embedding.py"
      - "src/infrastructure/ai/retrievers/*.py"
    
    mvp_tasks:
      - "W4-T2: RAG 检索用例"
    
    # 架构约束（architecture.md 第 17.1.5 节混合检索）
    constraints:
      - "三路召回：Dense（余弦相似度）+ Sparse（BM25）+ Graph（图遍历）"
      - "RRF 融合：倒数排名融合，k=60"
      - "ColBERT 重排序：Top-100→Top-10"
      - "语义缓存：相似度>0.9 命中，TTL 24 小时"
      - "MVP 目标：检索延迟 P95<800ms，召回率≥80%"

  ai_agent_rag_sparse:
    # Sparse 检索专家 - 负责 BM25 关键词检索
    role: "Sparse 检索专家"
    description: "负责 BM25 关键词检索、混合检索 Sparse 路、Qdrant Sparse Vector"
    
    skills:
      primary:
        - "BM25 算法"
        - "Sparse Vector"
        - "关键词检索"
      secondary:
        - "Qdrant Sparse API"
        - "文本分词"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: false
      auto_test_generation: true
    
    preferred_files:
      - "src/infrastructure/ai/retrievers/sparse_retriever.py"
    
    mvp_tasks:
      - "W4-T2: RAG 检索用例（Sparse 路）"

  # =========================================================================
  # 测试 Agent 组（第 6 周任务）
  # =========================================================================
  test_agent_unit:
    # 单元测试专家 - 负责 pytest 单元测试
    role: "单元测试与质量保障专家"
    description: "负责 pytest 单元测试、Mock、测试覆盖率，确保 MVP 单元测试覆盖率≥80%、领域层≥90%"
    
    skills:
      primary:
        - "pytest 7+"
        - "单元测试"
        - "Mock/Fixture"
        - "pytest-cov"
      secondary:
        - "测试驱动开发"
        - "属性基测试"
        - "模糊测试"
    
    execution:
      max_concurrent_tasks: 3        # 测试可高度并行
      output_review_required: false  # 测试代码可自动合并
      auto_test_generation: true
    
    preferred_files:
      - "tests/unit/**/*.py"
      - "tests/fixtures/*.py"
      - "tests/conftest.py"
    
    mvp_tasks:
      - "W6-T1: 集成测试"
      - "W6-T5: 性能基准测试"
    
    # 质量约束（mvp-implementation-plan.md 第 6 章）
    constraints:
      - "MVP 目标：整体覆盖率≥80%，领域层≥90%"
      - "所有 P0 功能必须有单元测试"
      - "关键路径代码必须有属性基测试"
      - "使用 pytest-asyncio 测试异步代码"

  test_agent_integration:
    # 集成测试专家 - 负责端到端测试
    role: "集成测试与 E2E 专家"
    description: "负责集成测试、端到端测试、性能测试，确保 MVP 集成测试通过率≥95%"
    
    skills:
      primary:
        - "集成测试"
        - "端到端测试"
        - "Playwright"
        - "locust/k6"
      secondary:
        - "性能测试"
        - "负载测试"
        - "压力测试"
    
    execution:
      max_concurrent_tasks: 2
      output_review_required: false
      auto_test_generation: true
    
    preferred_files:
      - "tests/integration/**/*.py"
      - "tests/e2e/**/*.py"
      - "tests/performance/*.py"
    
    mvp_tasks:
      - "W6-T2: 端到端测试"
      - "W6-T5: 性能基准测试"
    
    # 质量约束
    constraints:
      - "MVP 目标：集成测试通过率≥95%，E2E 测试通过率≥90%"
      - "所有 P0 功能必须有集成测试"
      - "关键用户旅程必须有 E2E 测试"
      - "性能测试覆盖所有 P0 技术指标"

  # =========================================================================
  # 文档 Agent（全程并行）
  # =========================================================================
  doc_agent:
    # 技术文档专家 - 负责所有文档生成
    role: "技术文档与知识管理专家"
    description: "负责 Markdown 文档、API 文档、用户手册、代码注释，确保 MVP 文档完整性≥90%"
    
    skills:
      primary:
        - "Markdown"
        - "API 文档（OpenAPI）"
        - "用户手册"
        - "代码注释"
      secondary:
        - "技术写作"
        - "文档自动化"
        - "知识库管理"
    
    execution:
      max_concurrent_tasks: 3        # 文档可高度并行
      output_review_required: false  # 文档可自动合并
      auto_test_generation: false
    
    preferred_files:
      - "docs/**/*.md"
      - "**/README.md"
      - "**/*.py"  # 代码注释
      - "CHANGELOG.md"
    
    mvp_tasks:
      - "W8-T2: 用户文档编写"
      - "W8-T3: 运维手册编写"
    
    # 文档约束
    constraints:
      - "所有公共 API 必须有 Google 风格文档字符串"
      - "所有模块必须有模块级文档"
      - "用户手册必须包含快速入门"
      - "运维手册必须包含应急预案"

  # =========================================================================
  # 审查 Agent（关键质量门禁）
  # =========================================================================
  review_agent:
    # 代码审查专家 - 负责质量门禁
    role: "代码审查与安全专家"
    description: "负责代码审查、安全扫描、性能分析、规范检查，确保 MVP 代码质量达标"
    
    skills:
      primary:
        - "代码审查"
        - "mypy 类型检查"
        - "ruff Lint"
        - "安全扫描"
      secondary:
        - "性能分析"
        - "架构一致性检查"
        - "技术债务评估"
    
    execution:
      max_concurrent_tasks: 1        # 审查需串行确保质量
      output_review_required: false  # 审查结果供人类参考
      auto_test_generation: false
    
    preferred_files:
      - "src/**/*.py"
      - "tests/**/*.py"
    
    mvp_tasks:
      - "W6-T3: Bug 修复 Sprint 1"
      - "W6-T4: 安全测试"
      - "W7-T3: 安全加固"
    
    # 质量门禁（mvp-implementation-plan.md 第 6.3 节）
    constraints:
      - "mypy 类型检查：100% 通过"
      - "ruff Lint：100% 通过"
      - "安全扫描：无高危漏洞"
      - "圈复杂度：平均<10"
      - "重复代码：<5%"

  # =========================================================================
  # BMAD Master Agent（流程协调）
  # =========================================================================
  bmad_master_agent:
    # BMAD 主协调 Agent - 负责 Party Mode 评审
    role: "BMAD 流程与 Party Mode 协调员"
    description: "负责 BMAD 工作流协调、Party Mode 多 Agent 评审、架构一致性验证"
    
    skills:
      primary:
        - "BMAD 框架"
        - "Party Mode 评审"
        - "多 Agent 协作"
        - "架构评审"
      secondary:
        - "流程优化"
        - "质量保障"
        - "风险管理"
    
    execution:
      max_concurrent_tasks: 1
      output_review_required: true
      auto_test_generation: false
    
    preferred_files:
      - "_bmad/**/*.md"
      - "_bmad-output/**/*.md"
      - ".qwen/**/*.md"
    
    mvp_tasks:
      - "W4-T5: 应用层测试（评审）"
      - "W8-T4: 上线评审会"
    
    # 流程约束
    constraints:
      - "所有 P0 功能必须通过 Party Mode 评审"
      - "架构变更必须更新 architecture.md"
      - "所有决策必须记录至 ADR"

# -----------------------------------------------------------------------------
# 并行度管理（基于 mvp-implementation-plan.md 第 4.3 节）
# -----------------------------------------------------------------------------
parallelism:
  # 最佳并行 Agent 数（超过 8 个会导致上下文冲突）
  max_concurrent_agents: 6
  
  # 任务队列配置
  task_queue:
    enabled: true
    priority_levels:
      - "P0"  # 关键路径任务（MVP 必需）
      - "P1"  # 重要任务（V1 版本）
      - "P2"  # 可延后任务（V2 版本）
    default_priority: "P1"
    auto_assign: true  # 根据 Agent 技能自动分配
  
  # 冲突检测
  conflict_detection:
    enabled: true
    detect_code_conflicts: true      # 检测代码冲突
    detect_duplicate_implementation: true  # 检测重复实现
    detect_architecture_violation: true    # 检测架构违规
  
  # 上下文隔离
  context_isolation:
    enabled: true
    per_agent_context: true          # 每个 Agent 独立上下文
    shared_blackboard: true          # 共享公共黑板（架构状态）

# -----------------------------------------------------------------------------
# 任务队列与优先级（基于 MVP WBS）
# -----------------------------------------------------------------------------
task_queue:
  # MVP P0 级任务（第 1-4 周关键路径）
  p0_tasks:
    - "W1-T1: 项目骨架创建"
    - "W1-T2: 数据库 Schema 设计"
    - "W1-T3: Docker Compose 配置"
    - "W2-T1: 领域实体定义"
    - "W2-T2: 领域服务接口"
    - "W3-T1: PostgreSQL 仓储实现"
    - "W3-T2: Redis 缓存集成"
    - "W3-T3: RabbitMQ 事件总线"
    - "W4-T1: 文档处理用例"
    - "W4-T2: RAG 检索用例"
    - "W4-T3: Agent 执行用例"
    - "W4-T4: Checkpoint 用例"
  
  # MVP P1 级任务（第 5-7 周）
  p1_tasks:
    - "W5-T1: CLI 命令实现"
    - "W5-T2: 租户上下文传播"
    - "W5-T3: 白标配置系统"
    - "W6-T1: 集成测试"
    - "W6-T2: 端到端测试"
    - "W7-T1: 性能瓶颈分析"
    - "W7-T2: 检索性能优化"
  
  # MVP P2 级任务（第 8 周及以后）
  p2_tasks:
    - "W8-T2: 用户文档编写"
    - "W8-T3: 运维手册编写"
    - "W8-T5: MVP 上线"

# -----------------------------------------------------------------------------
# 代码审查配置（基于 mvp-implementation-plan.md 第 6.3 节）
# -----------------------------------------------------------------------------
code_review:
  # 自动审查
  auto_review_enabled: true
  
  # 审查 Agent 列表
  review_agents:
    - "review_agent"
  
  # 检查项
  checks:
    # 类型检查
    type_check:
      enabled: true
      tool: "mypy"
      config: "mypy.ini"
      fail_on_error: true  # MVP 阶段严格要求
    
    # Lint 检查
    lint:
      enabled: true
      tool: "ruff"
      config: "ruff.toml"
      fail_on_error: true
    
    # 安全扫描
    security:
      enabled: true
      tools:
        - "bandit"  # Python 安全扫描
        - "safety"  # 依赖漏洞扫描
      fail_on_high: true  # 高危漏洞阻断
    
    # 性能分析
    performance:
      enabled: true
      tools:
        - "py-spy"  # 性能分析
        - "memray"  # 内存分析
      threshold_ms: 100  # P95 延迟阈值
    
    # 架构一致性检查
    architecture:
      enabled: true
      rules:
        - "领域层零外部依赖"
        - "五层存储单向依赖链"
        - "事件驱动架构合规"
  
  # 合并策略
  merge_strategy: "human_approval"  # MVP 阶段人类最终审批

# -----------------------------------------------------------------------------
# 风险管理配置（基于 mvp-implementation-plan.md 第 5 章）
# -----------------------------------------------------------------------------
risk_management:
  # AI 原生开发特有风险
  ai_risks:
    AI-1:  # Bug 率高
      level: "medium"
      mitigation:
        - "所有 AI 代码必须通过自动化测试"
        - "审查 Agent 进行静态分析"
        - "人类审查关键路径代码"
    
    AI-2:  # AI 幻觉
      level: "high"
      mitigation:
        - "架构约束代码人类主导"
        - "安全关键代码形式化验证"
        - "复杂算法人工实现"
    
    AI-3:  # 上下文冲突
      level: "medium"
      mitigation:
        - "每日代码同步"
        - "审查 Agent 检测重复和冲突"
        - "统一代码规范检查"
    
    AI-7:  # 审查疲劳
      level: "high"
      mitigation:
        - "每 2 小时休息 15 分钟"
        - "审查 Agent 标记高风险代码"
        - "自动化检查优先"
  
  # 技术风险
  technical_risks:
    T1:  # LLM API 不稳定
      level: "high"
      mitigation:
        - "实现重试机制（tenacity）"
        - "本地模型兜底（Ollama+Qwen2.5）"
        - "语义缓存减少调用"
    
    T2:  # RAG 性能不达标
      level: "high"
      mitigation:
        - "使用 Qdrant 向量数据库"
        - "实现语义缓存"
        - "索引优化（HNSW）"
    
    T3:  # 多租户数据泄露
      level: "medium"
      mitigation:
        - "严格的 Row-Level 过滤"
        - "租户中间件"
        - "渗透测试"

# -----------------------------------------------------------------------------
# 监控与指标（基于 architecture.md 第 26 章）
# -----------------------------------------------------------------------------
monitoring:
  # 工作流监控
  workflow:
    enabled: true
    metrics:
      - "工作流执行时间"
      - "工作流成功率"
      - "任务重试次数"
      - "Checkpoint 数量"
  
  # Agent 决策监控
  agent:
    enabled: true
    metrics:
      - "Agent 决策延迟"
      - "路由决策分布"
      - "Token 消耗"
      - "语义缓存命中率"
  
  # 性能监控
  performance:
    enabled: true
    metrics:
      - "检索延迟 P95/P99"
      - "路由决策延迟 P95"
      - "系统可用性"
      - "并发 Agent 会话数"
  
  # CUSUM 漂移检测（architecture.md 附录 I）
  cusum:
    enabled: true
    metrics:
      - "检索延迟漂移"
      - "Agent 决策质量漂移"
    threshold: 0.05  # 5% 漂移阈值

# -----------------------------------------------------------------------------
# 项目特定配置
# -----------------------------------------------------------------------------
project:
  # 基本信息
  name: "sisys"
  full_name: "企业战略规划管理系统"
  version: "1.0.0-MVP"
  
  # 架构信息
  architecture:
    style: "六边形架构 + 事件驱动"
    core_pattern: "DDD（领域驱动设计）"
    storage_layers: 5  # 五层存储架构
  
  # 技术栈（基于 architecture.md 第 12 章）
  tech_stack:
    python: "3.11+"
    web_framework: "FastAPI 0.104+"
    workflow_engine: "Prefect 3.6+"
    agent_orchestration: "LangGraph 1.0+"
    database: "PostgreSQL 15+"
    cache: "Redis 7.0+"
    message_queue: "RabbitMQ 3.12+"
    vector_db: "Qdrant 1.7+"
    graph_db: "Neo4j 5.x"
    object_storage: "MinIO WORM"
  
  # MVP 范围（mvp-implementation-plan.md 第 1 章）
  mvp:
    theme: "Single Agent, Single Plan, Single Customer"
    start_date: "2026-03-01"
    end_date: "2026-05-23"
    duration_weeks: 12
    team_size: "1 人 + 4~8 个 Qwen Code Agent"
    
    # P0 级功能
    p0_features:
      - "单 Agent 执行（CEO Agent）"
      - "基础 RAG 检索（Dense+Sparse）"
      - "BLM 部分阶段（市场洞察→业务设计）"
      - "Checkpoint 机制（单点恢复）"
      - "基础审计日志"
      - "文档上传解析（17 种格式）"
      - "基础多租户（Basic tier）"
      - "白标输出基础（3 种主题）"
    
    # P0 级技术指标
    p0_metrics:
      - "检索延迟 P95<800ms"
      - "路由决策延迟 P95<100ms"
      - "系统可用性≥99%"
      - "文档处理成功率≥95%"
      - "Checkpoint 恢复成功率≥90%"
      - "检索召回率≥80%"
      - "本地模型路由占比≥60%"
      - "Token 成本/请求<¥0.05"
  
  # 合规要求（prd.md 第 5 章）
  compliance:
    - "SOX（7 年 WORM 存储）"
    - "ISO 27001（信息安全）"
    - "数据安全法（数据境内存储）"
    - "个人信息保护法（PIPL）"
  
  # 排除范围（MVP 不包含）
  excluded_from_mvp:
    - "完整多 Agent 协作（7 种角色）"
    - "完整 BLM 六阶段"
    - "BEM 业务执行模型"
    - "红蓝辩论机制"
    - "完整合规审计（7 年 WORM）"
    - "外部企业数据整合"
    - "REST API 接口"
    - "知识图谱（Neo4j）"

# -----------------------------------------------------------------------------
# 工具链集成
# -----------------------------------------------------------------------------
toolchain:
  # 开发工具
  development:
    - "mypy"       # 类型检查
    - "ruff"       # Lint
    - "pytest"     # 测试
    - "black"      # 代码格式化
    - "isort"      # 导入排序
  
  # CI/CD
  ci_cd:
    - "GitHub Actions"
    - "pre-commit"
    - "docker-compose"
  
  # 监控
  monitoring:
    - "Prometheus"
    - "Grafana"
    - "Jaeger"     # 链路追踪
  
  # 文档
  documentation:
    - "mkdocs"     # 文档生成
    - "pdoc"       # API 文档

