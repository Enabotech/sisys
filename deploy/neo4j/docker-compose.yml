version: '3.8'

# =============================================================================
# Neo4j 图存储层 - 本地开发环境部署配置
# =============================================================================
# 用途：Story 1.8 (Neo4j Graph Layer) 本地开发和集成测试
# 版本：Neo4j 5.15+（支持 AsyncGraphDatabase 异步客户端）
# 职责：L5 图存储层（知识图谱存储、实体关系、依赖图、GraphRAG 检索）
# =============================================================================

services:
  neo4j:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/neo4j/neo4j:5.15
    container_name: sisys-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"    # HTTP 接口（浏览器）
      - "${NEO4J_BOLT_PORT:-7687}:7687"    # Bolt 协议（异步客户端）
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j}
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_tx__state_memory__allocation_max=256m
      - NEO4J_dbms_default__database=neo4j
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_connector_https_listen__address=0.0.0.0:7473
      - NEO4J_PLUGINS=[]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-neo4j}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sisys-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  neo4j_data:
    driver: local
    name: sisys-neo4j-data
  neo4j_logs:
    driver: local
    name: sisys-neo4j-logs
  neo4j_import:
    driver: local
    name: sisys-neo4j-import

networks:
  sisys-network:
    driver: bridge
    name: sisys-network
