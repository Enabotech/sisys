---
# Traefik Middleware 配置 - 安全响应头
# Story 0.6: Harbor 镜像仓库部署
# 配置 HSTS 和其他安全响应头
#
# ⚠️ 当前状态：未部署 (HIGH-002)
# 此文件定义了安全响应头 Middleware，但当前未实际应用到 IngressRoute
# 缺失的安全头:
#   - HSTS (HTTP Strict Transport Security)
#   - Content-Security-Policy
#   - X-Frame-Options: DENY
#   - X-Content-Type-Options: nosniff
#   - XSS-Protection
#
# 启用方式:
#   1. 在 ingress-route.yaml 的 routes 中添加:
#      middlewares:
#      - name: harbor-middleware-chain
#        namespace: harbor
#   2. 应用此配置: kubectl apply -f middleware.yaml
#   3. 验证: curl -vk https://harbor.sisys.local -I | grep -i strict

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harbor-security-headers
  namespace: harbor
spec:
  headers:
    # HSTS - HTTP Strict Transport Security
    # 强制使用 HTTPS，有效期 1 年（31536000 秒）
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000

    # 防止点击劫持
    customFrameOptionsValue: "DENY"

    # 防止 MIME 类型嗅探
    contentTypeNosniff: true

    # XSS 防护
    browserXssFilter: true

    # 内容安全策略（CSP）- 宽松配置，允许 Harbor 正常运行
    # 生产环境应该更严格
    customResponseHeaders:
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://harbor.sisys.local; frame-ancestors 'none';"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
      X-Permitted-Cross-Domain-Policies: "none"
      Cache-Control: "no-store, no-cache, must-revalidate, proxy-revalidate"
      Pragma: "no-cache"
      Expires: "0"

---
# Traefik Middleware 链 - 组合所有安全头
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harbor-middleware-chain
  namespace: harbor
spec:
  chain:
    middlewares:
    - name: harbor-security-headers
      namespace: harbor

# =============================================================================
# 使用说明
# =============================================================================
#
# 当前状态：未部署 (HIGH-002)
#
# 要在 IngressRoute 中启用安全响应头，请在 ingress-route.yaml 的 routes 中添加:
#
#   routes:
#   - match: Host(`harbor.sisys.local`) && PathPrefix(`/`)
#     kind: Rule
#     priority: 5
#     services:
#     - name: harbor-portal
#       port: 80
#       scheme: http
#     middlewares:                        # ← 添加此行
#     - name: harbor-middleware-chain     # ← 添加此行
#       namespace: harbor                 # ← 添加此行
#
# 然后应用此配置:
#   kubectl apply -f middleware.yaml
#
# 验证安全响应头:
#   curl -vk https://harbor.sisys.local -I | grep -iE "strict|x-frame|x-content|xss"
