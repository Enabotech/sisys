# Harbor Helm Chart 配置
# Story 0.6: Harbor 镜像仓库部署
# 版本：Harbor v2.14.2 (实际运行版本)
# 命名空间：harbor
# 最后更新：2026-04-06 (基于实际运行时配置验证)

# =============================================================================
# 基础配置
# =============================================================================

# 副本数配置（MVP 阶段全部为 1）
expose:
  type: ingress
  tls:
    enabled: true
    # 注意：实际使用自签泛域名证书 *.sisys.local (RSA 2048, 有效期至 2027-03-17)
    # 未使用 cert-manager/Let's Encrypt
    auto:
      enabled: false  # 禁用自动证书管理，使用手动证书
      commonName: "*.sisys.local"  # 泛域名证书
  # ==========================================================================
  # 修复 CRITICAL-001: 禁用 Helm 管理的 Ingress
  # ==========================================================================
  # 原因：避免与 Kustomize 管理的 ingress-route.yaml 冲突
  # Helm 负责管理 Harbor 内部组件，Kustomize 负责 K8s 原生资源
  ingress:
    enabled: false  # 禁用 Helm Ingress，使用独立的 IngressRoute CRD
    hosts:
      core: harbor.sisys.local
    # 保留配置用于文档说明，但实际不创建 Ingress 资源

externalURL: https://harbor.sisys.local

# =============================================================================
# 组件启用配置
# =============================================================================

# 启用 Trivy 漏洞扫描
trivy:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Notary 已弃用 - 使用 Cosign 进行镜像签名
# 参考：docs/deploy/HARBOR_COSIGN_SIGNING.md

# =============================================================================
# 核心组件配置
# =============================================================================

core:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m  # 2 核
      memory: 4Gi  # 4GB（符合架构规划）
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

# =============================================================================
# 数据库配置（使用内部 PostgreSQL）
# =============================================================================

database:
  type: internal
  internal:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistentVolumeClaim:
      size: 10Gi
      storageClass: local-path
    # PostgreSQL 连接配置 (实际运行值)
    max_idle_conns: 100  # 实际运行：100 (非默认 50)
    max_open_conns: 900  # 实际运行：900 (非默认 1000)
    ssl_mode: disable

# =============================================================================
# 存储配置
# =============================================================================

# Registry 存储配置
# 实际运行采用分层存储架构：
# - Hot: 50Gi SSD (local-path-ssd) - 高频访问镜像层
# - Warm: 2Ti HDD (native-hdd-vhdx) - 历史镜像层
# - Cold: Pending (local-path-hdd) - 归档存储 (未绑定)
registry:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistentVolumeClaim:
    registry:
      size: 50Gi  # Hot 层：50Gi SSD
      storageClass: local-path-ssd  # 实际使用 SSD StorageClass
    chart:
      size: 10Gi
      storageClass: local-path

# Jobservice 存储配置
jobservice:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  jobLog:
    persistentVolumeClaim:
      size: 2Gi  # 推荐值：日志保留 14 天的安全容量（当前实际 1Gi，需手动扩容）
      storageClass: local-path

# Redis 配置
redis:
  type: internal
  internal:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistentVolumeClaim:
      size: 1Gi  # 实际运行配置
    # Redis DB 分配 (实际运行值)
    # Core: DB 0 (会话、缓存) - redis://harbor-redis:6379/0
    # Jobservice: DB 1 (任务队列) - redis://harbor-redis:6379/1
    # Registry: DB 2 (层信息缓存) - redis://harbor-redis:6379/2
    # Trivy: DB 5 (扫描任务) - redis://harbor-redis:6379/5?idle_timeout_seconds=30

# =============================================================================
# Portal 配置
# =============================================================================

portal:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

# =============================================================================
# Nginx 配置（内部代理）
# =============================================================================

nginx:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

# =============================================================================
# 安全配置
# =============================================================================

# 容器安全上下文
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Pod 安全上下文
podSecurityContext:
  fsGroup: 10000

# 网络策略（在单独的 networkpolicy.yaml 中配置）

# =============================================================================
# 密钥配置（通过 Kubernetes Secret 管理）
# =============================================================================

# 注意：实际密钥通过 deploy/kubernetes/harbor/secrets.yaml 管理
# 此处仅配置密钥引用
# pragma: allowlist secret
secretName: "harbor-secret"
secretKey: "secret"  # 密钥 key 名，实际值在 Secret 中

# Harbor 管理员密码（首次启动后需修改）
harborAdminPassword: ""  # 从 Secret 加载

# 数据库密码引用 (在上方 database.internal 中配置)
# Redis 密码引用 (在上方 redis.internal 中配置)

# 密钥密钥（至少 32 字节）
secretKey: ""  # 从 Secret 加载

# =============================================================================
# 日志配置
# =============================================================================

logLevel: info
logRotate:
  enabled: true
  maxSize: 100M
  maxBackups: 5
  maxAge: 7

# =============================================================================
# 监控配置
# =============================================================================

metrics:
  enabled: true
  core:
    path: /metrics
    port: 8080
  registry:
    path: /metrics
    port: 8001
  jobservice:
    path: /metrics
    port: 8081
  exporter:
    path: /metrics
    port: 9901

# =============================================================================
# 高可用配置（MVP 阶段禁用）
# =============================================================================

# MVP 阶段不使用集群模式
enableCluster: false

# =============================================================================
# 自动扩缩容配置（MVP 阶段禁用）
# =============================================================================

# HPA 配置（后续根据监控指标启用）
# autoscaling:
#   enabled: false

# =============================================================================
# 备份配置
# =============================================================================

# 备份策略（通过 K3S etcd-snapshot 实现）
# 每日凌晨 2 点备份，保留 7 天

# =============================================================================
# 其他配置
# =============================================================================

# 允许匿名拉取（公开项目）
allowAnonymousPull: true

# 禁用普通用户注册（仅管理员邀请制）
selfRegistration:
  enabled: false

# 认证配置（本地数据库认证）
authMode: db_auth

# 密码策略
# 修复 LOW-002: 添加密码历史策略配置
passwordPolicy:
  minLength: 12
  requireUpper: true
  requireLower: true
  requireDigit: true
  requireSpecial: true
  passwordHistoryCount: 5  # 不得重复最近 5 次密码
  passwordExpiration: 90   # 密码 90 天过期（可选）
  passwordMaxAge: 180      # 密码最大使用天数

# 会话超时（分钟）
sessionTimeout: 4320  # 3 天

# 机器人账户配置
robot:
  enabled: true
  namePrefix: "robot$"
  tokenDuration: 365  # 天

# =============================================================================
# 版本信息
# =============================================================================

# Helm Chart 版本
# harbor/harbor (managed-by: Helm)

# Harbor 版本 (实际运行)
# v2.14.2

# 实际运行项目:
# - library (公开, 0 仓库)
# - sisys (公开, 38 仓库, 自动扫描启用)
