---
# ArgoCD Application - Prod 环境
# 生产环境配置 - 手动同步 + 双人审批
#
# 同步策略：手动同步（不启用 automated）
# 适用于：生产环境部署，需要严格审批流程

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sisys-app-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: sisys-app-prod
    app.kubernetes.io/part-of: sisys
    app.kubernetes.io/environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # ArgoCD Image Updater 注解
  annotations:
    # 镜像列表 - 格式：别名=镜像路径
    argocd-image-updater.argoproj.io/image-list: |
      app=harbor.sisys.local/sisys/app

    # 写回方法：使用 git 提交更新
    argocd-image-updater.argoproj.io/write-back-method: git
    # Git 仓库配置
    argocd-image-updater.argoproj.io/git-repo: https://gitea.sisys.local/sisys/sisys.git
    argocd-image-updater.argoproj.io/git-branch: release

    # argocd-image-updater.argoproj.io/app.update-strategy: semver
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build

    # argocd-image-updater.argoproj.io/app.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+-.*

    # 忽略预发布版本
    argocd-image-updater.argoproj.io/app.ignore-tags: regexp:.*-(test|rc|beta|alpha).*

    # 强制使用 Digest (生产环境必须)
    argocd-image-updater.argoproj.io/app.force-digest: "true"

    # 轮询间隔
    argocd-image-updater.argoproj.io/app.check-interval: 2m

    # 生产环境需要手动审批
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

spec:
  project: default

  # 源代码配置 - Prod 环境
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deploy/kubernetes/apps/sisys/prod

  # 目标配置 - Prod 命名空间
  destination:
    server: https://kubernetes.default.svc
    namespace: sisys-prod

  # 同步策略 - 手动同步（不启用 automated）
  syncPolicy:
    # 不启用 automated，需要手动触发同步
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
      - ServerSideApply=true
      - Prune=false  # 生产环境禁用自动修剪
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # 忽略差异 - Prod 环境
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  info:
    - name: Description
      value: SISYS 应用 - 生产环境
    - name: Environment
      value: production
    - name: SyncPolicy
      value: Manual (requires approval)
    - name: ImageTagPattern
      value: v{major}.{minor}.{patch}
    - name: UpdateStrategy
      value: semver
    - name: Security
      value: Digest + Signature Required
