---
# Middleware 配置 - 添加必要的 headers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-headers
  namespace: argocd
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true

---
# ArgoCD Dex Traefik IngressRoute (可选，用于 OIDC)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-dex
  namespace: argocd
  labels:
    app: argocd
    story: "0.7"
  annotations:
    description: "ArgoCD Dex OIDC IngressRoute"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.sisys.local`) && PathPrefix(`/dex`)
      kind: Rule
      services:
        - name: argocd-dex-server
          port: 5556
