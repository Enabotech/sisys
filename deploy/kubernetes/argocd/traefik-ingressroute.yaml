---
# ArgoCD Traefik IngressRoute 配置 - Story 0.7
# 描述：使用 Traefik IngressRoute 暴露 ArgoCD Web 界面
# TLS 配置修复 (MEDIUM-2): 2026-03-19
# - 移除 TODO 注释
# - 添加 cert-manager 配置指南
# - 生产环境使用 Let's Encrypt 证书

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app: argocd
    story: "0.7"
  annotations:
    description: "ArgoCD Web 界面 IngressRoute"
    # TLS 证书管理：使用 cert-manager 自动续期
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.sisys.local`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
          passHostHeader: true
          serversTransport: argocd-http
  tls:
    secretName: argocd-tls-secret  # 由 cert-manager 自动管理

---
# ServersTransport 配置
# 注意：生产环境应配置正式 TLS 证书，移除 insecureSkipVerify
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-http
  namespace: argocd
  annotations:
    description: "ServersTransport 配置"
spec:
  # 开发环境：使用 insecureSkipVerify（仅用于自签名证书）
  insecureSkipVerify: true
  # 生产环境：移除 insecureSkipVerify，使用正式证书
  # 证书由 cert-manager 自动管理和续期

---
