---
# 示例 Application 配置 - 展示如何配置镜像自动更新
# Story 0.7: ArgoCD 持续部署 - Task 5: Harbor 镜像仓库集成
# 创建日期：2026-03-16

# =============================================================================
# 配置说明
# =============================================================================
#
# 本配置展示如何在 ArgoCD Application 中配置镜像自动更新功能。
# 通过注解方式配置 Image Updater 行为。
#
# 使用方法:
#   sudo kubectl apply -f deploy/kubernetes/argocd/example-application.yaml
#
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-example
  namespace: argocd
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/part-of: sisys
  annotations:
    # =========================================================================
    # 镜像更新配置
    # =========================================================================

    # 启用镜像更新 - 指定要监控的镜像列表
    # 格式：镜像仓库/项目/镜像=别名
    argocd-image-updater.argoproj.io/image-list: |
      harbor.sisys.local/sisys/myapp=myapp

    # =========================================================================
    # 更新策略配置
    # =========================================================================

    # 更新策略：semver (语义化版本)
    # 可选值：latest, semver, name, digest
    argocd-image-updater.argoproj.io/myapp.update-strategy: semver

    # 允许的 tag 格式（正则表达式）
    # 只允许语义化版本号：v1.2.3
    argocd-image-updater.argoproj.io/myapp.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$

    # 排序方式：semver (按语义化版本排序)
    # 可选值：semver, name, date
    argocd-image-updater.argoproj.io/myapp.sort-mode: semver

    # 忽略的 tag
    argocd-image-updater.argoproj.io/myapp.ignore-tags: |
      latest,dev,nightly,test

    # 强制更新：即使镜像未变化也触发同步
    argocd-image-updater.argoproj.io/myapp.force-update: "true"

    # 镜像拉取策略
    # pragma: allowlist secret
    argocd-image-updater.argoproj.io/myapp.pull-secret: argocd-image-updater-secret

    # 健康检查配置
    argocd-image-updater.argoproj.io/myapp.health-check: |
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

spec:
  # =========================================================================
  # Application 基础配置
  # =========================================================================

  project: default

  source:
    # Git 仓库地址
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    # 分支/Tag
    targetRevision: HEAD
    # 应用路径
    path: deploy/kubernetes/myapp

  destination:
    # 目标集群
    server: https://kubernetes.default.svc
    # 目标命名空间
    namespace: default

  # =========================================================================
  # 同步策略配置
  # =========================================================================

  syncPolicy:
    # 自动化同步配置
    automated:
      # 自动修剪：删除不再存在的资源
      prune: true
      # 自动修复：当资源偏离期望状态时自动同步
      selfHeal: true
      # 允许空值：允许同步空值字段
      allowEmpty: false

    # 同步选项
    syncOptions:
      # 创建命名空间（如果不存在）
      - CreateNamespace=true
      # 应用时验证资源
      - Validate=true
      # 同步后修剪
      - Prune=true
      # 同步时应用服务器端应用
      - ServerSideApply=true

    # 同步重试配置
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # =========================================================================
  # 健康检查配置
  # =========================================================================

  ignoreDifferences:
    # 忽略某些字段的差异
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

---
# 测试 Application - 用于验证 Image Updater 功能
# 使用 latest tag 策略（最简单）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-image-updater
  namespace: argocd
  labels:
    app.kubernetes.io/name: test-app
    app.kubernetes.io/part-of: sisys-test
  annotations:
    # 最简单的配置 - 使用 latest tag
    argocd-image-updater.argoproj.io/image-list: harbor.sisys.local/sisys/test-app
    argocd-image-updater.argoproj.io/update-strategy: latest

spec:
  project: default
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deploy/kubernetes/test-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# 多镜像更新示例
# 展示如何配置多个镜像同时更新
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-image-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: multi-image-app
    app.kubernetes.io/part-of: sisys
  annotations:
    # 配置多个镜像
    argocd-image-updater.argoproj.io/image-list: |
      harbor.sisys.local/sisys/frontend=frontend
      harbor.sisys.local/sisys/backend=backend

    # Frontend 镜像配置
    argocd-image-updater.argoproj.io/frontend.update-strategy: semver
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/frontend.sort-mode: semver

    # Backend 镜像配置
    argocd-image-updater.argoproj.io/backend.update-strategy: semver
    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/backend.sort-mode: semver

spec:
  project: default
  source:
    repoURL: https://gitea.sisys.local/sisys/sisys.git
    targetRevision: HEAD
    path: deploy/kubernetes/multi-image-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# =============================================================================
# 使用指南
# =============================================================================
#
# 1. 选择适合的示例配置
#    - myapp-example: 标准语义化版本更新
#    - test-image-updater: 简单 latest tag 测试
#    - multi-image-app: 多镜像同时更新
#
# 2. 修改配置以匹配你的应用
#    - 修改 repoURL 为你的 Git 仓库
#    - 修改 path 为你的应用路径
#    - 修改 image-list 为你的镜像
#
# 3. 应用配置
#    sudo kubectl apply -f deploy/kubernetes/argocd/example-application.yaml
#
# 4. 验证配置
#    sudo kubectl get application myapp-example -n argocd
#    sudo kubectl describe application myapp-example -n argocd
#
# 5. 测试镜像更新
#    a. 推送新镜像到 Harbor:
#       docker tag myapp:latest harbor.sisys.local/sisys/myapp:v1.0.1
#       docker push harbor.sisys.local/sisys/myapp:v1.0.1
#
#    b. 等待 Image Updater 检测（约 1-2 分钟）:
#       sudo kubectl logs -n argocd -l app.kubernetes.io/name=argocd-image-updater -f
#
#    c. 验证 Application 已更新:
#       sudo kubectl get application myapp-example -n argocd
#
# =============================================================================
