---
# ArgoCD RBAC 配置 - Story 0.7
# 描述：配置角色基于访问控制

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app: argocd
    story: "0.7"
  annotations:
    description: "ArgoCD RBAC 策略配置"
data:
  policy.default: role:readonly
  policy.csv: |
    # 管理员角色 - 完全访问权限
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, logs, *, *, allow
    p, role:admin, exec, *, */*, allow
    p, role:admin, extensions, *, *, allow
    # 修复 MEDIUM-1: 添加 services 资源的 list 权限
    p, role:admin, services, list, */*, allow

    # 开发者角色 - 可以查看和同步应用
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, action, */*, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, logs, get, */*, allow

    # 只读角色 - 仅查看权限
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, repositories, get, *, allow
    p, role:readonly, clusters, get, *, allow
    p, role:readonly, projects, get, *, allow

    # 将 Gitea 用户组映射到 ArgoCD 角色
    g, admin, role:admin
    g, developers, role:developer
    g, viewers, role:readonly

---
# ArgoCD Server ServiceAccount ClusterRole
# 修复 MEDIUM-5: 添加 services 资源的 list/watch 权限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server-clusterrole
  labels:
    app: argocd
    story: "0.7"
  annotations:
    description: "ArgoCD Server ServiceAccount ClusterRole - 允许访问 Kubernetes 资源"
rules:
  # Services 权限（修复 MEDIUM-5）
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

  # Pods 权限（用于日志和健康检查）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Events 权限（用于事件查看）
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # ConfigMaps 权限（用于配置管理）
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Secrets 权限（用于仓库凭据）
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Deployments 权限（用于应用管理）
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # StatefulSets 权限
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]

---
# ArgoCD Server ServiceAccount ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-server-clusterrolebinding
  labels:
    app: argocd
    story: "0.7"
  annotations:
    description: "绑定 argocd-server ServiceAccount 到 ClusterRole"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-server-clusterrole
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd

---
# Admin Secret
# 安全修复 (CRITICAL-2): 2026-03-19
# - 移除明文密码，改为通过环境变量注入
# - 或使用 openssl 生成随机密码
#
# 部署前必须设置环境变量:
#   export ARGOCD_ADMIN_PASSWORD="$(openssl rand -base64 32)"
#   echo "Admin password: $ARGOCD_ADMIN_PASSWORD"

apiVersion: v1
kind: Secret
metadata:
  name: argocd-initial-admin-secret
  namespace: argocd
  labels:
    app: argocd
    story: "0.7"
  annotations:
    description: "ArgoCD 初始 admin 密码"
    # 注意：实际密码通过环境变量注入，不提交到 Git
    # 密码复杂度要求：12 位 + 大小写 + 数字 + 符号
type: Opaque
stringData:
  # 密码通过环境变量注入
  # 部署命令：kubectl create secret generic argocd-initial-admin-secret \
  #   --from-literal=password="$ARGOCD_ADMIN_PASSWORD" \
  #   -n argocd --dry-run=client -o yaml | kubectl apply -f -
  password: "${ARGOCD_ADMIN_PASSWORD}"
---
# 替代方案 1: 使用 openssl 生成随机密码 (推荐)
