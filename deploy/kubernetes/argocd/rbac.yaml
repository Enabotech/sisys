---
# 部署指南:
#
# 方法 1: 使用 openssl 生成随机密码 (推荐)
#   export ARGOCD_ADMIN_PASSWORD="$(openssl rand -base64 32)"
#   echo "Admin password: $ARGOCD_ADMIN_PASSWORD"
#   kubectl create secret generic argocd-initial-admin-secret \
#     --from-literal=password="$ARGOCD_ADMIN_PASSWORD" \
#     -n argocd
#
# 方法 2: 使用 Kustomize (推荐用于生产环境)
#   kubectl apply -k deploy/kubernetes/argocd/
#
# 方法 3: 使用 Helm (如果通过 Helm 部署 ArgoCD)
#   helm upgrade argocd argo/argo-cd -f values.yaml \
#     --set server.admin.password="$(openssl rand -base64 32)"
#
# 方法 4: 使用 External Secrets Operator (最佳实践)
#   kubectl apply -f external-secret.yaml
#
# 密码策略建议:
# - 最小长度：12 位
# - 必须包含：大写字母 + 小写字母 + 数字 + 特殊符号
# - 定期轮换：每 90 天
# - 密码历史：不得重复最近 5 次密码
