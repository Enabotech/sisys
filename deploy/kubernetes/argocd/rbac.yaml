#   type: Opaque
#   literals:
#   - password=CHANGE_ME  # 通过 kustomize 补丁替换
#
# 替代方案 3: 使用 External Secrets Operator (最佳实践)
# 文件：external-secret.yaml
# apiVersion: external-secrets.io/v1beta1
