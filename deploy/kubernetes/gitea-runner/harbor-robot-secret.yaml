# ============================================================
# Harbor Robot Account Secret for Gitea Runner
# ============================================================
# Story: 0-8 - Gitea Runner Configuration
# Task: 6 - Harbor Integration Configuration
#
# 说明:
#   - 复用 Story 0.6 创建的 Harbor Robot Account
#   - 为 Gitea Runner 推送镜像到 Harbor 提供认证
#   - 使用 Kubernetes Secret 存储 Docker Registry 凭据
#
# 前置依赖:
#   - Story 0.6: Harbor 镜像仓库部署 ✅ 已完成
#   - Story 0.6 Task 6: Robot Account 配置 ✅ 已完成
#
# 部署步骤:
#   1. 在 Harbor Web 界面创建 Robot Account (或使用 API)
#      - 项目：sisys
#      - 名称：gitea-runner-push
#      - 权限：Push, Pull
#      - 有效期：365 天或永不过期
#
#   2. 获取 Robot Account Token
#      - 名称：robot$gitea-runner-push
#      - 密钥：<从 Harbor 复制的 Token>
#
#   3. 生成 dockerconfigjson
#      使用以下命令生成 base64 编码:
#      ```bash
#      export HARBOR_URL="harbor.sisys.local"
#      export ROBOT_USER="robot\$gitea-runner-push"
#      export ROBOT_TOKEN="<从 Harbor 复制的 Token>"
#      export AUTH=$(echo -n "$ROBOT_USER:$ROBOT_TOKEN" | base64)
#
#      cat <<EOF | base64 -w0
#      {"auths":{"$HARBOR_URL":{"username":"$ROBOT_USER","password":"$ROBOT_TOKEN","auth":"$AUTH"}}}
#      EOF
#      ```
#
#   4. 更新下方 Secret 中的 .dockerconfigjson 值
#
#   5. 应用配置到 K8s 集群
#      ```bash
#      kubectl apply -f deploy/kubernetes/gitea-runner/harbor-robot-secret.yaml
#      ```
#
#   6. 验证 Secret 已创建
#      ```bash
#      kubectl get secret harbor-robot-account -n gitea-actions
#      ```
#
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: harbor-robot-account
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "6"
    source: "story-0.6"  # 复用 Story 0.6 Robot Account
type: kubernetes.io/dockerconfigjson
data:
  # ============================================================
  # Docker Registry 认证配置
  # ============================================================
  # 注意：以下是示例配置，实际部署时需要替换为真实的 Robot Account Token
  #
  # 生成命令:
  # echo '{"auths":{"harbor.sisys.local":{"username":"robot$gitea-runner-push","password":"<TOKEN>","auth":"<BASE64>"}}}' | base64
  #
  # 实际值应替换为:
  # .dockerconfigjson: <base64 编码的 docker config json>
  #
  # 示例（测试用，实际部署请替换）:
  .dockerconfigjson: >-
    eyJhdXRocyI6eyJ0ZXN0LmhhcmJvci5sb2NhbCI6eyJ1c2VybmFtZSI6InJvYm90JHNpc3lzK3J1bm5lciIsInBhc3N3b3JkIjoidGVzdC10b2tlbiIsImF1dGgiOiJkR2x6YUdGdWJtVnNWMHhIVkZKUFQwOU4ifX19

---
# ============================================================
# Harbor Robot Account 配置说明 ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-robot-account-info
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "6"
data:
  # Robot Account 配置信息
  ROBOT_ACCOUNT_NAME: "robot$gitea-runner-push"
  HARBOR_REGISTRY_URL: "harbor.sisys.local"
  HARBOR_PROJECT: "sisys"

  # 使用文档
  README: |
    Harbor Robot Account 使用说明
    ===========================

    1. 创建 Robot Account
       - 登录 Harbor Web 界面：https://harbor.sisys.local
       - 进入项目 → sisys → Robot Accounts
       - 点击 "New Robot Account"
       - 填写：
         * Name: gitea-runner-push
         * Permissions: Push, Pull
         * Expiration: 365 days (或 -1 永不过期)
       - 保存生成的 Token

    2. 更新 Kubernetes Secret
       - 使用生成的 Token 更新 harbor-robot-secret.yaml
       - 运行：kubectl apply -f harbor-robot-secret.yaml
       - 验证：kubectl get secret harbor-robot-account -n gitea-actions -o yaml

    3. 在 Pipeline 中使用
       - Gitea Pipeline 会自动使用 imagePullSecrets 进行认证
       - 推送镜像：docker push harbor.sisys.local/sisys/app:tag
       - 拉取镜像：docker pull harbor.sisys.local/sisys/app:tag

    4. 故障排除
       - 认证失败：检查 Token 是否过期或权限是否正确
       - 推送失败：检查 Robot Account 是否有 Push 权限
       - 拉取失败：检查 Robot Account 是否有 Pull 权限

    5. Token 轮换
       - 建议每 90 天轮换一次 Token
       - 在 Harbor 界面撤销旧 Token 并创建新 Token
       - 更新 Kubernetes Secret 并重启 Gitea Runner

---
# ============================================================
# Harbor Secret 验证脚本 ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-secret-validation
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "6"
data:
  # 验证 Harbor Secret 的脚本
  validate-harbor-secret.sh: |
    #!/bin/bash
    set -e

    echo "🔍 Validating Harbor Robot Account Secret..."

    NAMESPACE="gitea-actions"
    SECRET_NAME="harbor-robot-account"  # pragma: allowlist secret

    # 检查 Secret 是否存在
    echo "📋 Checking if Secret exists..."
    if ! kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
      echo "❌ Secret '$SECRET_NAME' not found in namespace '$NAMESPACE'"
      exit 1
    fi
    echo "✅ Secret found"

    # 检查 Secret 类型
    echo "🔍 Checking Secret type..."
    SECRET_TYPE=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath='{.type}')
    if [ "$SECRET_TYPE" != "kubernetes.io/dockerconfigjson" ]; then  # pragma: allowlist secret
      echo "❌ Secret type is '$SECRET_TYPE', expected 'kubernetes.io/dockerconfigjson'"
      exit 1
    fi
    echo "✅ Secret type is correct"

    # 验证 dockerconfigjson 格式
    echo "🔍 Validating dockerconfigjson format..."
    DOCKER_CONFIG=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d)

    if ! echo "$DOCKER_CONFIG" | jq . > /dev/null 2>&1; then
      echo "❌ dockerconfigjson is not valid JSON"
      exit 1
    fi
    echo "✅ dockerconfigjson format is valid"

    # 检查是否包含 Harbor 配置
    echo "🔍 Checking Harbor registry configuration..."
    if ! echo "$DOCKER_CONFIG" | jq -e '.auths."harbor.sisys.local"' > /dev/null 2>&1; then
      echo "❌ Harbor registry 'harbor.sisys.local' not found in dockerconfigjson"
      exit 1
    fi
    echo "✅ Harbor registry configuration found"

    # 测试 Harbor 连接（需要网络可达）
    echo "🌐 Testing Harbor connection..."
    if curl -k -s https://harbor.sisys.local/api/v2.0/ping > /dev/null 2>&1; then
      echo "✅ Harbor is reachable"
    else
      echo "⚠️  Harbor is not reachable (may be network issue)"
    fi

    echo ""
    echo "✅ Harbor Robot Account Secret validation complete!"
    echo ""
    echo "📊 Summary:"
    echo "  - Secret Name: $SECRET_NAME"
    echo "  - Namespace: $NAMESPACE"
    echo "  - Type: $SECRET_TYPE"
    echo "  - Registry: harbor.sisys.local"
    echo ""
    echo "🚀 Next steps:"
    echo "  1. Deploy Gitea Runner with this Secret"
    echo "  2. Test docker push/pull in Pipeline"
    echo "  3. Verify Trivy auto-scan after push"

---
# ============================================================
# Harbor Robot Account 部署脚本 ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-secret-deploy-scripts
  namespace: gitea-actions
  labels:
    app: gitea-runner
    story: "0-8"
    task: "6"
data:
  # 部署 Harbor Secret 的脚本
  deploy-harbor-secret.sh: |
    #!/bin/bash
    set -e

    echo "🚀 Deploying Harbor Robot Account Secret..."
    echo ""

    NAMESPACE="gitea-actions"
    SECRET_NAME="harbor-robot-account"  # pragma: allowlist secret
    CONFIG_FILE="deploy/kubernetes/gitea-runner/harbor-robot-secret.yaml"

    # 检查配置文件是否存在
    if [ ! -f "$CONFIG_FILE" ]; then
      echo "❌ Config file not found: $CONFIG_FILE"
      exit 1
    fi

    # 创建命名空间（如果不存在）
    echo "📋 Ensuring namespace '$NAMESPACE' exists..."
    kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

    # 应用 Secret 配置
    echo "🔧 Applying Harbor Secret configuration..."
    kubectl apply -f "$CONFIG_FILE"

    # 验证 Secret 已创建
    echo "⏳ Waiting for Secret to be created..."
    sleep 2

    if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
      echo "✅ Secret deployed successfully"
    else
      echo "❌ Secret deployment failed"
      exit 1
    fi

    # 显示 Secret 信息
    echo ""
    echo "📊 Secret Information:"
    kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o yaml | head -20

    echo ""
    echo "✅ Harbor Robot Account Secret deployment complete!"
    echo ""
    echo "🚀 Next steps:"
    echo "  1. Run validation: bash scripts/deployment/gitea-runner/validate-harbor-secret.sh"
    echo "  2. Deploy Gitea Runner: bash scripts/deployment/gitea-runner/deploy-runner.sh"
    echo "  3. Test Pipeline: Push code to Gitea and verify CI/CD execution"
