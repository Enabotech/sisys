# ============================================================
# Gitea Actions Runner - 完整部署配置（单文件整合版）
# ============================================================
# Story: 0-8-gitea-runner-configuration
# 命名空间：gitea-actions
# 版本：v5.0 (单文件整合版)
# 日期：2026-04-06
#
# 整合来源：
#   - gitea-actions-complete.yaml  (GPU Runner - hostPath Docker Socket)
#   - gitea-org-runner-config.yaml       (Runner ConfigMap)
#   - gitea-org-runner-token-secret.yaml (注册 Token Secret)
#   - harbor-robot-secret.yaml           (Harbor 认证 Secret)
#
# 架构说明：
#   ┌─────────────────────────────────────────────────────────┐
#   │  Namespace: gitea-actions                               │
#   ├─────────────────────────────────────────────────────────┤
#   │  StatefulSet: gitea-org-runner (GPU 直通)               │
#   │  - 副本: 4                                              │
#   │  - 架构: 单容器 + hostPath /var/run/docker.sock         │
#   │  - GPU: ✅ 通过 K3s containerd + NVIDIA Device Plugin    │
#   │  - 标签: docker,ubuntu2204,gpu                          │
#   │  - 镜像: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3-dind │
#   ├─────────────────────────────────────────────────────────┤
#   │  Secrets (需手动替换真实值):                             │
#   │  - gitea-org-runner-token (Gitea 注册 Token)            │
#   │  - ca-certificates (Gitea 自签名证书，外部创建)          │
#   │  - harbor-robot-account (Harbor 推送认证)               │
#   └─────────────────────────────────────────────────────────┘
#
# 部署命令：
#   # 1. 部署基础资源（Namespace、RBAC、ConfigMap、StatefulSet）
#   kubectl apply -f gitea-actions-complete.yaml
#
#   # 2. 注入 Gitea Runner Token（替换 <YOUR_TOKEN>）
#   kubectl create secret generic gitea-org-runner-token \
#     -n gitea-actions --from-literal=token="<YOUR_TOKEN>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 3. 注入 Harbor Robot Account（替换 <TOKEN>）
#   kubectl create secret docker-registry harbor-robot-account \
#     -n gitea-actions \
#     --docker-server=harbor.sisys.local \
#     --docker-username="robot\$sisys+gitea-runner-push" \
#     --docker-password="<TOKEN>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # 4. 重启 Runner Pod 使 Secret 生效
#   kubectl rollout restart statefulset gitea-org-runner -n gitea-actions
#
# 验证命令：
#   kubectl get pods -n gitea-actions -l app=gitea-org-runner
#   kubectl logs -n gitea-actions gitea-org-runner-0
# ============================================================

# -----------------------------------------------------------------------------
# 1. 命名空间配置
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: gitea-actions
  labels:
    app: gitea-actions
    story: "0-8"
    # Pod 安全标准 - 允许特权容器（GPU Runner 需要）
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.34
---
# -----------------------------------------------------------------------------
# 2. ServiceAccount 和 RBAC
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-runner-role
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
rules:
  # 允许访问 Pod（用于动态调度和监控）
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # 允许访问 ConfigMaps 和 Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner-binding
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-runner-role
subjects:
  - kind: ServiceAccount
    name: gitea-runner
    namespace: gitea-actions
---
# -----------------------------------------------------------------------------
# 3. Runner ConfigMap（Docker Executor 模式 - GPU 直通）
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
data:
  config.yaml: |
    # Runner 配置
    runner:
      # 注册文件路径（持久化在 PVC 中）
      file: /data/.runner
      # 工作目录
      workdir: /data/workdir
      # 临时目录
      tempdir: /data/tmp
      # 超时设置
      timeout: 720m

    # 日志配置
    log:
      level: info
      format: text
      output: stdout

    # 容器配置（Docker Executor 模式）
    # ✅ 使用预构建 CI 镜像，包含 Docker CLI 和完整工具链
    # ✅ 使用 bridge 网络模式支持 Kubernetes DNS 解析
    # ✅ GPU 直通：通过 hostPath docker.sock → K3s containerd → NVIDIA Runtime
    container:
      # 工作镜像（使用本地 Harbor 镜像，包含完整开发测试环境）
      image: harbor.sisys.local/sisys/dependency:l2-latest

      # 网络模式 - bridge 模式支持 DNS 解析
      network: bridge

      # 工作目录
      workdir: /workspace

      # Docker 选项
      # ✅ 特权模式：允许容器内运行 Docker 命令
      # ✅ DNS 配置支持 Kubernetes 服务发现
      # ✅ SSL 环境变量传递到 Job 容器（解决自签名证书问题）
      # ✅ host.docker.internal：让 Job 容器访问 host 上的服务
      options: |
        --privileged
        --tmpfs /tmp
        --tmpfs /var/tmp
        --dns 10.43.0.10
        --dns-search gitea-actions.svc.cluster.local
        --dns-search svc.cluster.local
        --dns-search cluster.local
        --add-host=host.docker.internal:host-gateway
        -e GIT_SSL_NO_VERIFY=true
        -e NODE_TLS_REJECT_UNAUTHORIZED=0

      # 环境变量（仅用于 Runner 容器本身）
      env:
        - DOCKER_HOST=unix:///var/run/docker.sock
        - DOCKER_TLS_CERTDIR=

      # 卷挂载（关键！挂载 docker.sock 到 Job 容器）
      volumes:
        # Docker socket（GPU 直通关键：指向 K3s containerd）
        - /var/run/docker.sock:/var/run/docker.sock
        # 工作目录
        - /workspace:/workspace
        # 临时目录
        - /tmp:/tmp

    # 缓存配置
    cache:
      enabled: true
      dir: /data/cache
---
# -----------------------------------------------------------------------------
# 4. Harbor Robot Account Secret（镜像推送认证）
# -----------------------------------------------------------------------------
# ⚠️ 需替换为真实的 Robot Account Token
# 生成命令：
#   echo '{"auths":{"harbor.sisys.local":{"username":"robot$sisys+gitea-runner-push","password":"<TOKEN>","auth":"<BASE64>"}}}' | base64
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: harbor-robot-account
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
    task: "6"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "$HARBOR_ROBOT_ACCOUNT_BASE64"
---
# -----------------------------------------------------------------------------
# 5. Gitea 组织级 Runner Token Secret
# -----------------------------------------------------------------------------
# ⚠️ 需替换为真实的组织级 Runner 注册 Token
# 获取位置：https://gitea.sisys.local/org/sisys/settings/actions/runners
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: gitea-org-runner-token
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
    scope: organization
    org: sisys
type: Opaque
stringData:
  token: "$GITEA_RUNNER_REGISTRATION_TOKEN"
---
# -----------------------------------------------------------------------------
# 6. StatefulSet - GPU 直通 Runner（hostPath Docker Socket）
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-org-runner
  namespace: gitea-actions
  labels:
    app: gitea-org-runner
    story: "0-8"
    scope: organization
    org: sisys
    runner-type: docker-socket-gpu
spec:
  # 4 个 Runner 支持 4 个并发 Job
  replicas: 4
  serviceName: gitea-org-runner
  selector:
    matchLabels:
      app: gitea-org-runner
  template:
    metadata:
      labels:
        app: gitea-org-runner
        runner-type: docker-socket-gpu
    spec:
      serviceAccountName: gitea-runner

      # Pod 级别安全上下文
      securityContext:
        runAsNonRoot: false

      # Init Container - 确保配置目录存在
      initContainers:
        - name: init-config
          image: harbor.sisys.local/sisys/tools/busybox:1.36
          command: ['sh', '-c', 'mkdir -p /etc/act-runner && ls -la /etc/act-runner/']
          volumeMounts:
            - name: runner-config
              mountPath: /etc/act-runner
              readOnly: true

      containers:
        - name: runner
          # 使用本地 Harbor 镜像（包含 Docker CLI + 完整工具链）
          image: harbor.sisys.local/sisys/tools/gitea/act_runner:0.3-dind
          imagePullPolicy: IfNotPresent

          # Runner 启动命令
          # ✅ 通过 hostPath docker.sock 访问 K3s containerd（GPU 直通关键）
          # ✅ 自动注册 Runner
          command:
            - /bin/sh
            - -c
            - |
              # 检查注册文件是否存在，不存在则自动注册
              if [ ! -f /data/.runner ]; then
                echo "📝 No registration file found, registering runner..."
                /usr/local/bin/act_runner generate config \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || echo "⚠️ Config generation failed, using existing config"

                echo "🔑 Registering runner..."
                /usr/local/bin/act_runner register \
                  --name "${GITEA_RUNNER_NAME}" \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --labels "${GITEA_RUNNER_LABELS}" \
                  --config /etc/act-runner/config.yaml || {
                    echo "❌ Registration failed, exiting..."
                    exit 1
                  }
                echo "✅ Runner registered successfully"
              else
                echo "✅ Registration file found, starting runner..."
              fi

              echo "🚀 Starting act_runner daemon..."
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml

          # 环境变量配置
          env:
            # Gitea 实例地址（使用 HTTPS 外部入口）
            - name: GITEA_INSTANCE_URL
              value: "https://gitea.sisys.local"

            # Runner 名称（使用 Pod 名称）
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Runner 标签（用于 Job 调度）
            # docker: 支持 Docker 命令
            # ubuntu2204: Ubuntu 22.04 工具链
            # gpu: 支持 GPU 直通（RTX 5090）
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu2204,actions,docker,gpu"

            # Token（从 Secret 注入 - 组织级 Token）
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-org-runner-token
                  key: token

            # SSL 证书配置 - 信任自签名证书
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-certificates.crt
            - name: GIT_SSL_NO_VERIFY
              value: "false"

          # 卷挂载
          volumeMounts:
            # ✅ Docker socket（GPU 直通关键：指向 K3s containerd）
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: false

            # ✅ Docker 配置（包含 Harbor 证书和认证）
            - name: docker-config
              mountPath: /etc/docker
              readOnly: true

            # Runner 持久化配置目录
            - name: runner-data
              mountPath: /data

            # Runner 配置文件（ConfigMap）
            - name: runner-config
              mountPath: /etc/act-runner/config.yaml
              subPath: config.yaml
              readOnly: true

            # SSL 证书挂载
            - name: ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true

          # 资源限制
          resources:
            requests:
              cpu: 1500m
              memory: 4Gi
            limits:
              cpu: 3000m
              memory: 8Gi

          # 健康检查
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 就绪检查
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - act_runner
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      # 卷配置
      volumes:
        # ✅ Docker socket (hostPath → K3s containerd，GPU 直通关键)
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

        # ✅ Docker 配置（包含 Harbor 证书和认证）
        - name: docker-config
          hostPath:
            path: /etc/docker
            type: DirectoryOrCreate

        # Runner 配置文件（ConfigMap）
        - name: runner-config
          configMap:
            name: gitea-runner-config
            defaultMode: 0644

        # SSL 证书卷
        - name: ca-certificates
          secret:
            secretName: ca-certificates   # pragma: allowlist secret
            defaultMode: 0644

  # volumeClaimTemplates - StatefulSet 核心特性
  # 每个 Pod 自动创建独立 PVC
  volumeClaimTemplates:
    - metadata:
        name: runner-data
        labels:
          app: gitea-org-runner
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path
