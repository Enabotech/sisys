# Gitea Ingress 配置 - Story 0.5 + Story 0.8 (域名端口优化)
# 描述：Traefik v3.x Ingress 配置，启用 TLS
# Story 0.8 更新：移除 Middleware 引用（命名空间兼容性问题）

# Gitea Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-ingress
  namespace: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: ingress
    story: "0.5+0.8"
  annotations:
    # Traefik 配置 - 使用 HTTPS 入口点
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # 注意：Middleware 引用已移除，由于 traefik.io/v1alpha1 API 的命名空间兼容性问题

spec:
  ingressClassName: traefik

  # TLS 配置（使用自签名证书 - Story 0.8）
  tls:
    - hosts:
        - gitea.sisys.local
      secretName: gitea-tls-secret

  # 路由规则
  rules:
    - host: gitea.sisys.local
      http:
        paths:
          # 主应用路径
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea-http
                port:
                  number: 3000

---
# TLS Secret 配置说明
#
# MVP 阶段（开发环境）：使用自签名证书
# 运行以下命令创建自签名证书：
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt \
#     -subj "/CN=gitea.sisys.local/O=SISYS"
#   kubectl create secret tls gitea-tls-secret --cert=tls.crt --key=tls.key -n gitea
