---
# SISYS 应用 HorizontalPodAutoscaler
# Story 1.13: K8s 动态扩缩容
#
# 支持指标:
# - Resource (CPU/memory): K8s metrics-server 提供 (kube-state-metrics)
# - External: Prometheus Adapter 将 Prometheus 指标转换为 K8s External Metrics API
#   注意: external metrics 需要 prometheus-adapter v0.13+ 支持，当前版本仅支持 custom.metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sisys-app
  labels:
    app.kubernetes.io/name: sisys-app
    app.kubernetes.io/part-of: sisys
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sisys-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Resource metrics (K8s metrics-server) - 当前主要扩缩容依据
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # External metrics (Prometheus Adapter) - 需要 v0.13+ 版本
    # - type: External
    #   external:
    #     metric:
    #       name: sisys_agent_sessions_active
    #       selector:
    #         matchLabels:
    #           namespace: sisys
    #     target:
    #       type: AverageValue
    #       averageValue: "10"
