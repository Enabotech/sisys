# =============================================================================
# SISYS 测试专用 docker-compose
# =============================================================================
# 用途：提供完全隔离的测试环境，使用测试专用端口
# Story: 20-1 (sisys-testing-refactor) - Phase 2
# =============================================================================
# 端口映射（与生产环境隔离）:
#   Redis: 6380 (生产: 6379)
#   PostgreSQL: 5433 (生产: 5432)
#   Qdrant: 6335/6336 (生产: 6333/6334)
#   MinIO: 9010/9011 (生产: 9000/9001)
#   Neo4j: 7475/7688 (生产: 7474/7687)
#   RabbitMQ: 5673/15673 (生产: 5672/15672)
# =============================================================================

services:

  # ===========================================================================
  # L1: Redis 高速缓存层 (测试专用)
  # ===========================================================================
  redis:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/redis/redis:7.2.5
    container_name: sisys-test-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - sisys-test-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # L2: PostgreSQL 关系存储层 (测试专用)
  # ===========================================================================
  postgres:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/postgres/postgres:15.4
    container_name: sisys-test-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=sisys_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sisys_test"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sisys-test-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ===========================================================================
  # L3: Qdrant 向量存储层 (测试专用)
  # ===========================================================================
  qdrant:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/qdrant/qdrant:v1.7.1
    container_name: sisys-test-qdrant
    restart: unless-stopped
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_test_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sisys-test-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # L4: MinIO 对象存储层 (测试专用)
  # ===========================================================================
  minio:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sisys-test-minio
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_test_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_VOLUMES=/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sisys-test-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ===========================================================================
  # L5: Neo4j 图存储层 (测试专用)
  # ===========================================================================
  neo4j:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/neo4j/neo4j:5.15
    container_name: sisys-test-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_test_data:/data
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
      - NEO4J_dbms_transaction_timeout=60s
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sisys-test-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # RabbitMQ 可靠事件通道 (测试专用)
  # ===========================================================================
  rabbitmq:
    image: ${HARBOR_REGISTRY:-harbor.sisys.local}/sisys/tools/rabbitmq/rabbitmq:3.13-management
    container_name: sisys-test-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sisys-test-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

# =============================================================================
# 存储卷
# =============================================================================
volumes:
  redis_test_data:
    driver: local
    name: sisys-test-redis-data
  postgres_test_data:
    driver: local
    name: sisys-test-postgres-data
  qdrant_test_data:
    driver: local
    name: sisys-test-qdrant-data
  minio_test_data:
    driver: local
    name: sisys-test-minio-data
  neo4j_test_data:
    driver: local
    name: sisys-test-neo4j-data
  rabbitmq_test_data:
    driver: local
    name: sisys-test-rabbitmq-data

# =============================================================================
# 网络
# =============================================================================
networks:
  sisys-test-network:
    driver: bridge
    name: sisys-test-network
