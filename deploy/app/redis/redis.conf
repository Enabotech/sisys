# Redis 7.0+ 部署配置 — Story 1.4
#
# 用途: 生产环境 Redis 部署，支持六层存储架构 L1 高速缓存层
# 要求: Redis 7.0+, 主从复制, 故障转移
# 验证: 运行 scripts/verify_redis_ready.py 确认部署就绪

# ============================================================================
# 基础配置
# ============================================================================

# 绑定地址（生产环境应改为内网 IP）
bind 0.0.0.0

# 端口
port 6379

# 保护模式（本地开发/测试关闭；生产环境通过独立配置文件覆盖为 yes）
protected-mode no

# 密码（生产环境应使用强密码）
# requirepass your-secure-password-here

# ============================================================================
# 内存管理
# ============================================================================

# 最大内存（根据服务器配置调整）
maxmemory 2gb

# 内存淘汰策略
# - volatile-lru: 对设置了 TTL 的 key 使用 LRU 淘汰
# - allkeys-lru: 对所有 key 使用 LRU 淘汰
# - volatile-ttl: 对即将过期的 key 优先淘汰
maxmemory-policy volatile-lru

# ============================================================================
# 持久化（可选，L1 缓存层通常不需要强持久化）
# ============================================================================

# RDB 快照（默认开启）
save 900 1
save 300 10
save 60 10000

# RDB 文件名
dbfilename dump.rdb

# 工作目录
dir /data

# ============================================================================
# 复制（主从配置）
# ============================================================================

# 主节点无需特殊配置
# 从节点配置:
# replicaof <master-ip> <master-port>
# masterauth <master-password>
# replica-read-only yes

# ============================================================================
# 连接管理
# ============================================================================

# 超时时间（0=永不超时）
timeout 300

# TCP keepalive
tcp-keepalive 60

# 最大连接数
maxclients 10000

# ============================================================================
# 日志
# ============================================================================

# 日志级别
loglevel notice

# 日志文件（空字符串=输出到 stdout）
logfile ""

# ============================================================================
# 安全
# ============================================================================

# 禁用危险命令（生产环境推荐）
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# ============================================================================
# sisys 应用配置
# ============================================================================

# 数据库数量（sisys 使用 db=0）
databases 16

# 慢查询日志阈值（微秒）
slowlog-log-slower-than 10000

# 慢查询日志最大条数
slowlog-max-len 128

# ============================================================================
# Redis Stack 模块（redis-stack-server:7.2.0-v20）
# ============================================================================

# redis-stack-server 的 entrypoint 已自动加载 /opt/redis-stack/lib/ 下所有模块
# 此处不再显式 loadmodule，避免与 entrypoint 的默认加载产生冲突导致重复加载失败
# 模块列表（由 entrypoint 自动加载）：
# - rediscompat.so — 兼容性层
# - redisearch.so — 全文搜索、向量索引
# - redisbloom.so — 布隆过滤器
# - redistimeseries.so — 时序数据
# - rejson.so — JSON 原生存储
