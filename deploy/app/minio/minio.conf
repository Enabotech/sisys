# MinIO 本地开发环境配置 — Story 1.7
#
# 用途: 本地开发环境 MinIO 部署，支持六层存储架构 L4 对象存储层
# 要求: MinIO RELEASE.2024-01+（支持对象锁定和生命周期管理）
# 验证: 运行 scripts/verify_minio_ready.py 确认部署就绪

# ============================================================================
# 基础配置
# ============================================================================

# 服务器地址（容器内）
MINIO_SERVER_URL=http://minio:9000
MINIO_BROWSER_REDIRECT_URL=http://localhost:9001

# ============================================================================
# 存储配置
# ============================================================================

# 数据目录
MINIO_VOLUMES=/data

# ============================================================================
# 安全配置
# ============================================================================

# 开发环境使用默认凭据（生产环境必须修改）
MINIO_ROOT_USER=minioadmin
MINIO_ROOT_PASSWORD=minioadmin          # pragma: allowlist secret

# ============================================================================
# 日志配置
# ============================================================================

# 日志级别
MINIO_LOG_LEVEL=info

# ============================================================================
# sisys 应用配置
# ============================================================================

# Bucket 前缀
MINIO_BUCKET_PREFIX=sisys

# SOX 合规保留天数（7 年 = 2555 天）
MINIO_SOX_RETENTION_DAYS=2555

# 临时对象保留天数
MINIO_TEMP_RETENTION_DAYS=30
