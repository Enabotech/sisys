services:
  # PaddleOCR-VL 参考模板（独立部署用）
  # 主 docker-compose.yml 已内联写入两服务，此文件保留为独立部署参考
  # 使用时需确保 docker-compose.yml 的 networks 和 volumes 已定义

  paddleocr-vl-api:
    image: harbor.sisys.local/sisys/tools/paddlepaddle/paddleocr-vl:${API_IMAGE_TAG_SUFFIX}
    container_name: sisys-paddleocr-vl-api
    ports:
      - "${PADDLEOCR_VL_API_PORT:-8080}:8080"
    depends_on:
      paddleocr-vl-vllm:
        condition: service_healthy
    # 注意：API 容器不需要 GPU 分配，vLLM 推理由 paddleocr-vl-vllm 容器处理
    shm_size: 2g
    restart: unless-stopped
    environment:
      - VLM_BACKEND=${VLM_BACKEND:-vllm}
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_${VLM_BACKEND}.yaml"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sisys-network

  paddleocr-vl-vllm:
    image: harbor.sisys.local/sisys/tools/paddlepaddle/paddleocr-genai-${VLM_BACKEND}-server:${VLM_IMAGE_TAG_SUFFIX}
    container_name: sisys-paddleocr-vl-vllm
    shm_size: 2g
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    command: [
      "python3", "-m", "vllm.entrypoints.openai.api_server",
      "--port", "8118",
      "--model", "/home/paddleocr/.paddlex/official_models/PaddleOCR-VL-1.6",
      "--gpu-memory-utilization", "0.15",
      "--max-model-len", "2048",
      "--max-num-seqs", "64",
      "--enforce-eager",
      "--trust-remote-code"
    ]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8118/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - sisys-network

networks:
  sisys-network:
    driver: bridge
