version: '3.8'

# =============================================================================
# PostgreSQL 关系存储层 - 生产环境部署配置
# =============================================================================
# 用途：Story 1.5 (PostgreSQL Relational Layer) 生产环境部署
# 版本：PostgreSQL 15.4+（支持异步驱动 asyncpg/psycopg2）
# 职责：L2 关系存储层（用户/RBAC、审计元数据、业务实体、事件发件箱）
# =============================================================================

services:
  postgres:
    image: harbor.sisys.local/sisys/tools/postgres/postgres:15.4
    container_name: sisys-postgres-prod
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./init-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:?Database name required}
      - POSTGRES_USER=${POSTGRES_USERNAME:?Username required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Strong password required}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sisys-network
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
    name: sisys-postgres-data-prod

networks:
  sisys-network:
    driver: overlay
    name: sisys-network-prod
