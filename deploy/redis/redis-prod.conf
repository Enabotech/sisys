# Redis 生产环境配置
# 参考 Qdrant/MinIO 生产配置模式

bind 0.0.0.0
port 6379

# 安全配置
requirepass ${REDIS_PASSWORD}
protected-mode yes
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# 持久化
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# 内存管理
maxmemory 3gb
maxmemory-policy allkeys-lru

# 网络
tcp-backlog 511
timeout 300
tcp-keepalive 60

# 日志
loglevel notice
logfile ""

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128
