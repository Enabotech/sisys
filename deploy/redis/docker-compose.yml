version: '3.8'

# =============================================================================
# Redis 高速缓存层 - 本地开发环境部署配置
# =============================================================================
# 用途：Story 1.4 (Redis Cache Layer) 本地开发和集成测试
# 版本：Redis 7.0+（支持 redis.asyncio 异步客户端）
# 职责：L1 高速缓存层（会话状态、语义缓存、公共黑板、事件发布/订阅）
# =============================================================================

services:
  redis:
    image: harbor.sisys.local/sisys/tools/redis:7.2.5
    container_name: sisys-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      - REDIS_PORT=6379
      # 可选：密码（生产环境必须启用）
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - sisys-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

volumes:
  redis_data:
    driver: local
    name: sisys-redis-data

networks:
  sisys-network:
    driver: bridge
    name: sisys-network
