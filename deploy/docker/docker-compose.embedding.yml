# SISYS Embedding API — Docker Compose 部署配置
# 复用 L2 依赖镜像（已含 FlagEmbedding/fastapi/torch），无需独立构建
#
# 使用方式:
#   无本地模型（自动从 HuggingFace 拉取）:
#     docker compose -f deploy/docker/docker-compose.embedding.yml up -d
#
#   有本地模型（优先加载，跳过下载）:
#     EMBEDDING_MODEL_PATH=/mnt/x/.cache/BAAI/bge-m3/models--BAAI--bge-m3/ \
#       docker compose -f deploy/docker/docker-compose.embedding.yml up -d
#
# 启动后在 .env 中设置 EMBEDDING_API_URL=http://localhost:8001

services:
  embedding-api:
    image: ${EMBEDDING_IMAGE:-harbor.sisys.local/sisys/dependency:l2-latest}
    container_name: sisys-embedding-api
    ports:
      - "${EMBEDDING_API_PORT:-8001}:8000"
    environment:
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-}
      - EMBEDDING_MODEL_DEVICE=${EMBEDDING_MODEL_DEVICE:-cpu}
    volumes:
      # 嵌入服务源码（挂载单文件，无需完整项目）
      - ../../src/infrastructure/external_services/embedding/embedding_api_server.py:/app/embedding_api_server.py:ro
      # 模型文件（可选）：设 EMBEDDING_MODEL_PATH 时挂载本地模型
      - ${EMBEDDING_MODEL_PATH:-/dev/null}:${EMBEDDING_MODEL_PATH:-/dev/null}:ro
      # HuggingFace 缓存（模型下载后持久化）
      - embedding-cache:/root/.cache/huggingface
    working_dir: /app
    command: >
      poetry run uvicorn embedding_api_server:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  embedding-cache:
