# MinIO 生产环境配置 — Story 1.7
# 参考 Redis/PostgreSQL 生产配置模式

# ============================================================================
# 基础配置
# ============================================================================

# 服务器地址
MINIO_SERVER_URL=https://minio.sisys.local
MINIO_BROWSER_REDIRECT_URL=https://console.minio.sisys.local

# ============================================================================
# 存储配置
# ============================================================================

# 数据目录
MINIO_VOLUMES=/data

# ============================================================================
# 安全配置（生产环境必须使用强密码）
# ============================================================================

# Root 凭据（通过环境变量注入，不要硬编码）
# MINIO_ROOT_USER=<from-env>
# MINIO_ROOT_PASSWORD=<from-env>

# ============================================================================
# 日志配置
# ============================================================================

# 日志级别
MINIO_LOG_LEVEL=warn

# ============================================================================
# sisys 应用配置
# ============================================================================

# Bucket 前缀
MINIO_BUCKET_PREFIX=sisys

# SOX 合规保留天数（7 年 = 2555 天）
MINIO_SOX_RETENTION_DAYS=2555

# 临时对象保留天数
MINIO_TEMP_RETENTION_DAYS=30
