# OpenAPI Specification v3.1
#
# API 端点将在后续 Story 中逐步完成定义
#
# API 版本管理: /api/v1/[resource]

openapi: "3.1.0"
info:
  title: sisys API
  description: AI 驱动的战略规划与决策智能平台 API
  version: "0.1.0"
  contact:
    name: sisys Team

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

paths:
  # ============================================================================
  # 文档管理端点 (Document Management)
  # ============================================================================
  /documents:
    get:
      tags:
        - documents
      summary: 查询文档列表
      description: 获取文档列表（支持分页和过滤）
      security:
        - OAuth2: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: 分页偏移
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        "401":
          description: 未认证

  /documents/{document_id}/versions:
    get:
      tags:
        - documents
      summary: 查询文档版本历史
      description: 返回按版本号降序排列的版本快照列表
      security:
        - OAuth2: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 文档 UUID
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
          description: 租户标识符
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentVersionSnapshotResponse'
        "401":
          description: 未认证
        "404":
          description: 文档不存在

  /documents/{document_id}/versions/snapshot:
    post:
      tags:
        - documents
      summary: 创建文档版本快照
      description: 手动创建文档版本快照，记录差异摘要
      security:
        - OAuth2: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 文档 UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionSnapshotRequest'
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionSnapshotResponse'
        "401":
          description: 未认证
        "404":
          description: 文档不存在
        "409":
          description: 版本冲突

  # ============================================================================
  # 认证端点 (Authentication)
  # ============================================================================
  /auth/login:
    post:
      tags:
        - authentication
      summary: 用户登录
      description: 验证用户凭证并返回 JWT 令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "401":
          description: 无效凭证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "423":
          description: 账户已锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - authentication
      summary: 刷新访问令牌
      description: 使用 refresh token 获取新的 access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "401":
          description: Refresh token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - authentication
      summary: 用户登出
      description: 撤销 JWT token
      security:
        - OAuth2: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 可选的 refresh token
      responses:
        "204":
          description: 登出成功

  /auth/me:
    get:
      tags:
        - authentication
      summary: 获取当前用户信息
      description: 返回当前认证用户的信息
      security:
        - OAuth2: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # 角色管理端点 (Role Management)
  # ============================================================================
  /roles:
    get:
      tags:
        - roles
      summary: 获取角色列表
      description: 返回所有角色（需认证）
      security:
        - OAuth2: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - roles
      summary: 创建角色
      description: 创建新角色（需 admin 角色）
      security:
        - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 需要管理员角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: 角色名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /roles/{role_id}:
    get:
      tags:
        - roles
      summary: 获取角色详情
      description: 根据 ID 获取角色详情
      security:
        - OAuth2: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 UUID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - roles
      summary: 更新角色
      description: 更新角色信息（需 admin 角色）
      security:
        - OAuth2: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 需要管理员角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: 角色名冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - roles
      summary: 删除角色
      description: 删除角色（软删除，需 admin 角色，系统保留角色不可删除）
      security:
        - OAuth2: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 UUID
      responses:
        "204":
          description: 删除成功
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 需要管理员角色或角色为系统保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: 无法删除（仍有用户关联到此角色）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /roles/{role_id}/permissions:
    post:
      tags:
        - roles
      summary: 为角色分配权限
      description: 添加权限到角色（需 admin 角色）
      security:
        - OAuth2: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPermissionRequest'
      responses:
        "200":
          description: 分配成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 需要管理员角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - roles
      summary: 撤销角色权限
      description: 从角色移除指定权限（需 admin 角色）
      security:
        - OAuth2: []
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 角色 UUID
        - name: permission
          in: path
          required: true
          schema:
            type: string
          description: 权限字符串（如 "document:read"）
      responses:
        "200":
          description: 撤销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 需要管理员角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # 审计日志端点 (Audit Logging)
  # ============================================================================
  /audit/logs:
    get:
      tags:
        - audit
      summary: 查询审计日志
      description: 支持多维检索（时间/actor/action_type/target_resource）
      security:
        - OAuth2: []
      parameters:
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 开始时间（ISO 8601）
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 结束时间（ISO 8601）
        - name: actor
          in: query
          required: false
          schema:
            type: string
          description: 操作用户 ID
        - name: action_type
          in: query
          required: false
          schema:
            type: string
          description: 操作类型（如 "authentication:login"）
        - name: target_resource
          in: query
          required: false
          schema:
            type: string
          description: 目标资源
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: 分页偏移
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: 每页数量
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /audit/logs/{log_id}:
    get:
      tags:
        - audit
      summary: 获取审计日志详情
      description: 根据 ID 获取审计日志详情
      security:
        - OAuth2: []
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 审计日志 UUID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 日志不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /audit/verify:
    post:
      tags:
        - audit
      summary: 批量验证日志完整性
      description: SHA256 校验和验证，支持指定 log_ids 或全部
      security:
        - OAuth2: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrityVerifyRequest'
      responses:
        "200":
          description: 验证完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityVerifyResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /audit/archive/status:
    get:
      tags:
        - audit
      summary: 查询归档状态
      description: 查询指定日志的归档状态
      security:
        - OAuth2: []
      parameters:
        - name: log_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 审计日志 UUID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveStatusResponse'
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /audit/archive:
    post:
      tags:
        - audit
      summary: 手动归档审计日志
      description: 手动触发归档超过指定天数的审计日志
      security:
        - OAuth2: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                older_than_days:
                  type: integer
                  default: 30
                  description: 归档多久之前的日志（天）
      responses:
        "200":
          description: 归档完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived_count:
                    type: integer
                    description: 已归档的日志数量

  # ============================================================================
  # 安全监控端点 (Security Monitoring) — 等保2.0三级
  # ============================================================================
  /security/intrusions:
    get:
      tags:
        - security
      summary: 查询入侵事件列表
      description: 查询系统检测到的入侵事件列表，支持按类型/严重级别/时间范围过滤
      security:
        - Bearer: []
      parameters:
        - name: attack_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - sql_injection
              - xss
              - brute_force
              - command_injection
              - path_traversal
              - rate_limit_violation
              - unauthorized_access
              - data_exfiltration
          description: 攻击类型过滤
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - critical
          description: 严重级别过滤
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: 返回数量限制
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: 偏移量
      responses:
        "200":
          description: 入侵事件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrusionEventListResponse'
        "401":
          description: 未授权
        "403":
          description: 权限不足（需要管理员权限）

  /security/intrusions/{event_id}:
    get:
      tags:
        - security
      summary: 获取入侵事件详情
      description: 获取指定入侵事件的详细信息
      security:
        - Bearer: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 入侵事件ID
      responses:
        "200":
          description: 入侵事件详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrusionEventResponse'
        "401":
          description: 未授权
        "404":
          description: 事件不存在

  /security/intrusions/block:
    post:
      tags:
        - security
      summary: 阻断恶意IP
      description: 手动封禁指定IP地址
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockIPRequest'
      responses:
        "200":
          description: IP封禁成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockIPResponse'
        "400":
          description: 无效IP地址
        "401":
          description: 未授权

  /security/intrusions/stats:
    get:
      tags:
        - security
      summary: 获取入侵统计数据
      description: 获取指定时间范围内的入侵检测统计数据
      security:
        - Bearer: []
      parameters:
        - name: period_hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: 统计周期（小时）
      responses:
        "200":
          description: 入侵统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrusionStatsResponse'
        "401":
          description: 未授权

  /security/integrity/verify:
    post:
      tags:
        - security
      summary: 验证数据完整性
      description: 计算并验证数据的SHA256校验和
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrityVerifyRequest'
      responses:
        "200":
          description: 完整性验证结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityVerifyResponse'
        "400":
          description: 无效请求参数
        "401":
          description: 未授权

  /security/backups:
    get:
      tags:
        - security
      summary: 查询备份列表
      description: 查询系统备份记录列表
      security:
        - Bearer: []
      parameters:
        - name: backup_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - postgresql
              - minio
              - redis
              - full
          description: 备份类型过滤
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: 返回数量限制
      responses:
        "200":
          description: 备份列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponse'
        "401":
          description: 未授权

    post:
      tags:
        - security
      summary: 创建新备份
      description: 创建指定类型的数据备份
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupRequest'
      responses:
        "200":
          description: 备份创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResponse'
        "400":
          description: 无效备份类型
        "401":
          description: 未授权

  /security/backups/{backup_id}/restore:
    post:
      tags:
        - security
      summary: 恢复备份
      description: 从指定备份恢复数据
      security:
        - Bearer: []
      parameters:
        - name: backup_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 备份ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequest'
      responses:
        "200":
          description: 备份恢复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreBackupResponse'
        "401":
          description: 未授权
        "404":
          description: 备份不存在

  /security/backups/status:
    get:
      tags:
        - security
      summary: 获取备份状态
      description: 获取当前备份系统的整体状态
      security:
        - Bearer: []
      responses:
        "200":
          description: 备份状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStatusResponse'
        "401":
          description: 未授权

  /security/compliance/report:
    get:
      tags:
        - security
      summary: 获取等保合规报告
      description: 获取等保2.0三级合规验证报告
      security:
        - Bearer: []
      responses:
        "200":
          description: 合规报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReportResponse'
        "401":
          description: 未授权
        "403":
          description: 权限不足

  # ============================================================================
  # Embedding API — BGE-M3 嵌入服务 (Story 3-1a, 内部服务)
  # ============================================================================
  /health:
    get:
      tags:
        - embedding
      summary: 健康检查
      description: 返回模型加载状态和设备信息
      responses:
        "200":
          description: 模型正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingHealthResponse"
        "503":
          description: 模型未加载
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingHealthResponse"

  /v1/embeddings:
    post:
      tags:
        - embedding
      summary: 文本嵌入编码
      description: Dense 编码（1024维） + Sparse 编码（词汇权重）按需返回
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: 编码成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "422":
          description: 请求参数校验失败
        "503":
          description: 模型未加载

  # ============================================================================
  # 分层检索端点 (Layered Retrieval, Story 3-5)
  # ============================================================================
  /api/v1/search/layered:
    post:
      tags:
        - search
      summary: 分层检索（L1-L4）
      description: |
        支持自顶向下（L3→L4 展开）与自底向上（L4→L3 回溯）双向遍历检索。
        L1/L2 为骨架实现（返回空列表），L3/L4 依赖分块级向量索引。
      security:
        - OAuth2: []
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayeredRetrievalRequest"
      responses:
        "200":
          description: 分层检索成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayeredRetrievalResponse"
        "400":
          description: 请求参数校验失败（ValidationError）
        "500":
          description: 检索编排失败或层级遍历非法
        "422":
          description: 请求体校验失败

components:
  schemas:
    # --------------------------------------------------------------------------
    # 文档版本快照相关 schemas (Story 2-6)
    # --------------------------------------------------------------------------
    CreateVersionSnapshotRequest:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          description: 租户标识符
        created_by:
          type: string
          description: 操作者标识
        change_description:
          type: string
          description: 变更描述
        old_content_summary:
          type: string
          nullable: true
          description: 旧版本内容摘要
        new_content_summary:
          type: string
          nullable: true
          description: 新版本内容摘要

    DocumentVersionSnapshotResponse:
      type: object
      required:
        - document_id
        - version
        - snapshot_id
        - created_at
        - created_by
      properties:
        document_id:
          type: string
          format: uuid
          description: 文档唯一标识符
        version:
          type: integer
          description: 版本号
        snapshot_id:
          type: string
          format: uuid
          description: 快照唯一标识符
        created_at:
          type: string
          format: date-time
          description: 快照创建时间
        created_by:
          type: string
          description: 操作者标识
        change_description:
          type: string
          description: 变更描述
        diff_summary:
          type: string
          description: 差异摘要文本
        diff_json:
          type: object
          nullable: true
          description: 结构化差异数据
        storage_object_key:
          type: string
          description: 对象存储引用
        file_size_bytes:
          type: integer
          description: 文件大小
        checksum:
          type: string
          description: 文件校验和

    DocumentListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersionSnapshotResponse'
        total:
          type: integer
          description: 总数量

    # --------------------------------------------------------------------------
    # 认证相关 schemas
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户名
        password:
          type: string
          minLength: 1
          description: 密码

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          nullable: true
          description: Refresh token（可选）
        token_type:
          type: string
          default: bearer
          description: Token 类型
        expires_in:
          type: integer
          description: 过期时间（秒）
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - username
        - roles
      properties:
        id:
          type: string
          description: 用户 UUID
        username:
          type: string
          description: 用户名
        roles:
          type: array
          items:
            type: string
          description: 角色列表

    # --------------------------------------------------------------------------
    # 角色相关 schemas
    # --------------------------------------------------------------------------
    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 角色名
        description:
          type: string
          default: ""
          description: 角色描述
        permissions:
          type: array
          items:
            type: string
          default: []
          description: 权限列表（如 ["document:read", "document:write"]）
        is_system_reserved:
          type: boolean
          default: false
          description: 是否为系统保留角色

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 角色名
        description:
          type: string
          nullable: true
          description: 角色描述
        permissions:
          type: array
          items:
            type: string
          nullable: true
          description: 权限列表
        is_active:
          type: boolean
          nullable: true
          description: 是否激活

    RoleResponse:
      type: object
      required:
        - id
        - name
        - permissions
        - is_system_reserved
        - is_active
      properties:
        id:
          type: string
          description: 角色 UUID
        name:
          type: string
          description: 角色名
        description:
          type: string
          description: 角色描述
        permissions:
          type: array
          items:
            type: string
          description: 权限列表
        is_system_reserved:
          type: boolean
          description: 是否为系统保留角色
        is_active:
          type: boolean
          description: 是否激活
        created_at:
          type: string
          nullable: true
          description: 创建时间（ISO 8601）
        updated_at:
          type: string
          nullable: true
          description: 更新时间（ISO 8601）

    AssignPermissionRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
          description: 要分配的权限列表

    # --------------------------------------------------------------------------
    # 审计相关 schemas
    # --------------------------------------------------------------------------
    AuditLogResponse:
      type: object
      required:
        - log_id
        - timestamp
        - actor
        - action_type
        - target_resource
        - checksum
      properties:
        log_id:
          type: string
          format: uuid
          description: 审计日志 UUID
        timestamp:
          type: string
          format: date-time
          description: 操作时间（UTC）
        actor:
          type: string
          description: 操作用户或系统组件
        action_type:
          type: string
          description: 操作类型（如 "authentication:login"）
        target_resource:
          type: string
          description: 目标资源
        old_value:
          type: object
          description: 操作前状态（JSON）
        new_value:
          type: object
          description: 操作后状态（JSON）
        correction_level:
          type: integer
          nullable: true
          description: 纠正级别（L0-L3）
        checksum:
          type: string
          description: SHA256 校验和
        archived:
          type: boolean
          description: 是否已归档
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: 归档时间

    AuditLogListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        total:
          type: integer
          description: 总数量
        offset:
          type: integer
          description: 当前偏移
        limit:
          type: integer
          description: 每页数量

    IntegrityVerifyRequest:
      type: object
      properties:
        log_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 要验证的日志 UUID 列表（空则验证全部）

    IntegrityVerifyResponse:
      type: object
      required:
        - total
        - passed
        - failed
      properties:
        total:
          type: integer
          description: 总验证数
        passed:
          type: integer
          description: 通过数
        failed:
          type: integer
          description: 失败数
        details:
          type: array
          items:
            type: object
            properties:
              log_id:
                type: string
              status:
                type: string
              message:
                type: string

    ArchiveStatusResponse:
      type: object
      required:
        - log_id
        - archived
      properties:
        log_id:
          type: string
          format: uuid
          description: 审计日志 UUID
        archived:
          type: boolean
          description: 是否已归档
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: 归档时间
        retention_days:
          type: integer
          description: 保留天数

    # --------------------------------------------------------------------------
    # 安全监控 schemas — 等保2.0三级
    # --------------------------------------------------------------------------
    IntrusionEventResponse:
      type: object
      required:
        - event_id
        - attack_type
        - severity
        - source_ip
        - detected_at
      properties:
        event_id:
          type: string
          format: uuid
        attack_type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        source_ip:
          type: string
        target_path:
          type: string
        confidence:
          type: number
          format: float
        description:
          type: string
        evidence:
          type: string
        action_taken:
          type: string
          enum: [logged, alerted, blocked, quarantined]
        detected_at:
          type: string
          format: date-time

    IntrusionEventListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntrusionEventResponse'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    BlockIPRequest:
      type: object
      required:
        - ip_address
      properties:
        ip_address:
          type: string
          description: 待封禁的IP地址
        reason:
          type: string
          description: 封禁原因
        duration_hours:
          type: integer
          default: 24
          description: 封禁时长（小时）

    BlockIPResponse:
      type: object
      required:
        - ip_address
        - blocked
      properties:
        ip_address:
          type: string
        blocked:
          type: boolean
        expiry:
          type: string
          format: date-time

    IntrusionStatsResponse:
      type: object
      required:
        - total_attacks
        - attacks_by_type
        - attacks_by_severity
      properties:
        total_attacks:
          type: integer
        attacks_by_type:
          type: object
          additionalProperties:
            type: integer
        attacks_by_severity:
          type: object
          additionalProperties:
            type: integer
        blocked_ips:
          type: array
          items:
            type: string

    SecurityIntegrityVerifyRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          description: 待验证的数据
        expected_hash:
          type: string
          description: 预期的SHA256校验和
        algorithm:
          type: string
          enum: [sha256, sha512, md5]
          default: sha256

    SecurityIntegrityVerifyResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        data_id:
          type: string
        expected_hash:
          type: string
        actual_hash:
          type: string
        algorithm:
          type: string
        error_message:
          type: string

    BackupListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupResponse'
        total:
          type: integer

    CreateBackupRequest:
      type: object
      required:
        - backup_type
      properties:
        backup_type:
          type: string
          enum: [postgresql, minio, redis, full]
        description:
          type: string

    BackupResponse:
      type: object
      required:
        - backup_id
        - success
        - backup_type
      properties:
        backup_id:
          type: string
          format: uuid
        success:
          type: boolean
        backup_type:
          type: string
        size_bytes:
          type: integer
        checksum:
          type: string
        error_message:
          type: string
        created_at:
          type: string
          format: date-time

    RestoreBackupRequest:
      type: object
      properties:
        target_components:
          type: array
          items:
            type: string
          description: 目标恢复组件列表

    RestoreBackupResponse:
      type: object
      required:
        - success
        - backup_id
      properties:
        success:
          type: boolean
        backup_id:
          type: string
        restored_items:
          type: integer
        warnings:
          type: array
          items:
            type: string
        error_message:
          type: string

    BackupStatusResponse:
      type: object
      properties:
        last_backup_time:
          type: string
          format: date-time
        last_backup_type:
          type: string
        total_backups:
          type: integer
        total_size_bytes:
          type: integer

    ComplianceReportResponse:
      type: object
      required:
        - total_domains
        - compliance_score
        - results
      properties:
        total_domains:
          type: integer
        compliant_count:
          type: integer
        non_compliant_count:
          type: integer
        compliance_score:
          type: number
          format: float
        results:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              status:
                type: string
                enum: [compliant, non_compliant, partial]
              score:
                type: number
              checks:
                type: object
                additionalProperties:
                  type: boolean

    # --------------------------------------------------------------------------
    # 通用 schemas
    # --------------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: 错误详情

    # --------------------------------------------------------------------------
    # Embedding API schemas (Story 3-1a)
    # --------------------------------------------------------------------------
    EmbedRequest:
      type: object
      required:
        - texts
      properties:
        texts:
          type: array
          items:
            type: string
          minItems: 1
          description: 待编码文本列表
        return_sparse:
          type: boolean
          default: false
          description: 是否返回稀疏词汇权重

    EmbedResponse:
      type: object
      required:
        - dense
      properties:
        dense:
          type: array
          items:
            type: array
            items:
              type: number
          description: Dense 向量列表（每项 1024 维 float）
        sparse:
          type: array
          nullable: true
          items:
            type: object
            properties:
              indices:
                type: array
                items:
                  type: integer
              values:
                type: array
                items:
                  type: number
          description: Sparse 向量列表（仅 return_sparse=true 时有值）

    EmbeddingHealthResponse:
      type: object
      required:
        - status
        - model
        - device
      properties:
        status:
          type: string
          enum: [ok, loading, unavailable]
        model:
          type: string
        device:
          type: string
        error:
          type: string
          nullable: true

    # --------------------------------------------------------------------------
    # 分层检索 schemas (Story 3-5)
    # --------------------------------------------------------------------------
    LayeredRetrievalRequest:
      type: object
      required:
        - query_text
      properties:
        query_text:
          type: string
          description: 查询文本
        target_level:
          type: string
          enum: ["L1", "L2", "L3", "L4"]
          default: "L4"
          description: 检索目标粒度层级
        direction:
          type: string
          enum: ["top_down", "bottom_up"]
          default: "top_down"
          description: 遍历方向（自顶向下/自底向上）
        collection:
          type: string
          default: "documents"
          description: Qdrant Collection 名称
        limit:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
          description: 返回结果数量限制
        tenant_id:
          type: string
          description: 租户标识符
        filter_payload:
          type: object
          description: Payload 过滤条件

    LayeredRetrievalResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/LayeredSearchResult"
        total:
          type: integer
          description: 结果总数
        query_text:
          type: string
          description: 原始查询文本
        target_level:
          type: string
          description: 实际检索目标层级

    LayeredSearchResult:
      type: object
      required:
        - id
        - score
      properties:
        id:
          type: string
          description: 向量点标识
        score:
          type: number
          format: float
          description: 相似度得分
        payload:
          type: object
          properties:
            parent_chunk_id:
              type: string
              nullable: true
              description: 父块 ID（L4 Child 结果时非空）
            child_count:
              type: integer
              description: 命中子块数（L3 回溯结果时）
            index_level:
              type: string
              enum: ["child", "parent", "document"]
              description: 索引层级
            parent_content:
              type: string
              description: 父块内容截断摘要（L4 展开结果时）
            content:
              type: string
              description: 块内容
            document_id:
              type: string
              description: 所属文档 ID

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes: {}
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token 认证
