<html lang="zh-CN">

<title>SISYS V5.0 · 战略偏差归因驾驶舱</title>
<style>

body{font-family:var(--f);background:var(--bg);color:var(--t1);overflow:hidden;height:100vh}

.sp-row{display:flex;align-items:center;gap:8px}.sp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.sp-dot.red{background:var(--d)}.sp-dot.amber{background:var(--w)}.sp-dot.green{background:var(--s)}
.sp-name{flex:1;font-weight:500}.sp-dev{font-family:var(--fm);font-weight:700;font-size:13px}.sp-dev.red{color:var(--d)}.sp-dev.amber{color:var(--w)}.sp-dev.green{color:var(--s)}

.chain-sp-agg{font-size:10px;color:var(--p);margin-bottom:8px;cursor:pointer}.chain-sp-agg:hover{text-decoration:underline}
.chain-bp{border:1px solid var(--bd);border-left:4px solid transparent;border-radius:8px;padding:12px;margin-bottom:8px;transition:all .3s;position:relative}

.chain-bp.critical{border-left-color:var(--d)}.chain-bp.at-risk{border-left-color:var(--w)}.chain-bp.on-track{border-left-color:var(--s)}
.chain-bp-name{font-weight:600;font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.chain-kpi-val{font-family:var(--fm);font-weight:700;font-size:16px}.chain-kpi-val.red{color:var(--d)}.chain-kpi-val.amber{color:var(--w)}.chain-kpi-val.green{color:var(--s)}
.chain-events{margin-top:8px;font-size:11px;color:var(--t2)}

.chain-event-imp{font-family:var(--fm);font-size:10px;padding:0 4px;border-radius:3px}.chain-event-imp.neg{background:var(--dn);color:var(--d)}.chain-event-imp.pos{background:var(--ok);color:var(--s)}

.chain-bp.ghost{opacity:.45;filter:grayscale(30%) blur(.3px);border:2px dashed var(--p)}

.chain-bp.ghost .ghost-banner{display:block}.chain-bp.ripple{animation:ghostPulse .3s ease-out}
.chain-path.ghosting{background:var(--db);border:1px dashed var(--p)}
.sp-item.ghost-glow{background:rgba(24,144,255,.08)}.sp-item.ghost-dim{opacity:.38;filter:grayscale(30%)}
.chain-bp.ghost-glow{border-color:var(--p);box-shadow:0 0 12px rgba(24,144,255,.2)}.chain-bp.ghost-dim{opacity:.38}
.toast-container{position:fixed;top:56px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:4px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:toastIn .3s ease-out}
.toast.success{background:#f6ffed;border:1px solid #b7eb8f;color:#135200}.toast.info{background:#e6f7ff;border:1px solid #91d5ff;color:#003a8c}
.ghost-bar{display:none;height:36px;flex-shrink:0;background:linear-gradient(90deg,#e6f7ff,#f0f5ff);border-bottom:1px solid var(--p);align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.ghost-bar.on{display:flex}
</style>

<body>
<div class="app">
<div class="header"><div class="header-brand">🎯 SISYS V5.0 · 战略偏差归因驾驶舱</div><div class="header-right"><span>XX公司 2026 SP-BP</span><span>👤 张总</span></div></div>
<div class="ghost-bar" id="ghostBar"><span>🔮 幽灵预览 — KPI目标调整中 · 未保存</span><span style="display:flex;gap:8px"><button class="chain-path" onclick="cancelPreview()" style="width:auto;padding:4px 12px">✖ 取消</button><button class="chain-path rec" onclick="applyPath()" style="width:auto;padding:4px 12px;background:var(--s);color:#fff;border-color:var(--s)">✓ 确认调整</button></span></div>
<div class="main">

</div>

</div>

<script>
// === Utils ===
function T(m,t){const c=document.getElementById('toasts'),e=document.createElement('div');e.className='toast '+(t||'info');e.textContent=m;c.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(()=>e.remove(),300)},3000)}
function S2C(s){return s>=70?'green':s>=40?'amber':'red'}

// === Data ===
const SPS=[
  {id:'sp1',name:'供应链自主可控',target:'国产化率≥67%',current:0,deviation:0,status:'critical',owner:'张总',tier:'strategic',bpIds:['bp1','bp2'],weight:[0.68,0.32]},
  {id:'sp2',name:'核心器件供应安全',target:'7类器件国产化',current:0,deviation:0,status:'at_risk',owner:'李明',tier:'strategic',bpIds:['bp3'],weight:[1.0]},
  {id:'sp3',name:'海外市场营收占比',target:'海外营收≥15%',current:0,deviation:0,status:'at_risk',owner:'赵总',tier:'strategic',bpIds:['bp4'],weight:[1.0]},
  {id:'sp4',name:'研发投入强度',target:'研发占比≥8%',current:0,deviation:0,status:'on_track',owner:'陈伟',tier:'execution',bpIds:['bp5'],weight:[1.0]},
  {id:'sp5',name:'人才梯队健康度',target:'继任率≥80%',current:0,deviation:0,status:'on_track',owner:'孙静',tier:'capability',bpIds:['bp6'],weight:[1.0]},
];
const BPIS=[
  {id:'bp1',cpId:'sp1',name:'供应商国产化替代计划',kpiName:'国产供应商签约率',kpiTarget:70,kpiActual:45,kpiUnit:'%',status:'critical',owner:'张总',budget:5.0,
    events:[{time:'2025-09',event:'鑫达贸易月度出货量下降23%',st:'danger',impact:-12,agent:'CMO Agent'},{time:'2025-10',event:'续约谈判推迟(第2次)',st:'warning',impact:-8,agent:'COO Agent'},{time:'2025-11',event:'⚠ 合同终止风险',st:'danger',impact:-15,agent:'AUD Agent'}],
    cf:{earliest:'2025-09-15',action:'启动备选供应商资质预审',agent:'CFO Agent',confidence:82,missed:63,hypoEvents:[{impact:20,label:'备选供应商替代'}]},
    paths:[{name:'分阶段推进 Q1→Q4',targetKpi:55,eff:'KPI偏差 35.7%→15%',cost:'额外供应商开发资源',time:'12个月',agent:'CFO Agent',confidence:78}],
    history:[{t:'W1',d:-22},{t:'W2',d:-25},{t:'W3',d:-29},{t:'W4',d:-32},{t:'W5',d:-30},{t:'W6',d:-33},{t:'W7',d:-35},{t:'W8',d:-35.7}]},
  {id:'bp2',cpId:'sp1',name:'供应链韧性提升计划',kpiName:'供应中断恢复时间',kpiTarget:48,kpiActual:72,kpiUnit:'h',status:'critical',owner:'张总',budget:2.4,
    events:[{time:'2025-08',event:'华东仓库水灾导致3天断供',st:'danger',impact:-18,agent:'COO Agent'}],
    cf:{earliest:'2025-07-01',action:'启动异地备灾仓库建设',agent:'COO Agent',confidence:71,missed:94,hypoEvents:[{impact:15,label:'备灾仓库启用'}]},
    paths:[{name:'加速异地仓库建设',targetKpi:55,eff:'恢复时间 72h→55h',cost:'¥8,000万追加投资',time:'6个月',agent:'COO Agent',confidence:65}],
    history:[{t:'W1',d:-35},{t:'W2',d:-38},{t:'W3',d:-42},{t:'W4',d:-45},{t:'W5',d:-48},{t:'W6',d:-47},{t:'W7',d:-49},{t:'W8',d:-50}]},
  {id:'bp3',cpId:'sp2',name:'核心器件国产替代专项',kpiName:'国产器件认证通过率',kpiTarget:80,kpiActual:55,kpiUnit:'%',status:'critical',owner:'李明',budget:3.2,
    events:[{time:'2025-07',event:'3类器件认证测试失败',st:'warning',impact:-10,agent:'CTO Agent'},{time:'2025-10',event:'供应商A退出竞标',st:'danger',impact:-15,agent:'CMO Agent'}],
    cf:{earliest:'2025-06-01',action:'启动备选认证实验室',agent:'CTO Agent',confidence:74,missed:112,hypoEvents:[{impact:12,label:'备选实验室'}]},
    paths:[{name:'引入第3方认证机构',targetKpi:65,eff:'偏差31%→18%',cost:'¥5,000万',time:'4个月',agent:'CTO Agent',confidence:68}],
    history:[{t:'W1',d:-21},{t:'W2',d:-24},{t:'W3',d:-26},{t:'W4',d:-28},{t:'W5',d:-29},{t:'W6',d:-30},{t:'W7',d:-31},{t:'W8',d:-31}]},
  {id:'bp4',cpId:'sp3',name:'东南亚市场落地计划',kpiName:'海外渠道签约数',kpiTarget:20,kpiActual:8,kpiUnit:'家',status:'critical',owner:'赵总',budget:1.8,
    events:[{time:'2025-04',event:'当地合规审批延迟4个月',st:'danger',impact:-22,agent:'AUD Agent'}],
    cf:{earliest:'2025-02-15',action:'提前启动当地法人注册',agent:'CMO Agent',confidence:69,missed:151,hypoEvents:[{impact:14,label:'提前注册'}]},
    paths:[{name:'加速合资公司设立',targetKpi:14,eff:'偏差60%→30%',cost:'¥3,000万',time:'3个月',agent:'CMO Agent',confidence:62}],
    history:[{t:'W1',d:-35},{t:'W2',d:-40},{t:'W3',d:-45},{t:'W4',d:-50},{t:'W5',d:-55},{t:'W6',d:-58},{t:'W7',d:-59},{t:'W8',d:-60}]},
  {id:'bp5',cpId:'sp4',name:'研发管线推进计划',kpiName:'专利申请数',kpiTarget:15,kpiActual:16,kpiUnit:'件',status:'on_track',owner:'陈伟',budget:6.0,events:[],cf:null,paths:[],
    history:[{t:'W1',d:3},{t:'W2',d:5},{t:'W3',d:4},{t:'W4',d:6},{t:'W5',d:7},{t:'W6',d:5},{t:'W7',d:6.7},{t:'W8',d:6.7}]},
  {id:'bp6',cpId:'sp5',name:'关键人才保留计划',kpiName:'关键岗位继任率',kpiTarget:80,kpiActual:72,kpiUnit:'%',status:'at_risk',owner:'孙静',budget:0.8,
    events:[{time:'2025-09',event:'2位总监级提出离职',st:'warning',impact:-5,agent:'CHO Agent'}],
    cf:{earliest:'2025-06-01',action:'提前启动股权激励方案',agent:'CHO Agent',confidence:76,missed:98,hypoEvents:[{impact:6,label:'股权激励'}]},
    paths:[{name:'加速股权激励落地',targetKpi:78,eff:'偏差10%→2.5%',cost:'¥2,000万',time:'2个月',agent:'CHO Agent',confidence:72}],
    history:[{t:'W1',d:-4},{t:'W2',d:-6},{t:'W3',d:-7},{t:'W4',d:-8},{t:'W5',d:-9},{t:'W6',d:-9},{t:'W7',d:-10},{t:'W8',d:-10}]},
];

// === State ===
let selSP='sp1',selBPI='bp1',ghost=false,ghostTarget=null,previewBpId=null,ghostStep='idle',ghostUndo=null;

// === V5.0 Compute Engine ===
function computeDeviation(bp){if(!bp)return 0;return Math.round((bp.kpiActual-bp.kpiTarget)/bp.kpiTarget*1000)/10}
function computeEventImpact(bp){if(!bp||!bp.events)return 0;return Math.round(bp.events.reduce((s,ev)=>s+(ev.impact||0),0)*10)/10}
function computeCounterfactual(bp){if(!bp||!bp.cf||!bp.cf.hypoEvents)return bp?computeDeviation(bp):0;const totalHypoImpact=bp.cf.hypoEvents.reduce((s,ev)=>s+(ev.impact||0),0);const cfActual=Math.max(0,bp.kpiActual+totalHypoImpact);return Math.round((cfActual-bp.kpiTarget)/bp.kpiTarget*1000)/10}
function computeDelta(bp){if(!bp||!bp.history||bp.history.length<2)return {value:0,dir:'flat'};const prev=bp.history[bp.history.length-2].d;const cur=bp.history[bp.history.length-1].d;const val=Math.round((cur-prev)*10)/10;return {value:val,dir:val>0.5?'better':val<-0.5?'worse':'flat'}}
function computeEMIndicator(bp){const d=computeDeviation(bp);if(d>=0)return {type:'success',label:'达标',cls:'green',score:0};const t=bp.trend||{};const slope=t.slope||0;if(slope<-0.3)return {type:'execution_lag',label:'执行滞后',cls:'amber',score:0.3};if(slope>=-0.3&&slope<=0.3&&bp.history&&bp.history.length>=2){const r=bp.history.slice(-2);if(r[1].d<=r[0].d)return {type:'execution_stalled',label:'执行停滞',cls:'amber',score:0.6}}if(slope>0.3)return {type:'strategy_failure',label:'策略失效',cls:'red',score:0.8};if(bp.cf&&bp.cf.confidence<40)return {type:'strategy_infeasible',label:'策略不可行',cls:'red',score:0.9};return {type:'execution_stalled',label:'执行停滞',cls:'amber',score:0.5}}
function computeCoverage(){const total=SPS.length;const mapped=SPS.filter(s=>s.bpIds.length>0).length;const pct=Math.round(mapped/total*100);return {mapped,total,pct,cls:pct>=95?'green':pct>=85?'amber':'red'}}
function projectTrend(bp){if(!bp||!bp.history||bp.history.length<2){if(bp)bp.trend={slope:0,projected:computeDeviation(bp),warn:false};return bp?bp.trend:{slope:0,projected:0,warn:false};}const h=bp.history;let sTotal=0,wTotal=0;for(let i=1;i<h.length;i++){const days=(h.length-i)*7;const w=Math.exp(-days/30);wTotal+=w;sTotal+=(h[i].d-h[i-1].d)/7*w}const slope=wTotal>0?Math.round(sTotal/wTotal*1000)/1000:0;const projected=Math.round((computeDeviation(bp)+slope*30)*10)/10;const warn=projected<-20;bp.trend={slope,projected,warn};return bp.trend}
function aggregateSPDeviation(spId){const sp=SPS.find(s=>s.id===spId);if(!sp||!sp.bpIds.length)return 0;const bps=BPIS.filter(b=>b.cpId===spId);let wSum=0,dSum=0;for(let i=0;i<bps.length;i++){const d=computeDeviation(bps[i]);const w=sp.weight[i]||1/bps.length;wSum+=w;dSum+=d*w}const avg=Math.round(dSum/wSum*10)/10;sp.deviation=avg;sp.current=Math.round(bps.reduce((s,bp)=>s+bp.kpiActual,0)/bps.length);sp.status=sp.deviation<-20?'critical':sp.deviation<-10?'at_risk':'on_track';return avg}

// === Derive ===
function getSP(id){return SPS.find(s=>s.id===id)}
function getBPI(id){return BPIS.find(b=>b.id===id)}
function getBPIsBySP(spId){return BPIS.filter(b=>b.cpId===spId)}
function bpStatus(bp){const d=computeDeviation(bp);return d<-20?'critical':d<-10?'at_risk':'on_track'}
function bpStatusCls(bp){const s=bpStatus(bp);return s==='critical'?'critical':s==='at_risk'?'at-risk':'on-track'}

// === V5.0: Trend Sparkline (SVG) ===
function renderSparkline(bp){
  if(!bp||!bp.history||bp.history.length<2)return '';
  const pts=bp.history;const max=Math.max(...pts.map(p=>Math.abs(p.d)),1);
  const str=pts.map((p,i)=>{const x=Math.round(i/(pts.length-1)*55);const y=Math.round(10-(p.d/max)*8);return x+','+y}).join(' ');
  const last=pts[pts.length-1].d,first=pts[0].d;const clr=last>first?'var(--s)':last<first?'var(--d)':'var(--t3)';
  return `<svg class="sparkline-svg" viewBox="0 0 55 20"><polyline points="${str}" fill="none" stroke="${clr}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
}

// === Render: SP List (左) ===
function renderSPList(){
  const el=document.getElementById('spPanel');
  const sorted=[...SPS].sort((a,b)=>a.deviation-b.deviation);let h='';
  for(const sp of sorted){
    const cls=['sp-item'];if(sp.id===selSP)cls.push('on');
    if(ghost){const affected=getSP(selSP);if(affected&&affected.bpIds.some(bid=>getBPI(bid)?.cpId===sp.id))cls.push('ghost-glow');else if(sp.id!==selSP)cls.push('ghost-dim');}
    const bps=getBPIsBySP(sp.id);
    h+=`<div class="${cls.join(' ')}" onclick="onSelectSP('${sp.id}')"><div class="sp-row"><span class="sp-dot ${sp.status==='critical'?'red':sp.status==='at_risk'?'amber':'green'}"></span><span class="sp-name">${sp.name}</span><span class="sp-dev ${sp.status==='critical'?'red':sp.status==='at_risk'?'amber':'green'}">${sp.deviation>0?'+':''}${sp.deviation}%</span></div><div class="sp-meta">← 来自${bps.length}个BP (加权聚合)</div>`;
    for(const bp of bps){const d=computeDeviation(bp);h+=`<div class="sp-sub" onclick="event.stopPropagation();onSelectBPI('${bp.id}')"><span class="sp-sub-dot ${d<-20?'red':d<-10?'amber':'green'}"></span>${bp.name} ${d}%</div>`;}
    h+=`</div>`;
  }
  const cov=computeCoverage();
  h+=`<div class="sp-cover"><span class="sp-cover-ring ${cov.cls}">${cov.pct}%</span><span>SP→BP 映射覆盖率<br>${cov.mapped}/${cov.total} SP已映射${cov.pct<100?' · '+(cov.total-cov.mapped)+'个缺口':''}</span></div>`;
  el.innerHTML=h;
}

// === Render: Causal Chain (中) ===
function renderCausalChain(){
  const el=document.getElementById('chainPanel');const sp=getSP(selSP);if(!sp)return;
  const bps=getBPIsBySP(selSP);const spW=sp.weight||[];
  let h=`<div class="chain-sp">${sp.status==='critical'?'🔴':sp.status==='at_risk'?'🟡':'🟢'} SP: ${sp.name}</div>`;
  h+=`<div class="chain-sp-target">目标: ${sp.target} · 偏差: ${sp.deviation>0?'+':''}${sp.deviation}% · ${sp.owner}(${sp.tier})</div>`;
  h+=`<div class="chain-sp-agg" title="SP偏差 = Σ(BP偏差 × 权重) / Σ(权重)">📐 聚合: `;
  for(let i=0;i<bps.length;i++){const d=computeDeviation(bps[i]);h+=`${bps[i].name.split('').slice(0,4).join('')}(${d}%×${Math.round((spW[i]||1/bps.length)*100)}%)`;if(i<bps.length-1)h+=' + ';}
  h+=` = ${sp.deviation}%</div>`;
  for(const bp of bps){
    const d=computeDeviation(bp);const delta=computeDelta(bp);const em=computeEMIndicator(bp);const cls=['chain-bp',bpStatusCls(bp)];if(bp.id===selBPI)cls.push('on');
    if(ghost){if(bp.id===previewBpId)cls.push('ghost');else if(sp.bpIds.includes(bp.id))cls.push('ghost-glow');else cls.push('ghost-dim')}
    if(ghostStep==='ripple'&&bp.id===previewBpId)cls.push('ripple');
    h+=`<div class="${cls.join(' ')}" onclick="onSelectBPI('${bp.id}')">`;
    if(ghost&&bp.id===previewBpId)h+=`<div class="ghost-banner">🔮 幽灵预览 · KPI目标调整中</div>`;
    h+=`<div class="chain-bp-name">${d<-20?'🔴':d<-10?'🟡':'🟢'} BP: ${bp.name} · ${bp.owner} · ¥${bp.budget}亿 <span class="delta-tag ${delta.dir==='worse'?'worse':delta.dir==='better'?'better':'flat'}">${delta.dir==='worse'?'↓恶化':delta.dir==='better'?'↑改善':'→持平'} ${Math.abs(delta.value)}pp</span> <span class="em-tag ${em.cls}">EM:${em.label}</span> ${renderSparkline(bp)}</div>`;
    h+=`<div class="chain-kpi"><div class="chain-kpi-item">目标<span class="chain-kpi-val">${bp.kpiTarget}${bp.kpiUnit}</span></div><div class="chain-kpi-item">实际<span class="chain-kpi-val ${S2C(bp.kpiActual/bp.kpiTarget*100)}">${bp.kpiActual}${bp.kpiUnit}</span></div><div class="chain-kpi-item">偏差<span class="chain-kpi-val ${d<-20?'red':d<-10?'amber':'green'}">${d>0?'+':''}${d}%</span></div></div>`;
    if(ghost&&bp.id===previewBpId&&ghostTarget!==null){
      const oldTarget=bp.kpiTarget;const previewActual=Math.round(bp.kpiActual+(ghostTarget-oldTarget)*0.6);const previewDev=Math.round((previewActual-ghostTarget)/ghostTarget*100);
      h+=`<div class="chain-kpi" style="opacity:.7;border:1px dashed var(--p);border-radius:4px"><div class="chain-kpi-item">预览目标<span class="chain-kpi-val" style="color:var(--p)">${ghostTarget}${bp.kpiUnit}</span></div><div class="chain-kpi-item">预估实际<span class="chain-kpi-val" style="color:var(--p)">${previewActual}${bp.kpiUnit}</span></div><div class="chain-kpi-item">预估偏差<span class="chain-kpi-val" style="color:var(--p)">${previewDev}%</span></div></div>`;
    }
    if(ghost&&bp.id!==previewBpId&&sp.bpIds.includes(bp.id)&&ghostTarget!==null){
      const previewBp=getBPI(previewBpId);if(previewBp){
        const rippleFactor=0.3;const previewDelta=(ghostTarget-previewBp.kpiTarget)*rippleFactor*(bp.budget/(previewBp.budget+bp.budget));
        const sibActual=Math.round(Math.max(0,bp.kpiActual+previewDelta));const sibDev=Math.round((sibActual-bp.kpiTarget)/bp.kpiTarget*100);
        h+=`<div class="chain-kpi" style="opacity:.5;border:1px dashed var(--bd);border-radius:4px"><div class="chain-kpi-item">🌊涟漪<span class="chain-kpi-val" style="color:var(--t3)">${sibActual}${bp.kpiUnit}</span></div><div class="chain-kpi-item">涟漪偏差<span class="chain-kpi-val" style="color:var(--t3)">${sibDev}%</span></div></div>`;
      }
    }
    if(bp.trend&&bp.trend.warn)h+=`<div class="chain-trend warn">⚠ 按当前趋势，30天后偏差将达 ${bp.trend.projected}% (超危险阈值-20%)</div>`;
    if(bp.events&&bp.events.length>0){h+=`<div class="chain-events">`;const totalImp=computeEventImpact(bp);for(const ev of bp.events){h+=`<div class="chain-event"><span class="chain-event-time">${ev.time}</span>${ev.event} <span class="chain-event-imp ${(ev.impact||0)<0?'neg':'pos'}">${(ev.impact||0)>0?'+':''}${ev.impact||0}pp</span><span class="agent-badge">🤖 ${ev.agent||'AI'}</span></div>`;}h+=`<div style="font-size:10px;color:var(--t3);margin-top:2px">Σimpact = ${totalImp}pp · 当前偏差 = ${d}%</div></div>`;}
    if(bp.paths&&bp.paths.length>0){h+=`<div class="chain-paths">`;for(let i=0;i<bp.paths.length;i++){const p=bp.paths[i];h+=`<div class="chain-path${i===0?' rec':''}${ghost&&previewBpId===bp.id&&ghostTarget===p.targetKpi?' ghosting':''}" onclick="event.stopPropagation();previewPath('${bp.id}',${i})"><span class="chain-path-name">${p.name}</span> · ${p.eff}<br><span class="agent-badge">🤖 ${p.agent||'AI'} · ${p.confidence||'—'}%</span></div>`;}h+=`</div>`;}
    if(bp.paths&&bp.paths.length>0)h+=`<div style="margin-top:4px"><span class="chain-path rec" onclick="event.stopPropagation();oneClickCorrect('${bp.id}',0)" style="display:inline-block;padding:4px 12px;font-size:11px;cursor:pointer">⚡ 一键纠正</span></div>`;
    h+=`</div>`;
  }
  el.innerHTML=h;
}

// === Render: Counterfactual (右) ===
function renderCounterfactual(){
  const el=document.getElementById('cfPanel');const bp=getBPI(selBPI);
  if(!bp){el.innerHTML='<div class="cf-title">💡 反事实推演</div><div style="font-size:12px;color:var(--t3)">← 选择BP举措查看反事实分析</div>';return;}
  let h=`<div class="cf-title">💡 反事实推演</div>`;
  if(!bp.cf){h+=`<div style="font-size:12px;color:var(--t2)">该举措暂无反事实分析数据</div>`;}else{
    const cfDev=computeCounterfactual(bp);const curDev=computeDeviation(bp);const delta=computeDelta(bp);
    h+=`<div class="cf-card"><div class="cf-card-title">如果当时...</div><div class="agent-badge" style="margin-bottom:6px">🤖 ${bp.cf.agent||'AI'} 推演 · 置信度 ${bp.cf.confidence||'—'}%</div><div style="font-size:11px;color:var(--t2);margin-bottom:6px">在 <b>${bp.cf.earliest}</b><br>${bp.cf.action}</div><div class="cf-compare"><span class="cf-cur">当前 ${curDev}%<br><small>趋势: ${delta.dir==='worse'?'↓恶化':delta.dir==='better'?'↑改善':'→持平'} ${Math.abs(delta.value)}pp</small></span><span class="cf-arrow">→</span><span class="cf-pre">反事实 ${cfDev>0?'+':''}${cfDev}%</span></div><div style="font-size:11px;color:var(--s)">📐 改善 +${Math.round((cfDev-curDev)*10)/10}pp</div><div class="cf-missed">⏰ 错过 ${bp.cf.missed} 天最佳干预窗口</div></div>`;
  }
  if(bp.trend&&bp.trend.warn)h+=`<div class="chain-trend warn" style="margin-bottom:8px">⚠ 30日预警: 偏差将达 ${bp.trend.projected}%</div>`;
  if(bp.paths&&bp.paths.length>0){h+=`<div style="font-size:12px;font-weight:600;margin-bottom:6px">🟢 修正路径</div>`;for(let i=0;i<bp.paths.length;i++){const p=bp.paths[i];h+=`<div class="chain-path${i===0?' rec':''}" onclick="previewPath('${bp.id}',${i})"><span class="chain-path-name">${p.name}</span><br><span class="chain-path-eff">${p.eff}</span><br><span class="agent-badge">🤖 ${p.agent||'AI'} · ${p.confidence||'—'}%</span></div>`;}}
  const em=computeEMIndicator(bp);h+=`<div class="cf-card" style="margin-top:8px"><div class="cf-card-title">🔍 EM 诊断</div><span class="em-tag ${em.cls}">${em.label}</span><span style="font-size:11px;color:var(--t2);margin-left:6px">${em.type==='success'?'偏差在目标范围内':em.type==='execution_lag'?'方向正确，执行速度不够':em.type==='execution_stalled'?'连续两期无改善，需排查阻力':em.type==='strategy_failure'?'偏差加速扩大，当前策略可能失效':em.type==='strategy_infeasible'?'反事实推演无法在合理周期内达标':'数据不足'}</span></div>`;
  if(!ghost&&bp.paths&&bp.paths.length>0)h+=`<div style="margin-top:10px"><span class="chain-path rec" onclick="oneClickCorrect('${selBPI}',0)" style="display:block;padding:8px;text-align:center;font-size:12px;cursor:pointer">⚡ 启动纠正措施</span></div>`;
  el.innerHTML=h;
}

// === Render: Bottom Bar (底) ===
function renderBottomBar(){
  const el=document.getElementById('bottomBar');
  if(ghost){const bp=getBPI(previewBpId);const sp=bp?getSP(bp.cpId):null;const spDev=sp?aggregateSPDeviation(sp.id):0;el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;width:100%;color:var(--p);font-weight:600">🔮 KPI目标: ${bp?bp.kpiTarget:''}→${ghostTarget}${bp?bp.kpiUnit:''} · SP聚合偏差预览: ${spDev}% · ${ghostStep==='ripple'?'🌊 涟漪评估中...':'预览中'}</div>`;return;}
  const criticals=BPIS.filter(b=>bpStatus(b)==='critical').slice(0,3);let acts='';
  for(let i=0;i<criticals.length;i++){const bp=criticals[i];const sp=getSP(bp.cpId);const p=bp.paths&&bp.paths[0]?bp.paths[0]:null;const d=computeDeviation(bp);const delta=computeDelta(bp);
    acts+=`<div class="bb-act red" onclick="onSelectSP('${bp.cpId}');onSelectBPI('${bp.id}')"><span class="bb-act-num">${i+1}.</span>${p?p.name:bp.name} (偏差${d}%, ${delta.dir==='worse'?'↓恶化':delta.dir==='better'?'↑改善':'→持平'}${Math.abs(delta.value)}pp)<br><span class="bb-act-from">关联SP: ${sp?sp.name:''} · ${bp.owner}</span><br><span class="agent-badge">🤖 ${p?p.agent||'AI':'—'} · ${p?p.confidence||'—':'—'}%</span></div>`;}
  el.innerHTML=`<span style="font-weight:600;white-space:nowrap">📌 今日行动 (${criticals.length}项)</span><div class="bb-actions">${acts}</div>`;
}

// === Render All ===
function renderAll(){renderSPList();renderCausalChain();renderCounterfactual();renderBottomBar();document.getElementById('ghostBar').classList.toggle('on',ghost)}

// === Interaction ===
function onSelectSP(spId){selSP=spId;const bps=getBPIsBySP(spId);selBPI=bps.length>0?bps[0].id:null;if(ghost){ghost=false;ghostTarget=null;previewBpId=null;ghostStep='idle';ghostUndo=null;}renderAll()}
function onSelectBPI(bpId){selBPI=bpId;renderAll()}
function previewPath(bpId,idx){const bp=getBPI(bpId);if(!bp||!bp.paths||!bp.paths[idx])return;ghost=true;ghostTarget=bp.paths[idx].targetKpi;previewBpId=bpId;ghostStep='preview';renderAll();T('🔮 幽灵预览: '+bp.paths[idx].name+' · 🤖 '+bp.paths[idx].agent+' 置信度'+(bp.paths[idx].confidence||'—')+'%','info')}
function cancelPreview(){ghost=false;ghostTarget=null;previewBpId=null;ghostStep='idle';ghostUndo=null;renderAll()}
function oneClickCorrect(bpId,idx){const bp=getBPI(bpId);if(!bp||!bp.paths||!bp.paths[idx])return;ghost=true;ghostTarget=bp.paths[idx].targetKpi;previewBpId=bpId;ghostStep='preview';ghostUndo={bpId:bpId,prevTarget:bp.kpiTarget};renderAll();setTimeout(()=>{ghostStep='ripple';renderAll();T('🌊 涟漪评估: 正在计算跨BP影响...','info');setTimeout(()=>{ghostStep='confirm';renderAll()},600)},400)}
function applyPath(){const bp=getBPI(previewBpId);if(!bp||ghostTarget===null)return;const oldTarget=bp.kpiTarget;bp.kpiTarget=ghostTarget;bp.kpiActual=Math.round(Math.max(0,bp.kpiActual+(ghostTarget-oldTarget)*0.6));if(bp.history&&bp.history.length>0){bp.history.push({t:'W'+(bp.history.length+1),d:computeDeviation(bp)});if(bp.history.length>12)bp.history.shift()}projectTrend(bp.id);aggregateSPDeviation(bp.cpId);ghost=false;ghostTarget=null;previewBpId=null;ghostStep='idle';ghostUndo=null;renderAll();T('✅ 路径已应用 · KPI目标 '+oldTarget+'→'+bp.kpiTarget+bp.kpiUnit+' · SP偏差已重算 · 可按 ESC 撤销','success')}

// === Init ===
document.addEventListener('DOMContentLoaded',()=>{for(const sp of SPS)aggregateSPDeviation(sp.id);for(const bp of BPIS)projectTrend(bp.id);selSP=SPS.reduce((a,b)=>(a.deviation<b.deviation)?a:b,SPS[0]).id;const bps=getBPIsBySP(selSP);selBPI=bps.length>0?bps[0].id:null;renderAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ghost){if(ghostUndo){const bp=getBPI(ghostUndo.bpId);if(bp)bp.kpiTarget=ghostUndo.prevTarget;ghostUndo=null;T('↺ 已撤销 · 恢复原始KPI目标','info')}cancelPreview()}});
</script>
