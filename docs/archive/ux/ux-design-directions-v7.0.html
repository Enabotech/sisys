      history:[{t:'W1',d:-4},{t:'W2',d:-6},{t:'W3',d:-7},{t:'W4',d:-8},{t:'W5',d:-9},{t:'W6',d:-9},{t:'W7',d:-10},{t:'W8',d:-10}],

//=== State ===
let selNodeId='bp1',ghost=false,ghostTarget=null,previewNodeId=null,ghostStep='idle',ghostUndo=null,advisorDismissed=false;

//=== Compute Engine ===
function computeDeviation(node){if(!node||node.type!=='bp')return 0;return Math.round((node.kpiActual-node.kpiTarget)/node.kpiTarget*1000)/10}
function computeEventImpact(node){if(!node||!node.events)return 0;return Math.round(node.events.reduce((s,ev)=>s+(ev.impact||0),0)*10)/10}
function computeCounterfactual(node){if(!node||!node.cf||!node.cf.hypoEvents)return node?computeDeviation(node):0;const totalHypoImpact=node.cf.hypoEvents.reduce((s,ev)=>s+(ev.impact||0),0);const cfActual=Math.max(0,node.kpiActual+totalHypoImpact);return Math.round((cfActual-node.kpiTarget)/node.kpiTarget*1000)/10}
function computeDelta(node){if(!node||!node.history||node.history.length<2)return {value:0,dir:'flat'};const prev=node.history[node.history.length-2].d;const cur=node.history[node.history.length-1].d;const val=Math.round((cur-prev)*10)/10;const posGain=cur>=0&&prev>=0;const improving=posGain?val>0.5:val<-0.5;const worsening=posGain?val<-0.5:val>0.5;return {value:Math.abs(val),dir:improving?'better':worsening?'worse':'flat'}}
function computeEMIndicator(node){const d=computeDeviation(node);if(d>=0)return {type:'success',label:'达标',cls:'green'};const t=node.trend||{};const slope=t.slope||0;if(slope<-0.3)return {type:'execution_lag',label:'执行滞后',cls:'amber'};if(slope>=-0.3&&slope<=0.3&&node.history&&node.history.length>=2){const r=node.history.slice(-2);if(r[1].d>r[0].d)return {type:'execution_lag',label:'执行改善中',cls:'amber'};if(r[1].d<=r[0].d)return {type:'execution_stalled',label:'执行停滞',cls:'amber'}}if(slope>0.3)return {type:'strategy_failure',label:'策略失效',cls:'red'};return {type:'execution_stalled',label:'执行停滞',cls:'amber'}}
function projectTrend(node){if(!node||!node.history||node.history.length<2){if(node)node.trend={slope:0,projected:computeDeviation(node),warn:false};return node?node.trend:{slope:0,projected:0,warn:false}}const h=node.history;let sTotal=0,wTotal=0;for(let i=1;i<h.length;i++){const days=(h.length-i)*7;const w=Math.exp(-days/30);wTotal+=w;sTotal+=(h[i].d-h[i-1].d)/7*w}const slope=wTotal>0?Math.round(sTotal/wTotal*1000)/1000:0;const projected=Math.round((computeDeviation(node)+slope*30)*10)/10;node.trend={slope,projected,warn:projected<-20};return node.trend}
function aggregateSPDeviation(sp){if(!sp||!sp.children)return 0;const bps=sp.children.filter(c=>c.type==='bp');if(!bps.length)return 0;let wSum=0,dSum=0;for(const bp of bps){const d=computeDeviation(bp);const w=bp.weight||1/bps.length;wSum+=w;dSum+=d*w}const avg=Math.round(dSum/wSum*10)/10;sp.deviation=avg;sp.status=avg<-20?'critical':avg<-10?'at_risk':'on_track';return avg}
// V7.0 NEW: Post-Apply Effect Verification
function computeEffect(node,oldDev){if(!node)return {improved:false,delta:0,recommendation:'rollback'};const newDev=computeDeviation(node);const delta=Math.round((newDev-oldDev)*10)/10;return {improved:newDev>oldDev,delta:Math.abs(delta),recommendation:newDev>oldDev?'keep':'rollback'}}
// V7.0: Execution Guard
function canRecommend(node){return node&&node.type==='bp'&&['idle','dismissed'].includes(node.execState)&&computeDeviation(node)<-20}
function findNode(id,root=ROOT){if(root.id===id)return root;if(!root.children)return null;for(const c of root.children){const f=findNode(id,c);if(f)return f}return null}
function findSP(spId){for(const c of ROOT.children)if(c.id===spId)return c;return null}

//=== Render: Pulse Bar ===
function renderPulse(){
  const el=document.getElementById('pulseBar');const allBp=[];for(const sp of ROOT.children)for(const c of sp.children)if(c.type==='bp')allBp.push(c);
  const total=allBp.length;const critical=allBp.filter(b=>computeDeviation(b)<-20).length;const atRisk=allBp.filter(b=>{const d=computeDeviation(b);return d>=-20&&d<-10}).length;const onTrack=total-critical-atRisk;
  const spHealth=Math.round(ROOT.children.filter(s=>s.status==='on_track').length/ROOT.children.length*100);
  el.innerHTML=`<div class="pulse-item"><span class="pulse-dot red"></span>SP健康 ${spHealth}%</div><div class="pulse-item"><span class="pulse-dot amber"></span>BP: <span class="pulse-val red">${critical}</span>恶化 <span class="pulse-val amber">${atRisk}</span>关注 <span class="pulse-val green">${onTrack}</span>达标</div><div style="flex:1"></div><span style="font-size:10px;color:var(--t3)">EM 监控运行中 · ${new Date().toLocaleTimeString()}</span>`;
}

//=== Render: SP-BP-EM Tree ===
function renderTree(){
  const el=document.getElementById('treePanel');let h='';
  for(const sp of ROOT.children){
    h+=`<div class="tree-node"><div class="tree-row sp ${sp.status}" onclick="onSelectNode('${sp.id}')"><span class="tree-dot ${sp.status==='critical'?'red':sp.status==='at_risk'?'amber':'green'}"></span><span class="tree-name">📁 SP: ${sp.label} · ${sp.owner}</span><span class="tree-dev ${sp.status==='critical'?'red':sp.status==='at_risk'?'amber':'green'}">${sp.deviation>0?'+':''}${sp.deviation}%</span><span class="tree-meta">← ${sp.children.length}个BP</span></div>`;
    h+=`<div class="tree-indent">`;
    for(const bp of sp.children.filter(c=>c.type==='bp')){
      const d=computeDeviation(bp);const delta=computeDelta(bp);const em=computeEMIndicator(bp);const isSel=bp.id===selNodeId;
      const rowCls=['tree-row',d<-20?'critical':d<-10?'at-risk':'on-track'];if(isSel)rowCls.push('sel');if(ghost&&bp.id===previewNodeId)rowCls.push('ghost-glow');if(ghost&&bp.id!==previewNodeId)rowCls.push('ghost-dim');if(bp.execState==='verifying')rowCls.push('verifying');
      h+=`<div class="tree-node"><div class="${rowCls.join(' ')}" onclick="onSelectNode('${bp.id}')"><span class="tree-dot ${d<-20?'red':d<-10?'amber':'green'}"></span><span class="tree-name">├─ BP: ${bp.label} · ${bp.owner}</span><span class="tree-dev ${d<-20?'red':d<-10?'amber':'green'}">${d>0?'+':''}${d}%</span><span class="delta-tag ${delta.dir}">${delta.dir==='worse'?'↓恶化':delta.dir==='better'?'↑改善':'→持平'}${delta.value}pp</span><span class="em-tag ${em.cls}">${em.label}</span>${renderSparkline(bp)}`;
      // Exec state badge
      if(bp.execState==='applied')h+=`<span class="exec-badge applied">已纠正</span>`;
      else if(bp.execState==='verified_improved')h+=`<span class="exec-badge improved">✅改善+${bp.execResult?bp.execResult.delta:''}pp</span>`;
      else if(bp.execState==='verified_worsened')h+=`<span class="exec-badge worsened">⚠恶化</span>`;
      else if(bp.execState==='verifying')h+=`<span class="exec-badge applied">验证中...</span>`;
      // Correct button
      if(bp.paths&&bp.paths.length>0){
        const disabled=['applied','verified_improved','verified_worsened','verifying'].includes(bp.execState);
        h+=`<button class="correct-btn${disabled?' done':''}" ${disabled?'disabled':''} onclick="event.stopPropagation();oneClickCorrect('${bp.id}',0)" title="${disabled?'已执行过纠正':canRecommend(bp)?'一键纠正偏差':'偏差未达纠正阈值'}">⚡${disabled?'已纠正':'纠正'}</button>`;
      }
      h+=`</div>`;
      // Ghost preview row
      if(ghost&&bp.id===previewNodeId&&ghostTarget!==null){
        const oldTarget=bp.kpiTarget;const previewActual=Math.round(bp.kpiActual+(ghostTarget-oldTarget)*0.6);const previewDev=Math.round((previewActual-ghostTarget)/ghostTarget*100);
        h+=`<div class="tree-indent"><div class="tree-row" style="border:1px dashed var(--p);border-radius:4px;opacity:.9"><span style="color:var(--p);font-size:11px">🔮 预览: 目标${ghostTarget}${bp.kpiUnit} · 预估实际${previewActual}${bp.kpiUnit} · 预估偏差${previewDev}%</span></div></div>`;
      }
      // Ripple row
      if(ghost&&bp.id!==previewNodeId&&ghostTarget!==null&&sp.children.filter(c=>c.type==='bp').some(c=>c.id===previewNodeId)){
        const previewBp=findNode(previewNodeId);if(previewBp){const rf=0.3;const pd=(ghostTarget-previewBp.kpiTarget)*rf*(bp.budget/(previewBp.budget+bp.budget));const sa=Math.round(Math.max(0,bp.kpiActual+pd));const sd=Math.round((sa-bp.kpiTarget)/bp.kpiTarget*100);
          h+=`<div class="tree-indent"><div class="tree-row" style="border:1px dashed var(--bd);border-radius:4px;opacity:.5;font-size:10px;color:var(--t3)">🌊涟漪: ${sa}${bp.kpiUnit} · 偏差${sd}%</div></div>`;}
      }
      if(isSel&&bp.events&&bp.events.length>0){h+=`<div class="tree-indent"><div style="font-size:10px;color:var(--t2);padding:4px 0">`;const ti=computeEventImpact(bp);for(const ev of bp.events){h+=`<div style="display:flex;gap:4px;padding:1px 0"><span style="color:var(--t3);width:42px">${ev.time}</span>${ev.event} <span style="font-family:var(--fm);font-size:9px;padding:0 3px;border-radius:2px;${(ev.impact||0)<0?'background:var(--dn);color:var(--d)':'background:var(--ok);color:var(--s)'}">${(ev.impact||0)>0?'+':''}${ev.impact||0}pp</span> 🤖${ev.agent}</div>`;}h+=`<div style="margin-top:2px;color:var(--t3)">Σimpact=${ti}pp · 偏差=${d}%</div></div></div>`;}
      if(isSel&&bp.paths&&bp.paths.length>0){h+=`<div class="tree-indent"><div style="font-size:10px;padding:4px 0">`;for(let i=0;i<bp.paths.length;i++){const p=bp.paths[i];h+=`<div style="padding:2px 6px;border:1px solid var(--bd);border-radius:4px;margin-bottom:2px;cursor:pointer;font-size:10px" onclick="event.stopPropagation();previewPath('${bp.id}',${i})">${p.name} · ${p.eff} · ${p.cost} · ${p.time} · 🤖${p.agent} ${p.confidence}%</div>`;}h+=`</div></div>`;}
      h+=`</div>`;
    }
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

//=== Sparkline ===
function renderSparkline(node){
  if(!node||!node.history||node.history.length<2)return '';
  const pts=node.history;const max=Math.max(...pts.map(p=>Math.abs(p.d)),1);
  const str=pts.map((p,i)=>{const x=Math.round(i/(pts.length-1)*40);const y=Math.round(7-(p.d/max)*5);return x+','+y}).join(' ');
  const last=pts[pts.length-1].d,first=pts[0].d;const posBase=last>=0&&first>=0;const clr=posBase?(last>first?'var(--s)':last<first?'var(--d)':'var(--t3)'):(last>first?'var(--s)':last<first?'var(--d)':'var(--t3)');
  return `<svg class="sparkline-svg" viewBox="0 0 40 14"><polyline points="${str}" fill="none" stroke="${clr}" stroke-width="1.2"/></svg>`;
}

//=== Render: Debate Panel ===
const DEBATES=[
  {agent:'CEO Agent',stance:'pro',text:'优先纠正BP-01，这是最关键的差距来源',confidence:78},
  {agent:'CFO Agent',stance:'neutral',text:'需要评估纠正成本vs预期收益，建议先做敏感性模拟',confidence:62},
  {agent:'CMO Agent',stance:'con',text:'应先稳住BP-02，客户流失成本更高，渠道覆盖优先',confidence:55},
  {agent:'CTO Agent',stance:'pro',text:'BP-01的技术方案已就绪，可立即启动执行',confidence:71},
  {agent:'COO Agent',stance:'neutral',text:'执行资源需跨BU调配，建议Q1分阶段推进',confidence:53},
  {agent:'CHO Agent',stance:'con',text:'华东区销售招聘周期需4个月，短期人力支撑不足',confidence:45},
];
function renderDebate(){
  const el=document.getElementById('debatePanel');let h=`<div class="debate-title">🗣 Agent 辩论室</div>`;
  for(const d of DEBATES){
    h+=`<div class="debate-item"><div class="debate-agent">🤖 ${d.agent} <span class="debate-stance ${d.stance}">${d.stance==='pro'?'赞同':d.stance==='con'?'反对':'中立'}</span></div><div class="debate-text">${d.text}</div><div class="debate-bar"><div class="debate-bar-fill" style="width:${d.confidence}%"></div></div><div style="font-size:9px;color:var(--t3);margin-top:2px">置信度 ${d.confidence}%</div></div>`;
  }
  const consensus=Math.round(DEBATES.reduce((s,d)=>s+d.confidence*(d.stance==='pro'?1:d.stance==='neutral'?0.5:0),0)/DEBATES.length);
  h+=`<div style="margin-top:8px;font-size:11px;color:var(--p);font-weight:600">共识度 ${consensus}% · 建议: 优先BP-01，同步关注BP-02</div>`;
  el.innerHTML=h;
}

//=== Render: Trend Chart ===
function renderTrend(){
  const el=document.getElementById('trendPanel');const w=el.clientWidth-48,h=el.clientHeight-24;if(w<=0||h<=0)return;
  const allBp=[];for(const sp of ROOT.children)for(const c of sp.children)if(c.type==='bp')allBp.push(c);
  const maxHist=Math.max(...allBp.map(b=>b.history?b.history.length:0),0);if(maxHist===0){el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3);font-size:11px">趋势数据采集中...</div>';return}
  const colors=['#f87171','#fbbf24','#60a5fa','#4ade80','#c084fc','#fb923c'];
  let svg=`<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs>`;
  for(let i=0;i<allBp.length;i++){const b=allBp[i];if(!b.history||!b.history.length)continue;
    svg+=`<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colors[i]}" stop-opacity="0.15"/><stop offset="100%" stop-color="${colors[i]}" stop-opacity="0"/></linearGradient>`;
  }
  svg+=`</defs>`;
  const allMax=Math.max(...allBp.flatMap(b=>b.history?b.history.map(p=>Math.abs(p.d)):[0]),1);const allMin=-allMax;
  const yRange=allMax-allMin||1;const stepX=w/Math.max(maxHist-1,1);
  for(let i=0;i<allBp.length;i++){const b=allBp[i];if(!b.history||!b.history.length)continue;const pts=b.history.map((p,j)=>{const x=Math.round(j*stepX);const y=Math.round((1-(p.d-allMin)/yRange)*h);return x+','+y}).join(' ');
    svg+=`<polyline points="${pts}" fill="url(#g${i})" stroke="${colors[i]}" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>`;
  }
  svg+=`<line x1="0" y1="${Math.round((1-(0-allMin)/yRange)*h)}" x2="${w}" y2="${Math.round((1-(0-allMin)/yRange)*h)}" stroke="var(--t3)" stroke-width="0.5" stroke-dasharray="4,2"/>`;
  svg+=`</svg>`;
  el.innerHTML=`<div style="display:flex;gap:12px;margin-bottom:4px;font-size:9px;color:var(--t3)">`+allBp.map((b,i)=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colors[i]};margin-right:2px"></span>${b.label.substring(0,6)}</span>`).join('')+`<span style="margin-left:auto">全局趋势 (8周)</span></div>${svg}`;
}

//=== AI Advisor ===
function computeAdvisor(){
  const allBp=[];for(const sp of ROOT.children)for(const c of sp.children)if(c.type==='bp')allBp.push(c);
  const criticals=allBp.filter(b=>canRecommend(b));if(!criticals.length)return null;
  criticals.sort((a,b)=>computeDeviation(a)-computeDeviation(b));return criticals[0];
}
function renderAdvisor(){
  const el=document.getElementById('advisor');const adv=computeAdvisor();
  if(!adv||advisorDismissed||ghost){el.style.display='none';return}
  el.style.display='block';const d=computeDeviation(adv);const delta=computeDelta(adv);const em=computeEMIndicator(adv);const sp=findSP(adv.id.startsWith('bp')?findNode(adv.id).id:'');const spNode=adv.id.startsWith('bp')?(ROOT.children.find(s=>s.children.some(c=>c.id===adv.id))||ROOT.children[0]):ROOT.children[0];
  const cfDev=computeCounterfactual(adv);const improvement=Math.round((cfDev-d)*10)/10;
  el.innerHTML=`<button style="position:absolute;top:4px;right:6px;cursor:pointer;background:none;border:none;color:var(--t3);font-size:14px" onclick="advisorDismissed=true;renderAdvisor()">×</button>
    <div class="advisor-title">🤖 AI 战略顾问</div>
    <div class="advisor-body">建议优先纠正 <b>${adv.label}</b>。<br>偏差 <span class="red">${d}%</span> · ${delta.dir==='worse'?'↓恶化':'↑改善'}${delta.value}pp · EM:${em.label}。<br>预计 SP <b>${spNode.label}</b> 改善 +${improvement}pp。<br>⏰ 已错过${adv.cf?adv.cf.missed:'—'}天窗口。</div>
    <div class="advisor-actions"><button class="advisor-btn primary" onclick="oneClickCorrect('${adv.id}',0)">⚡ 执行建议</button><button class="advisor-btn" onclick="advisorDismissed=true;renderAdvisor()">💤 忽略</button></div>`;
}

//=== Render All ===
function renderAll(){renderPulse();renderTree();renderDebate();renderTrend();renderAdvisor();document.getElementById('ghostBar').classList.toggle('on',ghost)}

//=== Interaction ===
function onSelectNode(id){selNodeId=id;renderAll()}
function previewPath(bpId,idx){const node=findNode(bpId);if(!node||!node.paths||!node.paths[idx])return;ghost=true;ghostTarget=node.paths[idx].targetKpi;previewNodeId=bpId;ghostStep='preview';renderAll();T('🔮 幽灵预览: '+node.paths[idx].name,'info')}
function cancelPreview(){ghost=false;ghostTarget=null;previewNodeId=null;ghostStep='idle';ghostUndo=null;renderAll()}
// V7.0: oneClickCorrect with execution guard
function oneClickCorrect(bpId,idx){const node=findNode(bpId);if(!node||!canRecommend(node)){T('⚠ 该BP已执行过纠正，无法重复执行','info');return}
  ghost=true;ghostTarget=node.paths[idx].targetKpi;previewNodeId=bpId;ghostStep='preview';ghostUndo={nodeId:bpId,prevTarget:node.kpiTarget};advisorDismissed=true;renderAll();
  setTimeout(()=>{ghostStep='ripple';renderAll();T('🌊 涟漪评估: 计算跨BP影响...','info');setTimeout(()=>{ghostStep='confirm';renderAll()},800)},300)}
function confirmApply(){const node=findNode(previewNodeId);if(!node||ghostTarget===null)return;const oldDev=computeDeviation(node);const oldTarget=node.kpiTarget;node.kpiTarget=ghostTarget;node.kpiActual=Math.round(Math.max(0,node.kpiActual+(ghostTarget-oldTarget)*0.6));if(node.history&&node.history.length>0){node.history.push({t:'W'+(node.history.length+1),d:computeDeviation(node)});if(node.history.length>12)node.history.shift()}projectTrend(node);const sp=ROOT.children.find(s=>s.children.some(c=>c.id===previewNodeId));if(sp)aggregateSPDeviation(sp);node.execState='verifying';ghost=false;ghostTarget=null;previewNodeId=null;ghostStep='idle';ghostUndo=null;advisorDismissed=false;renderAll();
  setTimeout(()=>{const effect=computeEffect(node,oldDev);node.execResult=effect;node.execState=effect.improved?'verified_improved':'verified_worsened';renderAll();T(effect.improved?`✅ 偏差改善 +${effect.delta}pp · 建议保留 · [保留] 已自动应用`:`⚠ 偏差恶化 ${effect.delta}pp · 建议回滚 · 按 ESC 撤销`,'info')},600);}
// ESC undo
document.addEventListener('DOMContentLoaded',()=>{for(const sp of ROOT.children){aggregateSPDeviation(sp);for(const bp of sp.children.filter(c=>c.type==='bp'))projectTrend(bp);}window.addEventListener('resize',renderTrend);renderAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ghost){if(ghostUndo){const node=findNode(ghostUndo.nodeId);if(node){node.kpiTarget=ghostUndo.prevTarget;node.execState='idle';node.execResult=null;ghostUndo=null;T('↺ 已撤销 · 恢复原始KPI目标','info')}}cancelPreview()}});
</script>
