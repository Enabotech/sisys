  <g transform="translate(50, 590)">
    <rect x="0" y="0" width="800" height="120" rx="12" fill="#f7fee7" stroke="#bef264" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#365314">🏗️ Infrastructure Layer</text>

    <rect x="20" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="45" y="77" text-anchor="middle" font-size="9" fill="#4d7c0f">📁 L0</text>
    <text x="45" y="92" text-anchor="middle" font-size="8" fill="#3f6212">MEMORY</text>

    <rect x="80" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="105" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">⚡ L1</text>
    <text x="105" y="92" text-anchor="middle" font-size="8" fill="#3f6212">Redis</text>

    <rect x="140" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="165" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🗄️ L2</text>
    <text x="165" y="92" text-anchor="middle" font-size="8" fill="#3f6212">PostgreSQL</text>

    <rect x="200" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="225" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🔮 L3</text>
    <text x="225" y="92" text-anchor="middle" font-size="8" fill="#3f6212">Qdrant</text>

    <rect x="260" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="285" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">📦 L4</text>
    <text x="285" y="92" text-anchor="middle" font-size="8" fill="#3f6212">MinIO</text>

    <rect x="320" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="345" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🕸️ L5</text>
    <text x="345" y="92" text-anchor="middle" font-size="8" fill="#3f6212">Neo4j</text>

    <rect x="380" y="55" width="50" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="405" y="77" text-anchor="middle" font-size="9" fill="#4d7c0f">🐳 Deploy</text>
    <text x="405" y="92" text-anchor="middle" font-size="8" fill="#3f6212">Docker</text>

    <rect x="440" y="55" width="80" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="480" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🔄 WorkFlow</text>
    <text x="480" y="92" text-anchor="middle" font-size="8" fill="#3f6212">Prefect</text>

    <rect x="530" y="55" width="90" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="575" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🎼 Orchestration</text>
    <text x="575" y="92" text-anchor="middle" font-size="8" fill="#3f6212">LangGraph</text>

    <rect x="630" y="55" width="70" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="665" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🐰 EventBus</text>
    <text x="665" y="92" text-anchor="middle" font-size="8" fill="#3f6212">RabbitMQ</text>

    <rect x="710" y="55" width="70" height="50" rx="6" fill="#fdfae2" stroke="#a3e635" stroke-width="1"/>
    <text x="745" y="77" text-anchor="middle" font-size="10" fill="#4d7c0f">🧠 LLM</text>
    <text x="745" y="92" text-anchor="middle" font-size="8" fill="#3f6212">Local/Cloud</text>
  </g>
</svg>
