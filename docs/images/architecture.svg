<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#37352f">SISYS System Architecture</text>

  <!-- Layer 1: Users -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#f7f6f3" stroke="#e0ddd6" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#37352f">👤 User Layer</text>

    <rect x="20" y="40" width="170" height="40" rx="8" fill="#ffffff" stroke="#e0ddd6" stroke-width="1.5"/>
    <text x="105" y="65" text-anchor="middle" font-size="13" fill="#4d4d4d">🏢 Executive View</text>

    <rect x="205" y="40" width="170" height="40" rx="8" fill="#ffffff" stroke="#e0ddd6" stroke-width="1.5"/>
    <text x="290" y="65" text-anchor="middle" font-size="13" fill="#4d4d4d">📊 Analyst View</text>

    <rect x="390" y="40" width="170" height="40" rx="8" fill="#ffffff" stroke="#e0ddd6" stroke-width="1.5"/>
    <text x="475" y="65" text-anchor="middle" font-size="13" fill="#4d4d4d">💼 Consultant View</text>

    <rect x="575" y="40" width="205" height="40" rx="8" fill="#ffffff" stroke="#e0ddd6" stroke-width="1.5"/>
    <text x="677" y="65" text-anchor="middle" font-size="13" fill="#4d4d4d">🔗 API Integration</text>
  </g>

  <line x1="450" y1="160" x2="450" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="445,185 455,185 450,192" fill="#94a3b8"/>

  <!-- Layer 2: Interface -->
  <g transform="translate(50, 195)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#faf7f2" stroke="#eadcc8" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#8b5e3c">🎯 Interface Layer</text>

    <rect x="120" y="40" width="170" height="40" rx="8" fill="#ffffff" stroke="#d4c3b3" stroke-width="1.5"/>
    <text x="205" y="65" text-anchor="middle" font-size="13" fill="#6e4f33">🖥️ CLI · Typer</text>

    <rect x="315" y="40" width="170" height="40" rx="8" fill="#ffffff" stroke="#d4c3b3" stroke-width="1.5"/>
    <text x="400" y="65" text-anchor="middle" font-size="13" fill="#6e4f33">🌐 REST API · FastAPI</text>

    <rect x="510" y="40" width="170" height="40" rx="8" fill="#ffffff" stroke="#d4c3b3" stroke-width="1.5"/>
    <text x="595" y="65" text-anchor="middle" font-size="13" fill="#6e4f33">📋 Skills · L1/L2/L3</text>
  </g>

  <line x1="450" y1="285" x2="450" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="445,310 455,310 450,317" fill="#94a3b8"/>

  <!-- Layer 3: Application -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#fbf7f0" stroke="#efe0cc" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#a1622b">⚙️ Application Layer</text>

    <rect x="50" y="40" width="160" height="40" rx="8" fill="#ffffff" stroke="#e3cba4" stroke-width="1.5"/>
    <text x="130" y="65" text-anchor="middle" font-size="13" fill="#854d0e">📄 Doc Processing</text>

    <rect x="225" y="40" width="160" height="40" rx="8" fill="#ffffff" stroke="#e3cba4" stroke-width="1.5"/>
    <text x="305" y="65" text-anchor="middle" font-size="13" fill="#854d0e">📊 Strategy Analysis</text>

    <rect x="400" y="40" width="160" height="40" rx="8" fill="#ffffff" stroke="#e3cba4" stroke-width="1.5"/>
    <text x="480" y="65" text-anchor="middle" font-size="13" fill="#854d0e">🤖 Agent Collab</text>

    <rect x="575" y="40" width="160" height="40" rx="8" fill="#ffffff" stroke="#e3cba4" stroke-width="1.5"/>
    <text x="655" y="65" text-anchor="middle" font-size="13" fill="#854d0e">📋 Plan Generation</text>
  </g>

  <line x1="450" y1="410" x2="450" y2="435" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="445,435 455,435 450,442" fill="#94a3b8"/>

  <!-- Layer 4: Domain -->
  <g transform="translate(50, 445)">
    <rect x="0" y="0" width="800" height="110" rx="12" fill="#f9f5f0" stroke="#e0cfba" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#6e4f33">💎 Domain Layer</text>

    <rect x="20" y="40" width="144" height="60" rx="8" fill="#ffffff" stroke="#cfb99a" stroke-width="1.5"/>
    <text x="92" y="62" text-anchor="middle" font-size="11" fill="#5a3f25" font-weight="500">📦 Document</text>
    <text x="92" y="78" text-anchor="middle" font-size="10" fill="#5a3f25">Entity</text>

    <rect x="174" y="40" width="144" height="60" rx="8" fill="#ffffff" stroke="#cfb99a" stroke-width="1.5"/>
    <text x="246" y="62" text-anchor="middle" font-size="11" fill="#5a3f25" font-weight="500">🤖 Agent · 🔧 Tool</text>
    <text x="246" y="78" text-anchor="middle" font-size="10" fill="#5a3f25">Entity</text>

    <rect x="328" y="40" width="144" height="60" rx="8" fill="#ffffff" stroke="#cfb99a" stroke-width="1.5"/>
    <text x="400" y="62" text-anchor="middle" font-size="11" fill="#5a3f25" font-weight="500">📋 Plan · Checkpoint</text>
    <text x="400" y="78" text-anchor="middle" font-size="10" fill="#5a3f25">Plan Entities</text>

    <rect x="482" y="40" width="144" height="60" rx="8" fill="#ffffff" stroke="#cfb99a" stroke-width="1.5"/>
    <text x="554" y="62" text-anchor="middle" font-size="11" fill="#5a3f25" font-weight="500">📊 Archive · RoutingLog</text>
    <text x="554" y="78" text-anchor="middle" font-size="10" fill="#5a3f25">Archive / Log</text>

    <rect x="636" y="40" width="144" height="60" rx="8" fill="#ffffff" stroke="#cfb99a" stroke-width="1.5"/>
    <text x="708" y="62" text-anchor="middle" font-size="11" fill="#5a3f25" font-weight="500">🔌 RAG · Eval · Plan</text>
    <text x="708" y="78" text-anchor="middle" font-size="10" fill="#5a3f25">Service Interfaces</text>
  </g>

  <line x1="450" y1="587" x2="450" y2="562" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="445,562 455,562 450,555" fill="#94a3b8"/>

