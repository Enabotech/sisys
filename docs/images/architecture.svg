<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#450a0a">SISYS System Architecture</text>

  <!-- Layer 1: Users -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#450a0a">👤 User Layer</text>

    <rect x="20" y="40" width="170" height="40" rx="8" fill="#fafafa" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="105" y="65" text-anchor="middle" font-size="13" fill="#7f1d1d">🏢 Executive View</text>

    <rect x="205" y="40" width="170" height="40" rx="8" fill="#fafafa" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="290" y="65" text-anchor="middle" font-size="13" fill="#7f1d1d">📊 Analyst View</text>

    <rect x="390" y="40" width="170" height="40" rx="8" fill="#fafafa" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="475" y="65" text-anchor="middle" font-size="13" fill="#7f1d1d">💼 Consultant View</text>

    <rect x="575" y="40" width="205" height="40" rx="8" fill="#fafafa" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="677" y="65" text-anchor="middle" font-size="13" fill="#7f1d1d">🔗 API Integration</text>
  </g>

  <line x1="450" y1="160" x2="450" y2="185" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="445,185 455,185 450,192" fill="#a8a29e"/>

  <!-- Layer 2: Interface -->
  <g transform="translate(50, 195)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#7c2d12">🎯 Interface Layer</text>

    <rect x="120" y="40" width="170" height="40" rx="8" fill="#fffaf5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="205" y="65" text-anchor="middle" font-size="13" fill="#9a3412">🖥️ CLI · Typer</text>

    <rect x="315" y="40" width="170" height="40" rx="8" fill="#fffaf5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="400" y="65" text-anchor="middle" font-size="13" fill="#9a3412">🌐 REST API · FastAPI</text>

    <rect x="510" y="40" width="170" height="40" rx="8" fill="#fffaf5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="595" y="65" text-anchor="middle" font-size="13" fill="#9a3412">📋 Skills · L1/L2/L3</text>
  </g>

  <line x1="450" y1="285" x2="450" y2="310" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="445,310 455,310 450,317" fill="#a8a29e"/>

  <!-- Layer 3: Application -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#78350f">⚙️ Application Layer</text>

    <rect x="50" y="40" width="160" height="40" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="130" y="65" text-anchor="middle" font-size="13" fill="#92400e">📄 Doc Processing</text>

    <rect x="225" y="40" width="160" height="40" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="305" y="65" text-anchor="middle" font-size="13" fill="#92400e">📊 Strategy Analysis</text>

    <rect x="400" y="40" width="160" height="40" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="480" y="65" text-anchor="middle" font-size="13" fill="#92400e">🤖 Agent Collab</text>

    <rect x="575" y="40" width="160" height="40" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="655" y="65" text-anchor="middle" font-size="13" fill="#92400e">📋 Plan Generation</text>
  </g>

  <line x1="450" y1="410" x2="450" y2="435" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="445,435 455,435 450,442" fill="#a8a29e"/>

  <!-- Layer 4: Domain -->
  <g transform="translate(50, 445)">
    <rect x="0" y="0" width="800" height="110" rx="12" fill="#fefce8" stroke="#facc15" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#713f12">💎 Domain Layer</text>

    <rect x="20" y="40" width="144" height="60" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="92" y="62" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="500">📦 Document</text>
    <text x="92" y="78" text-anchor="middle" font-size="10" fill="#713f12">Entity</text>

    <rect x="174" y="40" width="144" height="60" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="246" y="62" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="500">🤖 Agent · 🔧 Tool</text>
    <text x="246" y="78" text-anchor="middle" font-size="10" fill="#713f12">Entity</text>

    <rect x="328" y="40" width="144" height="60" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="400" y="62" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="500">📋 Plan · Checkpoint</text>
    <text x="400" y="78" text-anchor="middle" font-size="10" fill="#713f12">Plan Entities</text>

    <rect x="482" y="40" width="144" height="60" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="554" y="62" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="500">📊 Archive · RoutingLog</text>
    <text x="554" y="78" text-anchor="middle" font-size="10" fill="#713f12">Archive / Log</text>

    <rect x="636" y="40" width="144" height="60" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="708" y="62" text-anchor="middle" font-size="11" fill="#854d0e" font-weight="500">🔌 RAG · Eval · Plan</text>
    <text x="708" y="78" text-anchor="middle" font-size="10" fill="#713f12">Service Interfaces</text>
  </g>

  <line x1="450" y1="587" x2="450" y2="562" stroke="#a8a29e" stroke-width="2"/>
  <polygon points="445,562 455,562 450,555" fill="#a8a29e"/>

