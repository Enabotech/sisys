<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-up" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">sisys 系统架构</text>

  <!-- Layer 1: Users -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#475569">👤 用户层</text>

    <!-- Users modules -->
    <rect x="20" y="40" width="170" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="65" text-anchor="middle" font-size="13" fill="#374151">🏢 高管视图</text>

    <rect x="205" y="40" width="170" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="290" y="65" text-anchor="middle" font-size="13" fill="#374151">📊 分析师视图</text>

    <rect x="390" y="40" width="170" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="475" y="65" text-anchor="middle" font-size="13" fill="#374151">💼 顾问视图</text>

    <rect x="575" y="40" width="205" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="677" y="65" text-anchor="middle" font-size="13" fill="#374151">🔗 API 集成</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="450" y1="162" x2="450" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: Interface -->
  <g transform="translate(50, 195)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#1e40af">🎯 接口层</text>

    <rect x="120" y="40" width="170" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="205" y="65" text-anchor="middle" font-size="13" fill="#1d4ed8">🖥️ CLI · Typer</text>

    <rect x="315" y="40" width="170" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="400" y="65" text-anchor="middle" font-size="13" fill="#1d4ed8">🌐 REST API · FastAPI</text>

    <rect x="510" y="40" width="170" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="595" y="65" text-anchor="middle" font-size="13" fill="#1d4ed8">📋 Skills · L1/L2/L3</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="450" y1="287" x2="450" y2="317" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: Application -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="800" height="90" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#92400e">⚙️ 应用层</text>

    <rect x="50" y="40" width="160" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="65" text-anchor="middle" font-size="13" fill="#b45309">📄 文档处理</text>

    <rect x="225" y="40" width="160" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="305" y="65" text-anchor="middle" font-size="13" fill="#b45309">📊 战略分析</text>

    <rect x="400" y="40" width="160" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="65" text-anchor="middle" font-size="13" fill="#b45309">🤖 Agent 协作</text>

    <rect x="575" y="40" width="160" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="655" y="65" text-anchor="middle" font-size="13" fill="#b45309">📋 规划生成</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="450" y1="412" x2="450" y2="442" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Layer 4: Domain -->
  <g transform="translate(50, 445)">
    <rect x="0" y="0" width="800" height="110" rx="12" fill="#fce7f3" stroke="#f9a8c4" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#9d174d">💎 领域层</text>

    <!-- Entities -->
    <rect x="20" y="40" width="145" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="92" y="62" text-anchor="middle" font-size="11" fill="#be185d" font-weight="500">📦 Document</text>
    <text x="92" y="78" text-anchor="middle" font-size="10" fill="#9d174d">文档实体</text>

    <rect x="175" y="40" width="145" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="247" y="62" text-anchor="middle" font-size="11" fill="#be185d" font-weight="500">🤖 Agent · 🔧 Tool</text>
    <text x="247" y="78" text-anchor="middle" font-size="10" fill="#9d174d">实体</text>

    <rect x="330" y="40" width="145" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="402" y="62" text-anchor="middle" font-size="11" fill="#be185d" font-weight="500">📋 Plan · Checkpoint</text>
    <text x="402" y="78" text-anchor="middle" font-size="10" fill="#9d174d">规划实体</text>

    <rect x="485" y="40" width="145" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="557" y="62" text-anchor="middle" font-size="11" fill="#be185d" font-weight="500">📊 Archive · RoutingLog</text>
    <text x="557" y="78" text-anchor="middle" font-size="10" fill="#9d174d">档案/日志</text>

    <rect x="640" y="40" width="145" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="712" y="62" text-anchor="middle" font-size="11" fill="#be185d" font-weight="500">🔌 RAG · Eval · Plan</text>
    <text x="712" y="78" text-anchor="middle" font-size="10" fill="#9d174d">服务接口</text>
  </g>

  <!-- Arrow 4: Infrastructure → Domain (implements interface) -->
  <line x1="450" y1="587" x2="450" y2="557" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead-up)"/>

  <!-- Layer 5: Infrastructure -->
  <g transform="translate(50, 590)">
    <rect x="0" y="0" width="800" height="120" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#5b21b6">🏗️ 基础设施层</text>

    <!-- Storage -->
    <text x="20" y="50" font-size="12" font-weight="500" fill="#6b21a8">💾 六层存储</text>
    <rect x="20" y="58" width="540" height="52" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>

    <rect x="30" y="65" width="70" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="65" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">📁 L0</text>

    <rect x="110" y="65" width="70" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="145" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">⚡ L1</text>

    <rect x="190" y="65" width="70" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="225" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">🗄️ L2</text>

    <rect x="270" y="65" width="70" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="305" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">🔮 L3</text>

    <rect x="350" y="65" width="70" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="385" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">📦 L4</text>

    <rect x="430" y="65" width="70" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="465" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">🕸️ L5</text>

    <!-- Compute -->
    <text x="580" y="50" font-size="12" font-weight="500" fill="#6b21a8">⚡ 事件与计算</text>
    <rect x="580" y="58" width="200" height="52" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>

    <rect x="590" y="65" width="80" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="630" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">🐰 RabbitMQ</text>

    <rect x="680" y="65" width="90" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="725" y="87" text-anchor="middle" font-size="10" fill="#6b21a8">🐳 Docker</text>
  </g>

</svg>
