  <g transform="translate(50, 590)">
    <rect x="0" y="0" width="800" height="120" rx="12" fill="#f4f2ee" stroke="#dcd6cb" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="28" font-size="14" font-weight="600" fill="#37352f">🏗️ Infrastructure Layer</text>

    <rect x="20" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="45" y="77" text-anchor="middle" font-size="9" fill="#4a4a4a">📁 L0</text>
    <text x="45" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">MEMORY</text>

    <rect x="80" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="105" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">⚡ L1</text>
    <text x="105" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">Redis</text>

    <rect x="140" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="165" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🗄️ L2</text>
    <text x="165" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">PostgreSQL</text>

    <rect x="200" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="225" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🔮 L3</text>
    <text x="225" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">Qdrant</text>

    <rect x="260" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="285" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">📦 L4</text>
    <text x="285" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">MinIO</text>

    <rect x="320" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="345" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🕸️ L5</text>
    <text x="345" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">Neo4j</text>

    <rect x="380" y="55" width="50" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="405" y="77" text-anchor="middle" font-size="9" fill="#4a4a4a">🐳 Deploy</text>
    <text x="405" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">Docker</text>

    <rect x="440" y="55" width="80" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="480" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🔄 WorkFlow</text>
    <text x="480" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">Prefect</text>

    <rect x="530" y="55" width="90" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="575" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🎼 Orchestration</text>
    <text x="575" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">LangGraph</text>

    <rect x="630" y="55" width="70" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="665" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🐰 EventBus</text>
    <text x="665" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">RabbitMQ</text>

    <rect x="710" y="55" width="70" height="50" rx="6" fill="#ffffff" stroke="#d3ccc1" stroke-width="1"/>
    <text x="745" y="77" text-anchor="middle" font-size="10" fill="#4a4a4a">🧠 LLM</text>
    <text x="745" y="92" text-anchor="middle" font-size="8" fill="#4a4a4a">Local/Cloud</text>
  </g>
</svg>
