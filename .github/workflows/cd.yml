# CD Pipeline - Continuous Deployment
# Triggered on: Code merged to main branch
#
# Responsibilities:
# - Build production Docker image (multi-stage)
# - Push to GitHub Container Registry (GHCR)
# - Deploy to test environment
# - Run health checks
# - Optional: Deploy to production (with approval)

name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

# Cancel redundant workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.0"
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository }}/sisys
  REGISTRY: ghcr.io

jobs:
  # =========================================
  # Job 1: Build Production Docker Image
  # =========================================
  build-production:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git SHA and version
        id: git_info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')" >> $GITHUB_OUTPUT

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.git_info.outputs.sha }}
            type=raw,value=latest
            type=raw,value=${{ steps.git_info.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            POETRY_VERSION=${{ env.POETRY_VERSION }}
            APP_VERSION=${{ steps.git_info.outputs.version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.git_info.outputs.sha }}
          format: "sarif"
          output: "trivy-production.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-production-results
          path: trivy-production.sarif
          retention-days: 30

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.git_info.outputs.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # =========================================
  # Job 2: Deploy to Test Environment
  # =========================================
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-production]
    environment:
      name: test
      url: http://test.sisys.local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git SHA
        id: git_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Compose
        run: |
          docker compose version

      - name: Create test environment configuration
        run: |
          cat > docker-compose.test.yml << EOF
          version: '3.8'

          services:
            app:
              image: ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.git_sha.outputs.sha }}
              container_name: sisys-test-app
              restart: unless-stopped
              ports:
                - "8000:8000"
              environment:
                - ENVIRONMENT=test
                - POSTGRES_USER=test_user
                - POSTGRES_PASSWORD=test_password
                - POSTGRES_DB=test_db
                - POSTGRES_HOST=postgres
                - REDIS_HOST=redis
                - QDRANT_HOST=qdrant
                - MINIO_ENDPOINT=minio:9000
                - MINIO_ACCESS_KEY=test_minio
                - MINIO_SECRET_KEY=test_minio_password
                - NEO4J_URI=bolt://neo4j:7687
                - NEO4J_USER=neo4j
                - NEO4J_PASSWORD=test_neo4j_password
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
                qdrant:
                  condition: service_started
                minio:
                  condition: service_healthy
                neo4j:
                  condition: service_healthy
              networks:
                - sisys-test
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s

            postgres:
              image: postgres:15-alpine
              container_name: sisys-test-postgres
              environment:
                POSTGRES_USER: test_user
                POSTGRES_PASSWORD: test_password
                POSTGRES_DB: test_db
              volumes:
                - postgres_test_data:/var/lib/postgresql/data
              networks:
                - sisys-test
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U test_user"]
                interval: 10s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7.2-alpine
              container_name: sisys-test-redis
              command: redis-server --appendonly yes
              volumes:
                - redis_test_data:/data
              networks:
                - sisys-test
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5

            qdrant:
              image: qdrant/qdrant:v1.7.0
              container_name: sisys-test-qdrant
              volumes:
                - qdrant_test_data:/qdrant/storage
              networks:
                - sisys-test

            minio:
              image: minio/minio:latest
              container_name: sisys-test-minio
              command: server /data --console-address ":9001"
              environment:
                MINIO_ROOT_USER: test_minio
                MINIO_ROOT_PASSWORD: test_minio_password
              volumes:
                - minio_test_data:/data
              networks:
                - sisys-test
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
                interval: 10s
                timeout: 5s
                retries: 5

            neo4j:
              image: neo4j:5.15
              container_name: sisys-test-neo4j
              environment:
                NEO4J_AUTH: neo4j/test_neo4j_password
              volumes:
                - neo4j_test_data:/data
              networks:
                - sisys-test
              healthcheck:
                test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
                interval: 10s
                timeout: 5s
                retries: 5

          networks:
            sisys-test:
              driver: bridge

          volumes:
            postgres_test_data:
            redis_test_data:
            qdrant_test_data:
            minio_test_data:
            neo4j_test_data:
          EOF

      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.git_sha.outputs.sha }}

      - name: Deploy to test environment
        run: |
          docker compose -f docker-compose.test.yml down --remove-orphans || true
          docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30

          # Check each service health
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml ps | grep -q "sisys-test-app.*healthy"; then
              echo "✅ Application is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Application health check timeout"
              docker compose -f docker-compose.test.yml logs app
              exit 1
            fi
            echo "Waiting for application to be healthy... ($i/30)"
            sleep 10
          done

      - name: Run health check script
        run: |
          # Wait for application to be ready
          sleep 10

          # Test health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$response" -ne 200 ]; then
            echo "❌ Health check failed with status: $response"
            docker compose -f docker-compose.test.yml logs app
            exit 1
          fi
          echo "✅ Health check passed (HTTP $response)"

          # Test database connection
          response=$(curl -s http://localhost:8000/health | grep -i "postgres" || true)
          if [ -z "$response" ]; then
            echo "⚠️  PostgreSQL status not found in health response"
          else
            echo "✅ PostgreSQL connection: $response"
          fi

      - name: Upload deployment logs
        if: always()
        run: |
          docker compose -f docker-compose.test.yml logs > deployment-logs.txt

      - name: Upload deployment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs-test
          path: deployment-logs.txt
          retention-days: 7

  # =========================================
  # Job 3: Send Deployment Notification
  # =========================================
  notify-deployment:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-test]
    if: always()
    steps:
      - name: Get deployment status
        id: status
        run: |
          if [ "${{ needs.deploy-test.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Get git info
        id: git_info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Send Slack notification (optional)
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Deployment to Test Environment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ steps.status.outputs.emoji }} Deployment to Test Environment*\nStatus: *${{ needs.deploy-test.result }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ steps.git_info.outputs.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ steps.git_info.outputs.author }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Message:*\n${{ steps.git_info.outputs.commit_message }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send DingTalk notification (optional)
        if: always()
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DINGTALK_WEBHOOK }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "sisys Deployment Notification",
                "text": "## ${{ steps.status.outputs.emoji }} Deployment to Test Environment\n\n**Status:** ${{ needs.deploy-test.result }}\n**Commit:** ${{ steps.git_info.outputs.sha }}\n**Author:** ${{ steps.git_info.outputs.author }}\n**Message:** ${{ steps.git_info.outputs.commit_message }}\n\n[View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
        continue-on-error: true

  # =========================================
  # Job 4: Production Deployment (Optional - Requires Approval)
  # =========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-production, deploy-test]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[deploy-prod]')
    environment:
      name: production
      url: https://sisys.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git SHA and version
        id: git_info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')" >> $GITHUB_OUTPUT

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for production cluster
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          echo "✅ kubectl configured"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Set production image in Kubernetes deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/sisys-app \
            sisys-app=${{ env.DOCKER_IMAGE_NAME }}:${{ steps.git_info.outputs.sha }} \
            -n production
          echo "✅ Kubernetes deployment updated"

      - name: Wait for rollout to complete
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout status deployment/sisys-app -n production --timeout=300s
          echo "✅ Rollout completed"

      - name: Run production health checks
        run: |
          echo "Running production health checks..."

          # Wait for application to be ready
          sleep 15

          # Test health endpoint
          max_retries=30
          for i in $(seq 1 $max_retries); do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://sisys.example.com/health || echo "000")
            if [ "$response" -eq 200 ]; then
              echo "✅ Production health check passed (HTTP $response)"
              exit 0
            fi
            if [ $i -eq $max_retries ]; then
              echo "❌ Production health check failed after $max_retries attempts (HTTP $response)"
              exit 1
            fi
            echo "Waiting for production to be healthy... ($i/$max_retries)"
            sleep 10
          done

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."

          # Get deployment info
          export KUBECONFIG=kubeconfig
          kubectl get deployment sisys-app -n production -o wide

          # Get pod status
          kubectl get pods -n production -l app=sisys-app

          # Check recent events
          kubectl get events -n production --sort-by='.lastTimestamp' | tail -20

      - name: Send production deployment notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ steps.git_info.outputs.version }} Production Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀 Production Deployment*\nStatus: *${{ job.status }}*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ steps.git_info.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ steps.git_info.outputs.sha }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Environment:* Production\n*URL:* https://sisys.example.com"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Production Dashboard"
                      },
                      "url": "https://sisys.example.com/health"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Cleanup kubeconfig
        if: always()
        run: |
          rm -f kubeconfig
          echo "✅ Cleanup complete"
