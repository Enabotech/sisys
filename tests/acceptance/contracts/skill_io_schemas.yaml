# =============================================================================
# Skills input_schema / output_schema 契约（IO SSOT）
#
# 本文件是 16 个 SKILL.md frontmatter `input_schema`/`output_schema` 字段级定义的
# 唯一事实源（Single Source of Truth）：
#   - Story 4.1c（Task 0.2）：6 个外部数据型 Skills（pestel-analysis 等）
#   - Story 4.1d（Task 0.2）：10 个混合数据型 Skills（swot-tows 等，本批追加）
# TDD 红阶段以本文件为断言输入，实施内容必须与本文件逐字一致
# （required 集合 / properties 键 / type / description），禁止实施期临时增删字段；
# 如需变更必须先修订本文件。
#
# 载体决策（4-1c D6）：frontmatter `input_schema`/`output_schema` 键（JSON Schema
# dict），运行时 Pydantic 强制校验属 Story 4.3 范畴，仅定义契约。
#
# 4-1d 契约设计基准（Task 0.2）：
#   - input_schema 以 src/domain/entities/strategic_tool_catalog.py 既有
#     Tool.input_schema 为基础按混合数据场景增强（嵌套 required + 叶子字段
#     description），禁止删除 catalog 已有 required 字段
#   - output_schema 以 catalog 既有为基础补全 required（必含 data_sources，
#     对齐 4-1c 六条目「工具输出自带溯源元数据」惯例）
#   - 模板叶子键展开约定（AC-3）：templates 采集字段 == input_schema 递归展开的
#     叶子键集合（末端 properties 键；array 展开 items.properties；顶层键以模板
#     分区标题承载）
# =============================================================================

version: "1.1.0"
story: [4-1c-skills-data-collection-integration, 4-1d-skills-framework-enhancement]

skills:

  # ---------------------------------------------------------------------------
  # PESTEL 分析（6 源：world-bank / imf / eurostat / ipcc / newsapi / china-nbs）
  # ---------------------------------------------------------------------------
  pestel-analysis:
    input_schema:
      type: object
      required: [industry, region_scope, time_horizon_years]
      properties:
        industry:
          type: string
          description: 目标行业（如 "新能源汽车"）
        region_scope:
          type: string
          description: 地域范围（如 "global" / "china" / "eu"）
        time_horizon_years:
          type: integer
          description: 分析年限（1-10 年）
        focus_dimensions:
          type: array
          description: 可选聚焦维度子集（缺省全六维度）
          items:
            type: string
            enum: [P, E, S, T, En, L]
    output_schema:
      type: object
      required: [pestel_dimensions, weighted_total, score_grade, data_sources]
      properties:
        pestel_dimensions:
          type: array
          description: 六维度评估结果（每维度含评分/指标/来源）
          items:
            type: object
            required: [dimension, score, indicators, sources]
            properties:
              dimension:
                type: string
                enum: [P, E, S, T, En, L]
                description: 维度代码
              score:
                type: number
                description: 维度评分（0-1，机会趋 1 威胁趋 0）
              indicators:
                type: array
                description: 关键指标观测值列表
                items:
                  type: object
              sources:
                type: array
                description: 该维度数据来源（≥3 独立来源三角化）
                items:
                  type: string
        weighted_total:
          type: number
          description: 加权总分（权重见 references/scoring_matrix.json）
        score_grade:
          type: string
          enum: [机会主导, 中性, 威胁主导]
          description: 综合评级（≥0.7 机会 / ≤0.4 威胁 / 其余中性）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 波特五力（3 源：newsapi / world-bank / eurostat）
  # ---------------------------------------------------------------------------
  porters-five-forces:
    input_schema:
      type: object
      required: [industry, region_scope]
      properties:
        industry:
          type: string
          description: 目标行业
        region_scope:
          type: string
          description: 地域范围
        incumbent_players:
          type: array
          description: 可选已知在位企业清单
          items:
            type: string
    output_schema:
      type: object
      required: [five_forces, overall_attractiveness, data_sources]
      properties:
        five_forces:
          type: array
          description: 五力评估结果（每力含评分/证据/来源）
          items:
            type: object
            required: [force, score, evidence, sources]
            properties:
              force:
                type: string
                enum: [现有竞争, 新进入者威胁, 替代品威胁, 供应商议价力, 购买者议价力]
                description: 五力名称
              score:
                type: number
                description: 力量强度评分（0-1，越大压力越强）
              evidence:
                type: array
                description: 支撑证据列表
                items:
                  type: string
              sources:
                type: array
                description: 数据来源
                items:
                  type: string
        overall_attractiveness:
          type: string
          enum: [高, 中, 低]
          description: 行业综合吸引力评级
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # $APPEALS 分析（3 源：tavily / newsapi / china-nbs）
  # ---------------------------------------------------------------------------
  appeals-analysis:
    input_schema:
      type: object
      required: [product_category, target_segment]
      properties:
        product_category:
          type: string
          description: 产品类别（如 "智能手表"）
        target_segment:
          type: string
          description: 目标客群细分市场
        region_scope:
          type: string
          description: 地域范围（缺省 china）
    output_schema:
      type: object
      required: [appeals_dimensions, overall_score, data_sources]
      properties:
        appeals_dimensions:
          type: array
          description: $APPEALS 八维度评估（价格/可获得性/包装/性能/易用性/保证程度/生命周期成本/社会接受度）
          items:
            type: object
            required: [dimension, score, customer_evidence, sources]
            properties:
              dimension:
                type: string
                enum: [价格, 可获得性, 包装, 性能, 易用性, 保证程度, 生命周期成本, 社会接受度]
                description: 维度名称
              score:
                type: number
                description: 维度评分（0-1）
              customer_evidence:
                type: array
                description: 顾客洞察证据列表
                items:
                  type: string
              sources:
                type: array
                description: 数据来源
                items:
                  type: string
        overall_score:
          type: number
          description: 综合顾客价值评分（0-1）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 竞争对手分析（4 源：newsapi / uspto / tavily / china-nbs）
  # ---------------------------------------------------------------------------
  competitor-analysis:
    input_schema:
      type: object
      required: [industry, competitors]
      properties:
        industry:
          type: string
          description: 目标行业
        competitors:
          type: array
          description: 竞品企业清单（≥1 家）
          items:
            type: string
        analysis_dimensions:
          type: array
          description: 可选对标维度子集（缺省全维度）
          items:
            type: string
    output_schema:
      type: object
      required: [competitor_profiles, benchmark_matrix, data_sources]
      properties:
        competitor_profiles:
          type: array
          description: 竞品画像列表
          items:
            type: object
            required: [name, strategy_summary, patent_signals, sources]
            properties:
              name:
                type: string
                description: 竞品企业名称
              strategy_summary:
                type: string
                description: 战略动向摘要
              patent_signals:
                type: array
                description: 专利技术信号（USPTO）
                items:
                  type: string
              sources:
                type: array
                description: 数据来源
                items:
                  type: string
        benchmark_matrix:
          type: object
          description: 竞品对标矩阵（维度 × 企业评分）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 情景规划（3 源：tavily / ipcc / eurostat）
  # ---------------------------------------------------------------------------
  scenario-planning:
    input_schema:
      type: object
      required: [focal_issue, time_horizon_years]
      properties:
        focal_issue:
          type: string
          description: 核心议题（如 "2035 年欧洲能源结构"）
        time_horizon_years:
          type: integer
          description: 情景年限（5-30 年）
        region_scope:
          type: string
          description: 地域范围（缺省 global）
    output_schema:
      type: object
      required: [scenarios, uncertainty_matrix, data_sources]
      properties:
        scenarios:
          type: array
          description: 情景剧本列表（2×2 矩阵四情景）
          items:
            type: object
            required: [name, driving_forces, narrative, indicators]
            properties:
              name:
                type: string
                description: 情景名称
              driving_forces:
                type: array
                description: 关键驱动因素
                items:
                  type: string
              narrative:
                type: string
                description: 情景叙事
              indicators:
                type: array
                description: 先行指标观测值
                items:
                  type: object
        uncertainty_matrix:
          type: object
          description: 不确定性矩阵（双关键不确定性轴定义）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 破坏性创新模型（2 源：uspto / tavily，双源交叉验证 — 决策 D4）
  # ---------------------------------------------------------------------------
  disruptive-innovation:
    input_schema:
      type: object
      required: [technology_domain]
      properties:
        technology_domain:
          type: string
          description: 技术领域（如 "固态电池"）
        incumbent_industry:
          type: string
          description: 可选在位行业（评估颠覆对象）
    output_schema:
      type: object
      required: [disruption_signals, technology_maturity, innovation_assessment, data_sources]
      properties:
        disruption_signals:
          type: array
          description: 颠覆信号清单（专利/市场/技术信号）
          items:
            type: object
            required: [signal_type, description, strength, sources]
            properties:
              signal_type:
                type: string
                enum: [专利信号, 市场信号, 技术信号]
                description: 信号类型
              description:
                type: string
                description: 信号描述
              strength:
                type: number
                description: 信号强度（0-1）
              sources:
                type: array
                description: 数据来源（双源交叉验证）
                items:
                  type: string
        technology_maturity:
          type: string
          enum: [萌芽期, 成长期, 成熟期, 衰退期]
          description: 技术成熟度评级
        innovation_assessment:
          type: string
          description: 颠覆性创新综合评估结论
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # SWOT-TOWS（2 源：newsapi / tavily；双 Key 敏感）
  # 模板叶子键（AC-3）：strengths / weaknesses / opportunities / threats
  # ---------------------------------------------------------------------------
  swot-tows:
    input_schema:
      type: object
      required: [internal_factors, external_factors]
      properties:
        internal_factors:
          type: object
          description: 内部因素（工作坊采集：优势/劣势清单，模板 swot_factors_collection.md）。条目编码：强度分值（1-5）—— 因素描述（强度分值 = 首个『 —— 』前的 1-5 整数；TOWS 匹配阈值 ≥3 依赖分值解析）
          required: [strengths, weaknesses]
          properties:
            strengths:
              type: array
              description: 内部优势清单（资源/能力维度）
              items:
                type: string
            weaknesses:
              type: array
              description: 内部劣势清单（短板维度）
              items:
                type: string
        external_factors:
          type: object
          description: 外部因素（机会/威胁，经 NewsAPI/Tavily 外部基准印证）。条目编码：强度分值（1-5）—— 因素描述（强度分值 = 首个『 —— 』前的 1-5 整数，与内部象限同格式）
          required: [opportunities, threats]
          properties:
            opportunities:
              type: array
              description: 外部机会清单（行业时政/竞争情报印证）
              items:
                type: string
            threats:
              type: array
              description: 外部威胁清单（行业时政/竞争情报印证）
              items:
                type: string
    output_schema:
      type: object
      required: [tows_matrix, data_sources]
      properties:
        tows_matrix:
          type: object
          description: TOWS 策略矩阵（内外因素交叉匹配战略）
          required: [so_strategies, wo_strategies, st_strategies, wt_strategies, priority]
          properties:
            so_strategies:
              type: array
              description: SO 战略（优势×机会：增长型）
              items:
                type: string
            wo_strategies:
              type: array
              description: WO 战略（劣势×机会：扭转型）
              items:
                type: string
            st_strategies:
              type: array
              description: ST 战略（优势×威胁：多元化）
              items:
                type: string
            wt_strategies:
              type: array
              description: WT 战略（劣势×威胁：防御型）
              items:
                type: string
            priority:
              type: array
              description: 战略优先级排序（含依据）
              items:
                type: string
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 安索夫矩阵（2 源：world-bank / imf；免 Key）
  # 模板叶子键（AC-3）：existing_products / new_products / existing_markets / new_markets
  # ---------------------------------------------------------------------------
  ansoff-matrix:
    input_schema:
      type: object
      required: [market_product_data]
      properties:
        market_product_data:
          type: object
          description: 市场/产品数据（工作坊采集：产品 × 市场现有位置，模板 ansoff_product_market_matrix.md）。条目编码：风险档（低/中/高）—— 条目描述（风险档 = 首个『 —— 』前的枚举词；象限风险判定与外部增速基准交叉依赖风险档解析）
          required: [existing_products, new_products, existing_markets, new_markets]
          properties:
            existing_products:
              type: array
              description: 现有产品清单
              items:
                type: string
            new_products:
              type: array
              description: 拟开发新产品清单
              items:
                type: string
            existing_markets:
              type: array
              description: 现有市场清单
              items:
                type: string
            new_markets:
              type: array
              description: 拟进入新市场清单
              items:
                type: string
    output_schema:
      type: object
      required: [growth_strategy, data_sources]
      properties:
        growth_strategy:
          type: object
          description: 增长战略建议（四象限定位 + 风险评估）
          required: [quadrant_position, recommended_strategy, risk_assessment]
          properties:
            quadrant_position:
              type: string
              description: 当前所处象限（市场渗透/市场开发/产品延伸/多样化）
            recommended_strategy:
              type: string
              description: 推荐增长战略
            risk_assessment:
              type: object
              description: 风险等级评估（增长率基准：WB GDP 指标 + IMF WEO 展望对照）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 价值曲线分析（2 源：tavily / newsapi；双 Key 敏感）
  # 模板叶子键（AC-3）：competitors / value_factors
  # ---------------------------------------------------------------------------
  value-curve-analysis:
    input_schema:
      type: object
      required: [competition_data]
      properties:
        competition_data:
          type: object
          description: 竞争数据（客户调研 + 竞品情报，模板 value_curve_factors_grid.md）。条目编码——competitors 逐条「竞品名 —— 关注理由」（关注理由 = 首个『 —— 』后的文本）；value_factors 键值形态「要素名 → 当前/目标水平（各 1-5，对象键为 当前/目标）」（证据来源留档模板不入参）
          required: [competitors, value_factors]
          properties:
            competitors:
              type: array
              description: 竞品清单（行业战略轮廓绘制对象）
              items:
                type: string
            value_factors:
              type: object
              description: 价值要素水平（要素名 → 我方当前水平/目标值，三列网格采集）
    output_schema:
      type: object
      required: [value_curve, data_sources]
      properties:
        value_curve:
          type: object
          description: 价值曲线分析结果（行业轮廓 + 四行动框架）
          required: [curves, innovation_opportunities]
          properties:
            curves:
              type: object
              description: 各主体价值曲线（行业/竞品/我方当前/我方目标）
            innovation_opportunities:
              type: array
              description: 消除-减少-增加-创造四行动机会点
              items:
                type: string
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # GE-麦肯锡矩阵（2 源：world-bank / tavily；tavily Key 敏感）
  # 模板叶子键（AC-3）：name / industry_attractiveness / competitive_strength
  # ---------------------------------------------------------------------------
  ge-mckinsey-matrix:
    input_schema:
      type: object
      required: [business_units]
      properties:
        business_units:
          type: array
          description: 业务单元列表（高管访谈评分表采集，模板 ge_business_unit_scoresheet.md）
          items:
            type: object
            required: [name, industry_attractiveness, competitive_strength]
            properties:
              name:
                type: string
                description: 业务单元名称
              industry_attractiveness:
                type: number
                description: 行业吸引力评分（1-10，0.5 步进；外部基准支撑 WB 宏观指标 + Tavily 市场情报）。取评分表该维度行前缀分值，证据来源列留档模板不入参
              competitive_strength:
                type: number
                description: 业务实力评分（1-10，0.5 步进；内部数据市场份额/利润率）。取评分表该维度行前缀分值，证据来源列留档模板不入参
    output_schema:
      type: object
      required: [portfolio_map, data_sources]
      properties:
        portfolio_map:
          type: object
          description: 业务组合图谱（九宫格定位 + 投资建议）
          required: [grid_position, recommendation]
          properties:
            grid_position:
              type: object
              description: 各业务单元九宫格坐标定位
            recommendation:
              type: string
              description: 投资优先级建议（投资/选择性发展/收割/退出）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # SPACE 矩阵（2 源：world-bank / imf；免 Key）
  # 模板叶子键（AC-3）：financial_strength / competitive_advantage / industry_strength / environmental_stability
  # ---------------------------------------------------------------------------
  space-matrix:
    input_schema:
      type: object
      required: [strategic_factors]
      properties:
        strategic_factors:
          type: object
          description: 四维度因子评分（问卷打分 + 专家访谈，模板 space_dimension_scoring.md）
          required: [financial_strength, competitive_advantage, industry_strength, environmental_stability]
          properties:
            financial_strength:
              type: number
              description: FS 财务实力评分（内部数据）
            competitive_advantage:
              type: number
              description: CA 竞争优势评分（内部数据）
            industry_strength:
              type: number
              description: IS 产业实力评分（外部基准：IMF WEO 产业展望）
            environmental_stability:
              type: number
              description: ES 环境稳定性评分（外部基准：WB 治理/通胀指标）
    output_schema:
      type: object
      required: [space_positioning, data_sources]
      properties:
        space_positioning:
          type: object
          description: SPACE 定位结果（坐标定向 + 战略姿态）
          required: [position, strategic_posture, recommendations]
          properties:
            position:
              type: string
              description: 坐标定向结果（进取/保守/防御/竞争）
            strategic_posture:
              type: string
              description: 战略姿态描述
            recommendations:
              type: array
              description: 行动建议清单
              items:
                type: string
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 价值链分析（2 源：tavily / china-nbs；tavily Key 敏感 + china-nbs crawler）
  # 模板叶子键（AC-3）：primary_activities / support_activities / cost_structure
  # ---------------------------------------------------------------------------
  value-chain-analysis:
    input_schema:
      type: object
      required: [enterprise_data]
      properties:
        enterprise_data:
          type: object
          description: 企业内部数据（ERP 导出 + 流程访谈，模板 value_chain_activities_inventory.md）。条目编码——primary/support_activities 逐条「贡献分值（1-5）—— 活动描述」（贡献分值 = 首个『 —— 』前的 1-5 整数；优势环节判定阈值 ≥4 依赖分值解析）；cost_structure 键值形态「活动 → 对象（键为 成本金额/占比）」（证据来源留档模板）
          required: [primary_activities, support_activities, cost_structure]
          properties:
            primary_activities:
              type: array
              description: 主要活动清单（进料储运/生产/发货/营销/服务）
              items:
                type: string
            support_activities:
              type: array
              description: 支持活动清单（采购/技术开发/人力资源/企业基础设施）
              items:
                type: string
            cost_structure:
              type: object
              description: 成本归属（活动 → 成本金额/占比）
    output_schema:
      type: object
      required: [value_chain_analysis, data_sources]
      properties:
        value_chain_analysis:
          type: object
          description: 价值链分析结果（价值贡献 + 竞争优势定位）
          required: [value_contribution, competitive_advantages]
          properties:
            value_contribution:
              type: object
              description: 各活动价值贡献度
            competitive_advantages:
              type: array
              description: 竞争优势环节清单（对照行业基准）
              items:
                type: string
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # VRIO 框架（2 源：uspto / tavily；tavily Key 敏感）
  # 模板叶子键（AC-3）：name / value / rarity / imitability / organization
  # ---------------------------------------------------------------------------
  vrio-framework:
    input_schema:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          description: 资源/能力清单（内部审计 + 高管访谈，模板 vrio_resources_checklist.md）
          items:
            type: object
            required: [name, vrio_scores]
            properties:
              name:
                type: string
                description: 资源/能力名称
              vrio_scores:
                type: object
                description: V-R-I-O 四维度判定（0-1）
                required: [value, rarity, imitability, organization]
                properties:
                  value:
                    type: number
                    description: 价值性 V（是否抓住机会/化解威胁）
                  rarity:
                    type: number
                    description: 稀缺性 R（对照行业专利/能力密度基准）
                  imitability:
                    type: number
                    description: 可模仿性 I（获取难度，对照行业情报）
                  organization:
                    type: number
                    description: 组织利用能力 O（组织是否支持利用）
    output_schema:
      type: object
      required: [vrio_assessment, data_sources]
      properties:
        vrio_assessment:
          type: object
          description: VRIO 评估结果（分类 + 可持续性判定）
          required: [classification, sustainability]
          properties:
            classification:
              type: object
              description: 各资源五分类结果（持续竞争优势/暂时竞争优势/未实现潜在优势/竞争均势/竞争劣势，判定链见 scoring_anchors.md）
            sustainability:
              type: string
              description: 持续竞争优势综合判定
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # BSC 平衡计分卡（2 源：china-nbs / world-bank；免 Key + china-nbs crawler）
  # 模板叶子键（AC-3）：financial / customer / internal_process / learning_growth
  # ---------------------------------------------------------------------------
  bsc-scorecard:
    input_schema:
      type: object
      required: [strategic_objectives]
      properties:
        strategic_objectives:
          type: object
          description: 战略目标（高管工作坊采集：四维度目标/KPI 现值，模板 bsc_kpi_scorecard.md）。条目编码——四维清单逐条「目标档位（保守档/基准档/挑战档）—— 目标与 KPI 现值描述」（档位=首个『 —— 』前的枚举词；目标值校准与档位判定依赖档位前缀解析；证据来源留档模板）
          required: [financial, customer, internal_process, learning_growth]
          properties:
            financial:
              type: array
              description: 财务维度目标与 KPI 现值
              items:
                type: string
            customer:
              type: array
              description: 客户维度目标与 KPI 现值
              items:
                type: string
            internal_process:
              type: array
              description: 内部流程维度目标与 KPI 现值
              items:
                type: string
            learning_growth:
              type: array
              description: 学习成长维度目标与 KPI 现值
              items:
                type: string
    output_schema:
      type: object
      required: [bsc_metrics, data_sources]
      properties:
        bsc_metrics:
          type: object
          description: BSC 指标体系（KPI/目标值/权重/行动计划）
          required: [kpi_indicators, target_values, weights, action_plans]
          properties:
            kpi_indicators:
              type: array
              description: KPI 指标清单（含因果链假设）
              items:
                type: string
            target_values:
              type: object
              description: 目标值（KPI → 目标，行业统计对标参照）
            weights:
              type: object
              description: 权重分配（维度/指标 → 权重）
            action_plans:
              type: array
              description: 行动计划清单
              items:
                type: string
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # KPI 树（2 源：china-nbs / newsapi；newsapi Key 敏感）
  # 模板叶子键（AC-3）：objectives / baseline_data
  # ---------------------------------------------------------------------------
  kpi-tree:
    input_schema:
      type: object
      required: [business_objectives]
      properties:
        business_objectives:
          type: object
          description: 业务目标（战略规划文件 + 数据仓库导出，模板 kpi_tree_decomposition.md）。条目编码——objectives 逐条「目标档位（基准/挑战/突破）—— 层级：目标描述」（档位=首个『 —— 』前的枚举词，层级=其后『：』前的枚举词；档位换算与逐级校验依赖档位前缀解析；baseline_data 键值形态「指标 → 对象（键为 现值/口径）」）
          required: [objectives, baseline_data]
          properties:
            objectives:
              type: array
              description: 战略目标分解链（战略 → 部门 → 个人）
              items:
                type: string
            baseline_data:
              type: object
              description: KPI 现值基线（指标 → 现值，数据仓库导出）
    output_schema:
      type: object
      required: [kpi_definitions, data_sources]
      properties:
        kpi_definitions:
          type: array
          description: KPI 定义列表（含口径/目标/权重/监控频率）
          items:
            type: object
            required: [name, target_value, weight, monitoring_frequency]
            properties:
              name:
                type: string
                description: KPI 名称（含指标口径定义）
              target_value:
                type: number
                description: 目标值（行业指标统计参照）
              weight:
                type: number
                description: 权重（分解树层级）
              monitoring_frequency:
                type: string
                description: 监控频率（日/周/月/季/年）
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object

  # ---------------------------------------------------------------------------
  # 变革管理模型（2 源：newsapi / tavily；双 Key 敏感；slug 无 -model 后缀）
  # 模板叶子键（AC-3）：change_content / stakeholders / resistance_analysis
  # ---------------------------------------------------------------------------
  change-management:
    input_schema:
      type: object
      required: [change_data]
      properties:
        change_data:
          type: object
          description: 变革数据（访谈采集：变革内容 + 利益相关者立场，模板 change_stakeholder_assessment.md）。条目编码——stakeholders 逐条「姓名/角色（立场：支持/观望/反对；影响力 1-5；阻力 1-5）」（影响力/阻力 = 括注内「影响力/阻力」标签后的 1-5 整数；专项转化规则「影响力 ≥4 且反对/观望」依赖分值解析）
          required: [change_content, stakeholders, resistance_analysis]
          properties:
            change_content:
              type: string
              description: 变革内容描述（范围/目标/驱动因素）
            stakeholders:
              type: array
              description: 利益相关者清单及立场评估
              items:
                type: string
            resistance_analysis:
              type: object
              description: 阻力分析（阻力来源 → 强度/根因）
    output_schema:
      type: object
      required: [change_roadmap, data_sources]
      properties:
        change_roadmap:
          type: object
          description: 变革路线图（Kotter 8 步路径 + 里程碑 + 沟通计划）
          required: [path, milestones, communication_plan, risk_mitigation]
          properties:
            path:
              type: array
              description: 变革路径（Kotter 8 步裁剪适配）
              items:
                type: string
            milestones:
              type: array
              description: 里程碑清单（含时间点）
              items:
                type: string
            communication_plan:
              type: object
              description: 沟通计划（对象/渠道/频率/责任人）
            risk_mitigation:
              type: array
              description: 风险缓解措施清单
              items:
                type: string
        data_sources:
          type: array
          description: 溯源元数据（source/freshness/confidence）
          items:
            type: object
