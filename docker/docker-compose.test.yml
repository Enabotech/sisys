# sisys - Test Environment Docker Compose
# Version: 1.0.0
# Description: Test environment with automatic cleanup
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v  # Clean up volumes
#
# Notes:
# - All data is automatically cleaned up after tests
# - Services use test-specific credentials
# - Optimized for CI/CD pipeline usage

services:
  # PostgreSQL 15+ - Relational Storage Layer (L2) - Test
  postgres:
    image: postgres:15-alpine
    container_name: sisys-test-postgres
    restart: "no"
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"  # Use different port to avoid conflict with dev
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - sisys-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Redis 7.0+ - High-Speed Cache Layer (L1) - Test
  redis:
    image: redis:7.2-alpine
    container_name: sisys-test-redis
    restart: "no"
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"  # Use different port
    volumes:
      - redis_test_data:/data
    networks:
      - sisys-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Qdrant 1.7+ - Vector Storage Layer (L3) - Test
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: sisys-test-qdrant
    restart: "no"
    ports:
      - "6334:6333"  # Use different port
    volumes:
      - qdrant_test_data:/qdrant/storage
    networks:
      - sisys-test

  # MinIO - Object Storage Layer (L4) - Test
  minio:
    image: minio/minio:latest
    container_name: sisys-test-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: test_minio
      MINIO_ROOT_PASSWORD: test_minio_password
    ports:
      - "9002:9000"  # Use different port
      - "9003:9001"  # Use different port
    volumes:
      - minio_test_data:/data
    networks:
      - sisys-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Neo4j 5.x - Graph Storage Layer (L5) - Test
  neo4j:
    image: neo4j:5.15
    container_name: sisys-test-neo4j
    restart: "no"
    environment:
      NEO4J_AUTH: neo4j/test_neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7475:7474"  # Use different port
      - "7688:7687"  # Use different port
    volumes:
      - neo4j_test_data:/data
    networks:
      - sisys-test
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  sisys-test:
    driver: bridge

volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local
  qdrant_test_data:
    driver: local
  minio_test_data:
    driver: local
  neo4j_test_data:
    driver: local
