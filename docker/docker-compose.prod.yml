# sisys - Production Docker Compose
# Version: 1.0.0
# Description: Production environment with all services
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Notes:
# - All services are configured for production use
# - Resource limits are set for each container
# - Health checks are enabled for all services
# - Data persistence is configured with Docker volumes
# - Network isolation is enabled
# - Image tagging strategy: Use specific version tags (git SHA or semver) instead of 'latest'
#   - DOCKER_IMAGE_TAG environment variable controls the app image tag (default: latest)
#   - In production, always use specific version tags for reproducibility

services:
  # =========================================
  # Application Service
  # =========================================
  app:
    image: ghcr.io/sisys/sisys:${DOCKER_IMAGE_TAG:-latest}
    container_name: sisys-prod-app
    restart: always
    build:
      context: ..
      dockerfile: docker/dockerfile.prod
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - app_logs:/app/logs
      - ../configs/production.py:/app/configs/production.py:ro

  # =========================================
  # PostgreSQL 15+ - Relational Storage (L2)
  # =========================================
  postgres:
    image: postgres:15.4
    container_name: sisys-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../scripts/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Redis 7.0+ - High-Speed Cache (L1)
  # =========================================
  redis:
    image: redis:7.2.5
    container_name: sisys-prod-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Qdrant 1.7+ - Vector Storage (L3)
  # =========================================
  qdrant:
    image: harbor.sisys.local/sisys/tools/qdrant/qdrant:v1.7.0
    container_name: sisys-prod-qdrant
    restart: always
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # =========================================
  # MinIO - Object Storage (L4)
  # =========================================
  minio:
    image: minio/minio:latest
    container_name: sisys-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_prod_data:/data
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Neo4j 5.x - Graph Storage (L5)
  # =========================================
  neo4j:
    image: neo4j:5.15
    container_name: sisys-prod-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_SERVER_MEMORY_HEAP__INITIAL__SIZE: "512M"
      NEO4J_SERVER_MEMORY_HEAP__MAX__SIZE: "1G"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_prod_data:/data
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Optional: OpenTelemetry Collector
  # =========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: sisys-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
    networks:
      - sisys-prod
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # =========================================
  # Optional: Prometheus
  # =========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sisys-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - sisys-prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles:
      - monitoring

  # =========================================
  # Optional: Grafana
  # =========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: sisys-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - sisys-prod
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    profiles:
      - monitoring

# =========================================
# Networks
# =========================================
networks:
  sisys-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =========================================
# Volumes
# =========================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  qdrant_prod_data:
    driver: local
  minio_prod_data:
    driver: local
  neo4j_prod_data:
    driver: local
  app_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
