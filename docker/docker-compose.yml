# sisys - Development Environment Docker Compose
# Version: 1.0.0
# Description: Local development environment with all required services
#
# Supported Environments:
#   Option 1: Docker Desktop on Windows 11
#   Option 2: WSL 2 with Ubuntu 22.04
#
# Usage:
#   Option 1 (Docker Desktop):
#     - Run from PowerShell/CMD: cd docker && docker-compose up -d
#
#   Option 2 (WSL 2):
#     - Run from WSL terminal: cd docker && docker-compose up -d
#     - Ensure Docker daemon is running: sudo systemctl start docker
#
# Notes:
#   - All data is stored in Docker volumes (persistent across restarts)
#   - Services are accessible from both Windows and WSL 2
#   - Ports are bound to localhost (not exposed to network)
version: '3.8'

services:
  # PostgreSQL 15+ - Relational Storage Layer (L2)
  postgres:
    image: postgres:15.4
    container_name: sisys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sisys_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sisys_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sisys}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sisys_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7.0+ - High-Speed Cache Layer (L1)
  redis:
    image: redis:7.2.5
    container_name: sisys-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Qdrant 向量数据库 - 本地开发环境部署配置
# =============================================================================
# 用途：Story 1.6 (Qdrant Vector Layer) 本地开发和集成测试
# 版本：Qdrant v1.7.0+（支持异步客户端和 query_points API）
# =============================================================================

services:
  qdrant:
    image: harbor.sisys.local/sisys/tools/qdrant/qdrant:v1.7.0
    container_name: sisys-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"    # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=info
      # 可选：API 密钥（生产环境必须启用）
      # - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sisys-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  qdrant_data:
    driver: local
    name: sisys-qdrant-data

networks:
  sisys-network:
    driver: bridge
    name: sisys-network

  # MinIO - Object Storage Layer (L4)
  minio:
    image: minio/minio:latest
    container_name: sisys-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sisys_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sisys_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j 5.x - Graph Storage Layer (L5)
  neo4j:
    image: neo4j:5.15
    container_name: sisys-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/sisys_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sisys-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  neo4j_data:
    driver: local
