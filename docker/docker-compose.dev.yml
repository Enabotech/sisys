# SISYS Docker Compose 开发环境配置
# 用途：使用 Docker Compose 运行开发环境，避免卷挂载问题

version: '3.8'

services:
  # 开发服务
  app:
    image: harbor.sisys.local/sisys/dependency:dev-dep-v1.0.0-202603292248
    container_name: sisys-dev
    volumes:
      # 挂载项目代码（只读，避免覆盖 .venv）
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./poetry.lock:/app/poetry.lock:ro
      # Poetry 缓存卷
      - poetry_cache:/home/sisys/.cache/pypoetry
    environment:
      - APP_ENV=development
      - PYTHONPATH=/app/src
    ports:
      - "8000:8000"
    command: poetry run uvicorn src.interfaces.api.main:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "poetry", "run", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 测试服务
  test:
    image: harbor.sisys.local/sisys/dependency:dev-dep-v1.0.0-202603292248
    container_name: sisys-test
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./poetry.lock:/app/poetry.lock:ro
      - poetry_cache:/home/sisys/.cache/pypoetry
    environment:
      - APP_ENV=test
      - PYTHONPATH=/app/src
    command: poetry run pytest tests/ -v

volumes:
  poetry_cache:
    driver: local
