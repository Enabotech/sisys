# sisys - Development Environment Docker Compose (China Mirror)
# Version: 1.0.1
# Description: Local development environment with Alibaba Cloud registry mirrors
# 
# 中国大陆镜像源配置 - 使用阿里云官方镜像

services:
  # PostgreSQL 15+ - Relational Storage Layer (L2)
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub-library/postgres:15-alpine
    container_name: sisys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sisys_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sisys_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sisys}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sisys_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7.0+ - High-Speed Cache Layer (L1)
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub-library/redis:7.2-alpine
    container_name: sisys-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant 1.7+ - Vector Storage Layer (L3)
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: sisys-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage Layer (L4)
  minio:
    image: quay.io/minio/minio:latest
    container_name: sisys-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sisys_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sisys_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j 5.x - Graph Storage Layer (L5)
  neo4j:
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub-library/neo4j:5.15
    container_name: sisys-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/sisys_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - sisys-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sisys-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  neo4j_data:
    driver: local
